[project]
dependencies = []
description = "The organisation name and crate prefix this project publishes under"
license = "Apache-2.0 OR MIT"
name = "et-org"
requires-python = ">=3.10"
version = "0.1.0"

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build==0.11.8"]

[tool.uv.build-backend]
module-name = "et_org"
module-root = ""

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
