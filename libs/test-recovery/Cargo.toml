[package]
name = "et-test-recovery"
publish = true
description = "Domain-specific fixtures for recovery supervisor integration tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
bench = false
doc = false
name = "recovery-command-probe"
path = "src/bin/command-probe.rs"
test = false

[dependencies]
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
edge-toolkit = { workspace = true, features = ["std"] }
et-recovery-supervisor.workspace = true
serde-env.workspace = true
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
