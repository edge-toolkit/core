[package]
name = "et-actix-web-config"
publish = true
description = "actix-web HttpServer settings as a serde struct, for reading them from environment variables"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
features = ["docs"]

[lib]
doctest = false

[features]
## Builds actix-web with rustls 0.23, which adds the TLS handshake timeout setting actix-web only offers with TLS.
rustls-0_23 = ["actix-web/rustls-0_23"]
## Derives JSON Schema for the settings, so a binary can document its environment variables.
env-schema = ["dep:schemars"]
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

[dependencies]
actix-http.workspace = true
actix-service.workspace = true
actix-web.workspace = true
document-features = { workspace = true, optional = true }
humantime.workspace = true
humantime-serde.workspace = true
nutype.workspace = true
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["std"] }
serde_default.workspace = true
serde_with.workspace = true

[dev-dependencies]
actix-rt.workspace = true
serde-env.workspace = true

[lints]
workspace = true
