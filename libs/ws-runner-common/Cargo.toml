[package]
name = "et-ws-runner-common"
publish = true
description = "Shared helpers + constants for the native ws-server agent runners"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
features = ["docs"]

[lib]
doctest = false
path = "src/lib.rs"

[features]
## Derives JSON Schema for every runner's environment configuration.
## et-int-gen renders each runner's environment variables into its HELP.md from that schema.
env-schema = ["dep:schemars", "edge-toolkit/env-schema"]
## Internal: adds the `ET_TEST_COVERAGE` switch to the WASI and web runners' configs, for their coverage builds.
coverage = []
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

[dependencies]
document-features = { workspace = true, optional = true }
edge-toolkit.workspace = true
et-otlp.workspace = true
et-rest-client.workspace = true
futures-util.workspace = true
humantime-serde.workspace = true
reqwest.workspace = true
retry-policies.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde-inline-default.workspace = true
serde_default.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
tracing.workspace = true

[dev-dependencies]
et-rest-client.workspace = true
et-test-helpers.workspace = true
serde-env.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }

[lints]
workspace = true
