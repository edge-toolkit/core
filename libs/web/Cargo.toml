[package]
name = "et-web"
publish = true
description = "Web helpers for WASM modules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
js-sys.workspace = true
minicov = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "MessageEvent",
  "Navigator",
  "Window",
] }

# Coverage instrumentation, off by default and enabled only by the coverage build of the browser wasm modules.
# Pulls minicov and exposes __et_capture_coverage, which wasm-bindgen collects into every dependent module's glue.
[features]
coverage = ["dep:minicov"]

[lints]
workspace = true
