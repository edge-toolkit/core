[package]
name = "edge-toolkit"
publish = true
description = "A collection of utilities and common code for Edge Toolkit services"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
features = ["docs"]

[lib]
doctest = false

[features]
## Derives JSON Schema and AsyncAPI descriptions for the WebSocket protocol types.
## The published specs are generated from them. Off by default, so wasm and runtime crates do not pull in schemars
## and asyncapi-rust.
schema-export = ["dep:asyncapi-rust", "dep:schemars"]
## Derives JSON Schema for the configuration types the binaries read from the environment.
## et-int-gen renders each binary's environment variables into its HELP.md from that schema.
env-schema = ["dep:schemars"]
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

[dependencies]
asyncapi-rust = { workspace = true, optional = true }
base64.workspace = true
command-error.workspace = true
document-features = { workspace = true, optional = true }
et-path.workspace = true
fs-err.workspace = true
humantime-serde.workspace = true
schemars = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde-inline-default.workspace = true
serde_default.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_yaml.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
et-test-helpers.workspace = true
et-test-otlp.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
