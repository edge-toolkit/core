[package]
name = "edge-toolkit"
description = "A collection of utilities and common code for Edge Toolkit services"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
asyncapi-rust = { workspace = true, optional = true }
base64.workspace = true
et-path.workspace = true
fs-err.workspace = true
humantime-serde.workspace = true
log.workspace = true
schemars = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde-env.workspace = true
serde-inline-default.workspace = true
serde_default.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_yaml.workspace = true
strum.workspace = true
thiserror.workspace = true

[features]
# Opt-in derives for emitting JSON Schema / AsyncAPI from the WS protocol types.
# Off by default so wasm and runtime crates don't pull schemars + asyncapi-rust.
schema-export = ["dep:asyncapi-rust", "dep:schemars"]

[dev-dependencies]
rstest.workspace = true
temp-env.workspace = true
tempfile.workspace = true
testing_logger.workspace = true

[lints]
workspace = true
