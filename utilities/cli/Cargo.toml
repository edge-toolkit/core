[package]
name = "et-cli"
description = "Edge Toolkit management CLI"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 or MIT"
repository = "https://github.com/edge-toolkit/core"
rust-version = "1.87.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
edge-toolkit = { path = "../../libs/edge-toolkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
