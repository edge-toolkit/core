[package]
name = "et-cli"
publish = true
description = "Edge Toolkit management CLI"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
doctest = false
name = "et-cli"
path = "src/main.rs"

[dependencies]
bytesize.workspace = true
clap = { workspace = true, features = ["env"] }
croner.workspace = true
edge-toolkit.workspace = true
et-org.workspace = true
et-path.workspace = true
et-recovery-supervisor.workspace = true
fake.workspace = true
fs-err.workspace = true
jiff.workspace = true
k8s-openapi.workspace = true
pretty_yaml.workspace = true
rand.workspace = true
rand_chacha.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
textwrap.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true

[dev-dependencies]
command-error.workspace = true
et-test-helpers.workspace = true
et-ws-test-server.workspace = true
serde-env.workspace = true
tempfile.workspace = true

[lints]
workspace = true
