[package]
name = "et-cli"
publish = true
description = "Edge Toolkit management CLI"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
doctest = false
name = "et-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap-markdown = { workspace = true, optional = true }
edge-toolkit.workspace = true
et-path.workspace = true
fake.workspace = true
fs-err.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
textwrap.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
# Checked `spawn_checked`, so a failure to launch a generated task reports the command line it tried.
command-error.workspace = true
# Port-readiness wait for the generated deployment's hub.
et-test-helpers.workspace = true
# Expected math1 weights for the generated-deployment test.
# The canonical input's model is this crate's to state, so reimplementing the values here would let the two
# drift apart silently.
et-ws-test-server.workspace = true
tempfile.workspace = true

[features]
markdown-help = ["dep:clap-markdown"]

[lints]
workspace = true
