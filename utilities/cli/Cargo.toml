[package]
name = "et-cli"
description = "Edge Toolkit management CLI"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
doctest = false
name = "et-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap-markdown = { workspace = true, optional = true }
edge-toolkit.workspace = true
et-path.workspace = true
fs-err.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Enables `--markdown-help` on the CLI, which prints a markdown rendering of
# the full clap tree (used by `mise run gen-help-all` to regenerate HELP.md).
markdown-help = ["dep:clap-markdown"]

[lints]
workspace = true
