[package]
name = "et-onnx"
publish = true
description = "CLI to investigate ONNX models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
doctest = false
name = "et-onnx"
path = "src/main.rs"
test = false

[dependencies]
clap.workspace = true
clap-markdown = { workspace = true, optional = true }
onnx-extractor.workspace = true

[features]
markdown-help = ["dep:clap-markdown"]

[lints]
workspace = true
