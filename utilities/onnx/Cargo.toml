[package]
name = "et-onnx"
description = "CLI to investigate ONNX models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
doctest = false
name = "et-onnx"
path = "src/main.rs"
# No unit/integration tests in this crate (it's a 21-line CLI wrapper),
# so don't build a test harness binary for it under `cargo test`. Skipping
# the harness drops the heaviest link in the workspace (et-onnx pulls in
# onnx-extractor + its prost-generated ONNX schema -- ~100 KB of codegen
# statically linked into a debug binary) and removes the AL2023 docker
# hang at "Compiling et-onnx" entirely.
test = false

[dependencies]
clap.workspace = true
onnx-extractor.workspace = true

[lints]
workspace = true
