[package]
name = "et-int-gpu-probe-web"
publish = false
description = "The GPU probe sets as WASM, for a page to put to the browser's WebGPU"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
features = ["docs"]

# `#[wasm_bindgen] pub async fn probe_webgpu` expands to `wasm_bindgen_futures` paths, which cargo-shear cannot see.
[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
## Internal: links et-web's minicov profiler runtime, for the coverage build of the page's browser tests.
coverage = ["dep:et-web", "et-web/coverage"]
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

[dependencies]
base64 = { workspace = true, features = ["std"] }
document-features = { workspace = true, optional = true }
et-gpu-probe = { workspace = true, features = ["native"] }
js-sys.workspace = true
md-5.workspace = true
png.workspace = true
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "ContextAttributes2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "ImageData",
  "Node",
  "WebGl2RenderingContext",
  "WebGlContextAttributes",
  "WebGlFramebuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "Window",
] }
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
et-web = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
