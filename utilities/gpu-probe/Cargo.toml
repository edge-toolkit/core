[package]
name = "et-gpu-probe-server"
publish = true
description = "HTTPS server that collects GPU probe signatures into the et-gpu-probe registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[[bin]]
doctest = false
name = "et-gpu-probe-server"
path = "src/bin/et-gpu-probe-server.rs"
test = false

[[bin]]
doctest = false
name = "gpu-probe"
path = "src/bin/gpu-probe.rs"
test = false

[dependencies]
actix-files.workspace = true
actix-web = { workspace = true, features = ["macros", "rustls-0_23"] }
clap.workspace = true
edge-toolkit = { workspace = true, features = ["std"] }
et-gpu-probe = { workspace = true, features = ["native", "registry"] }
et-https-listener = { workspace = true, features = ["tls-self-signed"] }
fs-err.workspace = true
futures-executor.workspace = true
serde = { workspace = true, features = ["std"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true

[dev-dependencies]
actix-http.workspace = true
actix-rt.workspace = true
tempfile.workspace = true
wgpu = { workspace = true, features = ["noop"] }

[lints]
workspace = true
