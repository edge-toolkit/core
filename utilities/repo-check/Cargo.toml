[package]
name = "et-int-repo-check"
# No tests: the binary is tested by being invoked, which the coverage workflow does under instrumentation.
autotests = false
publish = false
description = "Repository-wide checks that no file-at-a-time linter can do"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
doctest = false
name = "et-int-repo-check"
path = "src/main.rs"
test = false

[dependencies]
command-error.workspace = true
fs-err.workspace = true
regex = { workspace = true, features = ["perf", "std", "unicode-perl"] }
thiserror = { workspace = true, features = ["std"] }
toml.workspace = true

[lints]
workspace = true
