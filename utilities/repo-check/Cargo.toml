[package]
name = "et-int-repo-check"
publish = false
description = "Repository-wide checks that need to read git itself"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
doctest = false
name = "et-int-repo-check"
path = "src/main.rs"
test = false

[dependencies]
command-error.workspace = true
fs-err.workspace = true
regex = { workspace = true, features = ["perf", "std", "unicode-perl"] }
thiserror = { workspace = true, features = ["std"] }

[lints]
workspace = true
