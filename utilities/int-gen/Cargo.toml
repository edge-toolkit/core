[package]
name = "et-int-gen"
description = "Internal repo-only code generator emitting artifacts under generated/ from Rust sources of truth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "et-int-gen"

# `int` = "internal": this crate is for in-repo use only.
# It isn't published alongside the public `et-*` libraries.
[[bin]]
name = "et-int-gen"
path = "src/bin/int-gen.rs"

[dependencies]
asyncapi-rust.workspace = true
clap.workspace = true
clap-markdown = { workspace = true, optional = true }
edge-toolkit = { workspace = true, features = ["schema-export"] }
et-modules-service = { workspace = true, features = ["openapi-spec"] }
et-storage-service = { workspace = true, features = ["openapi-spec"] }
et-ws-server = { workspace = true, features = ["openapi-spec"] }
fs-err.workspace = true
heck.workspace = true
kdl.workspace = true
openapiv3.workspace = true
pretty_yaml.workspace = true
prettyplease.workspace = true
progenitor.workspace = true
quote.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls"] }
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
syn.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-zig.workspace = true
utoipa.workspace = true
wit-encoder = { workspace = true, features = ["from-parser"] }
wit-parser.workspace = true

[features]
markdown-help = ["dep:clap-markdown"]

[lints]
workspace = true
