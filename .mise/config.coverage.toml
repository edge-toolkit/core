# Coverage env (MISE_ENV includes `coverage`).
# A special stackable env like mingw/msvc, not a language -- so it is deliberately NOT in config.toml's ALL_LANGS
# and the *-all tasks never touch it. Selected only by the coverage workflow, stacked on the language envs it also
# loads (rust + the guest langs whose ws-modules the coverage build exercises, so the module-loading tests run
# rather than self-skip). Houses the cargo-llvm-cov task so it stays out of the always-loaded config.toml.
# cargo-llvm-cov is not a mise [tool] -- the workflow co-installs it via taiki-e/install-action. (cargo-nextest IS
# a mise tool, from config.toml's `github:nextest-rs/nextest` entry.)

# conda-forge clang is a full LLVM clang with the wasm32 backend that the host clang (Apple's) lacks.
# The wasm coverage builds need it: minicov's build.rs hardcodes bare `clang` to compile its C profiler runtime
# for the guest target, so this wasm-capable clang must be first on PATH (the wasm build tasks prepend it). LLVM
# 22 here matches rustc's LLVM, keeping the covmap format aligned with the llvm-tools llc/llvm-cov used downstream.
#
# Known-broken on macOS: mise resolves the [env] _.path prepend below to a PATH position BEHIND /usr/bin, so
# under `mise run` bare `clang` still hits Apple's and minicov's C compile fails with "unable to create target:
# No available targets are compatible with triple wasm32-unknown-unknown". The wasm coverage tasks
# (wasm-agent-cov, pic-viewer-cov) therefore only work locally on Linux until that ordering is fixed; on a Mac,
# run the task body manually in a shell with the conda-clang bin dir genuinely first on PATH. CI (ubuntu) is
# unaffected because the distro clang already has the wasm backend.
#
# Windows is deliberately out of scope for this env (hence the os scoping here): coverage collection runs only
# on the ubuntu CI lane, and there is no intention to make the wasm coverage pipeline work on Windows.
[tools]
# scc is the primary line counter behind the sloc task.
# Picked over the alternatives on three grounds: a prebuilt binary for every target platform, counting rules
# documented upstream, and json/csv output so a reported figure can be regenerated rather than transcribed.
"aqua:boyter/scc" = "latest"
# gocloc re-counts the same file sets for sloc-crosscheck, as an independent implementation of cloc's rules.
# cloc itself cannot be a mise tool: upstream ships a Perl script plus a Windows .exe, so every non-Windows
# platform would fall back to host perl. gocloc is the closest thing that installs as a prebuilt binary.
"aqua:hhatto/gocloc" = "latest"
"conda:clang" = { version = "latest", os = ["linux", "macos"] }

[vars]
# The libs/ crates each branch-coverage check is answerable for, as directory names under libs/.
# The split is which pipeline carries the crate's coverage, not a judgement about how well tested it is.
# The native set is everything cargo-llvm-cov's own run instruments and reports; the wasm set is the two
# crates that only ever compile to wasm, whose covmaps come out of the .ll-gutting path the three wasm-side
# tasks share (wasm-cov for the guests, wasm-agent-cov and pic-viewer-cov for the browser tests) and so can
# only be asserted where that path runs. A crate belongs to exactly one list: naming it in both would let a
# gap in one pipeline be answered by the other.
native_cov_libs = "edge-toolkit et-otlp path test-helpers test-otlp ws-runner-common"
wasm_cov_libs = "wasi-guest web"

# The wasm coverage builds run on nightly (-Zno-profiler-runtime) with the wasm-capable conda clang on PATH.
# It is set env-wide here because this env loads only under the coverage workflow; per-command RUSTFLAGS and
# the minicov feature come from the wasm_cov / *_cov_feat vars so uninstrumented builds stay clean.
[env]
RUSTUP_TOOLCHAIN = "{{ vars.rust_nightly }}"
# Resolve libonnxruntime at runtime from the mise install rather than from ort-sys's dylib copies.
# ort-sys symlinks the ONNX Runtime dylibs next to the built binaries, but it derives that directory from
# `OUT_DIR/../../..`, which nightly's `build/<pkg>/<hash>/out` layout shifts down to `<target>/debug/build`.
# The copies therefore land in `<target>/debug/build{,/examples,/deps}` and never beside the test binaries, so
# et-ws-wasi-runner starts and immediately dies with no output -- surfacing in the wasi-runner tests as
#   called `Result::unwrap()` on an `Err` value: Output(OutputError { program: ".../target/debug/et-ws-wasi-runner",
#   status: ExitStatus(unix_wait_status(32512)), stdout_utf8: "", stderr_utf8: "", user_error: None })
# (32512 >> 8 == 127, the loader's "cannot start" code). Seen on commit
# https://github.com/edge-toolkit/core/commit/b63888492c53cd403168ea24483cea53bde60899 at
# https://github.com/edge-toolkit/core/actions/runs/30786563725/job/91601098246, in all four wasi-runner tests.
# Pointing the loader straight at the install dir is layout-independent, so it holds however cargo lays the
# build dir out. Scoped to this env because only the coverage lane runs binaries under nightly. Drop it together
# with the cargo-doc-check mkdir once ort stops hardcoding the OUT_DIR depth.
#
# Keep host links on Apple's cc, which the conda-clang prepend below otherwise shadows.
# That prepend is there so minicov's build.rs finds a bare `clang` with a wasm32 backend, but conda-clang ships
# a `cc` too and wins the lookup for it -- and conda's clang knows nothing of the macOS SDK, so every host link
# in the coverage env dies with libSystem unresolved, one undefined symbol per libstd call:
#     "_writev", referenced from: ...std::sys::stdio::unix::Stderr...write_vectored in libstd-*.rlib
#     ld: symbol(s) not found for architecture arm64
# Naming the linker outright is narrower than reordering PATH: `clang` stays conda's for the wasm guest builds
# that need it, and only rustc's choice of linker driver moves back. The var is per-target, so the Linux lane
# ignores both lines. Drop them if the conda-clang bin dir ever stops carrying a `cc`.
CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER = "/usr/bin/cc"
CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER = "/usr/bin/cc"
DYLD_LIBRARY_PATH = "{{ vars.ort_loc_unix }}/lib"
LD_LIBRARY_PATH = "{{ vars.ort_loc_unix }}/lib"
_.path = "{{ env.HOME }}/.local/share/mise/installs/conda-clang/latest/bin"

[tasks.cargo-llvm-cov]
description = "Rust coverage (cargo-llvm-cov) + JUnit test results (nextest); emits lcov.info + junit.xml"
# cargo-llvm-cov is deliberately NOT a mise [tool] (like cargo-unmaintained).
# The coverage workflow installs it via taiki-e/install-action; cargo-nextest comes from config.toml's mise tool.
# This task just runs them. cargo-llvm-cov needs the `llvm-tools-preview` rustup component, which it adds on demand
# against the mise-managed toolchain.
# `show-env` exports the coverage instrumentation env (rustc wrapper, LLVM_PROFILE_FILE, target dir) so BOTH the
# nextest run and the mise regen tasks build + run instrumented into one profile set, then a single `report`
# merges them. The regens -- `gen-specs` (et-int-gen) and `regen-verification` (et-cli) -- exercise the code
# generators, which otherwise get only their unit-test coverage. nextest (NEXTEST_PROFILE=ci) also writes
# target/nextest/ci/junit.xml for the Codecov test-results upload, and serializes et-ws-web-runner via the
# `web-runner` test-group in config/nextest.toml. No `--doc` pass: the workspace sets `[lib] doctest = false`
# almost everywhere (doc comments are prose), and cargo-llvm-cov's `--doc` ignores that and chokes on the
# generated et-rest-client's backtick prose, so coverage stays tests-only.
env = { NEXTEST_PROFILE = "ci" }
run = """
cargo llvm-cov clean --workspace
# Drop the native build dirs so every native crate rebuilds under cargo-llvm-cov's rustc wrapper.
# The prior `build-modules` step compiled et-cli + its native dep tree (edge-toolkit, et-path, int-gen, ...)
# NON-instrumented into target/{debug,release}, and `cargo llvm-cov clean` leaves those in place; without this the
# coverage build reuses them uninstrumented so those crates report zero coverage (et-path was the symptom). The
# wasm guest .ll that wasm-cov consumes live under target/wasm32-wasip2 and are left untouched.
coreutils rm -rf target/debug target/release
# Apply cargo-llvm-cov's instrumentation env via `eval` of its `show-env` exports.
# `--sh` is the current flag (the old `--export-prefix` alias is deprecated). This sets the rustc wrapper +
# LLVM_PROFILE_FILE + profile dir so nextest and the regens instrument into one profile set that `report` merges.
eval "$(cargo llvm-cov show-env --sh)"
# Pre-create the dirs ort-sys symlinks its dylibs into, for the same nightly-cargo reason as cargo-doc-check.
# It has to come after the eval above, which is what points CARGO_TARGET_DIR at the instrumented target dir --
# a `depends` task would run in its own process and never see it. This whole env builds on nightly
# (RUSTUP_TOOLCHAIN above), so every cargo invocation below hits the same build-script layout.
ort_build_dir="${CARGO_TARGET_DIR:-target}${CARGO_BUILD_TARGET:+/$CARGO_BUILD_TARGET}/debug/build"
coreutils mkdir -p "$ort_build_dir/examples" "$ort_build_dir/deps"
# nextest SIGKILLs the spawned et-ws-pyo3-runner (services/ws-pyo3-runner/tests/modules.rs) after each exchange.
# LLVM flushes a process's counters only at exit, so a SIGKILLed process contributes nothing: the runner's async
# run/drive/worker paths reported 0% while its in-process initialize() was covered. Continuous mode (%c) memory-maps
# the counter file so increments persist live and survive the kill. %c is incompatible with the merge-pool (%Nm)
# specifier show-env emits, so use a per-process (%p) continuous file in the same profile dir -- `cargo llvm-cov
# report` globs every *.profraw there regardless of name. Branch coverage: `show-env` has no --branch flag (only
# the top-level `cargo llvm-cov` does), so the nightly `-Zcoverage-options=branch` is appended to the wrapper
# RUSTFLAGS directly; `report`'s lcov export emits the BRDA records on its own once the covmap carries branch
# regions. On Linux continuous mode additionally needs relocatable counters
# (`-Cllvm-args=-runtime-counter-relocation`).
# macOS is the exception and keeps the profile pattern show-env emits, because continuous mode there writes
# nothing back at all. The run completes and the report generates, but every counter in it reads zero:
#   lines:    0/8677 hit
#   branches: 0/954 hit
# from that lane's own artifact on commit
# https://github.com/edge-toolkit/core/commit/52b2a6a67087fab043c1ea8c520373f5ba2477a4 at
# https://github.com/edge-toolkit/core/actions/runs/35032214650/job/104593077352, and reproduced on a
# workstation by changing this one variable and nothing else -- the same crates and tests report real
# numbers under the merge-pool pattern and zeros under %c. The relocation flag above is what makes %c work
# on Linux and has no Mach-O counterpart to reach for. The carve-out costs exactly what %c was added for:
# the pyo3 runner that nextest SIGKILLs contributes nothing on macOS, so its async paths read 0% there and
# the Linux lane is the one that measures them. The wrapper flags env is CARGO_ENCODED_RUSTFLAGS format (ASCII
# unit separator 0x1f between flags), not space-separated -- a space append glues the llvm-arg onto the last
# existing flag and rustc rejects `--cfg=coverage_nightly -Cllvm-args=...` as one invalid --cfg value. goawk
# generates the separator byte at run time: bash dollar-quote hex is not a valid escape in this TOML basic
# string, and a TOML unicode escape renders as an invisible byte in the body, so it is constructed visibly.
host_os="$(coreutils uname -s)"
if [ "$host_os" != "Darwin" ]; then
  cov_dir="$(coreutils dirname "$LLVM_PROFILE_FILE")"
  export LLVM_PROFILE_FILE="$cov_dir/core-cont-%p%c.profraw"
fi
us="$(goawk 'BEGIN { printf "%c", 31 }')"
flags="${__CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS:-}"
append_flag() { flags="${flags:+${flags}${us}}$1"; }
append_flag "-Zcoverage-options=branch"
if [ "$host_os" = "Linux" ]; then
  append_flag "-Cllvm-args=-runtime-counter-relocation"
fi
export __CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS="$flags"
# The --features flags compile each runner's coverage code, off by default so non-coverage builds omit it.
# et-ws-web-runner/coverage adds the browser-module capture (shims + the __et_capture_coverage PUT);
# et-ws-wasi-runner/coverage adds the guest `/cov` preopen. ET_TEST_COVERAGE (set by the coverage job) still
# gates capture at runtime within each build.
# A failing test must not cost the whole report: capture the status and re-raise it once lcov.info is written.
# Under `set -e` a nextest failure would abort the task here, so `cargo llvm-cov report` below never runs and
# lcov.info is never produced -- the coverage upload steps then have nothing to send and the run reports no
# coverage at all. A failing run is exactly when the per-test results and the coverage delta matter most, so the
# profile data nextest has already written gets turned into a report either way.
test_status=0
cargo nextest run --config-file config/nextest.toml --features et-ws-web-runner/coverage,et-ws-wasi-runner/coverage ||
  test_status=$?
mise run gen-specs
mise run regen-verification
# The runner's host bindings are excluded from the report, not just from analysis.
# et-int-gen emits them from WIT (gen:wasmtime-bindings), and they have to live inside the crate for
# `cargo package` to include them -- so unlike the rest of the generated code they are not under
# `generated/`, which is what every other tool keys its exclusion on. Left in, ~2k machine-written lines
# land in lcov.info at near-zero coverage and drag the repo metric under DeepSource's threshold; the
# `.deepsource.toml` exclude only stops the analyzers, not the coverage aggregate.
# Deliberately NOT anchored with `^`: llvm-cov matches this regex against the absolute path recorded in the
# coverage map (`/home/runner/work/core/core/services/...`), which is what the lcov SF: lines then carry, so a
# leading `^` matches nothing and the file stays in the report. Match the path tail instead.
cov_ignore='services/ws-wasi-runner/src/bindings\\.rs$'
cargo llvm-cov report --lcov --include-build-script --ignore-filename-regex "$cov_ignore" --output-path lcov.info
exit "$test_status"
"""
shell = "{{ vars.task_shell }}"

# The assertion both branch-coverage checks make, kept in one place so the two differ only in what they feed it.
# Hidden because it is meaningless without a report: the caller decides which pipeline produced one and which
# crates that pipeline answers for, and this only reads the result.
#
# Two ways to fail, and the second is the one that matters.
# A crate whose files are all at 100% passes, and so does a file with no branch regions at all (`count` 0 is
# vacuously complete). But a crate with NO records in the report also has nothing under 100%, so a check that
# only looked for shortfalls would go green for a crate the run never executed -- exactly backwards, since a
# crate dropping out of the report is how coverage silently stops being measured. A named crate contributing
# no records is therefore an error, which is why the lists are spelled out rather than globbed from libs/.
[tasks."_cov-branch-assert"]
description = "Assert every named libs/ crate is at 100% branch coverage in an llvm-cov JSON summary"
hide = true
# The whole assertion is one jaq query over llvm-cov's own JSON, with no parsing of our own.
run = """
report="$usage_report"
if [ ! -f "$report" ]; then
  echo "cov-branch-assert: no coverage report at $report" >&2
  echo "Run the coverage task that produces it first; a missing report is a failure, not a skip." >&2
  exit 1
fi
shortfall="$(jaq -r --arg libs "$usage_libs" -f .mise/cov-branch-assert.jq "$report")"
if [ -n "$shortfall" ]; then
  echo "cov-branch-assert: libs/ must be at 100% branch coverage, and is not:" >&2
  echo "$shortfall" >&2
  exit 1
fi
echo "cov-branch-assert: 100% branch coverage across $usage_libs"
"""
shell = "{{ vars.task_shell }}"
usage = """
arg "<report>" help="llvm-cov JSON summary (--format=text) to assert over"
arg "<libs>" help="Space-separated libs/ directory names that must be at 100% branch coverage"
"""

# Reports on the profile data cargo-llvm-cov already wrote; it does not re-run the tests.
# `report` re-reads that data, so this is cheap and must follow cargo-llvm-cov in the same job. It needs no
# `--branch` flag: branch regions are baked into the covmap by the `-Zcoverage-options=branch` that task
# appends, and every export carries them from there. With no profile data the underlying command fails on its
# own, which is the right answer -- there is nothing to assert.
#
# The `show-env` eval is what points `report` at that data instead of at an empty directory. Under `show-env`
# the profiles land in the plain target dir, which is where the collecting task's cargo invocations put them;
# a bare `cargo llvm-cov report` -- which is what this is, running in its own process one CI step later --
# defaults to `target/llvm-cov-target` instead and finds nothing:
#   error: failed to merge profile data: not found *.profraw files in
#   /home/runner/work/core/core/target/llvm-cov-target; this may occur if target directory is accidentally
#   cleared, or running report subcommand without running any tests or binaries
# on commit https://github.com/edge-toolkit/core/commit/52b2a6a67087fab043c1ea8c520373f5ba2477a4 at
# https://github.com/edge-toolkit/core/actions/runs/35005110677/job/104502812372. The raw profiles are still
# on disk at that point -- the collecting task's own `report` leaves them alone -- so the only thing this
# process was missing is the environment that says where to look.
[tasks.cargo-llvm-cov-branch-check]
description = "Fail unless every native libs/ crate is at 100% branch coverage"
run = """
coreutils mkdir -p target/cov
report=target/cov/native-libs.json
eval "$(cargo llvm-cov show-env --sh)"
cargo llvm-cov report --json --summary-only --output-path "$report"
mise run _cov-branch-assert "$report" "{{ vars.native_cov_libs }}"
"""
shell = "{{ vars.task_shell }}"

[tasks.wasm-cov]
description = "Turn instrumented wasm guest .profraw into lcov (llc + llvm-cov) and merge into the workspace lcov.info"
# The instrumented wasm builds drop their minicov .profraw into target/wasi-cov during the runner tests.
# WASI guests (wasi-comm1/wasi-data1) dump via the runner's /cov preopen; browser modules (data1, comm1, ...) go
# through et-web's __et_capture_coverage -> the module's ws-server storage bucket -> the web-runner test (see
# config.rust.toml's coverage wrapper). Each instrumented build also emits an .ll next to its .wasm (release/deps).
# The .ll is gutted and compiled to an ELF object with llc (per taiki-e/cargo-llvm-cov#337 + hknio/wasmcov).
# The fixed x86_64 ELF target avoids the macOS Mach-O AsmPrinter aborting on the covmap globals, and llvm-cov
# reads the covmap from any object format regardless of host. llc/llvm-cov/llvm-profdata are the version-matched
# nightly llvm-tools that built the guests. Path remap of the emitted SF: lines to repo-relative may need a CI
# follow-up.
run = """
covdir=target/wasi-cov
if [ -z "$(find "$covdir" -maxdepth 1 -name '*.profraw' -print -quit 2>/dev/null)" ]; then
  echo "wasi-cov: no $covdir/*.profraw -- coverage build/run produced no guest data; skipping"
  exit 0
fi
host="$(rustc -vV | goawk '/^host:/ { print $2 }')"
bin="$(rustc +{{ vars.rust_nightly }} --print sysroot)/lib/rustlib/$host/bin"
: >"$covdir/wasi.lcov"
for profraw in "$covdir"/*.profraw; do
  name="$(coreutils basename "$profraw" .profraw)"
  # Look for the .ll in nightly's new build-dir layout first, then the classic one.
  # `-Z build-dir-new-layout` (now the default on nightly, which this env pins) moved per-crate intermediates
  # from `<profile>/deps/` to `<profile>/build/<pkg>/<hash>/out/`, so the deps-only glob this used to run found
  # nothing and every module aborted the task with `wasi-cov: no .ll found for et_ws_audio1`. Observed on commit
  # 3fe98398 at https://github.com/edge-toolkit/core/actions/runs/30789818011/job/91610793550. Both globs stay so
  # the task works whichever layout the toolchain produces; drop the deps fallback once no supported cargo emits it.
  # `-print -quit` (not `| coreutils head -n 1`) and an exact-or-hash-suffixed name pattern, both load-bearing:
  # (1) `$name*.ll` also matched prefix-sharing sibling crates once math1-sender landed next to math1, risking a
  # profraw paired with the wrong module's covmap; (2) with 2+ matches, head exits after the first line and the
  # uutils find dies on the broken pipe (Rust ignores SIGPIPE) -- a panic on the Linux runners, exiting 101 with
  # its message discarded by the 2>/dev/null, so `pipefail` killed this task with no output at all. Observed on
  # commit https://github.com/edge-toolkit/core/commit/db374f051f72f7c285fe8267f5acc80a52cfcfd9 at
  # https://github.com/edge-toolkit/core/actions/runs/31994728610/job/95284251850; reproduced locally on macOS
  # as `find: stdout: Undefined error: 0` (EPIPE, exit 1) once the second match exists.
  ll="$(find target -path '*/release/build/*' \\( -name "$name.ll" -o -name "$name-*.ll" \\) -print -quit 2>/dev/null)"
  if [ -z "$ll" ]; then
    ll="$(find target -path '*/release/deps/*' \\( -name "$name.ll" -o -name "$name-*.ll" \\) -print -quit 2>/dev/null)"
  fi
  if [ -z "$ll" ]; then
    echo "wasi-cov: no .ll found for $name"
    exit 1
  fi
  pd="$covdir/$name.profdata"
  obj="$covdir/$name.o"
  goawk -f .mise/llvm-cov-gut.awk "$ll" >"$covdir/$name.gutted.ll"
  "$bin/llc" -filetype=obj -mtriple=x86_64-unknown-linux-gnu -o "$obj" "$covdir/$name.gutted.ll"
  "$bin/llvm-profdata" merge -sparse -o "$pd" "$profraw"
  "$bin/llvm-cov" export --format=lcov --instr-profile "$pd" "$obj" >>"$covdir/wasi.lcov"
done
goawk -f .mise/lcov-drop-external.awk "$covdir/wasi.lcov" >>lcov.info
"""
shell = "{{ vars.task_shell }}"

# Linux-only, because the pipeline feeding it is.
# The guest .profraw this reads exist only if the instrumented wasm builds ran, and those need the wasm-capable
# conda clang genuinely first on PATH -- which this env's `_.path` prepend does not achieve on macOS (see the
# header). Windows never runs coverage at all. So on any other OS there is no data to judge and the check says
# so and stops, rather than passing on an empty report.
#
# One export per coverage source, folded into a union, rather than one export over everything.
# libs/web and libs/wasi-guest are linked into several guests and into the browser test binaries, so every
# source holds its own partial view of the same file, and "did anything exercise this branch" is the union of
# those views. The sources are what the three merge tasks leave behind: wasm-cov's per-guest profdata and gutted
# object under target/wasi-cov, and the agent's and pic-viewer's profdata plus every object their test binary
# linked under target/agent-cov and target/pic-viewer-cov. Each is exported on its own, with the branch regions a
# full `--format=text` export carries, and cov-branch-union.jq folds them into the summary shape
# _cov-branch-assert reads. A single export over every guest object against one merged profile was the first
# shape, and it reported libs/web as absent even though the same objects export it one at a time:
# `libs/web: no records in the report -- this run never exercised the crate` on commit
# https://github.com/edge-toolkit/core/commit/d32048c2e87fea4693efed25d1f12482cca28248 at
# https://github.com/edge-toolkit/core/actions/runs/35051118134/job/104651501456.
[tasks.wasm-cov-branch-check]
description = "Linux-only: fail unless every wasm libs/ crate is at 100% branch coverage"
run = """
os="$(coreutils uname -s)"
if [ "$os" != "Linux" ]; then
  echo "wasm-cov-branch-check: the wasm coverage pipeline only runs on Linux; nothing to check on $os"
  exit 0
fi
host="$(rustc -vV | goawk '/^host:/ { print $2 }')"
bin="$(rustc +{{ vars.rust_nightly }} --print sysroot)/lib/rustlib/$host/bin"
exports=target/cov/wasm-branch
coreutils rm -rf "$exports"
coreutils mkdir -p "$exports"
export_branches() {
  out=$1
  profdata=$2
  shift 2
  "$bin/llvm-cov" export --format=text --instr-profile "$profdata" "$@" >"$exports/$out.json"
}

guests=target/wasi-cov
if [ -z "$(find "$guests" -maxdepth 1 -name '*.o' -print -quit 2>/dev/null)" ]; then
  echo "wasm-cov-branch-check: no $guests/*.o -- run the instrumented wasm build and wasm-cov first" >&2
  exit 1
fi
for obj in "$guests"/*.o; do
  name="$(coreutils basename "$obj" .o)"
  export_branches "guest-$name" "$guests/$name.profdata" -object "$obj"
done

for run in "agent-cov agent" "pic-viewer-cov pic-viewer"; do
  dir="target/${run%% *}"
  profdata="$dir/${run#* }.profdata"
  if [ ! -f "$profdata" ]; then
    echo "wasm-cov-branch-check: no $profdata -- run the browser coverage task that writes it first" >&2
    exit 1
  fi
  objs=()
  while IFS= read -r obj; do
    [ -n "$obj" ] || continue
    objs+=("-object" "$obj")
  done <<OBJS
$(find "$dir" -maxdepth 1 -name '*.o' -print 2>/dev/null | coreutils sort)
OBJS
  export_branches "${run#* }" "$profdata" "${objs[@]}"
done

report=target/cov/wasm-libs.json
coreutils cat "$exports"/*.json | jaq -n -f .mise/cov-branch-union.jq >"$report"
echo "wasm-cov-branch-check: libs/ files in the union:"
jaq -r '.data[0].files[].filename | select(contains("/libs/"))' "$report" | coreutils sort
mise run _cov-branch-assert "$report" "{{ vars.wasm_cov_libs }}"
"""
shell = "{{ vars.task_shell }}"

[tasks.pytest-cov]
description = "Combined Python coverage (pytest + web-runner Pyodide runs) -> Cobertura for Codecov/DeepSource"
# One Python report is combined from several data sources: the pytest runs plus the web-runner Pyodide runs.
# The Python workflow pytest runs and the web-runner integration test (which drops the modules' .coverage files
# into target/pycov/ when ET_TEST_COVERAGE is set) all feed `coverage combine`. The paths in
# config/coverage.toml remap them into a single Cobertura report.
run = """
pyface=services/ws-modules/pyface1
pydemo=services/ws-modules/pydemo1
pyeye=services/ws-modules/pyeye1
pyspeech=services/ws-modules/pyspeech1
pycov=target/pycov
mkdir -p "$pycov"
uv run --directory "$pyface" pytest --cov=pyface1 --cov-report=
cp "$pyface/.coverage" "$pycov/.coverage.pyface1_pytest"
uv run --directory "$pydemo" pytest --cov=pydemo1 --cov-report=
cp "$pydemo/.coverage" "$pycov/.coverage.pydemo1_pytest"
uv run --directory "$pyeye" pytest --cov=pyeye1 --cov-report=
cp "$pyeye/.coverage" "$pycov/.coverage.pyeye1_pytest"
uv run --directory "$pyspeech" pytest --cov=pyspeech1 --cov-report=
cp "$pyspeech/.coverage" "$pycov/.coverage.pyspeech1_pytest"
uv run --project "$pyface" coverage combine "$pycov"
uv run --project "$pyface" coverage xml -o coverage-python.xml
"""
shell = "{{ vars.task_shell }}"

[tasks.pytest-cov.env]
COVERAGE_RCFILE = "{{ config_root }}/config/coverage.toml"
UV_PYTHON = "{% if os() == 'windows' %}{{ vars.py3_win }}{% else %}{{ vars.py3_unix }}{% endif %}"

[tasks.wasm-agent-cov]
depends = ["build-wasm-cov-wrapper"]
description = "Coverage for the browser ws-wasm-agent: run its wasm-bindgen tests headless, emit lcov into lcov.info"
# The agent is a browser wasm client with no native tests, so its lib is invisible to the cargo-llvm-cov run.
# This drives its wasm-bindgen tests (tests/client.rs and tests/web.rs) in a real headless Chrome and folds the
# result into the same lcov.info the other coverage tasks feed. Two pieces make it work:
#   1. A live backend. tests/client.rs covers the offline paths on its own, but the connected paths (onopen,
#      the connect-ack dispatch, the online send/flush/keepalive) need a server, so we start the in-process
#      et-ws-test-server (its cov-server bin) on the fixed port the tests dial, wait for its readiness marker,
#      and kill it after. It is built without the coverage wrapper, so it stays uninstrumented.
#   2. Instrumentation. wasm-bindgen-test 0.3 has built-in coverage under --cfg wasm_bindgen_unstable_test_coverage
#      (it pulls minicov and exports __wbgtest_cov_dump, which the test runner POSTs back and writes to
#      LLVM_PROFILE_FILE). The workspace wrapper adds -Cinstrument-coverage --emit=llvm-ir to our crates only,
#      and --features coverage links minicov's profiler runtime the same way the browser modules do.
# The .profraw -> lcov conversion mirrors wasm-cov (gut every .ll body to `unreachable`, keep the covmap, llc to a
# fixed x86_64 ELF object, then llvm-cov), with one addition: the test binary links several workspace crates and
# the agent's generic message helpers monomorphize into the test crate's object, so we compile every workspace
# .ll (not one) and keep only the records of the two crates these tests actually drive -- the agent lib and
# et-web. Gutting can leave an attribute group empty, which llc rejects, so emptied groups get a benign
# `nounwind`.
run = """
covdir=target/agent-cov
coreutils mkdir -p "$covdir"
coreutils rm -f "$covdir"/*.profraw "$covdir"/*.o "$covdir"/*.g.ll "$covdir/server-ready"
# Force the agent and et-web crates to recompile so this run emits fresh instrumented .ll for both.
# A covmap must match the .profraw we are about to capture, but cargo only re-emits `--emit=llvm-ir` when a crate
# actually compiles, so on a warm cache a stale or missing .ll would make llvm-cov drop that crate's functions (a
# bare `cargo test` cache hit yields only the generic helpers' covmap, which monomorphize into the test crate's
# object). et-web is cleaned alongside the agent because tests/web.rs exercises its browser helpers directly --
# `websocket_url` and `describe_js_error` have no other route to coverage, since they run only in a browser and
# the ws-modules guests reach them through paths the runner tests never take. Every other workspace crate's .ll
# is still dropped by the keep filters below, fresh or stale.
rustup target add wasm32-unknown-unknown
cargo clean -p et-ws-wasm-agent --target wasm32-unknown-unknown
cargo clean -p et-web --target wasm32-unknown-unknown

# Resolve the webdriver, honouring a CHROMEDRIVER already in the environment before the mise-pinned one.
# CI points CHROMEDRIVER at the runner's chromedriver (matched to its preinstalled Chrome); locally this falls
# back to the mise-managed http:chromedriver.
driver="${CHROMEDRIVER:-$(mise which chromedriver)}"

# Build + run cov-server itself instrumented so the launcher is not reported as untested.
# It uses native -Cinstrument-coverage and flushes its counters to this .profraw on the clean exit that removing
# the marker below triggers.
#
# Deliberately WITHOUT `-Zcoverage-options=branch`, unlike the rest of the pipeline: branch regions over async
# code make llvm-cov segfault while reading this binary's coverage map, so the `-object target/debug/cov-server`
# export below aborts the whole task with
#     bash: line 98: 49175 Segmentation fault: 11  "$llbin/llvm-cov" export --format=lcov
#       --instr-profile "$csp.profdata" -object target/debug/cov-server > "$csp.lcov"
# and no LLVM stack trace. Under lldb the frame is
# `llvm::coverage::CoverageMapping::getInstantiationGroups(llvm::StringRef) const + 412`, an EXC_BAD_ACCESS on a
# near-null address -- the open upstream bug https://github.com/llvm/llvm-project/issues/189169 ("Crash in
# llvm-cov for rust with async code and --branch option", minimal repro at
# https://github.com/mscharley/llvm-cov-crash). It reproduces identically under every llvm-cov on hand (the
# nightly, stable and previous-stable toolchains' copies), is unaffected by `-num-threads=1` or an 8x larger
# stack, and follows the object rather than the profile.
# cov-server crossed the threshold when it gained the storage service's object_store dependency tree (285 crates,
# a 10.4 MB __llvm_covfun), which is why the coverage lane passed on commit d8d42f9c and failed from
# https://github.com/edge-toolkit/core/commit/6e80f4decd7d7d78ec6bd770d52105f4bd5db15a onward -- e.g.
# https://github.com/edge-toolkit/core/actions/runs/30988267419/job/92248023234.
# Dropping branch regions for this one binary keeps its line coverage and costs only its own BRDA records; every
# other crate still gets branch coverage via `a_wasm_cov_instr` / the show-env wrapper. Restore the flag here
# once #189169 is fixed and the toolchain ships it.
RUSTFLAGS="-Cinstrument-coverage" cargo build -q -p et-ws-test-server --bin cov-server
LLVM_PROFILE_FILE="{{ config_root }}/$covdir/cov-server-%p.profraw" ./target/debug/cov-server "$covdir/server-ready" &
server_pid=$!
trap 'kill "$server_pid" 2>/dev/null || true' EXIT
for _ in $(coreutils seq 1 100); do
  [ -s "$covdir/server-ready" ] && break
  coreutils sleep 0.1
done
[ -s "$covdir/server-ready" ] || {
  echo "cov-server never became ready"
  exit 1
}

# Export the instrumentation env for the coverage test build.
# Trailing-backslash line continuations are banned repo-wide, so each variable is set on its own line; no later
# step invokes cargo, so these staying set for the rest of the script is harmless.
runner="$(mise which wasm-bindgen-test-runner)"
export RUSTC_WORKSPACE_WRAPPER="{{ config_root }}/target/debug/int-wasm-cov-wrapper"
export RUSTFLAGS="--cfg wasm_bindgen_unstable_test_coverage"
export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER="$runner"
export CHROMEDRIVER="$driver"
export LLVM_PROFILE_FILE="{{ config_root }}/$covdir/wasm-agent-%p.profraw"
cargo test -p et-ws-wasm-agent --features coverage --target wasm32-unknown-unknown --test client --test web

# Remove the marker so cov-server returns from main and flushes its coverage, then reap it (a kill would drop it).
coreutils rm -f "$covdir/server-ready"
wait "$server_pid" 2>/dev/null || true
trap - EXIT

host="$(rustc +{{ vars.rust_nightly }} -vV | goawk '/^host:/ { print $2 }')"
llbin="$(rustc +{{ vars.rust_nightly }} --print sysroot)/lib/rustlib/$host/bin"
"$llbin/llvm-profdata" merge -sparse -o "$covdir/agent.profdata" "$covdir"/wasm-agent-*.profraw
. .mise/wasm-ll-objs.sh "$covdir" "$llbin" wasm-agent-cov
"$llbin/llvm-cov" export --format=lcov --instr-profile "$covdir/agent.profdata" "${objs[@]}" >"$covdir/all.lcov"
coreutils touch lcov.info
goawk -v want="ws-wasm-agent/src/" -f .mise/lcov-keep-want.awk "$covdir/all.lcov" >>lcov.info
# Second pass for et-web, whose browser helpers tests/web.rs drives.
# One `want` substring per pass, matching the cov-server fold below, rather than a combined pattern the filter
# cannot express.
goawk -v want="libs/web/src/" -f .mise/lcov-keep-want.awk "$covdir/all.lcov" >>lcov.info

# Fold cov-server's own native coverage in from the instrumented run above (its cov-server-*.profraw).
# The export object links its whole dep tree, so keep only the cov-server.rs launcher records.
csp="$covdir/cov-server"
"$llbin/llvm-profdata" merge -sparse -o "$csp.profdata" "$covdir"/cov-server-*.profraw
"$llbin/llvm-cov" export --format=lcov --instr-profile "$csp.profdata" -object target/debug/cov-server >"$csp.lcov"
goawk -v want="ws-test-server/src/bin/cov-server.rs" -f .mise/lcov-keep-want.awk "$csp.lcov" >>lcov.info

rpt="$covdir/report.txt"
"$llbin/llvm-cov" report --instr-profile "$covdir/agent.profdata" "${objs[@]}" >"$rpt" 2>/dev/null || true
rg "ws-wasm-agent/src/lib.rs|Filename|TOTAL" "$rpt" || true
"""
shell = "{{ vars.task_shell }}"

[tasks.pic-viewer-cov]
depends = ["build-wasm-cov-wrapper"]
description = "Coverage for pic-viewer: run its wasm-bindgen display tests headless, emit lcov into lcov.info"
# Coverage for the module's browser-only display path; its native parse tests already ride cargo-llvm-cov.
# show_image's fetch/decode/canvas-draw only runs in a real browser, so this drives the wasm-bindgen browser
# tests (tests/show_image.rs) in headless Chrome, instrumented the same way as wasm-agent-cov -- the
# workspace wrapper's -Cinstrument-coverage + --emit=llvm-ir, wasm-bindgen-test's built-in coverage cfg, and
# et-web/coverage for minicov's profiler runtime -- then converts the .profraw the same way (gut every
# workspace .ll body to `unreachable`, keep the covmap, llc to a fixed x86_64 ELF object, llvm-cov to lcov,
# keep only this module's records). No backend is needed: the display tests are offline.
run = """
covdir=target/pic-viewer-cov
coreutils mkdir -p "$covdir"
coreutils rm -f "$covdir"/*.profraw "$covdir"/*.o "$covdir"/*.g.ll
# Force a recompile so this run emits a fresh instrumented .ll whose covmap matches the captured .profraw.
rustup target add wasm32-unknown-unknown
cargo clean -p et-ws-pic-viewer --target wasm32-unknown-unknown

# Resolve the webdriver, honouring a CHROMEDRIVER already in the environment before the mise-pinned one.
driver="${CHROMEDRIVER:-$(mise which chromedriver)}"

runner="$(mise which wasm-bindgen-test-runner)"
export RUSTC_WORKSPACE_WRAPPER="{{ config_root }}/target/debug/int-wasm-cov-wrapper"
export RUSTFLAGS="--cfg wasm_bindgen_unstable_test_coverage"
export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER="$runner"
export CHROMEDRIVER="$driver"
export LLVM_PROFILE_FILE="{{ config_root }}/$covdir/pic-viewer-%p.profraw"
cargo test -p et-ws-pic-viewer --features et-web/coverage --target wasm32-unknown-unknown --test show_image

host="$(rustc +{{ vars.rust_nightly }} -vV | goawk '/^host:/ { print $2 }')"
llbin="$(rustc +{{ vars.rust_nightly }} --print sysroot)/lib/rustlib/$host/bin"
"$llbin/llvm-profdata" merge -sparse -o "$covdir/pic-viewer.profdata" "$covdir"/pic-viewer-*.profraw
. .mise/wasm-ll-objs.sh "$covdir" "$llbin" pic-viewer-cov
"$llbin/llvm-cov" export --format=lcov --instr-profile "$covdir/pic-viewer.profdata" "${objs[@]}" >"$covdir/all.lcov"
coreutils touch lcov.info
goawk -v want="ws-modules/pic-viewer/src/" -f .mise/lcov-keep-want.awk "$covdir/all.lcov" >>lcov.info

rpt="$covdir/report.txt"
"$llbin/llvm-cov" report --instr-profile "$covdir/pic-viewer.profdata" "${objs[@]}" >"$rpt" 2>/dev/null || true
rg "ws-modules/pic-viewer/src/lib.rs|Filename|TOTAL" "$rpt" || true
"""
shell = "{{ vars.task_shell }}"

[tasks.sloc]
description = "Count source lines of code: non-test vs test totals plus a per-language split (scc)"
run = """
out=target/sloc
coreutils rm -rf "$out"
coreutils mkdir -p "$out"

# Count the repository of record rather than the working tree.
# `git ls-files` fixes the input set without relying on either counter's own ignore handling, and it hands this
# task and sloc-crosscheck byte-identical lists so a difference between the two tools is only ever a counting
# rule. verification/ is the one exclusion: those files are expected-output fixtures a generator emits for
# byte-comparison, so they are data the counts would inflate, not source anyone reads.
excluded='^verification/'
# A test is a file under a `tests/` directory, or one whose basename starts with `test_`.
# That is the repo's stated test convention and, checked against the tree, the only two shapes in it.
tests='(^|/)(tests/|test_[^/]*$)'
# generated/ counts as source, and is also measured on its own so a report can state how much is machine-made.
# It holds no test-shaped path, so it sits entirely inside the non-test partition and cannot split across the
# two -- which is what keeps the identity check below meaningful.
generated='^generated/'

git ls-files | rg -v "$excluded" >"$out/all.txt"
rg "$tests" <"$out/all.txt" >"$out/test.txt"
rg -v "$tests" <"$out/all.txt" >"$out/non-test.txt"
rg "$generated" <"$out/all.txt" >"$out/generated.txt"

# --no-cocomo drops the cost estimate: COCOMO is a model with its own assumptions, not a measurement.
# Each partition also lands as json + csv so a figure in prose can be regenerated instead of transcribed.
count() {
  echo "== $2 =="
  fmt="tabular:stdout,json:$out/$1.json,csv:$out/$1.csv"
  xargs scc --no-cocomo --sort code --format-multi "$fmt" <"$out/$1.txt"
}
count all "all source"
count non-test "non-test source"
count test "test source"
count generated "generated source (a subset of non-test, shown for reference)"

# Per-language test vs non-test, joined from the same json the totals come from so the two cannot disagree.
# scc counts one partition per run, so the split has to be assembled here rather than read off a single table.
{
  printf 'language\\tnon_test_code\\ttest_code\\ttotal_code\\n'
  # $doc and $l are jaq bindings, not shell variables, so the program stays single-quoted.
  # shellcheck disable=SC2016
  printf '{"nontest":%s,"test":%s}' "$(coreutils cat "$out/non-test.json")" "$(coreutils cat "$out/test.json")" |
    jaq -r '. as $doc
      | (reduce $doc.nontest[] as $l ({}; .[$l.Name] = {nontest: $l.Code, test: 0}))
      | (reduce $doc.test[] as $l (.; .[$l.Name] = {nontest: (.[$l.Name].nontest // 0), test: $l.Code}))
      | to_entries
      | map({lang: .key, nontest: .value.nontest, test: .value.test, total: (.value.nontest + .value.test)})
      | sort_by(-.total)
      | .[]
      | [.lang, .nontest, .test, .total]
      | @tsv'
} >"$out/by-language.tsv"

# The test share is derived at print time rather than stored, so the tsv holds only measured counts.
echo "== per-language test vs non-test =="
goawk -F '\\t' 'NR == 1 { printf "%-30s %10s %10s %10s %7s\\n", "Language", $2, $3, $4, "test%"; next }
  { nt += $2; t += $3; total += $4
    printf "%-30s %10d %10d %10d %7s\\n", substr($1, 1, 30), $2, $3, $4,
      ($4 > 0 ? sprintf("%.1f", 100 * $3 / $4) : "-") }
  END { printf "%-30s %10d %10d %10d %7s\\n", "TOTAL", nt, t, total,
      (total > 0 ? sprintf("%.1f", 100 * t / total) : "-") }' "$out/by-language.tsv"

# Every counted line must fall in exactly one partition, so a classification miss fails instead of passing.
code() { jaq '[.[].Code] | add' <"$out/$1.json"; }
total=$(code all)
production=$(code non-test)
tested=$(code test)
machine=$(code generated)
if [ "$total" -ne "$((production + tested))" ]; then
  echo "sloc partitions do not sum: all=$total non-test=$production test=$tested" >&2
  exit 1
fi
echo "sloc: $total code lines = $production non-test + $tested test; $machine of the non-test lines generated"
"""
shell = "{{ vars.task_shell }}"

[tasks.sloc-crosscheck]
depends = ["sloc"]
description = "Re-count sloc's file lists with gocloc, an independent implementation of cloc's rules"
# Corroboration, not a gate.
# Two implementations disagree by a few lines wherever their comment and blank-line rules differ, and the
# point is to show the primary figure does not rest on a single tool. A wide gap means something is being
# counted that should not be, so the deltas are printed for a human to read rather than asserted on.
run = """
out=target/sloc
for part in all non-test test generated; do
  xargs gocloc --output-type=json <"$out/$part.txt" >"$out/gocloc-$part.json"
  scc_code=$(jaq '[.[].Code] | add' <"$out/$part.json")
  gocloc_code=$(jaq '.total.code' <"$out/gocloc-$part.json")
  delta=$((scc_code - gocloc_code))
  printf "%-9s scc=%s gocloc=%s delta=%s\\n" "$part" "$scc_code" "$gocloc_code" "$delta"
done
"""
shell = "{{ vars.task_shell }}"
