# GPU probe page environment: the tools that build the probe page and the tasks that build, serve and drive it.
# Loaded when MISE_ENV includes `webprobe`, as in `mise -E webprobe run gpu-probe-page`. It is opt-in because nothing
# else in the repository needs these tools: a host that builds only the site, such as the Vercel deploy, sets
# MISE_ENV=webprobe for both its install and build commands. The registry's own tasks, gen:gpu-probe-signatures,
# gpu-probe-fold and gpu-probe-signatures-check, stay in the base config, since the checks run them.

[tools]
# The tools build-gpu-probe-page-legacy makes the probe page with for browsers with no WebAssembly or ES modules.
# binaryen's wasm2js turns the probes' WebAssembly into JavaScript, esbuild bundles it with the page's script into one
# file, and swc lowers that file to ES5, naming the core-js polyfills it uses, which esbuild then bundles in.
"github:WebAssembly/binaryen" = { version = "latest", version_prefix = "version_", strip_components = 1 }
"github:swc-project/swc" = { version = "latest", rename_exe = "swc" }
# Held to the release swc's swc.jsonc `coreJs` names, which is the one swc picks polyfill modules for.
"npm:core-js" = "3.51.0"
"npm:esbuild" = "latest"

[vars]
# The address a server binds to for other devices on the LAN to reach it: every IPv4 interface.
lan_bind = "0.0.0.0"
# The command every gpu-probe server task starts the server with, before the arguments it passes.
gpu_probe_server = "cargo run -p et-gpu-probe-server --bin et-gpu-probe-server --"
# The arguments the gpu-probe server tasks share: the registry, the probe page, and the certificate they serve.
# The pair lives under target/ so it is never committed; delete it to have one generated for a new LAN address.
gpu_probe_server_args = """
{{ "--registry libs/gpu-probe/signatures --root utilities/gpu-probe/static " ~
  "--cert target/gpu-probe-server-cert.pem --key target/gpu-probe-server-key.pem" -}}
"""
# Plain HTTP to the LAN, on a port of its own beside the HTTPS server's.
gpu_probe_lan_http_args = "--http --insecure-origin --port 8445 --bind {{ vars.lan_bind }}"

[tasks.build-gpu-probe-page]
description = "Build the GPU probe sets as WASM into utilities/gpu-probe/static/pkg, for the page the server serves"
dir = "utilities/gpu-probe/web"
run = """
pkg="../static/pkg"
wasm-pack build . --target web --out-dir "$pkg" --no-pack {{ vars.no_opt }} -- --target wasm32-unknown-unknown
"""
shell = "{{ vars.task_shell }}"

# The same WASM for browsers whose WebAssembly has no reference types, which the page loads where the other fails.
# Chrome turned them on in 96, a version Android 5 never got, and Chrome 95 on a Galaxy Note 3 refused the page with
#   CompileError: WebAssembly.instantiateStreaming(): invalid value type 'externref', enable with
#   --experimental-wasm-reftypes @+42
# Leaving them out of the crate's flags is not enough: the std Rust ships for wasm32 has them compiled in, and
# wasm-bindgen then fails with "failed to find the `__wbindgen_externref_table_dealloc` function". So std is rebuilt
# with the same flags, which only nightly can do. RUSTFLAGS, not the CARGO_TARGET_* variable the workspace sets,
# because it wins over that one. `rust_nightly` predates the workspace `rust-version`, hence
# --ignore-rust-version. A target directory of its own keeps the two builds from discarding each other's artifacts.
[tasks.build-gpu-probe-page-compat]
description = "Build the GPU probe WASM without reference types into utilities/gpu-probe/static/pkg-compat"
dir = "utilities/gpu-probe/web"
run = """
pkg="../static/pkg-compat"
export RUSTUP_TOOLCHAIN="{{ vars.rust_nightly }}"
export RUSTFLAGS="{{ vars.a_wasm_mvp_rustflags }}"
export CARGO_TARGET_DIR="{{ config_root }}/target/gpu-probe-compat"
std="-Z build-std=std,panic_abort --ignore-rust-version"
# shellcheck disable=SC2086 # $std is two flags, split by design.
wasm-pack build . --target web --out-dir "$pkg" --no-pack {{ vars.no_opt }} -- --target wasm32-unknown-unknown $std
"""
shell = "{{ vars.task_shell }}"

# The probe page's script for a browser with no ES modules or no WebAssembly, which index.html loads for one.
# Safari 9 on an iPad 3 with iOS 9.3.6 has neither, and left the page at "Loading the probes..." with
#   The probes could not run: the page's script never started, as in a browser too old for it
#   user agent: Mozilla/5.0 (iPad; CPU OS 9_3_6 like Mac OS X) AppleWebKit/601.1.46 (KHTML, like Gecko) Version/9.0
# It starts from the compat build's WebAssembly, which has nothing past the first WebAssembly release: wasm-bindgen
# gives it glue for a bundler, wasm2js turns it into JavaScript under the name the glue imports it by, esbuild bundles
# that with the page's script and the polyfills such a browser needs, and swc lowers the bundle to ES5.
[tasks.build-gpu-probe-page-legacy]
depends = ["build-gpu-probe-page-compat"]
description = "Build the GPU probe page's script as ES5, with no WebAssembly, into utilities/gpu-probe/static/legacy"
run = """
name=et_int_gpu_probe_web
stage=target/gpu-probe-legacy
legacy=utilities/gpu-probe/legacy
out=utilities/gpu-probe/static/legacy
coreutils rm -rf "$stage"
coreutils mkdir -p "$stage/pkg" "$out"
wasm-bindgen --target bundler --out-dir "$stage/pkg" "target/gpu-probe-compat/wasm32-unknown-unknown/release/$name.wasm"
# Each of the glue's views of memory is renewed whenever memory has a different buffer.
# The glue renews one only once the buffer under it is detached, which WebAssembly does when memory grows, but wasm2js
# grows it into a new buffer and leaves the old one whole, so a view would go on using the old one: a string the
# probes return past its end comes back empty, failing the page with
#   The probes could not run: SyntaxError: Unexpected end of JSON input
# and a pointer read back wrongly is freed, which Rust's allocator answers with an `abort` panic. The glue already
# compares buffers for its DataView, but only where `detached` is unknown.
glue="$stage/pkg/${name}_bg.js"
stale='(cached\\w+Memory0)(?:\\.byteLength === 0|\\.buffer\\.detached === true)'
rg --passthru --no-line-number -r '$1.buffer !== wasm.memory.buffer' "$stale" "$glue" >"$glue.renewed"
coreutils mv -f "$glue.renewed" "$glue"
wasm2js "$stage/pkg/${name}_bg.wasm" -O2 -o "$stage/pkg/${name}_bg.js.wasm"
coreutils mv -f "$stage/pkg/${name}_bg.js.wasm" "$stage/pkg/${name}_bg.wasm"
bundle="--bundle --format=iife --loader:.wasm=js --tsconfig=$legacy/tsconfig.json"
# shellcheck disable=SC2086 # $bundle is several flags, split by design.
esbuild "$legacy/entry.js" $bundle --outfile="$stage/bundle.js"
swc compile "$stage/bundle.js" --config-file "$legacy/swc.jsonc" --out-file "$stage/lowered.js"
# The lowered script requires the core-js modules swc named, which esbuild bundles in from mise's install of core-js.
core_js="$(mise where npm:core-js)/node_modules/core-js"
es5="--bundle --format=iife --target=es5 --minify-whitespace"
# shellcheck disable=SC2086 # $es5 is several flags, split by design.
esbuild "$stage/lowered.js" $es5 "--alias:core-js=$core_js" --outfile="$out/probe.js"
"""
shell = "{{ vars.task_shell }}"

[tasks.build-gpu-probe-site]
depends = ["build-gpu-probe-page", "build-gpu-probe-page-legacy"]
description = "Assemble the GPU probe page as a static site in target/gpu-probe-site, to deploy to a host like Vercel"
# The site is the page, its WASM in both builds, its legacy script, the server's files beside it, and the registry.
# The page holds what it measured against the registry, so that it proposes only what the registry does not record.
# The registry is the committed JSON, not a regenerated one: a Vercel deploy installs no yq, failing a regeneration
#   [gen:gpu-probe-signatures] /vercel/path0/.mise/task-shell.sh: line 56: yq: command not found
# on commit https://github.com/edge-toolkit/core/commit/1340bd269a5b47d15bd735eafd308900bf8eaada, and the JSON leaves
# submitted/ out, so it is what a regeneration gives wherever gpu-probe-signatures-check passes.
# wasm-pack leaves a .gitignore of `*` in the package, which would keep the package out of a deploy that reads it, so
# it is left behind.
run = """
site=target/gpu-probe-site
coreutils rm -rf "$site"
static=utilities/gpu-probe/static
coreutils mkdir -p "$site/pkg" "$site/pkg-compat" "$site/legacy"
coreutils cp "$static/index.html" "$static"/*.js "$site/"
coreutils cp "$static"/pkg/*.js "$static"/pkg/*.wasm "$site/pkg/"
coreutils cp "$static"/pkg-compat/*.js "$static"/pkg-compat/*.wasm "$site/pkg-compat/"
coreutils cp "$static/legacy/probe.js" "$site/legacy/probe.js"
coreutils cp utilities/gpu-probe/src/probe.css "$site/probe.css"
coreutils cp utilities/gpu-probe/src/favicon.svg "$site/favicon.svg"
coreutils cp utilities/gpu-probe/src/register.mjs "$site/register.js"
coreutils cp utilities/gpu-probe/src/propose.mjs "$site/propose.js"
coreutils cp libs/gpu-probe/signatures.json "$site/signatures.json"
"""
shell = "{{ vars.task_shell }}"

[tasks.gpu-probe-page]
depends = ["build-gpu-probe-page", "build-gpu-probe-page-legacy"]
description = "Serve the GPU probe page at http://localhost:8099/, adding what it submits to the registry"
run = "{{ vars.gpu_probe_server }} {{ vars.gpu_probe_server_args }} --http --port 8099"

[tasks.gpu-probe-chrome]
depends = ["build-gpu-probe-page"]
description = "Probe every GPU Google Chrome offers on the GPU probe page, WebGL on the ANGLE backend named"
# Serve the probe page and open Google Chrome on it, for a person to submit from or, with --submit, driven to.
#
# The page is served at localhost:8099 for the length of the task, unless a `gpu-probe-page` already serves it, and
# every job the task starts is stopped when it ends. Chrome is started with WebGPU on Vulkan, which Chrome on Linux
# offers only with Vulkan turned on and the GPU blocklist overridden, and WebGL on the ANGLE backend named. ANGLE takes
# Vulkan from its features rather than `--use-angle=vulkan`, which leaves Chrome with no WebGL 2 context, and Chrome
# honours only one `--enable-features`. The registry's Linux sightings were taken under X11, and each run gets a
# profile of its own under target/, so the person's own Chrome is never touched.
#
# By default Chrome opens for a person to check each row and submit. With --submit, chromedriver drives it through
# WebDriver, whose calls curl makes: the page submits every set itself when opened with `submit`, and says how each
# went in its status line, which the task prints. google-chrome and curl are the host's: the probes measure the
# browser the person has.
#
# --environment starts Chrome under driver settings, such as VK_DRIVER_FILES naming one GPU's Vulkan driver, which
# reaches a GPU Chrome would not pick of two. The page cannot see them, so they are passed to it as the rows'
# environment, sorted by name as gpu-probe records its own.
#
# --headless runs Chrome with no display, through EGL, and so reaches through ANGLE's gl backend a GPU that NVIDIA's
# EGL drives while another GPU drives the display: under X11 that EGL takes down Chrome's GPU process. WebGPU is left
# off, since the software adapter it falls back to there leaves the page no WebGL context, and so is Vulkan for the gl
# backends, which would composite on the display's GPU and leave WebGL none either.
run = """
# shellcheck shell=bash # Linux only: it starts the host's google-chrome with the Vulkan switches of Chrome on Linux.
trap 'coreutils kill $(jobs -p) 2>/dev/null || true' EXIT
# Wait up to $3 seconds for $1 to answer, failing as soon as $2, the process that is to serve it, has exited.
ready() {
  for _ in $(coreutils seq "$3"); do
    if curl -sf -o /dev/null "$1"; then return 0; fi
    if ! kill -0 "$2" 2>/dev/null; then
      printf '%s exited before it served %s\\n' "$4" "$1" >&2
      return 1
    fi
    coreutils sleep 1
  done
  printf '%s did not serve %s within %ss\\n' "$4" "$1" "$3" >&2
  return 1
}
if ! curl -sf -o /dev/null http://localhost:8099/; then
  {{ vars.gpu_probe_server }} {{ vars.gpu_probe_server_args }} --http --port 8099 &
  ready http://localhost:8099/ $! 600 "the gpu-probe server"
fi
coreutils mkdir -p target/gpu-probe-chrome
# The device goes in the page's query, so it is percent-encoded: a `&` in it would otherwise start another parameter.
device="${usage_device:-}" yq -n 'strenv(device) | @uri' >target/gpu-probe-chrome/device
query="device=$(coreutils cat target/gpu-probe-chrome/device)"
read -r -a settings <<<"${usage_environment:-}"
for setting in "${settings[@]}"; do
  if [[ $setting != [!=]*=* ]]; then
    printf -- '--environment takes NAME=value settings, not %s\\n' "$setting" >&2
    exit 2
  fi
done
# Only the last of a name set twice reaches the browser, which the rows' sorted environment could not say.
names="$(printf '%s\\n' "${settings[@]%%=*}" | LC_ALL=C coreutils sort)"
repeated="$(coreutils uniq -d <<<"$names" | coreutils paste -s -d ' ')"
if [ -n "$repeated" ]; then
  printf -- '--environment sets each name once, but sets %s more than once\\n' "$repeated" >&2
  exit 2
fi
if [ -n "${usage_environment:-}" ]; then
  environment="$(printf '%s\\n' "${settings[@]}" | LC_ALL=C coreutils sort | coreutils paste -s -d ' ')"
  query="$query&environment=$(environment="$environment" yq -n 'strenv(environment) | @uri')"
fi
angle="${usage_angle:-vulkan}"
headless="${usage_headless:-false}"
if [ "$headless" = true ] && [ "${usage_submit:-false}" != true ]; then
  printf -- '--headless opens no window for a person to submit from, so it takes --submit\\n' >&2
  exit 2
fi
if [ "$angle" = vulkan ]; then
  switches=("--enable-features=Vulkan,VulkanFromANGLE,DefaultANGLEVulkan")
elif [ "$headless" = true ]; then
  switches=("--use-angle=$angle" --enable-unsafe-swiftshader)
else
  switches=(--enable-features=Vulkan "--use-angle=$angle" --enable-unsafe-swiftshader)
fi
if [ "$headless" = true ]; then
  switches+=(--headless=new --no-first-run)
else
  switches+=(--enable-unsafe-webgpu --ozone-platform=x11 --no-first-run)
fi
if [ "${usage_submit:-false}" != true ]; then
  profile="$PWD/target/gpu-probe-chrome/$angle"
  url="http://localhost:8099/?$query"
  coreutils env "${settings[@]}" google-chrome "${switches[@]}" "--user-data-dir=$profile" "$url"
  exit
fi
driver=http://localhost:9515
# Chrome is started by chromedriver, and takes the driver settings from its environment.
coreutils env "${settings[@]}" chromedriver --port=9515 >target/gpu-probe-chrome/chromedriver.log 2>&1 &
ready "$driver/status" $! 60 chromedriver
profile="$PWD/target/gpu-probe-chrome/$angle-driven"
args=$(printf '"%s",' "${switches[@]}" "--user-data-dir=$profile")
options='{"args":['"${args%,}"']}'
capabilities='{"capabilities":{"alwaysMatch":{"browserName":"chrome","goog:chromeOptions":'"$options"'}}}'
reply=target/gpu-probe-chrome/webdriver-reply.json
curl -sf -XPOST "$driver/session" -d "$capabilities" -o "$reply"
session="$driver/session/$(yq -p json '.value.sessionId' "$reply")"
url="http://localhost:8099/?submit&$query" yq -n -o json -I0 '{"url": strenv(url)}' >"$reply"
curl -sf -XPOST "$session/url" -d "@$reply" >/dev/null
read_status='{"script":"return document.getElementById(\\"status\\").textContent","args":[]}'
# The page says "Submitted." only when every set went in or was on record already, and "Not submitted." otherwise.
status=""
for _ in $(coreutils seq 300); do
  coreutils sleep 2
  curl -sf -XPOST "$session/execute/sync" -d "$read_status" -o "$reply"
  status=$(yq -p json '.value' "$reply")
  if [[ $status == Submitted* || $status == "Not submitted"* || $status == "The probes could not run"* ]]; then
    break
  fi
done
curl -sf -XDELETE "$session" >/dev/null
printf '%s\\n' "${status:-the page said nothing within 600s}"
[[ $status == Submitted* ]]
"""
shell = "{{ vars.task_shell }}"
usage = """
arg "[angle]" help="The ANGLE backend Chrome runs WebGL on: vulkan (default), gl or swiftshader"
flag "--device <device>" help="The machine the rows name, such as its make and model"
flag "--environment <settings>" help="Driver settings to start Chrome under, as NAME=value separated by spaces"
flag "--headless" help="Run Chrome with no display, through EGL, and with no WebGPU; it takes --submit"
flag "--submit" help="Drive Chrome through chromedriver and submit every probe set, rather than open it for a person"
"""

[tasks.gpu-probe-browser]
depends = ["build-gpu-probe-page"]
description = "Probe a browser on the GPU probe page from a fresh profile: a Flatpak one on Linux, an app on macOS"
# Serve the probe page and open a browser on it, for a person to submit from or, with --submit, to submit by itself.
#
# The task serves the page itself, on a port of its own, and every job it starts is stopped when it ends. Each run
# gets a fresh profile under target/, so the person's own profile is never touched, and every run is a session of its
# own: Firefox keys its canvas PNG encoding to the session, so two runs are what tells a stable signature from a
# randomised one. On Linux firefox is the host's, and the others are the system Flatpaks from Flathub, given the
# profile's directory. On macOS each is the app installed in /Applications or ~/Applications, its version read from the
# bundle with the system's plutil; Safari alone takes no profile of its own, so it runs on the person's, and is quit
# once the run ends only if it was not open before. The probes measure the browser the person has, as it ships, its
# own defences named as the rows' defence.
#
# There is no WebDriver for most of these, and the one GNOME Web ships cannot reach the browser from inside its
# sandbox, so with --submit the page is opened with `submit` and read from the server: the page posts its status
# lines to `/status` once every set is submitted, and the server logs them.
#
# --environment starts the browser under driver settings, as gpu-probe-chrome's does, passed into a Flatpak's sandbox
# with its --env, where a path in one names the sandbox's own files rather than the host's. Safari opens only through
# Launch Services, which passes on no environment, so it takes none.
#
# --webgpu turns on WebGPU in a browser built on Firefox, which on Linux offers none as it ships, and past its GPU
# blocklist. It changes which interfaces answer, not what any answers, so it is named in the rows only as a defence it
# lifts, where the browser ships one.
run = """
# shellcheck shell=bash # Linux and macOS: the host's firefox or a Flathub Flatpak, or a macOS app.
trap 'coreutils kill $(jobs -p) 2>/dev/null || true' EXIT
browser="$usage_browser"
window=normal
defence=""
macos=false
if [ "$(coreutils uname -s)" = Darwin ]; then macos=true; fi
case "$browser" in
  firefox) app="" ;;
  chrome | safari)
    app=""
    if [ "$macos" != true ]; then
      printf '%s is run here on macOS only; on Linux Chrome has gpu-probe-chrome\\n' "$browser" >&2
      exit 2
    fi
    ;;
  librewolf)
    app=io.gitlab.librewolf-community
    defence="privacy.resistFingerprinting, on as LibreWolf ships"
    ;;
  mullvad-browser)
    app=net.mullvad.MullvadBrowser
    window=private
    defence="privacy.resistFingerprinting, on as Mullvad Browser ships"
    ;;
  brave)
    app=com.brave.Browser
    defence="Shields farbling, on as Brave ships"
    ;;
  chromium) app=org.chromium.Chromium ;;
  edge) app=com.microsoft.Edge ;;
  gnome-web) app=org.gnome.Epiphany ;;
  tor-browser)
    app=org.torproject.torbrowser-launcher
    window=private
    defence="privacy.resistFingerprinting, on as Tor Browser ships"
    ;;
esac
case "$browser" in
  brave | chromium | edge | chrome) chromium_based=true ;;
  *) chromium_based=false ;;
esac
if [ "${usage_high_performance_gpu:-false}" = true ] && [ "$chromium_based" != true ]; then
  printf -- '--high-performance-gpu is for a browser built on Chromium, not %s\\n' "$browser" >&2
  exit 2
fi
case "$browser" in
  firefox | librewolf | mullvad-browser | tor-browser) ;;
  *)
    if [ "${usage_webgpu:-false}" = true ]; then
      printf -- '--webgpu is for a browser built on Firefox, not %s\\n' "$browser" >&2
      exit 2
    fi
    ;;
esac
port="${usage_port:-8097}"
# A run's workspace is keyed by its port as well, so runs of one browser on two ports never share or remove the other's.
run="target/gpu-probe-browser/$browser-$port"
profile="$PWD/$run/profile"
log="$run/server.log"
# A server that accepts the connection but never answers would hold the run, so each request is given 2s.
serving=(curl -sf -o /dev/null --max-time 2 "http://localhost:$port/")
# A page another server already serves on the port would take the run's status lines, which this run never reads.
if "${serving[@]}"; then
  printf 'port %s is already serving a page; stop that server or pass another --port\\n' "$port" >&2
  exit 1
fi
coreutils rm -rf "$run"
coreutils mkdir -p "$profile"
# A caller's RUST_LOG is kept, but cannot hide the page's status lines.
# The server's app module logs them at info, and they are how the run's verdict is read.
status_log="et_gpu_probe_server::app=info"
filter="${RUST_LOG:+$RUST_LOG,}$status_log"
serve=(--http --port "$port")
NO_COLOR=1 RUST_LOG="$filter" {{ vars.gpu_probe_server }} {{ vars.gpu_probe_server_args }} "${serve[@]}" >"$log" 2>&1 &
server=$!
for _ in $(coreutils seq 600); do
  if "${serving[@]}"; then break; fi
  if ! kill -0 "$server" 2>/dev/null; then
    printf 'the gpu-probe server exited before it served the page; its log is %s\\n' "$log" >&2
    exit 1
  fi
  coreutils sleep 1
done
if [ "$macos" = true ]; then
  case "$browser" in
    firefox) bundle=Firefox ;;
    librewolf) bundle=LibreWolf ;;
    mullvad-browser) bundle="Mullvad Browser" ;;
    tor-browser) bundle="Tor Browser" ;;
    brave) bundle="Brave Browser" ;;
    chromium) bundle=Chromium ;;
    edge) bundle="Microsoft Edge" ;;
    chrome) bundle="Google Chrome" ;;
    safari) bundle=Safari ;;
    *)
      printf '%s has no macOS app\\n' "$browser" >&2
      exit 2
      ;;
  esac
  bundle_path=""
  for dir in /Applications "$HOME/Applications"; do
    if [ -d "$dir/$bundle.app" ]; then bundle_path="$dir/$bundle.app"; fi
  done
  if [ -z "$bundle_path" ]; then
    printf '%s.app is in neither /Applications nor ~/Applications\\n' "$bundle" >&2
    exit 1
  fi
  plist="$bundle_path/Contents/Info.plist"
  # A macOS app is no Flatpak: the run stops the process it started rather than a Flatpak instance.
  app=""
  launch=("$bundle_path/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$plist")")
  # The page reads the version of Firefox, Chrome and Safari itself; the others report another browser's.
  case "$browser" in
    firefox | chrome | safari) version="" ;;
    *) version="$(plutil -extract CFBundleShortVersionString raw "$plist")" ;;
  esac
  if [ "$browser" = tor-browser ]; then
    # The browser runs with no Tor, as it does on Linux, which cannot reach the page on localhost anyway.
    launch=(coreutils env TOR_PROVIDER=none "${launch[@]}")
  elif [ "$browser" = safari ]; then
    # Safari opens a URL only through Launch Services, whose `open` is made to wait for Safari to quit.
    # A run for a person then serves the page until they quit Safari, and a submitting run quits it itself.
    launch=(/usr/bin/open -W -a Safari)
    safari_was_open=false
    if pgrep -x Safari >/dev/null; then safari_was_open=true; fi
  fi
elif [ "$browser" = tor-browser ]; then
  # The launcher's Flatpak downloads Tor Browser on its first run; this runs that copy's own start script.
  tbb="$HOME/.var/app/$app/data/torbrowser/tbb/$(coreutils uname -m)/tor-browser/Browser"
  if [ ! -x "$tbb/start-tor-browser" ]; then
    printf 'Tor Browser is not downloaded yet: run "flatpak run --system %s" once first\\n' "$app" >&2
    exit 1
  fi
  # The browser runs with no Tor, which cannot reach the page on localhost anyway.
  # With Tor it waits on its connection before it opens the page. Its defences are the browser's own, as it ships them.
  launch=(flatpak run --system "--filesystem=$profile" --env=TOR_PROVIDER=none)
  launch+=("--command=$tbb/start-tor-browser" "$app")
  version="$(jaq -r .version "$tbb/tbb_version.json")"
elif [ -n "$app" ]; then
  launch=(flatpak run --system "--filesystem=$profile" "$app")
  # Flatpak translates the label to the locale, so it is read in the C locale's.
  version="$(LC_ALL=C flatpak info --system "$app" | rg -o 'Version: (\\S+)' -r '$1')"
else
  launch=(firefox)
  version=""
fi
query="device=$(device="${usage_device:-}" yq -n 'strenv(device) | @uri')&browser=$browser&window=$window"
if [ "$browser" = brave ]; then
  # Brave's own version is only for the labels: the row records the Chromium version, which the page reads itself.
  query="$query&brand_version=$version"
elif [ -n "$version" ]; then
  query="$query&browser_version=$version"
fi
if [ "$macos" = true ]; then
  # Only Chromium gives the system's version to the page.
  query="$query&os_version=$(sw_vers -productVersion)"
fi
read -r -a settings <<<"${usage_environment:-}"
for setting in "${settings[@]}"; do
  if [[ $setting != [!=]*=* ]]; then
    printf -- '--environment takes NAME=value settings, not %s\\n' "$setting" >&2
    exit 2
  fi
done
# Only the last of a name set twice reaches the browser, which the rows' sorted environment could not say.
names="$(printf '%s\\n' "${settings[@]%%=*}" | LC_ALL=C coreutils sort)"
repeated="$(coreutils uniq -d <<<"$names" | coreutils paste -s -d ' ')"
if [ -n "$repeated" ]; then
  printf -- '--environment sets each name once, but sets %s more than once\\n' "$repeated" >&2
  exit 2
fi
if [ -n "${usage_environment:-}" ]; then
  if [ "$browser" = safari ]; then
    printf -- '--environment cannot reach Safari, which opens only through Launch Services\\n' >&2
    exit 2
  elif [ -n "$app" ]; then
    # A Flatpak gives its sandbox none of the caller's environment, only what each --env sets.
    launch=("${launch[@]:0:3}" "${settings[@]/#/--env=}" "${launch[@]:3}")
  else
    launch=(coreutils env "${settings[@]}" "${launch[@]}")
  fi
  environment="$(printf '%s\\n' "${settings[@]}" | LC_ALL=C coreutils sort | coreutils paste -s -d ' ')"
  query="$query&environment=$(environment="$environment" yq -n 'strenv(environment) | @uri')"
fi
case "$browser" in
  firefox | librewolf | mullvad-browser | tor-browser)
    coreutils cp .mise/gpu-probe-browser.user.js "$profile/user.js"
    if [ "$browser" = tor-browser ]; then
      # Tor Browser sends even localhost through Tor, which cannot reach the page; these let it reach it directly.
      # Neither is a fingerprinting defence. Quick start connects to Tor without waiting on its connect screen.
      {
        printf 'user_pref("network.proxy.allow_hijacking_localhost", false);\\n'
        printf 'user_pref("network.proxy.no_proxies_on", "localhost");\\n'
        printf 'user_pref("torbrowser.settings.quickstart.enabled", true);\\n'
      } >>"$profile/user.js"
    fi
    if [ "$browser" = mullvad-browser ] || [ "$browser" = tor-browser ]; then
      # Both leave out NoScript, which freezes the page inside the Flatpak sandbox.
      # Its log says "Too many SyncMessage loops". Both ship it as a distribution add-on, which a profile that
      # records it as installed already never installs.
      noscript='{73a6fe31-595d-460b-a920-fcc0f8843232}'
      printf 'user_pref("extensions.installedDistroAddon.%s", true);\\n' "$noscript" >>"$profile/user.js"
      defence="$defence, NoScript left out"
    fi
    if [ "${usage_fingerprinting_protection:-false}" = true ]; then
      printf 'user_pref("privacy.fingerprintingProtection", true);\\n' >>"$profile/user.js"
      defence="${defence:+$defence, }privacy.fingerprintingProtection on"
    fi
    if [ "${usage_webgpu:-false}" = true ]; then
      printf 'user_pref("dom.webgpu.enabled", true);\\n' >>"$profile/user.js"
      printf 'user_pref("gfx.webgpu.ignore-blocklist", true);\\n' >>"$profile/user.js"
      # Only a browser that ships a defence of its own has WebGPU among the things it turns off.
      if [ -n "$defence" ]; then defence="$defence, WebGPU turned on"; fi
    fi
    args=(--no-remote --profile "$profile" --new-window)
    # Mullvad Browser and Tor Browser start through a script that sends the browser's output nowhere unless asked.
    if [ "$browser" = mullvad-browser ] || [ "$browser" = tor-browser ]; then
      args=(--verbose "${args[@]}")
    fi
    ;;
  gnome-web) args=(--private-instance) ;;
  # Safari starts without restoring the person's windows, so the probe page is the only one it opens.
  safari) args=(--fresh) ;;
  *) args=("--user-data-dir=$profile" --no-first-run --no-default-browser-check) ;;
esac
if [ "${usage_high_performance_gpu:-false}" = true ]; then
  # A machine with two GPUs runs WebGL on the low-power one unless told otherwise; WebGPU offers both either way.
  args+=(--force_high_performance_gpu)
fi
if [ -n "$defence" ]; then
  query="$query&defence=$(defence="$defence" yq -n 'strenv(defence) | @uri')"
fi
if [ "${usage_submit:-false}" != true ]; then
  "${launch[@]}" "${args[@]}" "http://localhost:$port/?$query"
  exit
fi
instance="$run/instance-id"
if [ -n "$app" ]; then
  # A Flatpak is stopped by the instance this run started.
  # A session of the same browser the person has open is then left alone, which the application's ID would not do.
  launch=("${launch[@]:0:2}" --instance-id-fd=3 "${launch[@]:2}")
fi
"${launch[@]}" "${args[@]}" "http://localhost:$port/?submit&$query" >"$run/browser.log" 2>&1 3>"$instance" &
opened=$!
# The page says "Submitted." only when every set went in or was on record already, and "Not submitted." otherwise.
verdict='page status: (Submitted|Not submitted|The probes could not run)'
for _ in $(coreutils seq 300); do
  if rg -q "$verdict" "$log"; then break; fi
  coreutils sleep 2
done
if [ -n "$app" ]; then
  if [ -s "$instance" ]; then
    flatpak kill "$(coreutils cat "$instance")" 2>/dev/null || true
  fi
elif [ "$browser" = safari ]; then
  if [ "$safari_was_open" != true ]; then osascript -e 'quit app "Safari"' || true; fi
else
  coreutils kill "$opened" 2>/dev/null || true
fi
rg -o 'page status: (.*)' -r '$1' "$log" || printf 'the page said nothing within 600s; its server log is %s\\n' "$log"
rg -q 'page status: Submitted' "$log"
"""
shell = "{{ vars.task_shell }}"
usage = """
arg "<browser>" help="The browser to probe" {
  choices "firefox" "librewolf" "mullvad-browser" "tor-browser" "brave" "chromium" "edge" "gnome-web" "chrome" "safari"
}
flag "--device <device>" help="The machine the rows name, such as its make and model"
flag "--environment <settings>" help="Driver settings to start the browser under, as NAME=value separated by spaces"
flag "--fingerprinting-protection" help="Turn on privacy.fingerprintingProtection, for one built on Firefox"
flag "--high-performance-gpu" help="Run WebGL on the high-performance GPU, for one built on Chromium"
flag "--webgpu" help="Turn WebGPU on, past its GPU blocklist, for one built on Firefox"
flag "--port <port>" help="The port to serve the page on for the run, 8097 if not given"
flag "--submit" help="Submit every probe set from the page and print how each went, rather than open it for a person"
"""

[tasks.gpu-probe-server]
depends = ["build-gpu-probe-page", "build-gpu-probe-page-legacy"]
description = "Collect GPU probe signatures into libs/gpu-probe/signatures over HTTPS at localhost:8444"
run = "{{ vars.gpu_probe_server }} {{ vars.gpu_probe_server_args }}"

[tasks.gpu-probe-server-lan]
depends = ["build-gpu-probe-page", "build-gpu-probe-page-legacy"]
description = "Collect GPU probe signatures over HTTPS from other devices on the LAN, listening on 0.0.0.0:8444"
run = "{{ vars.gpu_probe_server }} {{ vars.gpu_probe_server_args }} --bind {{ vars.lan_bind }}"

# Beside the HTTPS one on 8444, for a browser with no WebGPU to lose, or one that cannot take the certificate.
[tasks.gpu-probe-server-lan-http]
depends = ["build-gpu-probe-page", "build-gpu-probe-page-legacy"]
description = "Collect GPU probe signatures over plain HTTP from other devices on the LAN, on 0.0.0.0:8445"
run = "{{ vars.gpu_probe_server }} {{ vars.gpu_probe_server_args }} {{ vars.gpu_probe_lan_http_args }}"

# Everything build-gpu-probe-site needs, and nothing more, for a host that builds only the site.
# The Vercel deploy's install command runs this after installing mise, so what the site needs is decided here, not in
# Vercel's settings. mise must be on PATH, as for any task that runs it, and this env loaded, so once mise is installed
# the command goes on with `export PATH="$HOME/.local/bin:$PATH" MISE_ENV=webprobe && mise trust --all && mise run
# install-gpu-probe-site-tools`. A bare `rust` brings both toolchains, stable for the usual build and nightly with
# rust-src for the compat build's std. node is there because esbuild's npm package runs its binary through a node
# script. A Rust build links its build scripts with the host's C compiler, which no mise tool supplies and Vercel's
# image lacks, so a host with none is given gcc by its package manager; Vercel's image is Amazon Linux, whose manager
# is dnf.
[tasks.install-gpu-probe-site-tools]
description = "Install the tools build-gpu-probe-site needs, for a host such as Vercel that builds only the site"
run = """
if ! command -v cc >/dev/null; then
  dnf install -y gcc
fi
tools="rust aqua:rustwasm/wasm-pack github:uutils/coreutils github:wasm-bindgen/wasm-bindgen"
tools="$tools github:WebAssembly/binaryen github:swc-project/swc node npm:core-js npm:esbuild ripgrep"
# shellcheck disable=SC2086 # $tools is several tool names, split by design.
mise install $tools
"""
shell = "{{ vars.task_shell }}"
