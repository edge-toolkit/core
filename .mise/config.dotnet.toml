# .NET (C#) toolchain + tasks. Loaded when MISE_ENV includes `dotnet`.

[tools]
# Pinned: SDK churn re-keys the wasm-tools workload manifest, forcing a ~1.5GB pack re-download on every bump.
dotnet = "10.0.300"
dotnet-core = "10.0.300"
"dotnet:roslynator.dotnet.cli" = "latest"

[tasks.dotnet-fmt]
description = "Format dotnet C# code"
run = "dotnet format"

[tasks.dotnet-check]
description = "Check dotnet C# formatting"
run = "dotnet format --verify-no-changes"

# Namespaced aggregators picked up by the default config's globbed `check`/`fmt`.
[tasks."check:dotnet"]
depends = ["dotnet-check"]
description = "Run .NET checks (format verification)"

[tasks."fmt:dotnet"]
depends = ["dotnet-fmt"]
description = "Format .NET sources"

[tasks.build-ws-dotnet-data1-module]
description = "Build the dotnet-data1 C# WASM workflow module"
dir = "services/ws-modules/dotnet-data1"
run = '''
dotnet workload install wasm-tools --skip-manifest-update

# Windows-only: `dotnet workload install` drops the Emscripten SDK pack under
# %LOCALAPPDATA%/mise/dotnet-root/packs/Microsoft.NET.Runtime.Emscripten.*/*/tools/emscripten/,
# but does not add that dir to PATH (Linux/macOS get it via dotnet's
# workload-install shell-rc setup). `dotnet publish`'s MSBuild targets then
# shell out to bare `emcc` and cmd reports verbatim:
#   'emcc' is not recognized as an internal or external command,
#   operable program or batch file.
# Discover the pack dir and prepend to PATH so the publish subprocess finds
# emcc.bat. Glob via `find` so a future Emscripten / pack version bump
# rolls forward without touching this task.
if [ "${OS:-}" = "Windows_NT" ]; then
    emcc_bat="$(find "$LOCALAPPDATA/mise/dotnet-root/packs" -name 'emcc.bat' 2>/dev/null | head -1)"
    if [ -n "$emcc_bat" ]; then
        export PATH="$(dirname "$emcc_bat"):$PATH"
    else
        echo "build-ws-dotnet-data1-module: emcc.bat not found under \$LOCALAPPDATA/mise/dotnet-root/packs" >&2
        exit 1
    fi
fi

dotnet publish -c Release

PUBLISH=bin/Release/net10.0/publish/wwwroot/_framework
cp "$PUBLISH"/*.js "$PUBLISH"/*.wasm "$PUBLISH"/*.dat pkg/
'''
shell = "bash -euo pipefail -c"

[tasks."prefetch:dotnet"]
description = "Prefetch .NET dependencies and the wasm-tools workload"
run = """
dotnet restore
dotnet workload install wasm-tools --skip-manifest-update
"""
shell = "bash -euo pipefail -c"
