# .NET (C#) toolchain + tasks. Loaded when MISE_ENV includes `dotnet`.

[tools]
# Pinned: SDK churn re-keys the wasm-tools workload manifest, forcing a ~1.5GB pack re-download on every bump.
dotnet = "10.0.300"
"dotnet:roslynator.dotnet.cli" = "latest"

[vars]
# MSBuild dir inside the mise dotnet SDK, for the roslynator `-m` flags below.
# `$$DOTNET_ROOT` escapes mise's config-load `$VAR` expansion (`$$` -> literal `$`), so the value stays
# `$DOTNET_ROOT/...` for the task shell to expand at run time. DOTNET_ROOT is a tool-plugin env var that mise
# only injects once the dotnet tool is active; at config-parse time (e.g. mid `mise install`) it isn't set, so
# a bare `$DOTNET_ROOT` would emit a spurious "not defined" warning. The version segment is the [tools] dotnet
# pin above -- bump together.
dotnet_msbuild = "$$DOTNET_ROOT/sdk/10.0.300"

[tasks.dotnet-fmt]
description = "Format dotnet C# code"
run = "dotnet format"

[tasks.dotnet-check]
description = "Check dotnet C# formatting"
run = "dotnet format --verify-no-changes"

[tasks.roslynator-check]
description = "Analyze C# sources (Roslynator)"
# Roslynator analyzes with its embedded analyzer assemblies, against the mise dotnet SDK's own MSBuild.
# The dotnet:roslynator.dotnet.cli tool ships the analyzers, so the csproj needs no analyzer
# PackageReference. Diagnostics at the default info-and-up severity fail the task; loading the project
# performs an implicit restore, so no `dotnet restore` dependency is needed.
#
# `-m` pins MSBuild to the mise dotnet SDK instead of MSBuildLocator's automatic discovery. On Windows the
# inline-task shell is busybox ash (windows_default_inline_shell_args), and busybox-w32 rewrites `\` to `/`
# in every env var it passes to children -- DOTNET_ROOT arrives as `C:/Users/...`, a form hostfxr accepts
# (dotnet-check works) but MSBuildLocator's SDK discovery does not, failing with:
#     Cannot choose MSBuild location automatically. Use option '-m, --msbuild-path' to specify MSBuild location
# Observed on commit ef55945932f5d417b8d205530f0868cff6d73ffa (locally; reproduced under `mise exec` by
# setting a forward-slashed DOTNET_ROOT). The env var itself is fine as the `-m` argument -- mise's core
# dotnet plugin exports DOTNET_ROOT on every OS, and the forward-slashed form ash delivers on Windows is
# accepted there; only MSBuildLocator's own probing of it breaks.
run = """
roslynator analyze -m "{{ vars.dotnet_msbuild }}" services/ws-modules/dotnet-data1/dotnet-data1.csproj
roslynator analyze -m "{{ vars.dotnet_msbuild }}" services/ws-modules/dotnet-math1/dotnet-math1.csproj
"""
shell = "bash -euo pipefail -c"

[tasks.roslynator-fix]
description = "Apply Roslynator diagnostics' machine-applicable C# fixes in place"
run = """
roslynator fix -m "{{ vars.dotnet_msbuild }}" services/ws-modules/dotnet-data1/dotnet-data1.csproj
roslynator fix -m "{{ vars.dotnet_msbuild }}" services/ws-modules/dotnet-math1/dotnet-math1.csproj
"""
shell = "bash -euo pipefail -c"

# Namespaced aggregators picked up by the default config's globbed `check`/`fmt`/`fix`.
[tasks."check:dotnet"]
depends = ["dotnet-check", "roslynator-check"]
description = "Run .NET checks (format verification + Roslynator analysis)"

[tasks."fmt:dotnet"]
depends = ["dotnet-fmt"]
description = "Format .NET sources"

[tasks."fix:dotnet"]
depends = ["roslynator-fix"]
description = "Apply .NET lint-fix passes (roslynator fix)"

[tasks.build-ws-dotnet-data1-module]
description = "Build the dotnet-data1 C# WASM workflow module"
dir = "services/ws-modules/dotnet-data1"
run = '''
# `set -x` so every command is echoed to the log.
# The Windows lane is newly re-enabled; keep the trace until it is reliably green in CI.
set -x

dotnet workload install wasm-tools --skip-manifest-update

# Windows: cap the PATH the SDK's emcc link <Exec> constructs, or bare `emcc` becomes unresolvable.
# BrowserWasmApp.targets(522) runs the link as `<Exec Command='emcc ...'>` with an EnvironmentVariables PATH
# composed of the Emscripten workload pack dirs + $([MSBuild]::Escape($(PATH))). cmd.exe cannot read an
# environment variable longer than 8191 chars, and on GHA windows-latest the inherited PATH (mise's
# seven-language toolchain dirs + the runner's own) pushes the composed value past that limit -- cmd then sees
# no PATH at all and the link dies with:
#   'emcc' is not recognized as an internal or external command,
#   error MSB3073: The command "emcc "@...emcc-default.rsp" ..." exited with code 9009.
# Observed on commit 3c0d34021daa989a565aca1860ee41b638b90ff6 at
# https://github.com/edge-toolkit/core/actions/runs/28678866448/job/85058000145 and reproduced locally by
# padding PATH past 8191 chars. Overriding the MSBuild PATH *property* (global properties take precedence over
# environment-derived ones) shortens only that composed tail: the Exec gets pack dirs + System32 (~650 chars)
# while the process-environment PATH stays untouched. The compile step never needed this (absolute emcc path,
# no PATH lookup), and emcc's own subprocesses find python/node via EMSDK_PYTHON / DOTNET_EMSCRIPTEN_NODE_JS
# rather than PATH -- verified: the compile succeeds even when cmd can read no PATH whatsoever.
publish_args=""
if [ "${OS:-}" = "Windows_NT" ]; then
  publish_args="-p:PATH=C:\\Windows\\System32"
fi

# $publish_args holds zero or one CLI flag; word-splitting is intentional.
# shellcheck disable=SC2086
dotnet publish -c Release $publish_args

PUBLISH=bin/Release/net10.0/publish/wwwroot/_framework
cp "$PUBLISH"/*.js "$PUBLISH"/*.wasm "$PUBLISH"/*.dat pkg/
'''
shell = "bash -euo pipefail -c"

[tasks.build-ws-dotnet-math1-module]
description = "Build the dotnet-math1 C# WASM FedAvg module"
dir = "services/ws-modules/dotnet-math1"
# Same publish flow as build-ws-dotnet-data1-module, including its Windows PATH-cap workaround.
run = '''
set -x

dotnet workload install wasm-tools --skip-manifest-update

publish_args=""
if [ "${OS:-}" = "Windows_NT" ]; then
  publish_args="-p:PATH=C:\\Windows\\System32"
fi

# $publish_args holds zero or one CLI flag; word-splitting is intentional.
# shellcheck disable=SC2086
dotnet publish -c Release $publish_args

PUBLISH=bin/Release/net10.0/publish/wwwroot/_framework
cp "$PUBLISH"/*.js "$PUBLISH"/*.wasm "$PUBLISH"/*.dat pkg/
'''
shell = "bash -euo pipefail -c"

[tasks."prefetch:dotnet"]
description = "Prefetch .NET dependencies and the wasm-tools workload"
run = """
dotnet restore
dotnet workload install wasm-tools --skip-manifest-update
"""
shell = "bash -euo pipefail -c"
