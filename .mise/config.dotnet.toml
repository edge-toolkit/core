# .NET (C#) toolchain + tasks. Loaded when MISE_ENV includes `dotnet`.

[tools]
# Pinned: SDK churn re-keys the wasm-tools workload manifest, forcing a ~1.5GB pack re-download on every bump.
dotnet = "10.0.300"
dotnet-core = "10.0.300"
"dotnet:roslynator.dotnet.cli" = "latest"

[tasks.dotnet-fmt]
description = "Format dotnet C# code"
run = "dotnet format"

[tasks.dotnet-check]
description = "Check dotnet C# formatting"
run = "dotnet format --verify-no-changes"

# Namespaced aggregators picked up by the default config's globbed `check`/`fmt`.
[tasks."check:dotnet"]
depends = ["dotnet-check"]
description = "Run .NET checks (format verification)"

[tasks."fmt:dotnet"]
depends = ["dotnet-fmt"]
description = "Format .NET sources"

[tasks.build-ws-dotnet-data1-module]
description = "Build the dotnet-data1 C# WASM workflow module"
dir = "services/ws-modules/dotnet-data1"
run = '''
# `set -x` so every command is echoed to the log.
# The Windows lane is newly re-enabled; keep the trace until it is reliably green in CI.
set -x

dotnet workload install wasm-tools --skip-manifest-update

# Windows: cap the PATH the SDK's emcc link <Exec> constructs, or bare `emcc` becomes unresolvable.
# BrowserWasmApp.targets(522) runs the link as `<Exec Command='emcc ...'>` with an EnvironmentVariables PATH
# composed of the Emscripten workload pack dirs + $([MSBuild]::Escape($(PATH))). cmd.exe cannot read an
# environment variable longer than 8191 chars, and on GHA windows-latest the inherited PATH (mise's
# seven-language toolchain dirs + the runner's own) pushes the composed value past that limit -- cmd then sees
# no PATH at all and the link dies with:
#   'emcc' is not recognized as an internal or external command,
#   error MSB3073: The command "emcc "@...emcc-default.rsp" ..." exited with code 9009.
# Observed on commit 3c0d34021daa989a565aca1860ee41b638b90ff6 at
# https://github.com/edge-toolkit/core/actions/runs/28678866448/job/85058000145 and reproduced locally by
# padding PATH past 8191 chars. Overriding the MSBuild PATH *property* (global properties take precedence over
# environment-derived ones) shortens only that composed tail: the Exec gets pack dirs + System32 (~650 chars)
# while the process-environment PATH stays untouched. The compile step never needed this (absolute emcc path,
# no PATH lookup), and emcc's own subprocesses find python/node via EMSDK_PYTHON / DOTNET_EMSCRIPTEN_NODE_JS
# rather than PATH -- verified: the compile succeeds even when cmd can read no PATH whatsoever.
publish_args=""
if [ "${OS:-}" = "Windows_NT" ]; then
    publish_args="-p:PATH=C:\\Windows\\System32"
fi

# $publish_args holds zero or one CLI flag; word-splitting is intentional.
# shellcheck disable=SC2086
dotnet publish -c Release $publish_args

PUBLISH=bin/Release/net10.0/publish/wwwroot/_framework
cp "$PUBLISH"/*.js "$PUBLISH"/*.wasm "$PUBLISH"/*.dat pkg/
'''
shell = "bash -euo pipefail -c"

[tasks."prefetch:dotnet"]
description = "Prefetch .NET dependencies and the wasm-tools workload"
run = """
dotnet restore
dotnet workload install wasm-tools --skip-manifest-update
"""
shell = "bash -euo pipefail -c"
