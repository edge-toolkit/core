# JavaScript / npm env (MISE_ENV=js).
#
# Tools that resolve through mise's `npm:` backend live here so the modules that consume them (har1,
# face-detection -- both have `onnxruntime-web` as a Cargo dep and load the JS package at runtime via
# /modules/onnxruntime-web) only build when the `js` env is loaded. The aqua-backed `pnpm` row stays in the
# default config; the `npm:pnpm` row below is the macos/x64 fallback (no aqua darwin/amd64 prebuilt). oxlint +
# oxfmt also live here -- they only know JS/TS (the framework-file support is just the `<script>` block), so
# there's no value in installing them when `js` isn't loaded.

[tools]
# MediaPipe tasks-vision runtime for pyeye1.
# pyeye1 loads @mediapipe/tasks-vision (FaceLandmarker) at runtime via /modules/@mediapipe/tasks-vision, the
# same npm-package-served-as-a-module pattern as onnxruntime-web (resolved in libs/edge-toolkit/src/config.rs).
"npm:@mediapipe/tasks-vision" = "latest"
# transformers.js is llm1's WebGPU text-generation runtime.
# llm1 loads it at runtime via /modules/@huggingface/transformers and points its ONNX weights at the
# et-model-llm1 model module, so no request ever leaves the ws-server origin.
"npm:@huggingface/transformers" = "latest"
"npm:onnxruntime-web" = "latest"
# stats-gl is the GPU utilisation meter overlay on the ws-server index page.
# index.html loads it at runtime via /modules/stats-gl (same npm-package-served-as-a-module pattern as
# onnxruntime-web, resolved in libs/edge-toolkit/src/config.rs).
"npm:stats-gl" = "latest"
# oxlint-tsgolint is oxlint's type-aware engine.
# It's a typescript-go type checker oxlint shells out to under `--type-aware`. npm-only: it ships no GitHub
# release assets, distributing per-platform binaries via `@oxlint-tsgolint/<triple>` optional deps, so every OS
# is covered without os-scoping.
"npm:oxlint-tsgolint" = "0.24.0"
"npm:pnpm" = { version = "latest", os = ["macos/x64"] }

# oxlint + oxfmt are the Rust-native JS/TS linter + formatter from the oxc-project.
# They are pulled directly from the shared `apps_v<tag>` GitHub release. Aqua's registry entry trips mise's
# date-filter on the `apps_v` tag prefix (https://github.com/oxc-project/oxc/discussions/14452), and `cargo:`
# is out because neither binary is published as a crates.io crate. The http: backend with per-platform `url` +
# `rename_exe` strips the target-suffix baked into the upstream binary names (e.g. `oxlint-x86_64-apple-darwin`
# -> `oxlint`) so the bare command is on PATH the same way every other mise tool installs.
[tools."http:oxlint"]
bin = "oxlint"
rename_exe = "oxlint"
version = "1.73.0"
[tools."http:oxlint".platforms.linux-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-aarch64-unknown-linux-gnu.tar.gz"
[tools."http:oxlint".platforms.linux-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-unknown-linux-gnu.tar.gz"
[tools."http:oxlint".platforms.macos-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-aarch64-apple-darwin.tar.gz"
[tools."http:oxlint".platforms.macos-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-apple-darwin.tar.gz"
[tools."http:oxlint".platforms.windows-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-pc-windows-msvc.zip"

# oxfmt is pinned independently of oxlint.
# Both ship from per-version `apps_v` tags but track separate semver. oxfmt stays on apps_v1.69.0 / 0.54.0: its
# output is tuned against dprint (config/oxfmtrc.jsonc + config/dprint.jsonc) at that version, and a bump risks
# reformatting churn that fights dprint. oxlint above rode ahead to 1.73.0 for the `--type-aware` engine. Re-pin
# oxfmt here only after re-validating the oxfmt <-> dprint agreement at the new version.
[tools."http:oxfmt"]
bin = "oxfmt"
rename_exe = "oxfmt"
version = "0.54.0"
[tools."http:oxfmt".platforms.linux-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-aarch64-unknown-linux-gnu.tar.gz"
[tools."http:oxfmt".platforms.linux-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-x86_64-unknown-linux-gnu.tar.gz"
[tools."http:oxfmt".platforms.macos-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-aarch64-apple-darwin.tar.gz"
[tools."http:oxfmt".platforms.macos-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-x86_64-apple-darwin.tar.gz"
[tools."http:oxfmt".platforms.windows-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-x86_64-pc-windows-msvc.zip"

[tasks.build-ws-har1-module]
depends = ["build-et-cli", "build-wasm-cov-wrapper"]
description = "Build the har1 workflow WASM module"
dir = "services/ws-modules/har1"
# Chain with `&&` on one line rather than a multi-line `bash` block.
# wasm-pack shells out to `cargo metadata`, which can't find `cargo` under Git Bash on Windows; the default
# shell (cmd there) resolves it. web_pack_cov folds in the coverage wrapper prefix so this line stays under 120.
run = "{{ vars.web_pack_cov }} {{ vars.no_opt }}{{ vars.web_cov_feat }} && {{ vars.et_cli }} module-package-json"

[tasks.build-ws-face-detection-module]
depends = ["build-et-cli", "build-wasm-cov-wrapper"]
description = "Build the face detection workflow WASM module"
dir = "services/ws-modules/face-detection"
run = "{{ vars.web_pack_cov }} {{ vars.no_opt }}{{ vars.web_cov_feat }} && {{ vars.et_cli }} module-package-json"

[tasks.vendor-llm1-ort]
description = "Stage transformers.js's pinned ORT wasm runtime into llm1's pkg/ort/"
# transformers.js pins its own onnxruntime-web build and defaults its wasm pair to a CDN.
# llm1 has to answer with no internet access, so the pair is copied out of the npm install (mise's npm backend
# keeps the pinned transitive dep under node_modules/.mise/) and served from the module itself at
# /modules/et-ws-llm1/ort/. Both the asyncify and the plain build are staged because transformers.js picks
# between them per browser at import time, and llm1 only rewrites the directory of whichever it chose.
dir = "services/ws-modules/llm1"
run = """
install="$(mise where "npm:@huggingface/transformers")"
# mise reports a mixed-separator install path on Windows (C:/Users/...\\mise\\installs\\...).
# MSYS bash reads a backslash as an escape rather than a separator, so compose child paths from a
# forward-slash-only copy.
install="${install//\\\\//}"
pkg="$install/node_modules/@huggingface/transformers"
ort_version="$(mise exec -- yq -p json -oy '.dependencies."onnxruntime-web"' "$pkg/package.json")"
# transformers.js pins onnxruntime-web to one exact version, so the dist dir is addressable directly.
# Walking the install tree instead overruns Windows' 260-char MAX_PATH inside ort's own flatbuffers sources
# (the deepest, `runtime-optimization-record-container-entry.js.map`, lands at 279 chars), and uutils find
# then reports every unstattable entry as `find: <path>: No such file or directory` -- on files that do
# exist -- and exits 1. Seen on commit 189935fddb306fa8e4dc36007fd73f6edf0ca2ee at
# https://github.com/edge-toolkit/core/actions/runs/32195702185/job/95899138206
store="$install/node_modules/.mise/onnxruntime-web@$ort_version/node_modules/onnxruntime-web/dist"
# The npm backend keeps pinned transitive deps in the .mise store above; a hoisted layout is the fallback.
hoisted="$install/node_modules/onnxruntime-web/dist"
dist=""
for candidate in "$store" "$hoisted"; do
  if [ -d "$candidate" ]; then
    dist="$candidate"
    break
  fi
done
[ -n "$dist" ] || {
  echo "no onnxruntime-web@$ort_version dist under $install; run 'MISE_ENV=js mise install' first" >&2
  exit 1
}
coreutils rm -rf pkg/ort
coreutils mkdir -p pkg/ort
coreutils cp "$dist/ort-wasm-simd-threaded.mjs" pkg/ort/
coreutils cp "$dist/ort-wasm-simd-threaded.wasm" pkg/ort/
coreutils cp "$dist/ort-wasm-simd-threaded.asyncify.mjs" pkg/ort/
coreutils cp "$dist/ort-wasm-simd-threaded.asyncify.wasm" pkg/ort/
"""
shell = "bash -euo pipefail -c"

[tasks.build-ws-llm1-module]
depends = ["build-et-cli", "build-wasm-cov-wrapper", "vendor-llm1-ort"]
description = "Build the llm1 chat WASM module"
dir = "services/ws-modules/llm1"
run = "{{ vars.web_pack_cov }} {{ vars.no_opt }}{{ vars.web_cov_feat }} && {{ vars.et_cli }} module-package-json"

[tasks.build-ws-js-data1-module]
description = "Bundle the js-data1 module (AWS SDK for JS v3) into pkg/ with esbuild"
dir = "services/ws-modules/js-data1"
# esbuild bundles @aws-sdk/client-s3 into one self-contained ESM.
# Its @aws-sdk/* + @smithy/* graph uses bare-specifier imports that don't resolve as served static files, so
# bundling is required; pnpm install brings the workspace deps in first. `node build.mjs` is invoked directly
# rather than via `pnpm run build`, because mise's standalone pnpm does not put mise's node on PATH for the
# script child on Windows (`'node' is not recognized`), whereas the mise task shell always has node (a `[tools]`
# entry) resolvable -- the same way `pnpm` itself resolves here.
run = "pnpm install && node build.mjs"

[tasks.oxlint-check]
description = "Lint JavaScript/TypeScript sources (oxlint)"
# oxlint walks the working tree from CWD, honouring .gitignore; no path arg needed.
# Errors fail the task (correctness category, lifted in oxlintrc); warnings print but don't fail -- the initial
# introduction kept stylistic warnings visible rather than blocking on the existing module shims' style. Tighten
# with `--deny-warnings` once those are cleaned up. `--type-aware` (backed by the oxlint-tsgolint tool +
# config/tsconfig.json) enables the type-aware rule set; without it typescript/prefer-optional-chain silently
# no-ops.
run = "oxlint --config config/oxlintrc.jsonc --type-aware --tsconfig config/tsconfig.json"

[tasks.oxlint-fix]
description = "Auto-fix oxlint violations that have a machine-applicable suggestion"
run = "oxlint --config config/oxlintrc.jsonc --type-aware --tsconfig config/tsconfig.json --fix"

[tasks.oxfmt-check]
description = "Check JS/TS formatting (oxfmt)"
# oxfmt walks the working tree from CWD, honouring .gitignore.
# This means target/, all pkg/ dirs, node_modules, etc. are skipped. Runs alongside dprint -- dprint's
# typescript plugin formats the same files, and config/oxfmtrc.jsonc tunes oxfmt (printWidth=120) so its
# output matches dprint's typescript plugin (which is matched-back via arrowFunction.useParentheses + member
# linePerExpression in config/dprint.jsonc). `fmt:js` orders oxfmt-fmt before dprint-fmt so dprint has the
# last word on residual disagreements.
#
# The positional `!.mise/config*.toml` is a workaround for an oxfmt 0.54.0 bug: oxfmt's content-based JS
# detection mis-parses the multiple `"""..."""` TOML basic-multiline strings in these files as JS template
# literals (and silently concatenates `description = "..."` into the closing `"""` of an adjacent
# `run = """..."""` block on --write); it also flattens short TOML arrays like `depends = [...]` into single
# lines because they look like short JS arrays. The `ignorePatterns: ["**/*.toml"]` in
# config/oxfmtrc.jsonc filters every other TOML file correctly but fails to match dotfile-directory paths like
# `.mise/config*.toml`, so we override here positionally.
run = "oxfmt --config config/oxfmtrc.jsonc --check . '!.mise/config*.toml'"

[tasks.oxfmt-fmt]
description = "Format JS/TS sources in place (oxfmt)"
run = "oxfmt --config config/oxfmtrc.jsonc --write . '!.mise/config*.toml'"

[tasks.osv-scanner-npm]
description = "Scan the npm: tools' aube lockfiles for known vulnerabilities"
# Collect each npm: tool's aube lockfile under one root, then scan that root.
# The lockfile comes from mise's own embedded aube, which its default `npm.package_manager = "auto"` uses for
# every `npm:` install -- no external package manager is involved, so nothing needs installing for this to work.
# osv-scanner has no `aube-lock.yaml` extractor -- an explicit `--lockfile <path>` on one is rejected with
# `could not determine extractor suitable to this file`, and a directory scan of the install tree reports
# `No package sources found`. Its extractors are keyed on filename, so each lockfile is copied in as
# `pnpm-lock.yaml`: aube emits pnpm-lockfile-v9 (same `lockfileVersion`, `importers` and `packages` shape, plus
# a `time:` block the pnpm extractor ignores), so the native pnpm extractor reads it as-is.
#
# Every declared npm: tool must yield a lockfile or the task fails. That check is load-bearing: osv-scanner
# exits 0 on `No package sources found`, so a tool that silently installed via a lockfile-less backend would
# otherwise read as scanned-and-clean. `--no-ignore` is required because the collection root is under gitignored
# target/.
#
# `mise ls --json` maps each tool to an ARRAY of installed versions, so the declared-tool test has to look for a
# `requested_version` on ANY element, not on `.value[0]`. Indexing element 0 silently dropped onnxruntime-web from
# the scan here, because a superseded 1.26.0 install still sat ahead of the active 1.27.0 entry and carried no
# `requested_version` -- the task then scanned three tools instead of four and exited 0, the precise
# reads-as-clean failure the lockfile check above is meant to rule out.
#
# A tool is installed only when entirely absent, which keeps the scan from mutating what it measures. An
# unconditional `mise install` re-resolves a `latest` pin and upgrades the tool mid-scan: doing that here once
# moved onnxruntime-web 1.26.0 -> 1.27.0, whose tree carries a patched protobufjs, so two real advisories against
# the installed 1.26.0 tree (GHSA-f38q-mgvj-vph7, GHSA-j3f2-48v5-ccww) vanished from the report instead of being
# reported. Installing only what is missing still lets a cold CI job run this without a full `mise install` of
# every language toolchain, while a warm machine gets scanned exactly as it stands. Deriving the tool list from
# `mise ls` rather than restating it means it cannot drift from the [tools] table above.
run = """
dest=target/osv-npm-locks
coreutils rm -rf "$dest"
coreutils mkdir -p "$dest"
filter='to_entries[] | select(.key | startswith("npm:")) | select(any(.value[]; .requested_version)) | .key'
tools=$(mise ls --json | jaq -r "$filter")
if [ -z "$tools" ]; then
  echo "osv-scanner-npm: no declared npm: tools found; is MISE_ENV=js loaded?" >&2
  exit 1
fi
for tool in $tools; do
  root=$(mise where "$tool" 2>/dev/null || true)
  if [ -z "$root" ]; then
    mise install "$tool"
    root=$(mise where "$tool")
  fi
  # Bounded depth so the search never descends into node_modules.
  # -maxdepth 3 still reaches both layouts mise writes the lock to (the install root, or
  # global-aube/<hash>/), while the deepest node_modules entries in the transformers tree overrun Windows'
  # 260-char MAX_PATH and make uutils find exit 1 -- which under `pipefail` fails the whole task.
  lock=$(find "$root" -maxdepth 3 -name aube-lock.yaml -type f | coreutils head -1)
  if [ -z "$lock" ]; then
    echo "osv-scanner-npm: $tool has no aube-lock.yaml under $root" >&2
    echo "osv-scanner-npm: reinstall it so mise's embedded aube writes one" >&2
    exit 1
  fi
  slug=$(coreutils basename "$(coreutils dirname "$root")")
  coreutils mkdir -p "$dest/$slug"
  coreutils cp "$lock" "$dest/$slug/pnpm-lock.yaml"
  echo "osv-scanner-npm: collected $tool -> $dest/$slug/pnpm-lock.yaml"
done
osv-scanner --recursive --no-ignore "$dest" --config config/osv-scanner.toml
"""
shell = "bash -euo pipefail -c"

# Namespaced aggregators picked up by the default config's globbed `check`/`fmt`/`fix`.
[tasks."check:js"]
depends = ["oxfmt-check", "oxlint-check"]
description = "Run JavaScript/TypeScript checks (oxlint + oxfmt)"

[tasks."fmt:js"]
# oxfmt-fmt runs before dprint-fmt.
# Both touch JS/TS, but dprint isn't a `fmt:js` task -- it stays in fmt:rust (universal) and runs after fmt:js
# because the fmt aggregator runs siblings in parallel without ordering. Reaching a stable fixed point relies
# on idempotence of both tools on each other's output, which the tuned configs in config/oxfmtrc.jsonc +
# config/dprint.jsonc are calibrated for.
depends = ["oxfmt-fmt"]
description = "Format JavaScript/TypeScript sources"

[tasks."fix:js"]
depends = ["oxlint-fix"]
description = "Apply JavaScript/TypeScript lint-fix passes (oxlint --fix)"
