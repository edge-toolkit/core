# Maintenance tasks. Loaded when MISE_ENV includes `maint`. The tasks
# use bash idioms (bare `tar`, `coreutils`, `rg`, `git`, `gh`) and work
# on every OS where those tools are present -- including Windows via
# Git Bash + the mise-installed uutils/ripgrep/git/gh shims.
#
# - publish-face1-to-hf-cache: refreshes the Hugging Face asset mirror in
#   edge-toolkit/core's hf-cache-v<N> release.
# - publish-rp-wasm-to-release: builds upstream RustPython main with
#   wasm-pack + freeze-stdlib, tars the pkg/ output, and uploads to
#   edge-toolkit/core's rp-v<N> release (same release that holds the
#   matching native rustpython binary tarballs). Consumers pick up the
#   asset via the `http:et-rp-wasm` mise tool entry in config.toml.
#
# Not in ALL_LANGS (maint isn't a language); invoked manually:
#
#   MISE_ENV=maint mise run publish-face1-to-hf-cache
#   MISE_ENV=maint mise run publish-rp-wasm-to-release

[tools]
# Rust-native HTTP client; replaces the host `curl` (CLAUDE.md "Don't depend
# on host tools in mise tasks"). Behaves like HTTPie on the CLI; `--follow`
# is needed because xh doesn't follow redirects by default like curl -L does.
"aqua:ducaale/xh" = "latest"
# toml-cli: edit TOML in place while preserving comments (uses toml_edit
# under the hood). Used by publish-*-to-hf-cache to write back into
# config/checksums.toml + .mise/config.toml after the upload so the user
# doesn't have to paste manually. Cargo-source build (quickinstall has
# prebuilts for every triple we care about, but mise's cargo: backend
# treats it as cargo-binstall). Exempted from the workspace cargo:-policy
# in mise.rego because maint isn't on the CI path -- a slower install is
# fine on a maintainer workstation.
"cargo:toml-cli" = "latest"

[env]
# Shared HF base URLs + release-target coords hoisted out of every
# publish-*-to-hf-cache task so the xh/jq/gh lines stay under 120 chars
# without backslash continuations. All literals -- composing one from
# another (e.g. `HF_API = "{{ env.HF_CO }}/api/models"`) would trip mise's
# alphabetical env render order.
#
# The release tag itself lives as `a_hf_cache_tag` in config.toml's [vars]
# (consumer-side face1_src in that file needs to reference it) and is
# interpolated into this task body via `{{ vars.a_hf_cache_tag }}`.
GH_REPO = "edge-toolkit/core"
HF_API = "https://huggingface.co/api/models"
HF_CACHE_WORK = "{{ config_root }}/target/scratch/hf-cache"
HF_CO = "https://huggingface.co"
# Shared rp-v<N> GitHub release for both rustpython_wasm + native rustpython
# artifacts (built from the same upstream commit, stored together).
RP_RELEASE = "rp-v1"
RP_WORK = "{{ config_root }}/target/scratch/rp-publish"

[tasks.bootstrap-hf-cache-release]
description = "Create the hf-cache-v<N> GitHub release if it doesn't exist (idempotent)"
# Idempotent: `gh release view` short-circuits if the release already exists;
# otherwise create it empty + marked as prerelease (keeps it off the repo's
# "Latest release" badge, semantically right for an infrastructure mirror).
# `--prerelease` / `--draft` are presence-only flags -- `=false` is silently
# ignored and gh would fall into an interactive "Submit?" prompt; closing
# stdin via </dev/null suppresses that even on a TTY.
run = """
tag="{{ vars.a_hf_cache_tag }}"
if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
  echo "release $tag already exists on $GH_REPO"
  exit 0
fi
title="Hugging Face asset mirror ($tag)"
gh release create "$tag" --repo "$GH_REPO" --title "$title" --notes "" --prerelease </dev/null
"""
shell = "bash -euo pipefail -c"

[tasks.publish-face1-to-hf-cache]
depends = ["bootstrap-hf-cache-release"]
description = "Refresh face1 mirror in hf-cache-v<N> release (manual / on upstream bump)"
# Pulls amd/retinaface from HF once (HF doesn't rate-limit a single dev IP),
# pins the commit SHA into the asset name, checks the resulting SHA256
# against HF's recorded LFS oid, uploads both .onnx + .onnx.sha256 sidecar
# to the release, then auto-edits config/checksums.toml and .mise/config.toml
# via toml-cli (`toml set`) so the in-repo manifests stay in sync. The
# checksums.rego conftest rule catches any drift between the two manifests
# on next `mise run check`. The release itself is created (idempotently) by
# the bootstrap-hf-cache-release task below; this task depends on it.
run = """
work="$HF_CACHE_WORK/face1"
repo="amd/retinaface"
dir="weights"
filename="RetinaFace_int.onnx"
stem="RetinaFace_int"

coreutils rm -rf "$work"
coreutils mkdir -p "$work"
cd "$work"

xh --follow --download --output original.onnx "$HF_CO/$repo/resolve/main/$dir/$filename"
commit=$(xh --follow --body "$HF_API/$repo" | jq -r '.sha')
short=$(echo "$commit" | coreutils cut -c1-7)

asset="${stem}-${short}.onnx"
coreutils mv original.onnx "$asset"
coreutils sha256sum "$asset" > "${asset}.sha256"

# Sanity: SHA256 we just computed must match HF's recorded LFS oid for the
# blob; mismatch means the download was corrupted or HF served a different
# revision than we asked for.
tree=$(xh --follow --body "$HF_API/$repo/tree/main/$dir?recursive=true")
expected=$(echo "$tree" | jq -r --arg p "$dir/$filename" '.[] | select(.path == $p) | .lfs.oid')
actual=$(coreutils cut -c1-64 "${asset}.sha256")
if [ "$actual" != "$expected" ]; then
  echo "sha mismatch: local $actual vs HF LFS $expected" >&2
  exit 1
fi

gh release upload "{{ vars.a_hf_cache_tag }}" --clobber --repo "$GH_REPO" "$asset" "${asset}.sha256"

# Auto-update the in-repo manifests so the user doesn't have to paste. Both
# edits go via toml set (toml-cli) for format/comment preservation; toml-cli
# writes to stdout, so the temp+mv dance is the in-place idiom.
cksum_path="{{ config_root }}/config/checksums.toml"
mise_path="{{ config_root }}/.mise/config.toml"

toml set "$cksum_path" "sha256.\\"$asset\\"" "$actual" > "${cksum_path}.tmp"
coreutils mv "${cksum_path}.tmp" "$cksum_path"

toml set "$mise_path" "vars.face1_asset" "$asset" > "${mise_path}.tmp"
coreutils mv "${mise_path}.tmp" "$mise_path"

echo "uploaded $asset to {{ vars.a_hf_cache_tag }} (commit $commit)"
echo "updated config/checksums.toml + .mise/config.toml; conftest will catch any drift"
"""
shell = "bash -euo pipefail -c"

[tasks.build-rp-wasm]
description = "Build rustpython_wasm via wasm-pack from a local RustPython checkout"
# Linux/macOS only (config.maint.toml is). wasm-pack compiles rustpython +
# freeze-stdlib (the default crates/wasm feature) for wasm32, ~5-10 min on
# first run; the early `pkg/` exists check skips the build if a previous
# output is present. The checkout location follows $RUSTPYTHON_REPO
# (default ~/rust/RustPython); operator must `git pull` it to track main
# themselves -- this task doesn't fetch, so the build is reproducible from
# the local commit pin.
run = """
rp_dir="${RUSTPYTHON_REPO:-$HOME/rust/RustPython}"
if [ ! -d "$rp_dir/crates/wasm" ]; then
  echo "build-rp-wasm: no RustPython checkout at $rp_dir/crates/wasm" >&2
  echo "clone: git clone https://github.com/RustPython/RustPython.git $rp_dir" >&2
  exit 1
fi
if [ -f "$rp_dir/crates/wasm/pkg/rustpython_wasm_bg.wasm" ]; then
  echo "build-rp-wasm: pkg/ already present at $rp_dir/crates/wasm/pkg"
  echo "rm -rf that dir to force a rebuild"
  exit 0
fi
wasm-pack build "$rp_dir/crates/wasm" --target web {{ vars.no_opt }}
"""
shell = "bash -euo pipefail -c"

[tasks.bootstrap-rp-release]
description = "Create the rp-v<N> GitHub release if it doesn't exist (idempotent)"
# Same shape as bootstrap-hf-cache-release: idempotent gh release view+create,
# marked as prerelease so it stays off the repo's "Latest release" badge.
run = """
if gh release view "$RP_RELEASE" --repo "$GH_REPO" >/dev/null 2>&1; then
  echo "release $RP_RELEASE already exists on $GH_REPO"
  exit 0
fi
title="Pre-built rustpython artifacts ($RP_RELEASE)"
gh release create "$RP_RELEASE" --repo "$GH_REPO" --title "$title" --notes "" --prerelease </dev/null
"""
shell = "bash -euo pipefail -c"

[tasks.publish-rp-wasm-to-release]
depends = ["bootstrap-rp-release", "build-rp-wasm"]
description = "Tar the local wasm-pack pkg/ + upload to the rp-v<N> release"
# Reads the local RustPython checkout (same $RUSTPYTHON_REPO as build-rp-wasm),
# pins HEAD's short SHA into the asset filename, tars the wasm-pack pkg/
# (stripping the upstream package.json + README -- pywasm1 writes its own),
# uploads + sha256 sidecar, then auto-edits the version + checksum fields
# in config.toml's [tools."http:et-rp-wasm"] block so the next `mise install`
# picks up the new artifact. `tar` is the host's; maint is Linux/macOS-only.
run = """
rp_dir="${RUSTPYTHON_REPO:-$HOME/rust/RustPython}"
coreutils rm -rf "$RP_WORK"
coreutils mkdir -p "$RP_WORK"

commit=$(git -C "$rp_dir" rev-parse HEAD)
short=$(echo "$commit" | coreutils cut -c1-7)
asset="rustpython-wasm-${short}.tar.gz"
tarball="$RP_WORK/$asset"

pkg_dir="$rp_dir/crates/wasm/pkg"
tar -C "$pkg_dir" --exclude='package.json' --exclude='README.md' --exclude='.gitignore' -czf "$tarball" .
coreutils sha256sum "$tarball" > "${tarball}.sha256"
actual=$(coreutils cut -c1-64 "${tarball}.sha256")

gh release upload "$RP_RELEASE" --clobber --repo "$GH_REPO" "$tarball" "${tarball}.sha256"

# Update the in-repo manifests: bump rp_wasm_asset in .mise/config.toml +
# add/refresh the matching entry in config/checksums.toml. checksums.rego
# cross-checks them on next `mise run check`.
cksum_path="{{ config_root }}/config/checksums.toml"
mise_path="{{ config_root }}/.mise/config.toml"
toml set "$cksum_path" "sha256.\\"$asset\\"" "$actual" > "${cksum_path}.tmp"
coreutils mv "${cksum_path}.tmp" "$cksum_path"
toml set "$mise_path" "vars.rp_wasm_asset" "$asset" > "${mise_path}.tmp"
coreutils mv "${mise_path}.tmp" "$mise_path"

echo "uploaded $asset to $RP_RELEASE (commit $commit)"
echo "updated config/checksums.toml + .mise/config.toml; conftest will catch any drift"
"""
shell = "bash -euo pipefail -c"

[tasks.build-rp-native]
description = "cargo install rustpython --features freeze-stdlib"
# Source build with the upstream `freeze-stdlib` feature so the resulting
# binary embeds the Python stdlib -- no RUSTPYTHONPATH dance required at
# consumer side, unlike cargo:rustpython 0.5.0 from crates.io. Reads the
# local checkout to track main HEAD (which carries the #7956 pip audit-
# hook fix). ~5-10 min on first run; the early `bin/rustpython*` exists
# check skips the cargo install if a previous output is present (the
# binary is `rustpython` on Unix and `rustpython.exe` on Windows -- the
# glob covers both).
run = """
rp_dir="${RUSTPYTHON_REPO:-$HOME/rust/RustPython}"
prefix="$RP_WORK/native-install"
if [ ! -d "$rp_dir" ]; then
  echo "build-rp-native: no RustPython checkout at $rp_dir" >&2
  echo "clone: git clone https://github.com/RustPython/RustPython.git $rp_dir" >&2
  exit 1
fi
if compgen -G "$prefix/bin/rustpython*" >/dev/null; then
  echo "build-rp-native: bin/rustpython* already present at $prefix"
  echo "rm -rf $prefix to force a rebuild"
  exit 0
fi
cargo install --path "$rp_dir" --features freeze-stdlib --root "$prefix" rustpython
"""
shell = "bash -euo pipefail -c"

[tasks.publish-rp-native-to-release]
depends = ["bootstrap-rp-release", "build-rp-native"]
description = "Tar the local rustpython binary + upload to rp-v<N> for the current host triple"
# Detects the current host triple via rustc, pins HEAD's short SHA + that
# triple into the asset filename, tars just `bin/rustpython` (mise's http:
# backend will extract that into the install dir; `bin = "rustpython"` in
# the [tools."http:et-rp"] block then exposes it on PATH), uploads, then
# auto-edits the matching [tools."http:et-rp".platforms.<plat>] checksum
# + the top-level [tools."http:et-rp"] version in .mise/config.toml.
#
# Multi-platform coverage today is only what's been published. Add a
# triple by running this task on a host of that triple and committing the
# resulting checksum bump.
run = """
rp_dir="${RUSTPYTHON_REPO:-$HOME/rust/RustPython}"
prefix="$RP_WORK/native-install"

commit=$(git -C "$rp_dir" rev-parse HEAD)
short=$(echo "$commit" | coreutils cut -c1-7)
triple=$(rustc -vV | rg '^host: ' | coreutils cut -c7-)

case "$triple" in
  x86_64-apple-darwin)        plat="macos-x64" ;;
  aarch64-apple-darwin)       plat="macos-arm64" ;;
  x86_64-unknown-linux-gnu)   plat="linux-x64" ;;
  aarch64-unknown-linux-gnu)  plat="linux-arm64" ;;
  x86_64-pc-windows-*)        plat="windows-x64" ;;
  *) echo "unsupported host triple: $triple" >&2; exit 1 ;;
esac

# Glob the produced binary -- `rustpython` on Unix, `rustpython.exe` on
# Windows -- so the same tar line works on every host.
bin_rel=$(cd "$prefix" && compgen -G "bin/rustpython*" | head -1)
asset="rustpython-${short}-${triple}.tar.gz"
tarball="$RP_WORK/$asset"
tar -C "$prefix" -czf "$tarball" "$bin_rel"
coreutils sha256sum "$tarball" > "${tarball}.sha256"
actual=$(coreutils cut -c1-64 "${tarball}.sha256")

gh release upload "$RP_RELEASE" --clobber --repo "$GH_REPO" "$tarball" "${tarball}.sha256"

# Update http:et-rp: the top-level `version` (mise install-dir name), and
# this platform's `url` + `checksum`. mise's tera doesn't expose top-level
# `version` into platforms.<plat>.url, so the short SHA is inlined in each
# platform's url and the publish task rewrites it here too. Per-platform
# triple is baked into each url.
mise_path="{{ config_root }}/.mise/config.toml"
new_url="https://github.com/edge-toolkit/core/releases/download/$RP_RELEASE/$asset"
toml set "$mise_path" 'tools."http:et-rp".version' "$short" > "${mise_path}.tmp"
coreutils mv "${mise_path}.tmp" "$mise_path"
toml set "$mise_path" "tools.\\"http:et-rp\\".platforms.${plat}.url" "$new_url" > "${mise_path}.tmp"
coreutils mv "${mise_path}.tmp" "$mise_path"
toml set "$mise_path" "tools.\\"http:et-rp\\".platforms.${plat}.checksum" "sha256:$actual" > "${mise_path}.tmp"
coreutils mv "${mise_path}.tmp" "$mise_path"

echo "uploaded $asset to $RP_RELEASE (commit $commit, triple $triple)"
echo "updated http:et-rp version + platforms.${plat}.{url,checksum} in .mise/config.toml"
"""
shell = "bash -euo pipefail -c"
