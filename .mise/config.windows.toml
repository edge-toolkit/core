# Windows-only mise config. Loaded automatically on Windows by the platform
# auto_env feature (enabled in .miserc.toml): the `windows` platform env maps to
# this file. Everything here is therefore Windows-scoped, so it needs no per-entry
# `os = ["windows"]` guards or `{% if os() == 'windows' %}` conditionals -- values
# defined here override the cross-platform defaults in config.toml on Windows.
# Shared vars (rpath_flag, py313_*, …) come from config.toml, which loads first.

[tools]
# msys2 mirror packages: git (cargo git deps), gpg (so mise verifies tool
# downloads), make (some -sys build scripts shell out to it). The MSVC CRT +
# Windows SDK can't come from mise, so the build uses the LLVM mingw toolchain
# (the gnullvm target below); llvm-mingw bundles clang + lld + the mingw-w64
# runtime/headers/libs + the libclang.dll bindgen loads. Pinned so its install
# dir is deterministic for the PATH entry in Dockerfile.windows -- bump both.
"conda:m2-git" = "latest"
"conda:m2-gnupg" = "latest"
"conda:m2-make" = "latest"
"github:mstorsjo/llvm-mingw" = { version = "20260602", matching = "ucrt-x86_64" }

# busybox-w32 `sh` (POSIX ash) -- the shell the bash-tasks run on. A native Win32
# single exe with no cygwin/msys runtime, so it loads on a bare Nano Server,
# unlike conda's msys2 bash whose msys-2.0.dll imports KERNEL32!IdnToAscii /
# IdnToUnicode that Nano's stripped kernel32 forwarder doesn't re-export
# (-> 0xC0000139; unfixable -- the system file + registry are ACL-locked).
# Renamed `ash.exe` so mise -- whose POSIX-shell list is bash/sh/zsh/fish/ksh/
# dash, NOT ash -- doesn't rewrite the task PATH into msys form, which native
# busybox-w32 can't resolve. Checksum-pinned so a silent upstream rebuild fails
# loudly; `.exe` because mise writes the bin name verbatim and Windows launches
# by extension.
[tools."http:busybox"]
version = "1.37.0"
bin = "ash.exe"
url = "https://frippery.org/files/busybox/busybox64u.exe"
checksum = "sha256:6e263d154d8548d1eb936f65d1d8312c80df31c45974e48d6335e4dcc0f4f34c"

[vars]
# busybox `ash` install path (for MISE_BASH_PATH), keyed by the pinned
# http:busybox version above -- keep in sync.
winsh = '{{ get_env(name="LOCALAPPDATA", default="") }}\mise\installs\http-busybox\1.37.0\ash.exe'
# mise-managed CPython 3.13; the mise data dir is LOCALAPPDATA\mise on Windows.
py313_win = "{{ get_env(name='LOCALAPPDATA', default='') }}\\mise\\installs\\python\\3.13\\python.exe"
# clang-sys finds libclang on PATH (Docker's gnu build has llvm-mingw there); a
# workstation with system LLVM also works.
win_libclang = "C:\\Program Files\\LLVM\\bin"

[env]
# Run `shell = "bash …"` tasks on busybox ash rather than the Windows WSL
# launcher (mise can't auto-find an http-backend shell). busybox ash accepts the
# `-euo pipefail -c` the shell string passes; the task bodies are POSIX.
MISE_BASH_PATH = "{{ vars.winsh }}"
# Build for the LLVM mingw target. gnullvm, not gnu: llvm-mingw ships
# compiler-rt + libunwind, not the GCC runtime (libgcc/libgcc_eh) the gnu
# target's link line demands. setup-windows flips the rustup host to gnullvm too,
# so build scripts/proc-macros (built for the host) link the same way. The linker
# is clang and the raw-dylib import tool is llvm-dlltool, both from llvm-mingw on
# PATH. These can live in [env] here (unlike config.toml) because this file only
# loads on Windows, so there's no empty off-Windows value to break Linux cargo.
CARGO_BUILD_TARGET = "x86_64-pc-windows-gnullvm"
CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER = "clang"
CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_RUSTFLAGS = "-Cdlltool=llvm-dlltool"
LIBCLANG_PATH = "{{ vars.win_libclang }}"
PYO3_PYTHON = "{{ vars.py313_win }}"

[tasks.setup-windows]
# Windows preinstall, shared by Dockerfile.windows and a real workstation. The
# busybox `sh` (http:busybox) is installed by the cmd bootstrap that runs before
# any bash task on Windows (Dockerfile.windows / the README), so this task's
# `bash -euo pipefail` shell (= busybox ash via MISE_BASH_PATH) works. Installs
# the build utils (git/gpg/make), llvm-mingw and rust, pip-installs pipx (the
# backend for the pipx:* tools, since aqua has no Windows pipx build), then flips
# rustup's default host to gnullvm so both host and target link via llvm-mingw
# rather than the absent MSVC link.exe (no Visual Studio Build Tools needed). The
# prereqs mise CAN'T supply (a recent mise + the VC++ runtime) are in the README.
description = "Windows preinstall: Windows toolchain + pipx + flip rustup to the gnullvm host"
depends = ["_setup_all"]
run = """
mise install conda:m2-git conda:m2-gnupg github:mstorsjo/llvm-mingw conda:m2-make rust
# pipx backs the pipx:* tools but isn't a mise tool on Windows. Install it with
# whatever python is on PATH: the runner's system python on CI/workstations (its
# Scripts dir, where pipx lands, is already on PATH); Dockerfile.windows puts
# mise's python on PATH before this so the command resolves on Nano too.
python -m pip install pipx
# Install + default to the gnullvm build of the EXACT rust version mise pinned;
# mise sets RUSTUP_TOOLCHAIN to that bare version, so once the default host is
# gnullvm it resolves to this <version>-gnullvm toolchain.
ver="$(mise exec -- rustc --version | awk '{print $2}')"
mise exec -- rustup set default-host x86_64-pc-windows-gnullvm
mise exec -- rustup toolchain install "${ver}-x86_64-pc-windows-gnullvm"
mise exec -- rustup default "${ver}-x86_64-pc-windows-gnullvm"
"""
shell = "bash -euo pipefail -c"
