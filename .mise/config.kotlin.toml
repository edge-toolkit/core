# Kotlin toolchain + tasks. Loaded when MISE_ENV includes `kotlin`.

[tools]
# Gradle drives the Kotlin/Wasm build.
# The Kotlin Gradle plugin bundles the compiler, resolved from the Gradle Plugin Portal on first build, the
# same way the java env's Maven pulls TeaVM from Central. Gradle finds its JVM via the `java` tool on PATH --
# unlike mvn.cmd it does not require JAVA_HOME on any platform.
gradle = "9.7.0"
# Same JDK pin as config.java.toml carries for Maven; bump the two in lockstep.
java = "26.0.1"

[env]
# Cross-platform gradle invocation.
# On Windows, mise creates no working gradle shim (see the gradle_bin var in config.windows.toml), and a bare
# `gradle` under busybox bash resolves the extensionless Unix launcher, whose `JAVACMD="$JAVA_HOME/bin/java"`
# (no `.exe`) check dies with "JAVA_HOME is set to an invalid directory" even though the JDK is present --
# observed on commit 88825a7217aa80c04171a735fec8f7a550fb75d1 at
# https://github.com/edge-toolkit/core/actions/runs/31558277244/job/93995051606 (check:kotlin) and
# https://github.com/edge-toolkit/core/actions/runs/31558277392/job/93995052197 (prefetch:kotlin). The
# absolute path to `gradle.bat` sidesteps the PATH lookup; busybox's spawnve auto-wraps `.bat` with cmd.exe,
# the same way the java env's MVN does for mvn.cmd.
GRADLE = '''{% if os() == "windows" -%}
{{- vars.gradle_bin -}}\gradle.bat
{%- else -%}
gradle
{%- endif %}'''

[tasks.build-ws-kotlin-data1-module]
description = "Build the kotlin-data1 workflow module (Kotlin/Wasm -> WasmGC)"
dir = "services/ws-modules/kotlin-data1"
run = "\"$GRADLE\" --console=plain pkgDist"
shell = "bash -euo pipefail -c"

[tasks.build-ws-kotlin-math1-module]
description = "Build the kotlin-math1 FedAvg module (Kotlin/Wasm -> WasmGC)"
dir = "services/ws-modules/kotlin-math1"
run = "\"$GRADLE\" --console=plain pkgDist"
shell = "bash -euo pipefail -c"
# Never extract binaryen at the same moment the sibling Kotlin module does.
# The Kotlin Gradle plugin's `kotlinWasmBinaryenSetup` unpacks binaryen into one shared GRADLE_USER_HOME path,
# and the two modules are separate Gradle root projects that build-modules fans out in parallel, so whichever
# reaches the extraction second lands on a tree the first is still writing:
#
#     Execution failed for task ':kotlinWasmBinaryenSetup'
#     > Could not copy tar entry '/root/.gradle/caches/modules-2/files-2.1/com.github.webassembly/binaryen/...
#        > Could not set file mode 755 on '/root/.gradle/binaryen/binaryen-version_125'
#
# The loser alternates, which is why it reads as an unrelated flake: kotlin-data1 lost on the ubuntu:24.04
# build at commit 0e7273a1154db315a0f584077db4565ba66be603
# (https://github.com/edge-toolkit/core/actions/runs/33727571318/job/100559961182), then kotlin-math1 lost on
# fedora:42 and kotlin-data1 again on opensuse/leap:15.6, both at commit
# 6c6b6e6f0d123f131d3f41e188660151f6994f9e
# (https://github.com/edge-toolkit/core/actions/runs/33847012202/job/100941026418 and
# .../job/100941026442). `wait_for` rather than `depends`: math1 needs nothing kotlin-data1 produces, so this
# must not pull that module into a build that only asked for this one -- it only defers when both are already
# running. check:kotlin and prefetch:kotlin avoid the same race by running both modules in one task body.
wait_for = ["build-ws-kotlin-data1-module"]

# Namespaced aggregator picked up by the default config's globbed `check`.
# The compile runs kotlinc with allWarningsAsErrors (set in build.gradle.kts), the Kotlin analogue of -Werror.
# Each Kotlin module is its own Gradle root project, so the check compiles them one -p at a time.
[tasks."check:kotlin"]
description = "Run Kotlin checks (kotlinc allWarningsAsErrors via the Gradle compile)"
run = """
"$GRADLE" --console=plain -p services/ws-modules/kotlin-data1 compileKotlinWasmJs
"$GRADLE" --console=plain -p services/ws-modules/kotlin-math1 compileKotlinWasmJs
"""
shell = "bash -euo pipefail -c"

[tasks."prefetch:kotlin"]
description = "Prefetch Kotlin (Gradle plugin + Maven Central) dependencies"
run = """
"$GRADLE" --console=plain -p services/ws-modules/kotlin-data1 dependencies
"$GRADLE" --console=plain -p services/ws-modules/kotlin-math1 dependencies
"""
shell = "bash -euo pipefail -c"
