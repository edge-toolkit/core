[vars]
# The Pico 2 W radio's blobs, as fetch-cyw43-firmware-rclone fetches them.
# Each asset name carries embassy's short commit; config/upstream-cache/data.toml records the matching SHA256s, and
# checksums.rego cross-checks both sides.
cyw43_clm_asset = "cyw43-75f40b3-43439A0_clm.bin"
cyw43_dir = "target/cyw43-firmware"
cyw43_firmware_asset = "cyw43-75f40b3-43439A0.bin"
cyw43_nvram_asset = "cyw43-75f40b3-nvram_rp2040.bin"
cyw43_repo = ":http:embassy-rs/embassy/raw/75f40b383a14/cyw43-firmware"
