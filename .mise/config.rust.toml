# Rust env (MISE_ENV=rust).
#
# First migration out of the always-loaded default config: the Rust WASM
# module builds live here, so `MISE_ENV=dart mise run build-modules` no longer
# tries to build them. They keep their `build-ws-*-module` names, so the
# default config's `build-modules` glob (`build-ws-*-module`) picks them up
# whenever the `rust` env is loaded — exactly like the guest-language module
# builds in the other config.<lang>.toml files.
#
# The rest of the Rust toolchain + tasks (the `rust` tool itself, cargo-*, the
# universal repo-wide checks, ws-server, the e2e tests) still live in the
# default config; moving those out is a later pass.

[tasks.build-ws-wasm-agent]
description = "Build the WebSocket WASM client"
dir = "services/ws-wasm-agent"
# {{ vars.no_opt }} is --no-opt on Windows (wasm-opt can't run on Nano), empty
# elsewhere -- the served, size-optimised artifact is built on Linux/macOS.
# Stable toolchain build: drops the nightly `-Z build-std=std,panic_abort`.
# Without build-std the precompiled std doesn't get the mvp target-feature
# treatment, but the agent doesn't need that for correctness.
# Lives in config.rust.toml (not the base config) because Windows mise's
# child-env composition drops the `%LOCALAPPDATA%\mise\shims` PATH entry
# for base-config tasks spawned under a bash-parent step, but keeps it for
# tasks declared in a language-env config. Captured on 0490dbc3, windows
# job 82266241297.
run = "wasm-pack build . --target web {{ vars.no_opt }}"

[tasks.build-ws-data1-module]
description = "Build the data1 workflow WASM module"
dir = "services/ws-modules/data1"
run = "wasm-pack build . --target web {{ vars.no_opt }}"

