[tasks.build-ws-wasi-data1-module]
depends = ["build-et-cli"]
description = "Build the Rust WASI data1 module as a WASI Preview 2 component"
# Explicitly request wasm32-wasip2 for this crate's WASI-gated lib body.
# The crate is a regular workspace member but its lib body is gated on
# `#![cfg(target_os = "wasi")]`, so cargo check from the host target gets
# an empty cdylib while this task explicitly requests wasm32-wasip2. The
# .wasm artifact lands in the workspace-shared `target/` and is then
# copied into the module's pkg/ for et-modules-service to serve.
run = """
{{ vars.wasm_cov }} cargo build --release -p et-ws-wasi-data1 --target wasm32-wasip2{{ vars.wasi_cov_feat }}
coreutils mkdir -p services/ws-modules/wasi-data1/pkg
wasm=et_ws_wasi_data1.wasm
coreutils cp "target/wasm32-wasip2/release/$wasm" "services/ws-modules/wasi-data1/pkg/$wasm"
{{ vars.et_cli }} module-package-json --module-dir services/ws-modules/wasi-data1
"""
shell = "{{ vars.task_shell }}"

[tasks.build-ws-wasi-math1-module]
depends = ["build-et-cli"]
description = "Build the Rust WASI math1 module as a WASI Preview 2 component"
run = """
{{ vars.wasm_cov }} cargo build --release -p et-ws-wasi-math1 --target wasm32-wasip2{{ vars.wasi_cov_feat }}
coreutils mkdir -p services/ws-modules/wasi-math1/pkg
wasm=et_ws_wasi_math1.wasm
