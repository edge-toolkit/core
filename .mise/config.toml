# Default config: always loaded regardless of MISE_ENV.
# Holds the Rust toolchain (the substrate -- every guest-language module build
# shells out to `cargo run -p et-cli`), the Node static-workspace infra, the
# universal repo-wide linters, and the cross-language orchestration tasks below.
#
# Per-language toolchains live in .mise/config.<lang>.toml, selected via MISE_ENV (dart, dotnet, java,
# python, zig). config.rust.toml currently holds only the Rust WASM module builds; the rest of the Rust
# tooling still lives here, pending a later pass that moves it behind MISE_ENV=rust. Examples:
#   Install one language's toolchain:   MISE_ENV=dart mise install
#   Run a check across everything:      mise run check-all  (or install-all)
#   Make a selection sticky:            export MISE_ENV=dart

# Require release that introduced auto_env enabled in .miserc.toml
min_version = "2026.7.1"

[settings]
# Disable mise's two auto-install paths so tasks fail fast on a missing tool.
# exec_auto_install covers `mise exec`, task.run_auto_install covers `mise run`.
cargo.binstall = true
# Make every inline task body run under bash by default (Windows-only effect).
# bash is ash via MISE_BASH_PATH = busybox-w32 in config.windows.toml. Without this, mise spawns `cmd /c "<body>"`
# and any task in the always-loaded base config hits the cmd-subprocess PATH dropout (cargo/pnpm/wasm-pack
# /etc. unresolvable) we worked around piecemeal with `shell = "bash -euo pipefail -c"` on prefetch:rust,
# prefetch:node, and build-et-cli. Setting the global flips every other task at once. Tasks that explicitly
# need cmd (e.g. dotnet-data1's `dotnet publish` chain) still set `shell` on the task to override.
windows_default_inline_shell_args = "bash -euo pipefail -c"
# Disable mise backends we never use.
# `asdf` is kept enabled because several of our bare-name tools (conftest, dprint, hadolint, pipx, rclone,
# ruff, ...) list `asdf:` as the registry fallback after `aqua:`. `vfox` was the original target -- killed
# the persistent `DEBUG [vfox] Getting metadata for yarn` noise that mise's `load_tools` produces by
# proactively iterating every registry tool with `idiomatic_files` declared. The rest (forgejo, gem, gitlab,
# pkgx, s3, spm, ubi) are belt-and-braces.
disable_backends = ["forgejo", "gem", "gitlab", "pkgx", "s3", "spm", "ubi", "vfox"]
exec_auto_install = false
experimental = true
http_retries = 10
http_timeout = "2m"
# Explicit empty list (matches mise's default) keeps version-file detection off.
# This disables idiomatic-version-file detection for every tool. We declare versions in `.mise/config*.toml`;
# no need to parse `.tool-versions`/`.node-version`/etc. on top of that.
idiomatic_version_file_enable_tools = []
# Pin the npm: backend to aube rather than letting mise pick one.
# The default "auto" uses aube when it happens to be installed and silently falls back to plain npm otherwise,
# which produces two different install layouts: aube writes `global-aube/<hash>/aube-lock.yaml` (a full
# transitive lockfile), plain npm writes a bare `lib/node_modules` tree with no lockfile at all. osv-scanner
# cannot extract anything from a lockfile-less tree, so under "auto" a tool's vulnerability coverage depended on
# whether aube was present the day it was installed. Pinning to aube makes every npm: tool emit a lockfile, which
# is what osv-scanner-npm collects and scans.
npm.package_manager = "aube"
task.run_auto_install = false
# Hard-verify tool signatures via gpg on every platform.
# Propagates to node.gpg_verify and swift.gpg_verify per mise/src/config/settings.rs. mise's node plugin
# runs `gpg --import` + `gpg --verify` against Node's signed SHASUMS; with this enabled that path hard-fails
# instead of soft-skipping (`warn!("gpg not found, skipping verification")` in mise/src/plugins/core/node.rs)
# when gpg is absent. The full gnupg suite (gpg + agent + dirmngr) is installed up-front in _setup_all so
# any gpg-verified install finds it.
gpg_verify = true

[tools]
# aqua/github ship no Windows build for action-validator, so scope the aqua entry off Windows.
# config.windows.toml installs cargo:action-validator (cargo-quickinstall msvc prebuilt) there instead.
action-validator = { version = "latest", os = ["linux", "macos"] }
# jaq: a Rust jq-compatible alternative implementation with prebuilt binaries for every platform.
"aqua:01mf02/jaq" = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
"aqua:StyraInc/regal" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:rhysd/actionlint" = "latest"
"aqua:rustwasm/wasm-pack" = "latest"
"aqua:vectordotdev/vector" = "0.56.0"
ast-grep = "latest"
# aube is the npm: backend, and mandatory because npm.package_manager names it.
# aqua ships linux/macos-arm64/windows; macos/x64 has no aqua asset, so it takes the cargo backend -- allowed
# there because macos/x64 is second-tier.
aube = { version = "latest", os = ["linux", "macos/arm64", "windows"] }
cargo-binstall = "latest"
"cargo:aube" = { version = "latest", os = ["macos/x64"] }
"cargo:cargo-expand" = { version = "latest", os = ["linux", "macos"] }
"cargo:open" = "latest"
"cargo:wasm-opt" = { version = "latest", os = ["linux", "macos"] }
cmake = "latest"
"conda:openssl" = "3"
conftest = "latest"
"github:nextest-rs/nextest" = "latest"
taplo = "latest"
watchexec = "latest"
# uutils coreutils: the Rust multicall binary, invoked as `coreutils <util>` in tasks.
# Pinned to 0.6.0 (NOT the latest 0.9.0) because uutils 0.7.0+ ships the Windows release as 85 per-utility
# .exes with no multicall coreutils.exe (see uutils/coreutils#11268). 0.6.0 keeps the multicall layout
# uniform across Linux/macOS/Windows, so tasks can keep using `coreutils <util>` everywhere. Bump cautiously:
# confirm the Windows zip layout hasn't reverted before raising the pin.
coreutils = "0.6.0"
dprint = "latest"
editorconfig-checker = "latest"
# ripgrep (rg): the Rust grep that tasks use in place of the host's grep.
ripgrep = "latest"
# uutils findutils (find + xargs), pinned to 0.8.0 (0.9.0 ships no binaries).
# Separate binaries, not a multicall, so the mise shims shadow the host's find /
# xargs in tasks. Every platform uses the 0.8.0 prebuilt via github: ...
"github:uutils/findutils" = { version = "0.8.0", os = ["linux/x64", "macos", "windows"] }
# Apple Silicon resource monitor (CPU/GPU/ANE/power) for the o2-macmon task; macOS-only, so os-scoped.
"github:vladkens/macmon" = { version = "0.7.2", os = ["macos"] }
# NVIDIA GPU Prometheus exporter (nvidia-smi) for the o2-nvidia task; Linux-only, so os-scoped.
# Windows GPU coverage is windows_exporter's gpu collector; Apple Silicon is macmon.
"github:utkuozdemir/nvidia_gpu_exporter" = { version = "1.10.0", os = ["linux"] }
# Windows host + GPU Prometheus exporter for the o2-winmetrics task; Windows-only, so os-scoped.
"github:prometheus-community/windows_exporter" = { version = "0.31.7", os = ["windows"] }
# OpenTelemetry Collector (contrib distro) binary for the native, non-Docker o2-winmetrics-native / o2-winperf tasks.
# The releases repo ships several distros in one tag; matching=contrib selects the contrib archive -- the only one
# carrying the prometheus/hostmetrics/windowsperfcounters receivers + basicauth extension those configs use.
"github:open-telemetry/opentelemetry-collector-releases[matching=contrib]" = { version = "0.156.0" }
# aarch64-linux is the exception, building findutils from source instead.
# Its 0.8.0 release has no asset, so it builds from
# source via cargo: (same 0.8.0 pin, so every platform runs the same version).
"cargo:findutils" = { version = "0.8.0", os = ["linux/arm64"] }
# goawk: the awk that tasks invoke as `goawk` in place of the host's awk.
"github:benhoyt/goawk" = "latest"
"github:caldempsey/parfit" = "latest"
"github:grok-rs/waitup" = "latest"
# ONNX Runtime prebuilt -- ort-sys 2.0.0-rc.10 binds to ORT 1.22.x.
"cargo:ryl" = { version = "latest", os = ["macos/x64"] }
"github:microsoft/onnxruntime" = "1.22.0"
"github:owenlamont/ryl" = { version = "latest", os = ["linux", "macos/arm64", "windows"] }
"github:wasm-bindgen/wasm-bindgen" = "0.2.126"
# Sole consumer right now is the `go:` backend that source-builds jqfmt.
# (noperator/jqfmt ships no release assets); add Go users here as they arrive.
go = "latest"
"go:github.com/noperator/jqfmt/cmd/jqfmt" = "latest"
hadolint = "latest"
ls-lint = "latest"
lychee = "latest"
mprocs = "latest"
node = "22"
osv-scanner = "latest"
# Aqua has no pipx build for windows/amd64.
# On Windows the workflow runs `python -m pip install pipx` separately so the
# `pipx:*` entries below still resolve through whatever pipx is already on PATH.
pipx = { version = "latest", os = ["linux", "macos"] }
# Pure-Python fixture for the et-ws-pyo3-runner `cowsay` test.
# Proves a mise-installed python package lands on the embedded interpreter's
# sys.path (see `edge_toolkit::config::mise_python_site_packages`).
gh = "latest"
"pipx:cowsay" = "latest"
"pipx:semgrep" = "latest"
# Aqua has no pnpm darwin/amd64 prebuilt.
# The `npm:pnpm` fallback for macos/x64 lives in the `js` env (config.js.toml).
pnpm = { version = "latest", os = ["linux", "macos/arm64", "windows"] }
protoc = "latest"
# Full version triple, not a minor pin.
# mise installs python under a per-tool dir named after the request and only symlinks the `3.x` minor alias
# -- and that symlink isn't created on the Windows runner, so the py3_* interpreter paths must resolve to the
# exact `3.x.y` dir. Bump in lockstep with py3_unix/py3_win/pylib.
python = "3.13.14"
rclone = "latest"
typos = "latest"
uv = "0.11.8"
wasm-tools = "latest"
yq = "latest"
zizmor = "latest"

# Rust toolchains -- Linux/macOS only.
# Windows installs the gnullvm-host toolchains directly via config.windows.toml's own `[[tools.rust]]`
# entries, which skips the install-msvc-then-flip-to-gnullvm dance the old preinstall did. Both entries use
# `profile = "minimal"` to skip the ~1 GB rust-docs HTML tree per toolchain (the Nano docker build otherwise
# filled its disk during the second toolchain install -- crashing inside an HCS re-exec on the rust-docs HTML
# write under share/doc/rust/html/ with "There is not enough space on the disk"). Array-of-tables form
# rather than inline so each entry's fields sit on their own lines alongside `os` + the component / target
# lists; must come at the end of [tools] (TOML can't re-open the table after the [[ ... ]] array-of-tables
# headers below).
[[tools.rust]]
components = "clippy,rust-analyzer"
os = ["linux", "macos"]
profile = "minimal"
targets = "wasm32-unknown-unknown,wasm32-wasip2"
# Use `stable`, not `latest`, so every lane resolves through the same rustup channel.
# mise's `latest` picks the max of rust-lang/rust's GitHub Releases, which are published by separate
# automation that lags the `stable` rustup channel the Windows [[tools.rust]] entries resolve through. That
# skew once shipped a newer clippy (with a new restriction lint) to Windows than Linux/macOS, breaking only
# that lane.
version = "stable"

[[tools.rust]]
# llvm-tools ships the version-matched llc + llvm-cov + llvm-profdata the wasm-coverage pipeline drives.
# The instrumented guests build on nightly for -Zno-profiler-runtime, so the matching LLVM tools are nightly's.
components = "rust-src,rustfmt,llvm-tools"
os = ["linux", "macos"]
profile = "minimal"
targets = "wasm32-unknown-unknown,wasm32-wasip2"
version = "nightly"

# Native rustpython binary built from upstream RustPython main.
# Built with `freeze-stdlib` (so the binary embeds the Python stdlib and doesn't need a RUSTPYTHONPATH dance)
# + the upstream pip audit-hook fix (RustPython#7956). Per-platform url + checksum, os-scoped to only those
# platforms whose triple's tarball is already in the rp-v<N> release; consumers on every other platform have
# no `rustpython` on PATH (no CI/build path depends on it today). To add a platform: dispatch
# .github/workflows/upstream-cache.yaml -- it builds + uploads the tarball, then auto-edits this block to add
# the platforms.<plat> entry on the maintainer's next local run. `bin = "rustpython"` because the tool short
# name (`et-rp`) doesn't match the binary name. Short SHA inlined in each platform's url because mise's tera
# context doesn't expose top-level `version` into platforms.<plat>.url; the publish task updates both
# `version` and the platform url together.
[tools."http:et-rp"]
bin = "rustpython"
os = ["linux", "macos", "windows"]
version = "08a1d6f"
[tools."http:et-rp".platforms.linux-arm64]
checksum = "sha256:c26df56bf3c28cb9e134abe95dd0fcf927f05487069a492a6f54ffa1c0f3dc12"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-aarch64-unknown-linux-gnu.tar.gz"
[tools."http:et-rp".platforms.linux-x64]
checksum = "sha256:75b74fd71ba338d542d9c8a512aa6e9475695f31d5e9e3d159b44d1445b9ba21"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-x86_64-unknown-linux-gnu.tar.gz"
[tools."http:et-rp".platforms.macos-arm64]
checksum = "sha256:5cdb5ed45e925ac01d12feeae453be75112d5e4d4725d44c869d63e502fcf393"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-aarch64-apple-darwin.tar.gz"
[tools."http:et-rp".platforms.macos-x64]
checksum = "sha256:2a161b533e6eab988b7a16d400b05216c37be371a142e761b917044c14cacad2"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-x86_64-apple-darwin.tar.gz"
[tools."http:et-rp".platforms.windows-x64]
checksum = "sha256:30b96e2d50ec15f7da5563b5bbce4170ee23f5fbf8565a8973889d8f25c6279a"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-x86_64-pc-windows-msvc.tar.gz"

# augtool (from augeas) is used by the maint publish-* tasks.
# Those config.maint.toml tasks edit .mise/config.toml + config/upstream-cache/data.toml in place via
# augeas's Toml lens (preserves comments and structure, unlike pure stringly TOML rewrites). Source-built
# from the jayvdb/augeas `win` branch on every platform by the augeas job in upstream-cache.yaml -- one
# branch, one set of portability patches, identical binaries. URLs inline the asset filename rather than
# templating via {{ vars.* }} because mise's http backend doesn't run tera against per-platform url fields
# (works for top-level tools.<name>.url, breaks here). The matching `augeas_<plat>_asset` vars stay in
# [vars] below so checksums.rego's cross-reference policy (.mise vars <-> data.toml [asset.*]) still passes.
# Noarch rustpython_wasm tarball (the prebuilt wasm-pack output that build-ws-pywasm1-module consumes).
# Single platform-agnostic URL -- mise extracts to `installs/http-rp-wasm/<version>/`, then the module
# build task copies what it needs into pkg/. Built + uploaded by `publish-rp-wasm-to-release` in
# config.maint.toml; matching `[asset."rustpython-wasm-<short>.tar.gz"]` row sits in config/upstream-cache/data.toml.
# Version segment is the upstream RustPython commit's 7-char short SHA -- bump in lockstep with the asset
# filename in data.toml and the url here.
[tools."http:rp-wasm"]
checksum = "sha256:7b81d53f5b3a63c60fc2bc1717e87466026d796ec522b925f009532c7b0291f3"
url = "https://github.com/edge-toolkit/core/releases/download/{{ vars.a_rp_release }}/{{ vars.a_rp_wasm_asset }}"
version = "08a1d6f"

# OpenObserve open-source binary for the o2-native task.
# The same build the o2 docker image runs (its Dockerfile is just `CMD ["/openobserve"]`), pinned to the same
# version. Direct upstream download, no checksum. No Windows build exists (downloads.openobserve.ai 403s the
# windows asset), so os-scoped to linux + macos.
[tools."http:openobserve"]
bin = "openobserve"
os = ["linux", "macos"]
version = "0.70.3"
[tools."http:openobserve".platforms.linux-arm64]
url = "https://downloads.openobserve.ai/releases/openobserve/v0.70.3/openobserve-v0.70.3-linux-arm64.tar.gz"
[tools."http:openobserve".platforms.linux-x64]
url = "https://downloads.openobserve.ai/releases/openobserve/v0.70.3/openobserve-v0.70.3-linux-amd64.tar.gz"
[tools."http:openobserve".platforms.macos-arm64]
url = "https://downloads.openobserve.ai/releases/openobserve/v0.70.3/openobserve-v0.70.3-darwin-arm64.tar.gz"

# chromedriver from Google's Chrome for Testing CDN, for the headless-browser wasm-bindgen tests.
# The `os` list uses mise's os/arch compound syntax (mise >= 2026.4, jdx/mise#9088) to skip linux-arm64: Chrome
# for Testing publishes no linux-arm64 chromedriver, and a bare `linux` entry would hard-fail `mise install` on
# the linux-arm64 lanes ("No URL for platform linux-arm64"). `linux/x64` matches only that arch; bare `macos`
# matches both. Immutable per-version URLs mean no checksum -- the same direct-upstream posture as
# http:openobserve. mise auto-strips the single `chromedriver-<platform>/` archive dir, leaving the `chromedriver`
# binary at the install root. Consumers: test-ws-wasm-agent-chrome / ws-e2e-chrome and the wasm-agent-cov coverage
# task (which in CI drives Chrome via the runner's matched CHROMEWEBDRIVER instead). The major version must track
# the Chrome it drives (a >1-major skew makes chromedriver refuse the session); bump this pin when that moves.
[tools."http:chromedriver"]
bin = "chromedriver"
os = ["linux/x64", "macos"]
version = "150.0.7871.124"
[tools."http:chromedriver".platforms.linux-x64]
url = "https://storage.googleapis.com/chrome-for-testing-public/150.0.7871.124/linux64/chromedriver-linux64.zip"
[tools."http:chromedriver".platforms.macos-arm64]
url = "https://storage.googleapis.com/chrome-for-testing-public/150.0.7871.124/mac-arm64/chromedriver-mac-arm64.zip"
[tools."http:chromedriver".platforms.macos-x64]
url = "https://storage.googleapis.com/chrome-for-testing-public/150.0.7871.124/mac-x64/chromedriver-mac-x64.zip"

[tools."http:augeas"]
bin = "augtool"
version = "1.14.1"
[tools."http:augeas".platforms.linux-arm64]
checksum = "sha256:3303e8022294b04fe4ed567b0d88c10c1c7d5b51e443485251a6d4a606b1433a"
url = "https://github.com/edge-toolkit/core/releases/download/augeas-v1/1.14.1-aarch64-unknown-linux-gnu.tar.xz"
[tools."http:augeas".platforms.linux-x64]
checksum = "sha256:76eb80c33355abe9f6ea01ac90a47a70d5917d940a0a843aed9d0b61feed7714"
url = "https://github.com/edge-toolkit/core/releases/download/augeas-v1/1.14.1-x86_64-unknown-linux-gnu.tar.xz"
[tools."http:augeas".platforms.macos-arm64]
checksum = "sha256:10fc4aff94a5c6016c51b4dbbc224277a340a083c315ca0a05e9f5ef9a869403"
url = "https://github.com/edge-toolkit/core/releases/download/augeas-v1/1.14.1-aarch64-apple-darwin.tar.xz"
[tools."http:augeas".platforms.macos-x64]
checksum = "sha256:28b26d680158f9480cf5e01cd7d47e57b7b05a7ac8646c76aa9c58537ea80422"
url = "https://github.com/edge-toolkit/core/releases/download/augeas-v1/1.14.1-x86_64-apple-darwin.tar.xz"
[tools."http:augeas".platforms.windows-x64]
checksum = "sha256:6d97229c53cc0af09635bfd85b15169704ab9c07d5e23090252ac80746260036"
url = "https://github.com/edge-toolkit/core/releases/download/augeas-v1/1.14.1-x86_64-pc-windows-mingw.tar.gz"

[vars]
# Tier-`a_` prefix marks leaf values referenced by later vars.
# a_* vars are referenced by later vars (face1_src), and mise renders [vars] in alphabetical order; `a_` sorts
# before every non-prefixed var name so the reference resolves. Shared GitHub release tag for the HF-asset
# mirror; referenced by face1_src below + by config.maint.toml's publish-*-to-hf-cache task body. Bump
# (`hf-cache-v2`, ...) when an upstream asset changes -- updating this single var rolls both sides.
a_hf_cache_tag = "hf-cache-v1"
# Shared GitHub release tag for both the rustpython_wasm tarball and the natives.
# Covers the wasm-pack rustpython_wasm tarball and the per-platform native rustpython binaries (both built
# from the same upstream RustPython commit, stored together). Referenced by rp_* vars below + by
# config.maint.toml's publish-rp-* task bodies.
a_rp_release = "rp-v1"
# Home directory, used to compose the Unix-style mise install paths in the vars below.
# On Unix, mise's tera context always has env.HOME. On Windows it does not (only USERPROFILE is guaranteed), and
# a bare `env.HOME` reference aborts the entire render with "Variable `env.HOME` not found in context" -- so branch
# on os() and fall back to USERPROFILE (forward-slashed) there. The Windows value only has to render without
# erroring: every var built from it (mise_data_dir, conda_openssl, py3_unix, pylib_flag, ort_loc_unix) is Unix-only
# and unused on Windows, where mise uses %LOCALAPPDATA%\mise and config.windows.toml supplies the real paths.
a_home = '''{% if os() == "windows" -%}
{{- (env?.USERPROFILE or "") | replace(from="\\", to="/") -}}
{%- else -%}
{{- env.HOME -}}
{%- endif %}'''
# augeas asset filenames, one per supported platform.
# Each matches an `[asset."<filename>"]` row in config/upstream-cache/data.toml so the checksums.rego policy
# can enforce the cross-reference. All five tarballs are uploaded to the augeas-v1 release by the
# upstream-cache `augeas` job.
augeas_linux_arm64_asset = "1.14.1-aarch64-unknown-linux-gnu.tar.xz"
augeas_linux_x64_asset = "1.14.1-x86_64-unknown-linux-gnu.tar.xz"
augeas_macos_arm64_asset = "1.14.1-aarch64-apple-darwin.tar.xz"
augeas_macos_x64_asset = "1.14.1-x86_64-apple-darwin.tar.xz"
augeas_windows_x64_asset = "1.14.1-x86_64-pc-windows-mingw.tar.gz"
# mise data dir -- the parent of `installs/<backend>-<name>/<version>`.
# Used to compose absolute paths into a tool's install dir from [env] (e.g. AUGEAS_LENS_LIB). Honours
# MISE_DATA_DIR if set; otherwise mise's default of $XDG_DATA_HOME (~/.local/share/mise on Linux/macOS).
mise_data_dir = '{{ env?.MISE_DATA_DIR or (vars.a_home ~ "/.local/share/mise") }}'
# The Rust/Python/Dart/Java half of the lockfile set osv-scanner scans, one file per ecosystem.
# Split from the npm half (and composed into osv_locks below) so no single line exceeds the editorconfig line
# length. The `a_` prefix puts both halves ahead of osv_locks in mise's alphabetical [vars] render order, so
# they are defined before osv_locks interpolates them.
a_osv_locks_base = "--lockfile Cargo.lock --lockfile uv.lock --lockfile pubspec.lock --lockfile pom.xml"
# The npm half: the repo-root pnpm workspace lockfile, covering every member listed in pnpm-workspace.yaml.
a_osv_locks_node = "--lockfile pnpm-lock.yaml"
osv_locks = "{{ vars.a_osv_locks_base }} {{ vars.a_osv_locks_node }}"
# clang-tidy's resource-dir arg (points clang at its builtin headers, e.g.
# stddef.h). Empty default; config.linux.toml sets it from conda:clangxx.
clang_resource_arg = ""
conda_openssl = "{{ vars.a_home }}/.local/share/mise/installs/conda-openssl/3"
# Forward-slashed config_root for safe substitution into bash command lines.
# Windows mise returns a backslash-form path like `D:\a\core\core`; substituting that verbatim into a bash
# command line trips `\a` -> alert, `\c` -> "suppress output" string mangling inside busybox ash, so paths
# like `D:\a\core\core/target/...` become `D:acorecore/target/...`). Forward slashes Just Work on both
# shells. Used as the root of every workspace-relative var below.
config_root_fwd = '{{ config_root | replace(from="\\", to="/") }}'
# Google dart-archive base URLs for config.dart.toml's `[tools.dart]` url/version_list_url.
# They live here (always-loaded), not in the dart config, because mise resolves tool URLs during
# `mise upgrade`/`install` without that env config's own [vars] in scope -- the same reason augeas_* assets are here.
dart_bucket = "https://storage.googleapis.com/storage/v1/b/dart-archive/o"
dart_release = "https://storage.googleapis.com/dart-archive/channels/stable/release"
# Absolute path to the workspace-built et-cli binary.
# The parallel build-ws-*-module tasks each invoke `et-cli module-package-json`; using this var (rather than
# `cargo run -p et-cli`) means every invocation execs the same pre-built binary instead of re-entering cargo,
# which avoids a race seen on macOS where one cargo's link step transiently unlinks `target/debug/et-cli`
# while another cargo's `cargo run` tries to exec it
# (`error: ... (never executed) ... No such file or directory (os error 2)`). The `build-et-cli` task is the
# dependency that puts the binary in place; every et-cli-using task must (directly or transitively) depend
# on it. `.exe` suffix on Windows matches cargo's output naming.
a_et_cli_exe = "et-cli{% if os() == 'windows' %}.exe{% endif %}"
a_et_cli_target_dir = "target{% if os() == 'windows' %}/x86_64-pc-windows-gnullvm{% endif %}/debug"
# RUSTC_WORKSPACE_WRAPPER assignment for the coverage build; leaf var referenced by web_cov_wrapper below.
# `a_` prefix so mise's alphabetical [vars] render defines it before web_cov_wrapper uses it. Split out so
# web_cov_wrapper only adds the ET_TEST_COVERAGE conditional around this value.
a_web_cov_wrapper_env = 'RUSTC_WORKSPACE_WRAPPER={{ config_root }}/target/debug/int-wasm-cov-wrapper '
et_cli = "{{ vars.config_root_fwd }}/{{ vars.a_et_cli_target_dir }}/{{ vars.a_et_cli_exe }}"
# mise-managed CPython (Linux/macOS); the PYO3_PYTHON default below.
# Windows overrides PYO3_PYTHON with its own py3_win in config.windows.toml. The version
# segment must equal the `python` [tools] pin (conftest enforces both).
py3_unix = "{{ vars.a_home }}/.local/share/mise/installs/python/3.13.14/bin/python3"
# RUSTFLAGS fragments shared by the CARGO_TARGET_* env in config.<os>.toml
rpath_flag = "-C link-arg=-Wl,-rpath,{{ vars.conda_openssl }}/lib"
# rpath to the mise CPython lib dir so the runner finds libpython at runtime.
# This lets the et-ws-pyo3-runner binary find libpython at runtime (libpython3.13.so on Linux,
# libpython3.13.dylib on macOS via its @rpath install name). Points at the exact `3.x.y` install dir (the
# `python` pin), since the minor-version alias dir isn't created everywhere.
pylib_flag = "-C link-arg=-Wl,-rpath,{{ vars.a_home }}/.local/share/mise/installs/python/3.13.14/lib"
wasm_rustflags = "-C target-cpu=mvp -C target-feature=+mutable-globals,+sign-ext,+nontrapping-fptoint,+reference-types"
# Instrumentation flag pair (leaf var) shared by the wasm coverage builds.
# The nightly -Z flag adds branch regions to the covmap so the lcov exports carry BRDA records. `a_` prefix so
# mise's alphabetical [vars] render defines it before wasm_cov_rustflags uses it.
a_wasm_cov_instr = "-Cinstrument-coverage -Zcoverage-options=branch"
# RUSTFLAGS for the wasm coverage builds: instrument + emit LLVM IR, no profiler runtime (minicov provides it).
# Single codegen unit + LTO off so each crate emits one .ll the wasm-cov task can gut and feed to llc/llvm-cov.
wasm_cov_rustflags = "--emit=llvm-ir {{ vars.a_wasm_cov_instr }} -Ccodegen-units=1 -Clto=off -Zno-profiler-runtime"
# Coverage fragments the wasm module build commands append unconditionally (empty unless ET_TEST_COVERAGE is set).
# wasm_cov is an inline RUSTFLAGS env prefix; the nightly toolchain + conda clang come from the coverage [env].
# The *_feat vars turn on minicov: cargo `--features` for the WASI cdylibs, wasm-pack `-- --features` for browsers
# (comm1 pulls et-web only under this feature).
wasi_cov_feat = '{% if env?.ET_TEST_COVERAGE == "true" %} --features coverage{% endif %}'
wasm_cov = '{% if env?.ET_TEST_COVERAGE == "true" %}RUSTFLAGS="{{ vars.wasm_cov_rustflags }}"{% endif %}'
web_cov_feat = '{% if env?.ET_TEST_COVERAGE == "true" %} -- --features et-web/coverage{% endif %}'
# Command prefix routing a browser module's wasm-pack build through the workspace-only coverage wrapper.
# Instruments our crates, never dependency cdylibs. Empty unless ET_TEST_COVERAGE is set, so normal builds get
# no wrapper (no fingerprint churn). The wrapper binary is built by the build-wasm-cov-wrapper task dependency.
web_cov_wrapper = '{% if env?.ET_TEST_COVERAGE == "true" %}{{ vars.a_web_cov_wrapper_env }}{% endif %}'
# Override-free head of a browser module's wasm-pack build: coverage wrapper prefix plus fixed build args.
# Used by the two modules that also run et-cli module-package-json (har1, face-detection). It excludes no_opt /
# web_cov_feat -- those are appended inline at the call site because no_opt carries a per-platform override that a
# nested var would freeze at this file's value.
web_pack_cov = '{{ vars.web_cov_wrapper }}wasm-pack build . --target web'
# Extra flag for the wasm-pack module builds; empty so wasm-opt runs.
# config.windows.toml overrides it to --no-opt where wasm-opt can't execute.
no_opt = ""
# Workspace members to exclude from the build-based cargo checks; empty on Linux/macOS.
# config.windows.toml overrides it to `--exclude et-ws-web-runner` -- that crate pulls deno -> v8, whose
# rusty_v8 gnullvm prebuilt is broken, so the workspace cargo check/clippy/doc can't build it on Windows.
cargo_ws_excludes = ""
# Linux/macOS install root for the github:microsoft/onnxruntime tool.
# The ORT_LIB_LOCATION env below resolves to it via the OS conditional. Version
# segment must match the [tools] pin (conftest's version_drift enforces this).
ort_loc_unix = "{{ vars.a_home }}/.local/share/mise/installs/github-microsoft-onnxruntime/1.22.0"
# Source/dest paths for the fetch-*-rclone model downloads, kept as vars.
# Keeping them as vars lets each `rclone copyto` command stay on a single line without continuations.
# face1's RetinaFace_int.onnx is mirrored to edge-toolkit/core's hf-cache-v<N> release because HuggingFace
# 429s the CI runner IP pool during prefetch (every docker-linux lane that hits amd/retinaface concurrently
# runs into the rate limit). face1_asset pins the upstream amd/retinaface commit SHA (short);
# config/upstream-cache/data.toml records the matching SHA256; the `publish-face1-to-hf-cache` task in
# config.maint.toml (MISE_ENV=maint) refreshes both sides + the release asset together.
# config/conftest/policy/checksums.rego cross-checks them.
face1_asset = "RetinaFace_int-7b69507.onnx"
face1_dst = "data/model-modules/model-face1/pkg/video_cv.onnx"
face1_src = ":http:edge-toolkit/core/releases/download/{{ vars.a_hf_cache_tag }}/{{ vars.face1_asset }}"
# eye1 is pyeye1's MediaPipe FaceLandmarker model bundle (Apache-2.0), used as-is (no conversion).
# It is Google's face_landmarker.task, mirrored from the mediapipe-models bucket to the same hf-cache-v<N>
# release by publish-eye1-to-hf-cache in config.maint.toml. data.toml records the SHA256; checksums.rego
# cross-checks both sides.
eye1_asset = "face_landmarker.task"
eye1_dst = "data/model-modules/model-eye1/pkg/face_landmarker.task"
eye1_src = ":http:edge-toolkit/core/releases/download/{{ vars.a_hf_cache_tag }}/{{ vars.eye1_asset }}"
har_dst = "data/model-modules/model-har-motion1/pkg/har-motion1.onnx"
har_repo = ":http:acd17sk/MET-Metabolic-Equivalent-of-Task-AI-Android-APP"
har_src = "{{ vars.har_repo }}/raw/refs/heads/main/Models/onnx/hybrid_met.onnx"
mnist_dst = "services/ws-modules/wasi-graphics-info/pkg/mnist-12.onnx"
mnist_src = ":http:onnx/models/raw/main/validated/vision/classification/mnist/model/mnist-12.onnx"
speech1_asset = "speech1-84f0d86.onnx"
speech1_dst = "data/model-modules/model-speech1/pkg/speech1.onnx"
speech1_src = ":http:onnx-community/silero-vad/resolve/84f0d86/onnx/model_fp16.onnx"
# Pip 26.0.1 wheel via PyPI, pinned to stay compatible with RustPython.
# Pinned because pip 26.1.1+ calls
# `sys.addaudithook` in `_prevent_further_imports`, which RustPython 0.5.0
# doesn't implement (RustPython#7956). Used to bootstrap pipx on rustpython
# (config.windows.toml's preinstall, the Nano-Server arm) and to probe pip
# + pipx behaviour generally (config.maint.toml's rustpython-investigation).
# `_sha` is the SHA256-prefix dir PyPI uses for `packages/`; rclone composes
# the full URL via `--http-url https://files.pythonhosted.org`.
pip_for_rustpython = "26.0.1"
pip_for_rustpython_sha = "de/f0/c81e05b613866b76d2d1066490adf1a3dbc4ee9d9c839961c3fc8a6997af"
pip_for_rustpython_wheel = "pip-{{ vars.pip_for_rustpython }}-py3-none-any.whl"
pip_for_rustpython_wheel_url = ":http:packages/{{ vars.pip_for_rustpython_sha }}/{{ vars.pip_for_rustpython_wheel }}"
# Pre-built rustpython_wasm tarball from upstream RustPython main.
# Built with wasm-pack --target web; `freeze-stdlib` is the default crates/wasm feature so the .wasm
# embeds the Python stdlib (no RUSTPYTHONPATH dance needed at consumer-side). Tracks main HEAD so the
# upstream `pip` audit-hook fix (RustPython#7956) is in. a_rp_wasm_asset pins the upstream short SHA;
# config/upstream-cache/data.toml records the matching SHA256; built + uploaded by config.maint.toml's
# `publish-rp-wasm-to-release` (sharing the rp-v<N> release tag with the native rustpython binary builds).
# `a_rp_wasm_short` is the canonical version source -- the upstream RustPython commit's 7-char short SHA.
# rp_wasm_dir templates against it, and the publish-rp-wasm-to-release maint task bumps it (plus
# a_rp_wasm_asset, the tool entry's version + checksum, and the data.toml asset row) in one go.
# a_rp_wasm_asset stays a literal string because checksums.rego reads the raw TOML and needs the
# filename verbatim to cross-check the data.toml [asset.*] entry.
a_rp_wasm_asset = "rustpython-wasm-08a1d6f.tar.gz"
a_rp_wasm_short = "08a1d6f"
# Install dir for the [tools."http:rp-wasm"] tarball.
# mise extracts to `installs/http-rp-wasm/<version>/`. Picks the per-OS install root inline: on Windows
# mise uses %LOCALAPPDATA%\mise (config.toml's [vars] is rendered before config.windows.toml's [vars] is
# in scope, so we can't cross-reference vars.mise_installs here); on Unix it uses MISE_DATA_DIR or
# $HOME/.local/share/mise. On Windows vars.mise_data_dir still renders (via a_home's USERPROFILE fallback) but
# resolves to a Unix-style path mise ignores there, so reusing it would be wrong -- the conditional is load-bearing.
# Forward slashes throughout the Windows suffix: GHA's LOCALAPPDATA arrives already-forward-slashed
# ("C:/Users/runneradmin/AppData/Local"), and a mixed-slash path trips uutils-coreutils' Windows path
# normalizer (`cp: The system cannot find the path specified. (os error 3)`).
# Extra actionlint flags for actionlint-check; empty everywhere except the config.windows.toml override.
actionlint_args = ""
gh_http = "--http-url https://github.com --progress --ignore-existing"
# OpenObserve docker image for the openobserve/o2 dev-observability task.
o2_image = "openobserve/openobserve:v0.70.3"
# OpenTelemetry Collector image for the o2-hostmetrics / o2-macmon / o2-nvidia / o2-winmetrics tasks.
otelcol_image = "otel/opentelemetry-collector-contrib:0.156.0"
rp_wasm_dir = '''{% if os() == "windows" -%}
{%- set base = (env?.LOCALAPPDATA or "") | replace(from="\\", to="/") -%}
{{- base -}}/mise/installs/http-rp-wasm/{{- vars.a_rp_wasm_short -}}
{%- else -%}
{{- vars.mise_data_dir -}}/installs/http-rp-wasm/{{- vars.a_rp_wasm_short -}}
{%- endif %}'''

[env]
# Comma-separated list of every language env (one per .mise/config.<lang>.toml).
# Used as MISE_ENV by the *-all tasks to act on every language at once (mise has
# no MISE_ENV=all). Hardcoded rather than shell-discovered so it works on Windows
# too -- keep in sync when adding/removing a config.<lang>.toml.
ALL_LANGS = "dart,dotnet,java,js,python,r,rust,zig"
CLIPPY_CONF_DIR = "{{ config_root }}/config"
TAPLO_CONFIG = "{{ config_root }}/config/taplo.toml"
# augtool's lens search path is compile-time pinned to the build-time --prefix.
# That --prefix (i.e. the GHA runner's $RUNNER_TEMP) means a freshly mise-installed augtool can't find
# Toml.lns. Point it at the bundled lens dir in our tarball; the version segment is the [tools."http:augeas"]
# pin -- bump them together. (A binary-self-locate patch in the jayvdb/augeas `win` branch is the proper
# fix; until then, this.)
AUGEAS_LENS_LIB = "{{ vars.mise_data_dir }}/installs/http-augeas/1.14.1/share/augeas/lenses"
# Use the conda:openssl install for Rust's OPENSSL_DIR so openssl-sys crate builds.
OPENSSL_DIR = "{{ vars.conda_openssl }}"

# pyo3-ffi (et-ws-pyo3-runner) links its embedded interpreter at build time.
# It links from PYO3_PYTHON, else the first python on PATH -- under mise that's the 32-bit Pyodide shim
# ("target architecture (64-bit) does not match ... (32-bit)"). Pin it to the mise-managed CPython.
# Always-loaded so `cargo check --workspace` builds the pyo3 runner without MISE_ENV=python. This is the
# Linux/macOS path; config.windows.toml overrides it with py3_win.
PYO3_PYTHON = "{{ vars.py3_unix }}"
RCLONE_CONFIG = "{{ config_root }}/config/rclone.ini"
RCLONE_RETRIES = "1"
# Make a bare `rg` search the tracked hidden dirs (esp. `.mise/`) instead of skipping them. See the config file.
RIPGREP_CONFIG_PATH = "{{ config_root }}/config/ripgrep.rc"

# Scope to the wasm32 target only.
# The env value is honoured by every `wasm-pack`/`cargo` invocation that targets wasm32-unknown-unknown but
# doesn't leak to host builds (e.g. wasm-pack's auto-install of wasm-bindgen-cli would otherwise reject
# `target-cpu=mvp` for the host). Hoisted from `[tasks.build-ws-wasm-agent.env]` to workspace [env]
# because a task-level env override on Windows made mise's child-env composition drop the `%LOCALAPPDATA%\mise\shims`
# dir from PATH, so `'wasm-pack' is not recognized` in the cmd subprocess. Captured at
#   https://github.com/edge-toolkit/core/actions/runs/27798859316/job/82264573380
# on 3a1e0c84.
CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS = "{{ vars.wasm_rustflags }}"

# Direct ort-sys (workspace `ort` dep) at the mise-staged ONNX Runtime install.
# That install is github:microsoft/onnxruntime above, used instead of fetching at build time. The
# workspace dep dropped the `download-binaries` feature, so SKIP_DOWNLOAD is
# belt-and-braces (the download code path is gone).
ORT_LIB_LOCATION = "{% if os() == 'windows' %}{{ vars.ort_loc_win }}{% else %}{{ vars.ort_loc_unix }}{% endif %}"
ORT_SKIP_DOWNLOAD = "1"

[tasks]
ec = "ec"
editorconfig-check = "ec"

[tasks.dprint-check]
env = { DPRINT_CACHE_DIR = "{{ config_root }}/target/dprint-cache" }
run = "dprint check"

[tasks.dprint-fmt]
run = "dprint fmt"

[tasks.jq-fmt]
description = "Format every checked-in .jq file with jqfmt (in-place)"
# jqfmt prints the formatted body to stdout (no -w flag).
# Pipe it through goawk to strip the trailing space jqfmt's `-op pipe` mode leaves at the
# end of each broken-pipe line, then rewrite via tmp + rename.
# NOTE: jqfmt strips leading/trailing `#` comments -- if a .jq file has docstring-style header comments
# worth keeping, lift them into the calling task / source-of-truth file before running this.
run = """
git ls-files '*.jq' | while read -r f; do
  jqfmt -f "$f" -op pipe -ob -ar | goawk '{ sub(/[ \\t]+$/, ""); print }' > "$f.tmp"
  coreutils mv "$f.tmp" "$f"
done
"""
shell = "bash -euo pipefail -c"

[tasks."fmt:rust"]
# Rust + universal formatters. Always-loaded, so `fmt`'s glob always matches it.
depends = ["cargo-clippy-fix", "cargo-fmt", "dprint-fmt", "jq-fmt", "taplo-fmt"]
description = "Run the Rust + universal repo-wide formatters"

[tasks.fmt]
# Native `depends` glob (not a nested `mise run`) so it works on Windows.
# It activates each task's tools. fmt:rust is always loaded, so the glob never
# matches zero (which mise would error on); guest fmt:<lang> join when loaded.
depends = ["fmt:*"]
description = "Run all formatters: fmt:rust + any loaded guest fmt:<lang>"

[tasks."check:rust"]
# Rust + universal repo-wide checks.
# Lives in the always-loaded default config,
# so `check`'s `check:*` glob always matches at least this one (Rust is in the
# default config this pass; the guest `check:<lang>` tasks come from their
# loaded MISE_ENV configs).
depends = [
  "action-validator-check",
  "actionlint-check",
  "ast-grep-check",
  "cargo-check",
  "cargo-clippy-check",
  "cargo-doc-check",
  "cargo-fmt-check",
  "conftest-check",
  "dockerignore-check",
  "dprint-check",
  "editorconfig-check",
  "gen-help-all",
  "gen-help-check",
  "gen-specs-check",
  "hadolint-check",
  "link-check",
  "ls-lint-check",
  "readme-mise-version-check",
  "regal-check",
  "ryl-check",
  "semgrep-check",
  "shellcheck-mise-check",
  "taplo-check",
  "taplo-fmt-check",
  "typos-check",
  "verification-check",
  "zizmor-check",
]
description = "Run the Rust + universal repo-wide checks"

[tasks.check]
# Native `depends` glob over check:rust + every loaded guest check:<lang>.
# They run as parallel siblings (all report, none gated), with each task's tools activated. check:rust is
# always loaded so the glob never matches zero. (Avoid a nested `mise run 'check:*'` -- that breaks tool
# activation and the `[env]` exec on Windows.)
depends = ["check:*"]
description = "Run all checks: check:rust + any loaded guest check:<lang>"

[tasks."fix:rust"]
# Rust + universal lint-fix passes.
# Distinct from fmt:rust (style/whitespace
# formatters) -- these apply auto-rewrites for actual lint violations.
depends = ["ast-grep-fix", "cargo-clippy-fix", "regal-fix", "semgrep-fix", "typos-fix"]
description = "Apply Rust + universal lint-fix passes"

[tasks.fix]
# Same glob shape as fmt/check.
# fix:rust is always loaded, so the glob never
# matches zero; guest fix:<lang> tasks join when their MISE_ENV is loaded.
depends = ["fix:*"]
description = "Apply all lint-fix passes: fix:rust + any loaded guest fix:<lang>"

[tasks.action-validator-check]
description = "Validate GitHub Actions workflow + composite-action YAML"
run = "action-validator .github/workflows/*.yaml .github/actions/*/action.yaml"

[tasks.actionlint-check]
description = "Lint GitHub Actions workflows (actionlint): local-action input validation, expression syntax, shellcheck"
# Lint every workflow with actionlint's native checks plus its shellcheck integration over each `run:` script.
# shellcheck is a mise [tool], so it is on PATH here and actionlint auto-detects and invokes it (except under
# the Windows vars.actionlint_args override). The most load-bearing native rule is `[action]`, which fails
# when a workflow step passes a `with:` key the referenced local action does not declare (GHA itself only
# warns). actionlint lints workflows only, so it does NOT see composite-action -> action calls; the gha_uses
# conftest rule covers that direction. Intentional word-splitting sites carry an inline
# `# shellcheck disable=SC2086` directive in the run script, as the mise-task bodies do.
run = "actionlint {{ vars.actionlint_args }} .github/workflows/*.yaml"

[tasks.zizmor-check]
description = "Audit GitHub Actions workflows + composite actions for security issues (zizmor)"
# --offline so it needs no GH token and stays deterministic.
# config/zizmor.yaml turns off the hash-pin policy (we pin actions by tag, not commit).
run = "zizmor --offline --no-progress -c config/zizmor.yaml .github/workflows .github/actions"

[tasks.ls-lint-check]
description = "Lint file and directory naming conventions (ls-lint)"
run = "ls-lint --config config/ls-lint.yaml"

[tasks.ast-grep-check]
# --no-ignore hidden so the gha-* YAML rules reach .github/workflows.
# ast-grep skips dot-dirs by default; gitignored paths like target/ stay skipped.
description = "Run ast-grep structural-search rules"
run = "ast-grep scan --error --no-ignore hidden -c config/ast-grep/sgconfig.yaml"

[tasks.ast-grep-fix]
description = "Apply autofix for ast-grep rules that define a `fix:` field"
run = "ast-grep scan --update-all --no-ignore hidden -c config/ast-grep/sgconfig.yaml"

[tasks.semgrep-check]
description = "Run Semgrep generic-mode rules (e.g. Cargo.toml style)"
run = "semgrep scan --config config/semgrep --error --metrics=off ."

[tasks.semgrep-fix]
description = "Apply autofix for Semgrep rules that define a `fix:` field"
run = "semgrep scan --config config/semgrep --autofix --metrics=off ."

[tasks.hadolint-check]
description = "Lint the Dockerfiles with hadolint"
run = "git ls-files '*Dockerfile' '*Dockerfile.*' | xargs hadolint --config config/hadolint.yaml"

[tasks.cargo-check]
run = "cargo check --workspace {{ vars.cargo_ws_excludes }}"

[tasks.cargo-fmt]
run = "cargo +nightly fmt"

[tasks.cargo-fmt-check]
run = "cargo +nightly fmt -- --check"

[tasks.cargo-clippy-check]
alias = ["cargo-clippy", "clippy", "clippy-check"]
run = "cargo clippy --keep-going --workspace --tests {{ vars.cargo_ws_excludes }}"

[tasks.cargo-clippy-check-pkg]
alias = ["clippy-pkg"]
description = "cargo clippy on a single workspace package (narrow inner-loop check)"
# Same flags as cargo-clippy-check minus --workspace.
# Usage-spec captures the package name and exposes it as $usage_package; a missing arg fails up front with
# mise's auto-generated usage message instead of clippy's generic "--package <SPEC> not found" error.
run = 'cargo clippy --keep-going --tests -p "$usage_package"'
usage = 'arg "<package>" help="Workspace package name (e.g. edge-toolkit)"'

[tasks.cargo-doc-check]
description = "Type-check rustdoc with -D warnings to fail on any doc issues"
# Uses nightly rustdoc's `--check` (gated behind -Z unstable-options).
# The task runs the front-end -- intra-doc link resolution + doc-comment type-check -- but skips HTML
# emission. No `target/doc/` churn; faster than a full doc build. Nightly is already in [tools] for
# `cargo +nightly fmt`. Drop `-Z unstable-options --check` and switch back to plain `cargo doc` once
# rustdoc stabilises `--check`.
env = { RUSTDOCFLAGS = "-Z unstable-options --check -D warnings" }
run = "cargo +nightly doc --keep-going --workspace --no-deps --document-private-items {{ vars.cargo_ws_excludes }}"

[tasks.cargo-clippy-fix]
run = "cargo clippy --fix --allow-dirty --allow-staged --keep-going --workspace --tests {{ vars.cargo_ws_excludes }}"

[tasks.taplo-fmt]
alias = "toml-fmt"
run = "taplo format"

[tasks.taplo-fmt-check]
alias = "toml-fmt-check"
run = "taplo format --check"

[tasks.conftest-check]
depends = ["conftest-check-*"]
description = "Run all conftest policy checks (one per parsed file format)"

[tasks.conftest-check-toml]
description = "Run conftest OPA/Rego policies over the TOML config + lock files"
# --combine feeds every listed file to one policy evaluation.
# It arrives as an array of {path, contents}, so a policy can both check each file and compare across
# files (the mise wasm-bindgen pin vs Cargo.lock; the .mise/config*.toml *_asset vars vs
# config/upstream-cache/data.toml). --parser toml: Cargo.lock has no .toml suffix. The TOML rule
# namespaces are listed explicitly, so the per-file `gha` (YAML) namespace is never evaluated against this
# combined TOML input.
run = """
ns_list="cross cargo mise pyproject no_trailing_backslash checksums"
# $ns_list iteration relies on word-splitting; $ns expands to repeated `--namespace <n>` pairs.
# shellcheck disable=SC2086
ns=$(for n in $ns_list; do echo -n " --namespace $n"; done)
# shellcheck disable=SC2086
git ls-files '*Cargo.toml' '.mise/config*.toml' '*pyproject.toml' Cargo.lock config/upstream-cache/data.toml |
  xargs conftest test --combine --parser toml $ns -p config/conftest/policy
"""
shell = "bash -euo pipefail -c"

[tasks.conftest-check-yaml]
description = "Run conftest OPA/Rego policies over the GitHub Actions workflow + action YAML"
# Three passes over the workflow + action YAML.
# per-file rules (gha, no_trailing_backslash) over workflow YAML; --combine rules (gha_combined) over
# workflow YAML for cross-cutting invariants where the rule has to compare each workflow's parsed body
# against its own filename (the `paths:` self-reference check; conftest's per-file mode has no `input.path`);
# gha_action over the composite actions under .github/actions/*/action.yaml (different schema, so its
# own namespace); gha_mise over the workflow YAML combined with .mise (auto-detected parsers) so a rule can
# cross-check a hard-coded action-input version against the matching mise [tools] pin (setup-dotnet's
# dotnet-version vs the `dotnet` pin); and gha_uses over the workflow YAML combined with the composite actions so a
# rule can resolve each `uses: ./.github/actions/<name>` against that action's declared `inputs:` (GHA only warns on
# an undeclared input key, silently dropping the value).
run = """
ns="--namespace gha --namespace no_trailing_backslash"
# $ns expands to repeated `--namespace <n>` pairs; word-splitting is intentional.
# shellcheck disable=SC2086
conftest test --parser yaml $ns -p config/conftest/policy .github/workflows
conftest test --parser yaml --combine --namespace gha_combined -p config/conftest/policy .github/workflows
conftest test --parser yaml --namespace gha_action -p config/conftest/policy .github/actions/*/action.yaml
conftest test --combine --namespace gha_mise -p config/conftest/policy .github/workflows .mise
conftest test --parser yaml --combine --namespace gha_uses -p config/conftest/policy .github/workflows .github/actions
"""
shell = "bash -euo pipefail -c"

[tasks.conftest-check-dockerfile]
description = "Cross-check Dockerfiles against mise [tools] pins + heredoc body-first-line invariants"
# Two passes over each Dockerfile.
#   1. `dockerfile` parser (default) for AST-shape rules: version drift, pipx-disable, RUN heredoc must invoke bash.
#      Combined with .mise so the AST rules can compare against [tools] pins.
#   2. `ignore` parser, which preserves every line of the file as a separate entry -- conftest's dockerfile parser
#      flattens heredoc bodies out of the AST, so the body-first-line `set -euo pipefail` check lives in its
#      own namespace + parser.
# Each git-tracked Dockerfile* gets both passes, except that the `ignore` pass only visits Dockerfiles that
# actually contain heredocs: conftest 0.68.2's ignore parser panics with `runtime error: slice bounds out of
# range` on plain Dockerfiles (no heredocs), and the body-first-line rule has nothing to check there anyway.
run = """
files=$(git ls-files '*Dockerfile' '*Dockerfile.*')
# $files is a newline-separated path list; word-splitting is intentional (no spaces in paths).
# shellcheck disable=SC2086
conftest test --combine --namespace dockerfile -p config/conftest/policy $files .mise
# Filter to Dockerfiles that actually use heredocs before the `ignore` parser.
for f in $files; do
  if rg -q '^RUN[^\n]*<<' "$f"; then
    conftest test --parser ignore --namespace dockerfile_heredoc -p config/conftest/policy "$f"
  fi
done
"""
shell = "bash -euo pipefail -c"

[tasks.regal-check]
description = "Lint Rego policy files with Regal (style, idiomatic, bugs)"
# config/regal.yaml carves out conftest-specific patterns.
# These are multiple `deny` rules per file, cross-package data references, no OPA entrypoints.
run = "regal lint -c config/regal.yaml config/conftest/policy/"

[tasks.regal-fix]
description = "Auto-fix the regal violations that have an auto-fixer (e.g. opa-fmt)"
run = "regal fix -c config/regal.yaml config/conftest/policy/"

[tasks.shellcheck-mise-check]
description = "shellcheck every bash-shell mise task body across .mise/config*.toml"
# Extract each multi-line bash-shell task body and shellcheck it in isolation.
# For each `[tasks.X] run = """..."""` whose `shell` starts with bash and whose `run` is multi-line, drop
# it into target/scratch/shellcheck-mise/ with a synthetic shebang + `set -euo pipefail`, then shellcheck
# the lot. Tera tokens `{{ ... }}` are masked to `MISEVAR` (a valid bash word) and `{% ... %}` to empty so
# shellcheck doesn't choke on template syntax. The awk regex uses character classes (`[{][{]` not `{{`) so
# mise's own Tera render of this task body doesn't itself trip on the awk source. The jq filter at
# .mise/shellcheck-mise.jq emits one `<name> <body-b64>` line per eligible task (base64 so newlines +
# quotes survive the pipe). goawk emits CRLF on Windows, so `tr -d '\r'` normalises each generated script
# back to LF (a no-op on Unix) -- without it shellcheck flags every body with SC1017 (literal carriage return).
run = '''
boot="{{ vars.config_root_fwd }}/target/scratch/shellcheck-mise"
coreutils rm -rf "$boot"
coreutils mkdir -p "$boot"
mask='{ gsub(/[{][{][^}]*[}][}]/, "MISEVAR"); gsub(/[{][%][^%]*[%][}]/, ""); print }'
for cfg in .mise/config*.toml; do
  stem=$(coreutils basename "$cfg" .toml)
  yq -p toml -o json "$cfg" | jaq -r -f .mise/shellcheck-mise.jq | while read -r name b64; do
    out="$boot/${stem}__${name}.sh"
    {
      echo '#!/usr/bin/env bash'
      echo 'set -euo pipefail'
      printf '%s' "$b64" | coreutils base64 -d | goawk "$mask"
    } | coreutils tr -d '\r' > "$out"
  done
done
shellcheck --shell=bash --exclude=SC2034,SC2154 "$boot"/*.sh
'''
shell = "bash -euo pipefail -c"

[tasks.taplo-check]
alias = "toml-check"
# `taplo lint` reads config/taplo.toml's `[[rule]] schema` entries.
# It uses them for editor / LSP-style validation, but silently ignores their nested constraints in CLI
# mode (verified: injecting `path = "../foo"` into a member Cargo.toml doesn't fire `no-path-deps` via the
# rule alone). We work around it by applying each schema explicitly with `taplo lint --schema file://...`.
# conftest-check-toml (config/conftest/policy) intentionally duplicates these lints; running both is fine.
run = """
taplo lint

# The --schema lints need a file:// URL, built cross-platform as file:///${PWD#/}.
# taplo rejects a bare path. On Linux $PWD is /abs, so the form yields file:///abs; on Windows $PWD is C:/dir
# (forward slashes, from busybox), yielding file:///C:/dir. A plain file://$PWD puts the drive letter in the
# URL authority and breaks on Windows. conftest-check-toml duplicates these lints as a cross-check.

# All member Cargo.tomls -- exclude workspace root and any build output.
# `-prune` target/ and .git so find never descends into them: `-not -path` alone still walks the whole
# tree, and target/debug/deps/ churns constantly under a concurrent `cargo-check`, racing find into
# "No such file" errors. POSIX sh (no bash arrays / process substitution -- the tasks run on busybox ash
# on Windows): collect the paths into a temp file once and feed each schema run via xargs.
members="$(mktemp)"
trap 'rm -f "$members"' EXIT
find . -path ./target -prune -o -path ./.git -prune -o -name Cargo.toml ! -path ./Cargo.toml -print >"$members"

# Banned deps only need to be checked at the workspace root.
# Member crates are required to reference deps via `workspace = true` (the `require-workspace-deps` schema
# below), so any banned dep can only enter the build through `[workspace.dependencies]` here.
taplo lint --schema "file:///${PWD#/}/config/taplo/no-banned-deps.schema.json" Cargo.toml

# Schemas that apply to every member crate.
xargs taplo lint --schema "file:///${PWD#/}/config/taplo/no-path-deps.schema.json" <"$members"
xargs taplo lint --schema "file:///${PWD#/}/config/taplo/no-wildcard-or-git-deps.schema.json" <"$members"
xargs taplo lint --schema "file:///${PWD#/}/config/taplo/require-workspace-deps.schema.json" <"$members"
xargs taplo lint --schema "file:///${PWD#/}/config/taplo/require-lib-doctest-false.schema.json" <"$members"
xargs taplo lint --schema "file:///${PWD#/}/config/taplo/no-lib-name.schema.json" <"$members"

# `require-lints-section` exempts generated/rust-rest/Cargo.toml.
# It is exempted because progenitor's emitted `src/lib.rs` contains patterns our workspace lint table
# flags (e.g. doc-comment shapes that trip rustdoc's invalid-code-block lint). Inheriting `[lints] workspace = true`
# would fail the build on the generated source. The exemption is about the lint table, not about the
# deps -- its `[dependencies]` still inherits from `[workspace.dependencies]` like every other crate.
rg -vxF './generated/rust-rest/Cargo.toml' "$members" |
  xargs taplo lint --schema "file:///${PWD#/}/config/taplo/require-lints-section.schema.json"

taplo lint --schema "file:///${PWD#/}/config/taplo/mise-run-not-array.schema.json" .mise/config*.toml

taplo lint --schema "file:///${PWD#/}/config/taplo/mise-no-ubi-backend.schema.json" .mise/config*.toml
# config.maint.toml is exempted from the cargo:-backend allowlist.
# One-off maint tools can be slow cargo source-builds; see mise.rego's matching note.
non_maint=$(find .mise -maxdepth 1 -name 'config*.toml' ! -name 'config.maint.toml')
# $non_maint holds a space-separated path list; word-splitting is intentional.
# shellcheck disable=SC2086
taplo lint --schema "file:///${PWD#/}/config/taplo/mise-cargo-backend-allowlist.schema.json" $non_maint
"""
shell = "bash -euo pipefail -c"

[tasks.readme-mise-version-check]
# Keep the README's stated minimum mise version in sync with the enforced `min_version` in .mise/config.toml.
# No structural linter spans a markdown prose value and a TOML value, so this is a small goawk/coreutils compare.
description = "Fail if README.md's mise version differs from min_version in .mise/config.toml"
run = """
# README.md is excluded from the docker build context, so it is absent when `check` runs inside an image.
# gen:dockerignore adds /README.md. Skip there -- the native check lanes (which have README.md) enforce the sync.
if [ ! -f README.md ]; then
  echo "readme-mise-version-check: README.md absent (docker build context); skipping -- native lanes enforce it"
  exit 0
fi
config_version="$(goawk -F'"' '/^min_version/{print $2; exit}' .mise/config.toml)"
# shellcheck disable=SC2016 # $0/RSTART/RLENGTH are awk fields, not shell vars -- single quotes are intended
readme_prog='/ or later/ && match($0,/[0-9]{4}\\.[0-9]+\\.[0-9]+/){print substr($0,RSTART,RLENGTH);exit}'
readme_version="$(goawk "$readme_prog" README.md)"
if [ "$config_version" != "$readme_version" ]; then
  echo "README mise version ($readme_version) != .mise/config.toml min_version ($config_version)" >&2
  exit 1
fi
"""
shell = "bash -euo pipefail -c"

[tasks.typos-check]
alias = "typos"
run = "typos --config config/typos.toml"

[tasks.typos-fix]
description = "Auto-correct typos detected by the typos linter"
run = "typos --config config/typos.toml --write-changes"

# Part of the `check` aggregate.
# lychee makes live network requests, so config/lychee.toml is tuned (retries, 429-tolerance, disk cache)
# to keep it from being flaky. Checks every URL in the repo's Markdown + Rust sources; lychee extracts
# URLs from .rs comments and string literals too.
[tasks.link-check]
description = "Check that URLs in .md and .rs files are reachable (network)"
# The .rs glob is scoped to the source dirs, not a bare `**/*.rs`.
# A recursive `**/*.rs` walks target/'s churning rustc temp files, and lychee expands globs before applying
# `exclude_path`, so it aborts with a GlobError when one of those temps vanishes mid-iteration.
run = "lychee --config config/lychee.toml '**/*.md' 'libs/**/*.rs' 'services/**/*.rs' 'utilities/**/*.rs'"

[tasks.ryl-check]
description = "Lint YAML with ryl (a yamllint-compatible Rust linter)"
run = "ryl -c config/ryl.yaml .github config"

[tasks.setup-aube]
# Install the npm: backend ahead of the main `mise install`.
# aube is a mandatory `[tools]` entry, so `mise install` would fetch it anyway; this task exists purely for
# ordering. mise resolves tools concurrently and gives no guarantee that aube lands before the `npm:*` tools that
# invoke it as their package manager, and a tool whose backend binary isn't there yet fails outright. CI runs this
# first so the ordering is explicit rather than incidental.
#
# The tera branch picks the platform's backend: aqua ships aube for linux/macos-arm64/windows, macos/x64 has no
# aqua asset and takes cargo:aube. Versions come from the `[tools]` pins, so no `@version` here.
description = "Install the aube npm backend ahead of the npm: tools"
run = """
{% if os() == "macos" and arch() == "x64" %}
mise install cargo:aube
{% else %}
mise install aube
{% endif %}
"""
shell = "bash -euo pipefail -c"

[tasks._setup_all]
description = "Private shared cross-platform preinstall"
hide = true
run = """
# gpg must land BEFORE `mise install node` below.
# node's gpg-verify path (mise/src/plugins/core/node.rs) hard-fails when gpg_verify is enabled and gpg
# isn't reachable. Per-platform package: conda:gnupg on Linux/macOS (conda-forge has no win-64 build),
# conda:m2-gnupg on Windows (msys2 mirror package; config.windows.toml adds its bin to `_.path` so
# subprocess PATH picks up gpg.exe -- otherwise mise's per-tool .mise-bins misses the nested `Library/usr/bin` layout).
{% if os() == 'windows' %}mise install conda:m2-gnupg{% else %}mise install conda:gnupg{% endif %}
mise install gh
mise install cargo-binstall
mise install node
mise install conda:openssl
mise install coreutils
mise install ripgrep
# goawk lands here in _setup_all so it's available to every later step.
# Steps that may need `awk` -- third-party scripts (dotnet-install.sh on Linux, others) hard-code bare
# `awk`, and the per-OS preinstalls below symlink mise's `goawk` into `awk` on hosts where the base image
# lacks one (Azure Linux base/core notably). Installing here, not in the per-OS preinstall body, keeps the
# `mise which goawk` call those use guaranteed to resolve.
mise install github:benhoyt/goawk
# rclone is used by the rustpython pipx bootstrap in config.windows.toml's preinstall.
# That preinstall runs before the main `mise install` pass. Land it here in _setup_all so the bootstrap
# doesn't trip with `rclone: command was not found`.
mise install rclone
"""
shell = "bash -euo pipefail -c"

[tasks.osv-scanner-check]
# Scans every committed lockfile across languages for known vulnerabilities.
# The scanned set is vars.osv_locks. No build dependency, so the same task serves both ad-hoc local use and the
# dependencies workflow.
alias = "osv-scanner"
run = "osv-scanner {{ vars.osv_locks }} --config config/osv-scanner.toml"

[tasks."gen:osv-scanner"]
description = "Regenerate config/osv-scanner.toml from config/deny.toml's [advisories].ignore list"
# osv-scanner and cargo-deny must ignore the same advisory IDs.
# config/deny.toml is the source of truth (it carries the per-ID rationale). rg + coreutils only, so
# the `dependencies` workflow can run it (via mise) next to the audit binaries. Both RUSTSEC-YYYY-NNNN and
# GHSA-xxxx-xxxx-xxxx ids are extracted, so a GHSA-only advisory (one RustSec hasn't assigned) still filters.
run = """
{
  # backticks in the echoed line are literal markdown, not command substitution.
  # shellcheck disable=SC2016
  echo '# AUTO-GENERATED from config/deny.toml by `mise run gen:osv-scanner`.'
  echo 'IgnoredVulns = ['
  rg -oN -r '  { id = $0 },' '"(RUSTSEC-[0-9]{4}-[0-9]{4}|GHSA(-[0-9a-z]{4}){3})"' config/deny.toml | coreutils sort -u
  echo ']'
} > config/osv-scanner.toml
"""
shell = "bash -euo pipefail -c"

[tasks.cargo-deny-check]
description = "Audit dependencies with cargo-deny (advisories, bans, licenses, sources)"
# Escalate `no-license-field` to a hard error, except where clarify-allowlisted.
# The exception is crates with an explicit clarify entry in config/deny.toml. cargo-deny has no per-crate
# diagnostic-level config, so we post-filter its output: any `warning[no-license-field]` whose crate isn't
# allowlisted (currently just `saffron`) fails the task. A new transitive dep without an SPDX `license`
# expression must then land in clarify intentionally, not silently.
run = """
rc=0
out="$(cargo deny --config config/deny.toml check 2>&1)" || rc=$?
echo "$out"
extra="$(echo "$out" | rg 'warning\\[no-license-field\\]' | rg -v 'saffron' || true)"
if [ -n "$extra" ]; then
  echo "ERROR: no-license-field warning for crate not in clarify allowlist:" >&2
  echo "$extra" >&2
  exit 1
fi
exit "$rc"
"""
shell = "bash -euo pipefail -c"

[tasks.cargo-unmaintained-check]
description = "Flag dependencies whose upstream repo is archived or unmaintained"
# cargo-unmaintained is deliberately NOT a mise [tool].
# It has no prebuilt and a from-source `cargo install` is too heavy to pay on every `mise install`. The
# `dependencies` workflow installs it via taiki-e/install-action; this task just runs the binary so the
# audit command lives beside the others. cargo-unmaintained needs a GitHub token to check each upstream
# repo's archival status: the CI workflow already sets GITHUB_TOKEN, so the `:=` default is a no-op there;
# locally (where the env var is unset) it falls back to `gh auth token`, so a dev never has to export one by
# hand. `set -u` is satisfied because `${VAR:=...}` assigns before the reference.
run = """
: "${GITHUB_TOKEN:=$(gh auth token)}"
export GITHUB_TOKEN
cargo unmaintained
"""
shell = "bash -euo pipefail -c"

[tasks."gen:dockerignore"]
description = "Regenerate .dockerignore from .gitignore + Docker-only excludes"
# Docker reads only the root .dockerignore (never .gitignore or nested ignore files).
# A bare pattern there is root-anchored -- whereas a slash-less .gitignore pattern matches at any depth.
# So mirror .gitignore, add the Docker-only excludes (`.git/`, plus the build recipe + docs so editing
# them doesn't bust the `COPY . .` cache), and `**/`-prefix each non-anchored pattern.
# goawk emits CRLF on Windows, so the whole block is piped through `tr -d '\r'` -- .dockerignore must stay
# LF-only (editorconfig enforces it, and CRLF would also make dockerignore-check see a spurious diff).
run = '''
{
  echo "# AUTO-GENERATED from .gitignore by 'mise run gen:dockerignore' -- do not edit."
  echo "# Docker reads only this file; patterns are **/-prefixed to match at any depth"
  echo "# like .gitignore. Edit .gitignore and regenerate."
  echo
  {
    cat .gitignore
    printf '%s\n' '.git/' 'Dockerfile*' '/README.md' '.dockerignore'
  } | goawk '
    /^[[:space:]]*#/ { print; next }
    /^[[:space:]]*$/ { print; next }
    {
      neg = ""; line = $0
      if (substr(line, 1, 1) == "!") { neg = "!"; line = substr(line, 2) }
      if (substr(line, 1, 1) == "/") { print neg substr(line, 2); next }
      core = line; sub(/\/$/, "", core)
      if (index(core, "/") > 0) print neg line; else print neg "**/" line
    }
  '
} | coreutils tr -d '\r' >.dockerignore
'''
shell = "bash -euo pipefail -c"

[tasks.dockerignore-check]
depends = ["gen:dockerignore"]
description = "Fail if .dockerignore is stale vs .gitignore (run `mise run gen:dockerignore`)"
run = "git diff --exit-code -- .dockerignore"

[tasks.prefetch-ci]
# `build-ws-wasm-agent` produces `services/ws-wasm-agent/pkg/`.
# The static workspace references it via a `link:` path. Run it before `pnpm install` so the link target
# exists. Only `fetch-mnist-rclone` is pulled here -- CI tests don't exercise the face1 / har-motion1
# models, and skipping those avoids the HuggingFace rate-limit that bites Windows runners.
#
# `prefetch:rust` + `prefetch:node` live in this default config (always loaded), so the `prefetch:*` glob
# never matches zero; guest-language `prefetch:<lang>` tasks join from their loaded MISE_ENV configs.
# Native `depends` glob (not a nested `mise run`) so each task's tools are activated -- a nested run left
# `dart`/`zig` off PATH on Windows.
depends = ["fetch-mnist-rclone", "prefetch:*"]
description = "Pre-download CI-required dependencies + the MNIST model"

[tasks.prefetch]
# "dprint-check" is here to trigger download of the dprint plugin WASM files.
depends = ["dprint-check", "fetch-eye1-rclone", "fetch-face1-rclone", "fetch-har-motion1-rclone", "prefetch-ci"]
description = "Pre-download all dependencies and models (superset of prefetch-ci)"

[tasks."prefetch:rust"]
description = "Prefetch the Rust (cargo) dependencies"
# `cargo fetch` downloads the full Cargo.lock graph (all targets) without compiling.
# The actual build happens in build-modules / the test step. Avoids
# the redundant `cargo check --workspace` compile (and its large target/ dir).
#
# `shell = "bash"` is load-bearing on Windows: as a base-config task, mise's child-cmd PATH composition
# drops the shim-dir / `~/.cargo/bin` entries (the same dropout the build-et-cli task uses `shell = "bash"`
# to avoid). Captured on 3ac0d60b, windows job 82277109482 -- bare `cargo` resolved via pwsh `where.exe`
# in the parent step but the cmd subprocess mise spawned didn't see it. Bash (ash via MISE_BASH_PATH on
# Windows) inherits the right PATH.
run = "cargo fetch"
shell = "bash -euo pipefail -c"

[tasks.build-ws-wasm-agent]
description = "Build the WebSocket WASM client"
dir = "services/ws-wasm-agent"
# {{ vars.no_opt }} is --no-opt on Windows (wasm-opt can't run on Nano), empty elsewhere.
# The served, size-optimised artifact is built on Linux/macOS. Stable toolchain build: drops the nightly
# `-Z build-std=std,panic_abort`. Without build-std the precompiled std doesn't get the mvp target-feature
# treatment, but the agent doesn't need that for correctness. Lives in the global config (not config.rust.toml)
# so other globally-loaded tasks -- prefetch-ci's transitive deps via `prefetch:node` -- can reference it
# without forcing `rust` into MISE_ENV. `shell = "bash"` for the same base-config PATH-dropout reason
# `prefetch:rust` carries it.
run = "wasm-pack build . --target web {{ vars.no_opt }}"
shell = "bash -euo pipefail -c"

[tasks."prefetch:node"]
# Needs `build-ws-wasm-agent` first.
# The static member `link:`s its `pkg/`, so the link target must exist before `pnpm install`.
depends = ["build-ws-wasm-agent"]
description = "Prefetch the Node (pnpm) workspace"
# pnpm refuses non-TTY destructive node_modules cleanup unless CI=true.
# That cleanup fires when an earlier install left a different layout. Treat as a CI batch.
env = { CI = "true" }
# Installs the whole workspace from the repo root, so no --dir.
# The members come from pnpm-workspace.yaml and the resolution lands in the single root pnpm-lock.yaml.
run = "pnpm install --ignore-scripts --config.ignoredBuiltDependencies=protobufjs"
# `shell = "bash"` on Windows for the same base-config-task PATH dropout.
# Same dropout as `prefetch:rust` and `build-et-cli` -- cmd subprocess can't find pnpm. Captured on
# 3ac0d60b windows test job 82282265424 (after the prefetch:rust fix, the same failure surfaced one step
# downstream in prefetch:node).
shell = "bash -euo pipefail -c"

[tasks.regenerate-verification]
alias = "regen-verification"
description = "Regenerate checked-in verification output files"
run = "cargo run -p et-cli -- regen-verification"

[tasks.verification-check]
depends = ["regenerate-verification"]
description = "Fail if generated scenario output files are stale"
run = "git diff --exit-code -- verification/"

# HELP.md for each clap-using utility under utilities/.
# Each crate has an optional `markdown-help` feature that gates a hidden `--markdown-help` flag;
# `cargo run --features markdown-help -p <name> -- --markdown-help` prints a full clap-tree markdown
# rendering. gen-help-all regenerates every HELP.md; gen-help-check diffs the committed files against
# fresh output. The pattern mirrors pep257-rs's HELP.md flow. It must run after regenerate-verification
# as they use different features, and they can race, invoking the wrong binary, without the required
# feature.
[tasks.gen-help-all]
depends = ["cargo-check", "cargo-clippy-check", "cargo-doc-check", "regenerate-verification"]
description = "Regenerate HELP.md for every clap-using utility under utilities/"
run = """
for crate in et-cli et-int-gen et-onnx; do
  helpmd="utilities/${crate#et-}/HELP.md"
  echo "[gen-help-all] $crate -> $helpmd"
  cargo run --features markdown-help -q -p "$crate" -- --markdown-help | dprint fmt --stdin md > "$helpmd"
done
"""
shell = "bash -euo pipefail -c"

[tasks.gen-help-check]
depends = ["gen-help-all"]
description = "Fail if any utility's checked-in HELP.md is stale vs the clap tree"
run = "git diff --exit-code -- utilities/*/HELP.md"

[tasks.fetch-wit-deps]
description = "Fetch upstream WASI WIT packages into generated/specs/wit/ at pinned versions (run by hand on bumps)"
run = "cargo run -q -p et-int-gen --bin et-int-gen -- fetch-deps"

[tasks."gen:ws-spec"]
description = "Run et-int-gen: emit the language-agnostic WS specs (YAML/WIT/KDL/JSON) + the Rust REST client"
# et-int-gen runs progenitor + prettyplease to produce generated/rust-rest/src/lib.rs.
# prettyplease's style disagrees with our nightly rustfmt (different import grouping + line width), so
# the workspace `mise run fmt` would reformat it and `mise run gen-specs-check` would see drift on the
# next regen. Make rustfmt the canonical formatter by running it here as a post-process -- the committed
# file is then a fixed point of both tools.
#
# `generate core` emits the language-agnostic specs every per-language `gen:*` task consumes (ws.kdl,
# *.schema.json, rest.yaml), so this task stays in the always-loaded default config (its `gen:` name also
# anchors the `gen:*` glob) and every `gen:<lang>` depends on it. The Zig client (`gen:zig-rest`) moved
# to config.zig.toml since it needs `zig fmt`.
run = """
cargo run -q -p et-int-gen --bin et-int-gen -- generate core
cargo run -q -p et-int-gen --bin et-int-gen -- generate rust
cargo +nightly fmt -p et-rest-client
"""
shell = "bash -euo pipefail -c"

[tasks.gen-specs]
# Native `depends` glob anchored by gen:ws-spec (core + Rust client, always loaded).
# That anchor keeps the glob from matching zero; guest `gen:<lang>` tasks join from their
# loaded MISE_ENV configs. Run with MISE_ENV covering every language (e.g.
# `mise run gen-specs-all`) to regenerate everything.
depends = ["gen:*"]
description = "Regenerate every loaded spec artifact under generated/ (core + Rust + any loaded guest gen)"

[tasks.gen-specs-check]
depends = ["gen-specs"]
description = "Fail if any checked-in artifact under generated/ is stale"
# All et-int-gen outputs land under generated/.
# The runner's wit/deps/et-ws-messages is a symlink into that tree, so a single diff
# against generated/ covers everything.
run = "git diff --exit-code -- generated"

# `cargo-watch` is unmaintained; `watchexec` is its successor.
# watchexec is what `cargo-watch` always called under the hood. Restart on .rs/.toml changes so a
# workspace-wide edit (any library, any service the server depends on) triggers a rebuild. `--clear`
# wipes the terminal between runs so cargo output starts at the top of the screen; `--restart` kills the
# running `cargo run` before kicking off a fresh one. Respects `.gitignore`, so `target/` and friends
# are skipped. `--shell=none` runs the command directly as a program instead of wrapping it in a shell:
# without it, watchexec 2.x defaults to shell mode, and on Windows the mise task runs under MSYS `sh`, which
# watchexec invokes as `sh -c cargo run -p et-ws-server` -- `cargo` runs with no args (run/-p/et-ws-server
# become sh positional params $0/$1/$2), so it just prints `cargo`'s help and the server never starts
# (with `--clear`, the screen simply blanks). The command has no shell features, so program mode is correct
# on every OS. This is upstream watchexec#918 (open); drop --shell=none once it is fixed. Verified on 2.5.1.
[tasks.ws-server]
description = "Run the WebSocket server, restarting on .rs/.toml changes"
run = "watchexec --restart --clear --exts rs,toml -i '**/tests/**' --shell=none -- cargo run -p et-ws-server"

[tasks.ws-server.env]
OTLP_AUTH_PASSWORD = "1234"
OTLP_AUTH_USERNAME = "root@example.com"

[tasks.ws-server-no-otel]
description = "Run the WebSocket server without OTLP/o2 observability (OpenTelemetry init is skipped)"
# Same as ws-server but sets no OTLP_* env, so Config.otlp deserialises to None and et_otlp::init is skipped.
# Use this when you don't want the o2/OpenObserve stack (`mise run o2`) running alongside the server.
run = "watchexec --restart --clear --exts rs,toml -i '**/tests/**' --shell=none -- cargo run -p et-ws-server"

[tasks.ws-server-offline-demo]
description = "Run the WebSocket server for a hotspot demo: no OTLP, no watchexec, cargo --offline"
# Demo the server from a machine that shares its own Wi-Fi hotspot and has no internet uplink.
# Sets no OTLP_* env, runs cargo directly (no watchexec restart-on-change), and `--offline` makes cargo
# resolve and build from the crates already in the local cache instead of touching the network.
env = { NET_LOG_INTERFACE = "bridge100" }
run = "cargo run --offline -p et-ws-server"

[tasks.ws-wasi-runner]
description = "Run the WebSocket WASI runner (set RUNNER_MODULE, e.g. wasi-graphics-info; RUNNER_FEATURES=cuda on CUDA)"
dir = "services/ws-wasi-runner"
run = """
if [ -n "${RUNNER_FEATURES:-}" ]; then
  cargo run --features "$RUNNER_FEATURES"
else
  cargo run
fi
"""
shell = "bash -euo pipefail -c"

[tasks.build-et-cli]
# Pre-build et-cli once.
# The parallel build-ws-* module tasks each call `cargo run -p et-cli -- module-package-json`; without
# this they race rebuilding et-cli, and one execs the binary mid-replace (ENOENT -- surfaced on macOS).
# Stays in the base config (not a per-lang config) because dart, js, python, and rust env tasks all
# depend on it.
# `shell = "bash"` is load-bearing on Windows: mise's child-env composition drops the `%LOCALAPPDATA%\mise\shims`
# PATH entry when spawning the default cmd shell for a base-config task under a bash-parent GHA step, so
# bare `cargo` fails with `'cargo' is not recognized`. Git Bash sources its own PATH from mise's shim
# dir, so `cargo` resolves cleanly. See windows job 82267796152 on d5bb7e0b for the captured
# cmd-subprocess failure.
description = "Build et-cli (prereq for the module-package-json steps)"
run = "cargo build -p et-cli"
shell = "bash -euo pipefail -c"

[tasks.build-modules]
# Native `depends` glob over `build-ws-*`.
# That matches `build-ws-wasm-agent` (always loaded here, no `-module` suffix -- so the glob never
# matches zero) plus every loaded `build-ws-*-module`.
depends = ["build-ws-*"]
description = "Build all loaded WebAssembly modules"

