# Default config: always loaded regardless of MISE_ENV. Holds the Rust
# toolchain (the substrate — every guest-language module build shells out to
# `cargo run -p et-cli`), the Node static-workspace infra, the universal
# repo-wide linters, and the cross-language orchestration tasks below.
#
# Per-language toolchains live in .mise/config.<lang>.toml, selected via
# MISE_ENV (dart, dotnet, java, python, zig). config.rust.toml currently holds
# only the Rust WASM module builds; the rest of the Rust tooling still lives
# here, pending a later pass that moves it behind MISE_ENV=rust. Examples:
#   Install one language's toolchain:   MISE_ENV=dart mise install
#   Run a check across everything:      mise run check-all  (or install-all)
#   Make a selection sticky:            export MISE_ENV=dart

# Require release that introduced auto_env enabled in .miserc.toml
min_version = "2026.6.5"

[settings]
# exec_auto_install covers `mise exec`,
# task.run_auto_install covers `mise run`.
exec_auto_install = false
task.run_auto_install = false

[tools]
action-validator = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
ast-grep = "latest"
cargo-binstall = "latest"
"aqua:rustwasm/wasm-pack" = "latest"
"cargo:cargo-expand" = "latest"
taplo = "latest"
watchexec = "latest"
# vfox-chromedriver's PostInstall hook fails on Windows ("syntax of the
# command is incorrect"). Chromedriver is only used by the
# `test-ws-wasm-agent-chrome` / `ws-e2e-chrome` tasks, neither of which run
# in the standard CI `test` flow, so skip it on Windows entirely.
"chromedriver" = { version = "146", os = ["linux", "macos"] }
cmake = "latest"
"conda:openssl" = "3"
conftest = "latest"
dprint = "latest"
editorconfig-checker = "latest"
# Retries a command with exponential backoff + jitter; wraps the model fetches
# below (see the `retry` var) so a transient HTTP 429 doesn't fail the build.
"github:dbohdan/recur" = "latest"
"github:grok-rs/waitup" = "latest"
"github:owenlamont/ryl" = "latest"
"github:wasm-bindgen/wasm-bindgen" = "0.2.122"
hadolint = "latest"
ls-lint = "latest"
lychee = "latest"
mprocs = "latest"
node = "22"
"npm:onnxruntime-web" = "latest"
osv-scanner = "latest"
# Aqua has no pipx build for windows/amd64. On Windows the workflow runs
# `python -m pip install pipx` separately so the `pipx:*` entries below
# still resolve through whatever pipx is already on PATH.
pipx = { version = "latest", os = ["linux", "macos"] }
# Pure-Python fixture for the et-ws-pyo3-runner `cowsay` test: proves a
# mise-installed python package lands on the embedded interpreter's sys.path
# (see `edge_toolkit::config::mise_python_site_packages`).
"pipx:cowsay" = "latest"
# semgrep lints Cargo.toml style (see `semgrep-check`), so it stays in the
# always-loaded config alongside the other repo-wide linters.
"pipx:semgrep" = "latest"
# The default aqua backend has no darwin/amd64 prebuilt; fall back to
# `npm:pnpm` on Intel Mac (node is already a mise tool above).
gh = "latest"
"npm:pnpm" = { version = "latest", os = ["macos/x64"] }
pnpm = { version = "latest", os = ["linux", "macos/arm64", "windows"] }
protoc = "latest"
python = "3.13"
rclone = "latest"
rust = [
  { version = "latest", components = "clippy,rust-analyzer", targets = "wasm32-unknown-unknown,wasm32-wasip2" },
  { version = "nightly", components = "rust-src,rustfmt", targets = "wasm32-unknown-unknown,wasm32-wasip2" },
]
typos = "latest"
uv = "0.11.8"
wasm-tools = "latest"
yq = "latest"
zizmor = "latest"

[vars]
# clang-tidy's resource-dir arg (points clang at its builtin headers, e.g.
# stddef.h). Empty default; config.linux.toml sets it from conda:clangxx.
clang_resource_arg = ""
conda_openssl = "{{ env.HOME }}/.local/share/mise/installs/conda-openssl/latest"
# mise-managed CPython 3.13 (Linux/macOS); the PYO3_PYTHON default below. Windows
# overrides PYO3_PYTHON with its own py313_win in config.windows.toml.
py313_unix = "{{ env.HOME }}/.local/share/mise/installs/python/3.13/bin/python3"
# RUSTFLAGS fragments shared by the CARGO_TARGET_* env in config.<os>.toml
rpath_flag = "-C link-arg=-Wl,-rpath,{{ vars.conda_openssl }}/lib"
# rpath to the mise CPython 3.13 lib dir so the et-ws-pyo3-runner binary finds
# libpython at runtime (libpython3.13.so on Linux, libpython3.13.dylib on macOS
# via its @rpath install name). pyo3 bakes an rpath to the resolved patch-version
# dir, which doesn't exist when mise installs under the "3.13" alias; point at
# the stable install path instead.
pylib_flag = "-C link-arg=-Wl,-rpath,{{ env.HOME }}/.local/share/mise/installs/python/3.13/lib"
wasm_rustflags = "-C target-cpu=mvp -C target-feature=+mutable-globals,+sign-ext,+nontrapping-fptoint"
# Extra flag for the wasm-pack module builds; empty so wasm-opt runs.
# config.windows.toml overrides it to --no-opt where wasm-opt can't execute.
no_opt = ""
# Source/dest paths for the fetch-*-rclone model downloads — kept as vars so
# each `rclone copyto` command stays on a single line without continuations.
face1_dst = "data/model-modules/model-face1/pkg/video_cv.onnx"
face1_src = ":http:amd/retinaface/resolve/main/weights/RetinaFace_int.onnx"
har_dst = "data/model-modules/model-har-motion1/pkg/har-motion1.onnx"
har_repo = ":http:acd17sk/MET-Metabolic-Equivalent-of-Task-AI-Android-APP"
har_src = "{{ vars.har_repo }}/raw/refs/heads/main/Models/onnx/hybrid_met.onnx"
mnist_dst = "services/ws-modules/wasi-graphics-info/pkg/mnist-12.onnx"
mnist_src = ":http:onnx/models/raw/main/validated/vision/classification/mnist/model/mnist-12.onnx"
# `retry` prefixes each fetch with recur for exponential-backoff-with-jitter
# retries (8 tries, 2s base doubling, capped 2m, 0-5s jitter); the *_http vars
# carry the per-host base URL + flags. Kept as vars so each task line fits.
gh_http = "--http-url https://github.com --progress --ignore-existing"
hf_http = "--http-url https://huggingface.co --progress --ignore-existing"
retry = "recur --attempts 8 --delay 2s --backoff 2s --max-delay 2m --jitter 0,5s --"

[env]
# Comma-separated list of every language env (one per .mise/config.<lang>.toml).
# Used as MISE_ENV by the *-all tasks to act on every language at once (mise has
# no MISE_ENV=all). Hardcoded rather than shell-discovered so it works on Windows
# too — keep in sync when adding/removing a config.<lang>.toml.
ALL_LANGS = "dart,dotnet,java,python,rust,zig"
TAPLO_CONFIG = "{{ config_root }}/config/taplo.toml"
CLIPPY_CONF_DIR = "{{ config_root }}/config"
# Use the conda:openssl install for Rust's OPENSSL_DIR so openssl-sys crate builds.
OPENSSL_DIR = "{{ vars.conda_openssl }}"

# pyo3-ffi (et-ws-pyo3-runner) links its embedded interpreter at build time from
# PYO3_PYTHON, else the first python on PATH -- under mise that's the 32-bit
# Pyodide shim ("target architecture (64-bit) does not match ... (32-bit)"). Pin
# it to the mise-managed CPython 3.13. Always-loaded so `cargo check --workspace`
# builds the pyo3 runner without MISE_ENV=python. This is the Linux/macOS path;
# config.windows.toml overrides it with py313_win.
PYO3_PYTHON = "{{ vars.py313_unix }}"
RCLONE_CONFIG = "{{ config_root }}/config/rclone.conf"
RCLONE_RETRIES = "1"

[tasks]
ec = "ec"
editorconfig-check = "ec"

[tasks.dprint-check]
run = "dprint check"

[tasks.dprint-check.env]
DPRINT_CACHE_DIR = "{{ config_root }}/target/dprint-cache"

[tasks.dprint-fmt]
run = "dprint fmt"

[tasks."fmt:rust"]
# Rust + universal formatters. Always-loaded, so `fmt`'s glob always matches it.
depends = ["cargo-clippy-fix", "cargo-fmt", "dprint-fmt", "taplo-fmt"]
description = "Run the Rust + universal repo-wide formatters"

[tasks.fmt]
# Native `depends` glob (not a nested `mise run`) so it works on Windows and
# activates each task's tools. fmt:rust is always loaded, so the glob never
# matches zero (which mise would error on); guest fmt:<lang> join when loaded.
depends = ["fmt:*"]
description = "Run all formatters: fmt:rust + any loaded guest fmt:<lang>"

[tasks."check:rust"]
# Rust + universal repo-wide checks. Lives in the always-loaded default config,
# so `check`'s `check:*` glob always matches at least this one (Rust is in the
# default config this pass; the guest `check:<lang>` tasks come from their
# loaded MISE_ENV configs).
depends = [
  "action-validator",
  "ast-grep-check",
  "cargo-check",
  "cargo-clippy",
  "cargo-doc-check",
  "cargo-fmt-check",
  "docker-check",
  "dprint-check",
  "editorconfig-check",
  "gen-specs-check",
  "hadolint-check",
  "link-check",
  "ls-lint-check",
  "ryl-check",
  "semgrep-check",
  "conftest-check",
  "taplo-check",
  "typos",
  "verification-check",
  "zizmor-check",
]
description = "Run the Rust + universal repo-wide checks"

[tasks.check]
# Native `depends` glob: check:rust and every loaded guest check:<lang> run as
# parallel siblings (all report, none gated), with each task's tools activated.
# check:rust is always loaded so the glob never matches zero. (Avoid a nested
# `mise run 'check:*'` — that breaks tool activation and the `[env]` exec on
# Windows.)
depends = ["check:*"]
description = "Run all checks: check:rust + any loaded guest check:<lang>"

[tasks.action-validator]
description = "Validate GitHub Actions workflow YAML"
run = "action-validator .github/workflows/*.yaml"

[tasks.zizmor-check]
description = "Audit GitHub Actions workflows for security issues (zizmor)"
# --offline so it needs no GH token and stays deterministic; config/zizmor.yaml
# turns off the hash-pin policy (we pin actions by tag, not commit).
run = "zizmor --offline --no-progress -c config/zizmor.yaml .github/workflows"

[tasks.ls-lint-check]
description = "Lint file and directory naming conventions (ls-lint)"
run = "ls-lint --config config/ls-lint.yaml"

[tasks.ast-grep-check]
# --no-ignore hidden so the gha-* YAML rules reach .github/workflows (ast-grep
# skips dot-dirs by default); gitignored paths like target/ stay skipped.
description = "Run ast-grep structural-search rules"
run = "ast-grep scan --error --no-ignore hidden -c config/ast-grep/sgconfig.yaml"

[tasks.semgrep-check]
description = "Run Semgrep generic-mode rules (e.g. Cargo.toml style)"
run = "semgrep scan --config config/semgrep --error --metrics=off ."

[tasks.hadolint-check]
description = "Lint the Dockerfiles with hadolint"
run = "git ls-files '*Dockerfile' '*Dockerfile.*' | xargs hadolint --config config/hadolint.yaml"

[tasks.cargo-check]
run = "cargo check --workspace"

[tasks.cargo-fmt]
run = "cargo +nightly fmt"

[tasks.cargo-fmt-check]
run = "cargo +nightly fmt -- --check"

[tasks.cargo-clippy]
run = "cargo clippy --keep-going --workspace --tests"

[tasks.cargo-doc-check]
description = "Build rustdoc with -D warnings to fail on any doc issues"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --keep-going --workspace --no-deps --document-private-items"

[tasks.cargo-clippy-fix]
run = "cargo clippy --fix --allow-dirty --allow-staged --keep-going --workspace --tests"

[tasks.taplo-fmt]
run = "taplo format"

[tasks.conftest-check]
depends = ["conftest-check-*"]
description = "Run all conftest policy checks (one per parsed file format)"

[tasks.conftest-check-toml]
description = "Run conftest OPA/Rego policies over the TOML config + lock files"
# --combine feeds every listed file to one policy evaluation as an array of
# {path, contents}, so a policy can both check each file and compare across files
# (the mise wasm-bindgen pin vs Cargo.lock). --parser toml: Cargo.lock has no
# .toml suffix. The TOML rule namespaces are listed explicitly, so the per-file
# `gha` (YAML) namespace is never evaluated against this combined TOML input.
run = """
ns="--namespace cross --namespace cargo --namespace mise --namespace pyproject"
git ls-files '*Cargo.toml' '.mise/config*.toml' '*pyproject.toml' Cargo.lock |
  xargs conftest test --combine --parser toml $ns -p config/conftest/policy
"""
shell = "bash -euo pipefail -c"

[tasks.conftest-check-yaml]
description = "Run conftest OPA/Rego policies over the GitHub Actions workflow YAML"
run = "conftest test --parser yaml --namespace gha -p config/conftest/policy .github/workflows"

[tasks.taplo-check]
# `taplo lint` reads config/taplo.toml's `[[rule]] schema` entries for editor /
# LSP-style validation, but silently ignores their nested constraints in
# CLI mode (verified: injecting `path = "../foo"` into a member Cargo.toml
# doesn't fire `no-path-deps` via the rule alone). We work around it by
# applying each schema explicitly with `taplo lint --schema file://...`.
# conftest-check-toml (config/conftest/policy) intentionally duplicates these
# lints; running both is fine.
run = """
taplo lint

# The --schema lints below pass file://$PWD URLs, which aren't well-formed on
# Windows (drive-letter paths); run them on Linux/macOS only. conftest-check-toml
# applies the same rules on every OS.
[ "${OS:-}" = "Windows_NT" ] && exit 0

# All member Cargo.tomls — exclude workspace root and any build output.
# `-prune` target/ and .git so find never descends into them: `-not -path`
# alone still walks the whole tree, and target/debug/deps/ churns constantly
# under a concurrent `cargo-check`, racing find into "No such file" errors.
# POSIX sh (no bash arrays / process substitution -- the tasks run on busybox
# ash on Windows): collect the paths into a temp file once and feed each schema
# run via xargs.
members="$(mktemp)"
trap 'rm -f "$members"' EXIT
find . -path ./target -prune -o -path ./.git -prune -o -name Cargo.toml ! -path ./Cargo.toml -print >"$members"

# Banned deps only need to be checked at the workspace root: member
# crates are required to reference deps via `workspace = true` (the
# `require-workspace-deps` schema below), so any banned dep can only
# enter the build through `[workspace.dependencies]` here.
taplo lint --schema "file://$PWD/config/taplo/no-banned-deps.schema.json" Cargo.toml

# Schemas that apply to every member crate.
xargs taplo lint --schema "file://$PWD/config/taplo/no-path-deps.schema.json" <"$members"
xargs taplo lint --schema "file://$PWD/config/taplo/no-wildcard-or-git-deps.schema.json" <"$members"
xargs taplo lint --schema "file://$PWD/config/taplo/require-workspace-deps.schema.json" <"$members"
xargs taplo lint --schema "file://$PWD/config/taplo/require-lib-doctest-false.schema.json" <"$members"
xargs taplo lint --schema "file://$PWD/config/taplo/no-lib-name.schema.json" <"$members"

# `require-lints-section` exempts generated/rust-rest/Cargo.toml because
# progenitor's emitted `src/lib.rs` contains patterns our workspace lint
# table flags (e.g. doc-comment shapes that trip rustdoc's invalid-code-
# block lint). Inheriting `[lints] workspace = true` would fail the build
# on the generated source. The exemption is about the lint table, not
# about the deps — its `[dependencies]` still inherits from
# `[workspace.dependencies]` like every other crate.
grep -vxF './generated/rust-rest/Cargo.toml' "$members" |
  xargs taplo lint --schema "file://$PWD/config/taplo/require-lints-section.schema.json"

# mise task `run` must be a string, not an array: taplo's reorder_arrays would
# re-sort an array and scramble an ordered command sequence (use a multiline
# string, one command per line). Applies to every .mise/config*.toml.
taplo lint --schema "file://$PWD/config/taplo/mise-run-not-array.schema.json" .mise/config*.toml

# ubi: is deprecated (use http:); cargo: builds from source (slow), allowed only
# for cargo-expand + dart-typegen. Two separate rules, two reasons.
taplo lint --schema "file://$PWD/config/taplo/mise-no-ubi-backend.schema.json" .mise/config*.toml
taplo lint --schema "file://$PWD/config/taplo/mise-cargo-backend-allowlist.schema.json" .mise/config*.toml
"""
shell = "bash -euo pipefail -c"

[tasks.typos]
run = "typos --config config/typos.toml"

# Part of the `check` aggregate. lychee makes live network requests, so
# config/lychee.toml is tuned (retries, 429-tolerance, disk cache) to keep it
# from being flaky. Checks every URL in the repo's Markdown + Rust sources;
# lychee extracts URLs from .rs comments and string literals too.
[tasks.link-check]
description = "Check that URLs in .md and .rs files are reachable (network)"
run = "lychee --config config/lychee.toml '**/*.md' '**/*.rs'"

[tasks.ryl-check]
description = "Lint YAML with ryl (a yamllint-compatible Rust linter)"
run = "ryl -c config/ryl.yaml .github config"

[tasks.setup-aube]
# `aube` is an OPTIONAL faster npm backend, kept out of the mandatory `[tools]`
# list because its install is flaky on some platforms and edge-toolkit falls
# back to the classical `lib/node_modules` layout without it (see
# `find_npm_modules_path_in`).
#
# CI (check.yaml / test.yaml) runs this task in its own allowed-to-fail step,
# placed BEFORE the main `mise install` so the `npm:onnxruntime-web` install
# can pick up aube as its backend.
#
# Platform split: aqua ships aube for linux/macos-arm64/windows; macos/x64 has
# no aqua asset, so use the cargo backend there. The branch is rendered by
# mise's tera templating to pick the right backend per platform.
description = "Install the optional aube npm backend (platform-specific, best-effort)"
run = """
{% if os() == "macos" and arch() == "x64" %}
mise install cargo:aube@latest
{% else %}
mise install aube@latest
{% endif %}
"""
shell = "bash -euo pipefail -c"

[tasks._setup_all]
description = "Private shared cross-platform preinstall"
hide = true
run = """
mise settings experimental=true
mise settings set cargo.binstall true
mise install cargo-binstall
mise install node
mise install conda:openssl
"""
shell = "bash -euo pipefail -c"

[tasks.osv-scanner]
# Scans the committed Cargo.lock only -- no build dependency, so the same task
# serves both ad-hoc local use and the dependencies workflow.
run = "osv-scanner --lockfile Cargo.lock --config config/osv-scanner.toml"

[tasks."gen:osv-scanner"]
description = "Regenerate config/osv-scanner.toml from config/deny.toml's [advisories].ignore list"
# osv-scanner and cargo-deny must ignore the same advisory IDs; config/deny.toml
# is the source of truth (it carries the per-ID rationale). grep/sort/sed only, so
# the `dependencies` workflow can run it (via mise) next to the audit binaries.
run = """
{
  echo '# AUTO-GENERATED from config/deny.toml by `mise run gen:osv-scanner`.'
  echo 'IgnoredVulns = ['
  grep -oE '"RUSTSEC-[0-9]{4}-[0-9]{4}"' config/deny.toml | sort -u | sed 's/.*/  { id = & },/'
  echo ']'
} > config/osv-scanner.toml
"""
shell = "bash -euo pipefail -c"

[tasks.cargo-deny-check]
description = "Audit dependencies with cargo-deny (advisories, bans, licenses, sources)"
run = "cargo deny check --config config/deny.toml"

[tasks.cargo-unmaintained-check]
description = "Flag dependencies whose upstream repo is archived or unmaintained"
# cargo-unmaintained is deliberately NOT a mise [tool]: it has no prebuilt and a
# from-source `cargo install` is too heavy to pay on every `mise install`. The
# `dependencies` workflow installs it via taiki-e/install-action; this task just
# runs the binary so the audit command lives beside the others. A GITHUB_TOKEN in
# the env lets it check each upstream repo's archival status.
run = "cargo unmaintained"

[tasks."gen:dockerignore"]
description = "Regenerate .dockerignore from .gitignore + Docker-only excludes"
# Docker reads only the root .dockerignore (never .gitignore or nested ignore
# files), and a bare pattern there is root-anchored -- whereas a slash-less
# .gitignore pattern matches at any depth. So mirror .gitignore, add the
# Docker-only excludes (`.git/`, plus the build recipe + docs so editing them
# doesn't bust the `COPY . .` cache), and `**/`-prefix each non-anchored pattern.
run = '''
{
  echo "# AUTO-GENERATED from .gitignore by 'mise run gen:dockerignore' -- do not edit."
  echo "# Docker reads only this file; patterns are **/-prefixed to match at any depth"
  echo "# like .gitignore. Edit .gitignore and regenerate."
  echo
  {
    cat .gitignore
    printf '%s\n' '.git/' 'Dockerfile*' '/README.md' '.dockerignore'
  } | awk '
    /^[[:space:]]*#/ { print; next }
    /^[[:space:]]*$/ { print; next }
    {
      neg = ""; line = $0
      if (substr(line, 1, 1) == "!") { neg = "!"; line = substr(line, 2) }
      if (substr(line, 1, 1) == "/") { print neg substr(line, 2); next }
      core = line; sub(/\/$/, "", core)
      if (index(core, "/") > 0) print neg line; else print neg "**/" line
    }
  '
} >.dockerignore
'''
shell = "bash -euo pipefail -c"

[tasks.docker-check]
depends = ["gen:dockerignore"]
description = "Fail if .dockerignore is stale vs .gitignore (run `mise run gen:dockerignore`)"
run = "git diff --exit-code -- .dockerignore"

[tasks.prefetch-ci]
# `build-ws-wasm-agent` produces `services/ws-wasm-agent/pkg/`, which the
# static workspace references via a `link:` path. Run it before `pnpm install`
# so the link target exists. Only `fetch-mnist-rclone` is pulled here —
# CI tests don't exercise the face1 / har-motion1 models, and skipping
# those avoids the HuggingFace rate-limit that bites Windows runners.
#
# `prefetch:rust` + `prefetch:node` live in this default config (always
# loaded), so the `prefetch:*` glob never matches zero; guest-language
# `prefetch:<lang>` tasks join from their loaded MISE_ENV configs. Native
# `depends` glob (not a nested `mise run`) so each task's tools are activated —
# a nested run left `dart`/`zig` off PATH on Windows.
depends = ["fetch-mnist-rclone", "prefetch:*"]
description = "Pre-download CI-required dependencies + the MNIST model"

[tasks.prefetch]
depends = ["fetch-face1-rclone", "fetch-har-motion1-rclone", "prefetch-ci"]
description = "Pre-download all dependencies and models (superset of prefetch-ci)"

[tasks."prefetch:rust"]
description = "Prefetch the Rust (cargo) dependencies"
# `cargo fetch` downloads the full Cargo.lock graph (all targets) without
# compiling — the actual build happens in build-modules / the test step. Avoids
# the redundant `cargo check --workspace` compile (and its large target/ dir).
run = "cargo fetch"

[tasks."prefetch:node"]
# Needs `build-ws-wasm-agent` first: the static workspace `link:`s its `pkg/`,
# so the link target must exist before `pnpm install`.
depends = ["build-ws-wasm-agent"]
description = "Prefetch the Node (pnpm) static workspace"
run = "pnpm install --dir services/ws-server/static --ignore-scripts --config.ignoredBuiltDependencies=protobufjs"

[tasks."prefetch:node".env]
# pnpm refuses non-TTY destructive node_modules cleanup unless CI=true, which
# fires when an earlier install left a different layout. Treat as a CI batch.
CI = "true"

[tasks.regenerate-verification]
alias = "regen-verification"
description = "Regenerate checked-in verification output files"
run = "cargo run -p et-cli -- regen-verification"

[tasks.verification-check]
depends = ["regenerate-verification"]
description = "Fail if generated scenario output files are stale"
run = "git diff --exit-code -- verification"

[tasks.fetch-wit-deps]
description = "Fetch upstream WASI WIT packages into generated/specs/wit/ at pinned versions (run by hand on bumps)"
run = "cargo run -q -p et-int-gen --bin et-int-gen -- fetch-deps"

[tasks."gen:ws-spec"]
description = "Run et-int-gen: emit the language-agnostic WS specs (YAML/WIT/KDL/JSON) + the Rust REST client"
# et-int-gen runs progenitor + prettyplease to produce
# generated/rust-rest/src/lib.rs. prettyplease's style disagrees with our
# nightly rustfmt (different import grouping + line width), so the workspace
# `mise run fmt` would reformat it and `mise run gen-specs-check` would see
# drift on the next regen. Make rustfmt the canonical formatter by running
# it here as a post-process — the committed file is then a fixed point of
# both tools.
#
# `generate core` emits the language-agnostic specs every per-language `gen:*`
# task consumes (ws.kdl, *.schema.json, rest.yaml), so this task stays in the
# always-loaded default config (its `gen:` name also anchors the `gen:*` glob)
# and every `gen:<lang>` depends on it. The Zig client (`gen:zig-rest`) moved to
# config.zig.toml since it needs `zig fmt`.
run = """
cargo run -q -p et-int-gen --bin et-int-gen -- generate core
cargo run -q -p et-int-gen --bin et-int-gen -- generate rust
cargo +nightly fmt -p et-rest-client
"""
shell = "bash -euo pipefail -c"

[tasks.gen-specs]
# Native `depends` glob: gen:ws-spec (core + Rust client, always loaded) anchors
# the glob so it never matches zero; guest `gen:<lang>` tasks join from their
# loaded MISE_ENV configs. Run with MISE_ENV covering every language (e.g.
# `mise run gen-specs-all`) to regenerate everything.
depends = ["gen:*"]
description = "Regenerate every loaded spec artifact under generated/ (core + Rust + any loaded guest gen)"

[tasks.gen-specs-check]
depends = ["gen-specs"]
description = "Fail if any checked-in artifact under generated/ is stale"
# All et-int-gen outputs land under generated/. The runner's
# wit/deps/et-ws-messages is a symlink into that tree, so a single diff
# against generated/ covers everything.
#
# Skipped on Windows: the regen pipeline produces non-deterministic
# drift there (nightly rustfmt formats long signatures and doc-comment
# indentation differently across nightlies; pipx-driven python codegen
# emits subtly different output). Linux/macOS runs are canonical.
run = """
[ "${OS:-}" = "Windows_NT" ] && { echo "gen-specs-check: skipped on Windows (non-deterministic)"; exit 0; }
git diff --exit-code -- generated
"""
shell = "bash -euo pipefail -c"

# `cargo-watch` is unmaintained; `watchexec` is its successor (and what
# `cargo-watch` always called under the hood). Restart on .rs/.toml
# changes so a workspace-wide edit (any library, any service the server
# depends on) triggers a rebuild. `--clear` wipes the terminal between
# runs so cargo output starts at the top of the screen; `--restart`
# kills the running `cargo run` before kicking off a fresh one.
# Respects `.gitignore`, so `target/` and friends are skipped.
[tasks.ws-server]
description = "Run the WebSocket server, restarting on .rs/.toml changes"
run = "watchexec --restart --clear --exts rs,toml -i '**/tests/**' -- cargo run -p et-ws-server"

[tasks.ws-server.env]
OTLP_AUTH_PASSWORD = "1234"
OTLP_AUTH_USERNAME = "root@example.com"

[tasks.ws-wasi-runner]
description = "Run the WebSocket WASI runner (set RUNNER_MODULE, e.g. wasi-graphics-info; RUNNER_FEATURES=cuda on CUDA)"
dir = "services/ws-wasi-runner"
run = """
if [ -n "${RUNNER_FEATURES:-}" ]; then
  cargo run --features "$RUNNER_FEATURES"
else
  cargo run
fi
"""
shell = "bash -euo pipefail -c"

[tasks.build-ws-wasm-agent]
description = "Build the WebSocket WASM client"
dir = "services/ws-wasm-agent"
# {{ vars.no_opt }} is --no-opt on Windows (wasm-opt can't run on Nano), empty
# elsewhere -- the served, size-optimised artifact is built on Linux/macOS.
run = "wasm-pack build . --target web {{ vars.no_opt }} -- -Z build-std=std,panic_abort"

[tasks.build-ws-wasm-agent.env]
# Scope these flags to the wasm target rather than setting plain `RUSTFLAGS`:
# wasm-pack auto-installs a matching `wasm-bindgen-cli` (when the version in
# `Cargo.lock` differs from the one on PATH) by shelling out to `cargo
# install`, which inherits this env. A plain `RUSTFLAGS` with `target-cpu=mvp`
# and `+mutable-globals` then leaks into that host build and rustc rejects
# them with "'mvp' is not a recognized processor for this target".
CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS = "{{ vars.wasm_rustflags }}"
RUSTUP_TOOLCHAIN = "nightly"

[tasks.build-et-cli]
# Pre-build et-cli once. The parallel build-ws-* module tasks each call
# `cargo run -p et-cli -- module-package-json`; without this they race rebuilding
# et-cli, and one execs the binary mid-replace (ENOENT -- surfaced on macOS).
description = "Build et-cli (prereq for the module-package-json steps)"
run = "cargo build -p et-cli"

[tasks.build-modules]
# Native `depends` glob over `build-ws-*`: that matches `build-ws-wasm-agent`
# (always loaded here, no `-module` suffix — so the glob never matches zero)
# plus every loaded `build-ws-*-module`.
depends = ["build-ws-*"]
description = "Build all loaded WebAssembly modules"

[tasks.test-ws-wasm-agent-firefox]
description = "Run headless Firefox tests for the WebSocket WASM client"
dir = "services/ws-wasm-agent"
run = "wasm-pack test --headless --firefox"

[tasks.ws-e2e-firefox]
depends = ["test-ws-wasm-agent-firefox", "ws-server"]
description = "Run both the ws-server and ws-wasm-agent using Firefox"

[tasks.test-ws-wasm-agent-chrome]
description = "Run headless Chrome tests for the WebSocket WASM client"
dir = "services/ws-wasm-agent"
run = "env CHROMEDRIVER=\"$(mise where chromedriver)/bin/chromedriver\" wasm-pack test --headless --chrome"

[tasks.ws-e2e-chrome]
depends = ["test-ws-wasm-agent-chrome", "ws-server"]
description = "Run both the ws-server and ws-wasm-agent using Chrome"

[tasks.openobserve]
alias = "o2"
run = "docker run --rm -it --name openobserve -p 5080:5080 --env-file config/o2.env openobserve/openobserve:v0.70.3"

[tasks.demo]
depends = ["openobserve", "ws-server"]

[tasks.open-o2]
run = "open http://localhost:5080/"

[tasks.fetch-face1-rclone]
run = "{{ vars.retry }} rclone copyto {{ vars.face1_src }} {{ vars.face1_dst }} {{ vars.hf_http }}"
shell = "bash -euo pipefail -c"

[tasks.fetch-har-motion1-rclone]
run = "{{ vars.retry }} rclone copyto {{ vars.har_src }} {{ vars.har_dst }} {{ vars.gh_http }}"
shell = "bash -euo pipefail -c"

[tasks.fetch-mnist-rclone]
# MNIST classifier used by services/ws-modules/wasi-graphics-info to exercise
# wasi-nn end-to-end. Sourced from the canonical ONNX Model Zoo; size 26143
# bytes. Lands under the module's gitignored pkg/ so et-modules-service can
# serve it statically alongside the .wasm.
run = "{{ vars.retry }} rclone copyto {{ vars.mnist_src }} {{ vars.mnist_dst }} {{ vars.gh_http }}"
shell = "bash -euo pipefail -c"

[tasks.download-models]
depends = ["fetch-face1-rclone", "fetch-har-motion1-rclone", "fetch-mnist-rclone"]

[tasks.cargo-test]
# Excludes `et-ws-web-runner` -- its tests need single-threaded
# execution (see `test-ws-web-runner` below); running the rest of the
# workspace in parallel keeps the total wall-clock down.
run = "cargo test --workspace --exclude et-ws-web-runner"

[tasks.test-ws-web-runner]
description = "Run et-ws-web-runner integration tests serialized"
# Each test case boots a full `MainWorker` (deno_runtime) -- ~10x
# heavier than the `JsRuntime` it replaced. 8 in parallel exhausts
# local fd/port budgets on macOS, surfacing as "error sending request
# for url" when the runner's wrapper module dynamic-`import()`s its
# module JS. Pin to one thread so the suite is deterministic.
run = "cargo test -p et-ws-web-runner"

[tasks.test-ws-web-runner.env]
RUST_TEST_THREADS = "1"

[tasks."test:rust"]
# Rust tests. Always-loaded, so `test`'s glob always matches it.
depends = ["cargo-test", "test-ws-web-runner"]
description = "Run the Rust tests"

[tasks.test]
# Native `depends` glob; test:rust is always loaded so it never matches zero.
depends = ["test:*"]
description = "Run all tests: test:rust + any loaded guest test:<lang>"

# --- Cross-language orchestration (stand-ins for the MISE_ENV=all mise lacks).
# `$ALL_LANGS` is auto-discovered in `[env]` above from the config.<lang>.toml
# filenames, so adding a language needs no edits here.

[tasks.print-all-langs]
description = "Print $ALL_LANGS — the comma-separated list of every language env"
run = 'echo "$ALL_LANGS"'
shell = "bash -c"

[tasks.install-all]
description = "Install every language toolchain (all .mise/config.<lang>.toml)"
run = 'MISE_ENV="$ALL_LANGS" mise install'
shell = "bash -c"

[tasks.all]
# Generic stand-in: run any command with every language env enabled. mise
# appends the task's CLI args after `mise exec --`, e.g. `mise run all zig version`.
description = "Run a command with every language env enabled (MISE_ENV=all)"
run = 'MISE_ENV="$ALL_LANGS" mise exec --'
shell = "bash -c"

[tasks.check-all]
description = "Run check across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run check'
shell = "bash -c"

[tasks.fmt-all]
description = "Run fmt across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run fmt'
shell = "bash -c"

[tasks.test-all]
description = "Run tests across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run test'
shell = "bash -c"

[tasks.build-modules-all]
description = "Build modules across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run build-modules'
shell = "bash -c"

[tasks.gen-specs-all]
description = "Regenerate every spec artifact across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run gen-specs'
shell = "bash -c"
