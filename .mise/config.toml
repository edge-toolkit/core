# Note: bare `yq` / `coreutils` would fail inside the nanoserver docker build.
# There mise's shims aren't on PATH for busybox-w32 ash (see the CLAUDE.md "Nano Server exception").
# `mise exec --` is the documented escape hatch; works the same on every host. yq stays bare because it
# already runs cleanly on every other lane and the nanoserver-shim TODO (CLAUDE.md) plans to put all
# shims on PATH there too.
[tasks.fetch-face1-rclone]
run = """
rclone copyto {{ vars.face1_src }} {{ vars.face1_dst }} {{ vars.gh_http }}
# Windows-safe checksum verify; behaviour is unchanged on Unix.
# Two Windows-only traps are avoided: (1) the inline `bash -c` body strips the double quotes from
# `yq '.asset."<key>"'`, so the dotted key `*.onnx` mis-parses to `null` (passing the key via env + strenv()
# needs no quotes); (2) uutils `sha256sum -c` mis-hashes binary files on Windows (text-mode read) even though
# a direct hash is correct, so we compare the direct hash ourselves instead of piping a checklist through `-c`.
export asset='{{ vars.face1_asset }}'
sha=$(mise exec -- yq -p toml -oy '.asset[strenv(asset)].sha256' config/upstream-cache/data.toml)
actual=$(mise exec -- coreutils sha256sum -b "{{ vars.face1_dst }}" | mise exec -- coreutils cut -c1-64)
[ "$actual" = "$sha" ] || { echo "face1 checksum mismatch: expected=$sha actual=$actual" >&2; exit 1; }
"""
shell = "bash -euo pipefail -c"

[tasks.fetch-eye1-rclone]
# Same shape as fetch-face1-rclone (rclone copy + Windows-safe SHA256 verify against data.toml).
# The FaceMesh .task is mirrored to the hf-cache-v<N> release by `MISE_ENV=maint mise run
# publish-eye1-to-hf-cache`; refresh it there on an upstream bump.
run = """
rclone copyto {{ vars.eye1_src }} {{ vars.eye1_dst }} {{ vars.gh_http }}
export asset='{{ vars.eye1_asset }}'
sha=$(mise exec -- yq -p toml -oy '.asset[strenv(asset)].sha256' config/upstream-cache/data.toml)
actual=$(mise exec -- coreutils sha256sum -b "{{ vars.eye1_dst }}" | mise exec -- coreutils cut -c1-64)
[ "$actual" = "$sha" ] || { echo "eye1 checksum mismatch: expected=$sha actual=$actual" >&2; exit 1; }
"""
shell = "bash -euo pipefail -c"

[tasks.fetch-har-motion1-rclone]
run = "rclone copyto {{ vars.har_src }} {{ vars.har_dst }} {{ vars.gh_http }}"
shell = "bash -euo pipefail -c"

[tasks.fetch-mnist-rclone]
# MNIST classifier used by services/ws-modules/wasi-graphics-info to exercise wasi-nn.
# Exercises wasi-nn end-to-end. Sourced from the canonical ONNX Model Zoo; size 26143 bytes. Lands under
# the module's gitignored pkg/ so et-modules-service can serve it statically alongside the .wasm.
run = "rclone copyto {{ vars.mnist_src }} {{ vars.mnist_dst }} {{ vars.gh_http }}"
shell = "bash -euo pipefail -c"

[tasks.fetch-speech1-rclone]
run = """
opts="--http-url https://huggingface.co --progress --ignore-existing"
# shellcheck disable=SC2086
rclone copyto {{ vars.speech1_src }} {{ vars.speech1_dst }} $opts
export asset='{{ vars.speech1_asset }}'
sha=$(mise exec -- yq -p toml -oy '.asset[strenv(asset)].sha256' config/upstream-cache/data.toml)
actual=$(mise exec -- coreutils sha256sum -b "{{ vars.speech1_dst }}" | mise exec -- coreutils cut -c1-64)
[ "$actual" = "$sha" ] || { echo "speech1 checksum mismatch: expected=$sha actual=$actual" >&2; exit 1; }
"""
shell = "bash -euo pipefail -c"

[tasks.download-models]
depends = [
  "fetch-eye1-rclone",
  "fetch-face1-rclone",
  "fetch-har-motion1-rclone",
  "fetch-mnist-rclone",
  "fetch-speech1-rclone",
]

[tasks.cargo-test]
description = "Run every Rust test via nextest (web-runner excluded on gnullvm)"
run = "cargo nextest run --workspace {{ vars.cargo_ws_excludes }} --config-file config/nextest.toml"

[tasks."test:rust"]
# Rust tests. Always-loaded, so `test`'s glob always matches it.
depends = ["cargo-test"]
description = "Run the Rust tests"

[tasks.test]
# Native `depends` glob; test:rust is always loaded so it never matches zero.
depends = ["test:*"]
description = "Run all tests: test:rust + any loaded guest test:<lang>"

# Detect which rp-v<N> assets are MISSING from the GitHub release.
# The assets are the native binary for this host's triple + the platform-agnostic wasm tarball. Lives
# outside config.maint.toml because callers (notably .github/workflows/test.yaml) need the answer before
# deciding whether to load the maint env; the detection itself only needs gh (host) + yq/rg/coreutils
# (mise tools). Reads .mise/config.toml's pinned `tools."http:et-rp".version` to derive the expected
# asset names. When $GITHUB_OUTPUT is set (GHA), emits step outputs the workflow can branch on; otherwise
# prints to stdout.
[tasks.rp-detect-missing]
description = "Print whether rp-v<N> has native+wasm assets for this host (GHA outputs)"
run = """
short=$(key='http:et-rp' yq -p toml -oy '.tools[strenv(key)].version' .mise/config.toml)
triple=$(rustc -vV | rg '^host: ' | coreutils cut -c7-)
native_asset="rustpython-${short}-${triple}.tar.gz"
wasm_asset="rustpython-wasm-${short}.tar.gz"
tag="{{ vars.a_rp_release }}"
assets=$(gh release view "$tag" --repo edge-toolkit/core --json assets --jq '.assets[].name' 2>/dev/null || true)
native_missing=true
wasm_missing=true
if echo "$assets" | rg -Fxq "$native_asset"; then native_missing=false; fi
if echo "$assets" | rg -Fxq "$wasm_asset";   then wasm_missing=false;   fi
out="${GITHUB_OUTPUT:-/dev/stdout}"
{
  echo "short=$short"
  echo "triple=$triple"
  echo "native_missing=$native_missing"
  echo "wasm_missing=$wasm_missing"
} >> "$out"
echo "[rp-detect-missing] triple=$triple short=$short native_missing=$native_missing wasm_missing=$wasm_missing" >&2
"""
shell = "bash -euo pipefail -c"

# Build the pywasm1 ws-module from the prebuilt rustpython_wasm tarball.
# The tarball is installed by mise as [tools."http:rp-wasm"] (download + sha256 + extract handled by
# mise; install dir referenced via vars.rp_wasm_dir). Picked up by `build-modules`'s glob (`build-ws-*`)
# like every other module task -- using the prebuilt tarball from the rp-v<N> release rather than
# recompiling RustPython keeps the cost at one ~10 MB download, not a multi-minute upstream wasm-pack build.
[tasks.build-ws-pywasm1-module]
depends = ["build-et-cli"]
description = "Build the pywasm1 module (fetched rustpython_wasm + main.py)"
dir = "services/ws-modules/pywasm1"
run = """
rp_pkg={{ vars.rp_wasm_dir }}
coreutils rm -rf pkg
coreutils mkdir -p pkg
coreutils cp "$rp_pkg"/rustpython_wasm.js "$rp_pkg"/rustpython_wasm.d.ts pkg/
coreutils cp "$rp_pkg"/rustpython_wasm_bg.wasm "$rp_pkg"/rustpython_wasm_bg.wasm.d.ts pkg/
coreutils cp -R "$rp_pkg/snippets" pkg/
coreutils cp index.js main.py pkg/
{{ vars.et_cli }} module-package-json
"""
shell = "bash -euo pipefail -c"

# Cross-language orchestration (stand-ins for the MISE_ENV=all mise lacks).
# `$ALL_LANGS` is auto-discovered in `[env]` above from the config.<lang>.toml filenames, so adding a
# language needs no edits here.

[tasks.print-all-langs]
description = "Print $ALL_LANGS -- the comma-separated list of every language env"
