# Default config: always loaded regardless of MISE_ENV. Holds the Rust
# toolchain (the substrate — every guest-language module build shells out to
# `cargo run -p et-cli`), the Node static-workspace infra, the universal
# repo-wide linters, and the cross-language orchestration tasks below.
#
# Per-language toolchains live in .mise/config.<lang>.toml, selected via
# MISE_ENV (dart, dotnet, java, python, zig). config.rust.toml currently holds
# only the Rust WASM module builds; the rest of the Rust tooling still lives
# here, pending a later pass that moves it behind MISE_ENV=rust. Examples:
#   Install one language's toolchain:   MISE_ENV=dart mise install
#   Run a check across everything:      mise run check-all  (or install-all)
#   Make a selection sticky:            export MISE_ENV=dart

# Require release that introduced auto_env enabled in .miserc.toml
min_version = "2026.6.5"

[settings]
# exec_auto_install covers `mise exec`,
# task.run_auto_install covers `mise run`.
cargo.binstall = true
exec_auto_install = false
experimental = true
http_retries = 10
http_timeout = "2m"
task.run_auto_install = false
# Hard-verify tool signatures via gpg on every platform (propagates to
# node.gpg_verify and swift.gpg_verify per mise/src/config/settings.rs).
# Without it mise's node plugin soft-skips when gpg is absent (`warn!("gpg not
# found, skipping verification")` in mise/src/plugins/core/node.rs). gpg is
# installed up-front in _setup_all via conda:gnupg (cross-platform conda-forge
# build) so the subsequent `mise install node` finds it.
gpg_verify = true

[tools]
action-validator = "latest"
# jaq: a jq-compatible alternative implementation in Rust. Prebuilt
# binaries for every project tier, unlike the C jq's missing release
# assets for some platforms. Used as `jaq` in task bodies (gh's `--jq`
# flag is internal to gh, not affected).
"aqua:01mf02/jaq" = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
"aqua:StyraInc/regal" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:rustwasm/wasm-pack" = "latest"
ast-grep = "latest"
cargo-binstall = "latest"
"cargo:cargo-expand" = "latest"
taplo = "latest"
watchexec = "latest"
# vfox-chromedriver's PostInstall hook fails on Windows ("syntax of the
# command is incorrect"). Chromedriver is only used by the
# `test-ws-wasm-agent-chrome` / `ws-e2e-chrome` tasks, neither of which run
# in the standard CI `test` flow, so skip it on Windows entirely.
"chromedriver" = { version = "146", os = ["linux", "macos"] }
cmake = "latest"
# gpg + agent + dirmngr (full gnupg suite). Required by mise's node plugin
# verify path (`gpg --import` + `gpg --verify` against Node's signed SHASUMS);
# `[settings] gpg_verify = true` flips that path from soft-skip to hard-fail,
# so gpg must be reachable before `mise install node`. _setup_all does this
# install first thing for that ordering. Conda-forge has gnupg builds for
# linux-64, osx-64, osx-arm64 -- but NOT win-64; Windows uses the msys2
# `conda:m2-gnupg` package declared in config.windows.toml.
"conda:gnupg" = { version = "latest", os = ["linux", "macos"] }
"conda:openssl" = "3"
conftest = "latest"
# uutils coreutils: the Rust multicall binary, invoked as `coreutils <util>`
# in tasks. Pinned to 0.6.0 (NOT the latest 0.9.0) because uutils 0.7.0+
# ships the Windows release as 85 per-utility .exes with no multicall
# coreutils.exe (see uutils/coreutils#11268). 0.6.0 keeps the multicall
# layout uniform across Linux/macOS/Windows, so tasks can keep using
# `coreutils <util>` everywhere. Bump cautiously: confirm the Windows zip
# layout hasn't reverted before raising the pin.
coreutils = "0.6.0"
dprint = "latest"
editorconfig-checker = "latest"
# ripgrep (rg): the Rust grep that tasks use in place of the host's grep.
ripgrep = "latest"
# uutils findutils (find + xargs), pinned to 0.8.0 (0.9.0 ships no binaries).
# Separate binaries, not a multicall, so the mise shims shadow the host's find /
# xargs in tasks. Every platform uses the 0.8.0 prebuilt via github: ...
"github:uutils/findutils" = { version = "0.8.0", os = ["linux/x64", "macos", "windows"] }
# ... except aarch64-linux, whose 0.8.0 release has no asset, so it builds from
# source via cargo: (same 0.8.0 pin, so every platform runs the same version).
"cargo:findutils" = { version = "0.8.0", os = ["linux/arm64"] }
# goawk: the awk that tasks invoke as `goawk` in place of the host's awk. Go, not
# Rust, but it's the one with prebuilt binaries for every platform we target.
"github:benhoyt/goawk" = "latest"
# Retries a command with exponential backoff + jitter; wraps the model fetches
# below (see the `retry` var) so a transient HTTP 429 doesn't fail the build.
# `bin = "recur"` forces mise to expose the binary as `recur` on every
# platform; without it, mise's auto-rename keeps the Windows asset's
# `recur-v<ver>-windows-amd64.exe` filename verbatim, so `recur` doesn't
# resolve on PATH inside `mise run` task bodies that call it bare.
"github:dbohdan/recur" = { version = "latest", bin = "recur" }
"github:grok-rs/waitup" = "latest"
# ONNX Runtime prebuilt -- ort-sys 2.0.0-rc.10 binds to ORT 1.22.x.
"github:microsoft/onnxruntime" = "1.22.0"
# ryl: prebuilt assets cover every platform we target except macos/x64, so that
# one slot builds from source via cargo: (same `latest` so every platform tracks
# the same release).
"cargo:ryl" = { version = "latest", os = ["macos/x64"] }
"github:owenlamont/ryl" = { version = "latest", os = ["linux", "macos/arm64", "windows"] }
"github:wasm-bindgen/wasm-bindgen" = "0.2.122"
# go: Go toolchain. Sole consumer right now is the `go:` backend that
# source-builds jqfmt (noperator/jqfmt ships no release assets); add Go
# users here as they arrive.
go = "latest"
# jqfmt: jq formatter ("like gofmt, but for jq"). Source-built by the
# go: backend because upstream ships no release assets. Used by the
# `jq-fmt` task.
"go:github.com/noperator/jqfmt/cmd/jqfmt" = "latest"
hadolint = "latest"
ls-lint = "latest"
lychee = "latest"
mprocs = "latest"
node = "22"
"npm:onnxruntime-web" = "latest"
osv-scanner = "latest"
# Aqua has no pipx build for windows/amd64. On Windows the workflow runs
# `python -m pip install pipx` separately so the `pipx:*` entries below
# still resolve through whatever pipx is already on PATH.
pipx = { version = "latest", os = ["linux", "macos"] }
# Pure-Python fixture for the et-ws-pyo3-runner `cowsay` test: proves a
# mise-installed python package lands on the embedded interpreter's sys.path
# (see `edge_toolkit::config::mise_python_site_packages`).
"pipx:cowsay" = "latest"
# semgrep lints Cargo.toml style (see `semgrep-check`), so it stays in the
# always-loaded config alongside the other repo-wide linters.
"pipx:semgrep" = "latest"
# The default aqua backend has no darwin/amd64 prebuilt; fall back to
# `npm:pnpm` on Intel Mac (node is already a mise tool above).
gh = "latest"
"npm:pnpm" = { version = "latest", os = ["macos/x64"] }
pnpm = { version = "latest", os = ["linux", "macos/arm64", "windows"] }
protoc = "latest"
# Full version triple, not a minor pin: mise installs python under a per-tool dir
# named after the request and only symlinks the `3.x` minor alias -- and that
# symlink isn't created on the Windows runner, so the py3_* interpreter paths must
# resolve to the exact `3.x.y` dir. Bump in lockstep with py3_unix/py3_win/pylib.
python = "3.13.14"
rclone = "latest"
typos = "latest"
uv = "0.11.8"
wasm-tools = "latest"
yq = "latest"
zizmor = "latest"

# Rust toolchains -- Linux/macOS only. Windows installs the gnullvm-host
# toolchains directly via config.windows.toml's own `[[tools.rust]]` entries,
# which skips the install-msvc-then-flip-to-gnullvm dance the old preinstall
# did. Both entries use `profile = "minimal"` to skip the ~1 GB rust-docs
# HTML tree per toolchain (the Nano docker build otherwise filled its disk
# during the second toolchain install -- crashing inside an HCS re-exec on
# the rust-docs HTML write under share/doc/rust/html/ with "There is not
# enough space on the disk"). Array-of-tables form rather than inline so
# each entry fits within the 120-char limit alongside `os` + the component
# / target lists; must come at the end of [tools] (TOML can't re-open the
# table after the [[ … ]] array-of-tables headers below).
[[tools.rust]]
components = "clippy,rust-analyzer"
os = ["linux", "macos"]
profile = "minimal"
targets = "wasm32-unknown-unknown,wasm32-wasip2"
version = "latest"

[[tools.rust]]
components = "rust-src,rustfmt"
os = ["linux", "macos"]
profile = "minimal"
targets = "wasm32-unknown-unknown,wasm32-wasip2"
version = "nightly"

# oxlint + oxfmt -- Rust-native JS/TS linter + formatter from the oxc-project,
# pulled directly from the shared `apps_v<tag>` GitHub release. Aqua's
# registry entry trips mise's date-filter on the `apps_v` tag prefix
# (https://github.com/oxc-project/oxc/discussions/14452), and `cargo:` is
# out because neither binary is published as a crates.io crate. The http:
# backend with per-platform `url` + `rename_exe` strips the target-suffix
# baked into the upstream binary names (e.g. `oxlint-x86_64-apple-darwin`
# -> `oxlint`) so the bare command is on PATH the same way every other
# mise tool installs.
[tools."http:oxlint"]
bin = "oxlint"
rename_exe = "oxlint"
version = "1.69.0"
[tools."http:oxlint".platforms.linux-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-aarch64-unknown-linux-gnu.tar.gz"
[tools."http:oxlint".platforms.linux-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-unknown-linux-gnu.tar.gz"
[tools."http:oxlint".platforms.macos-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-aarch64-apple-darwin.tar.gz"
[tools."http:oxlint".platforms.macos-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-apple-darwin.tar.gz"
[tools."http:oxlint".platforms.windows-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-pc-windows-msvc.zip"

# oxfmt's binary version lags oxlint's (they ship from the same apps_v tag
# but track separate semver). Pin the URL to the release tag that bundles
# both (`apps_v<oxlint_ver>` -- here apps_v1.69.0); bump that string when
# bumping oxlint above.
[tools."http:oxfmt"]
bin = "oxfmt"
rename_exe = "oxfmt"
version = "0.54.0"
[tools."http:oxfmt".platforms.linux-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-aarch64-unknown-linux-gnu.tar.gz"
[tools."http:oxfmt".platforms.linux-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-x86_64-unknown-linux-gnu.tar.gz"
[tools."http:oxfmt".platforms.macos-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-aarch64-apple-darwin.tar.gz"
[tools."http:oxfmt".platforms.macos-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-x86_64-apple-darwin.tar.gz"
[tools."http:oxfmt".platforms.windows-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v1.69.0/oxfmt-x86_64-pc-windows-msvc.zip"

# Native rustpython binary built from upstream RustPython main with
# `freeze-stdlib` (so the binary embeds the Python stdlib and doesn't
# need a RUSTPYTHONPATH dance) + the upstream pip audit-hook fix
# (RustPython#7956). Per-platform url + checksum, os-scoped to only
# those platforms whose triple's tarball is already in the rp-v<N>
# release; consumers on every other platform have no `rustpython` on
# PATH (no CI/build path depends on it today). To add a platform:
# dispatch .github/workflows/upstream-cache.yaml -- it builds + uploads
# the tarball, then auto-edits this block to add the platforms.<plat>
# entry on the maintainer's next local run. `bin = "rustpython"`
# because the tool short name (`et-rp`) doesn't match the binary name.
# Short SHA inlined in each platform's url because mise's tera context
# doesn't expose top-level `version` into platforms.<plat>.url; the
# publish task updates both `version` and the platform url together.
[tools."http:et-rp"]
bin = "rustpython"
os = ["linux", "macos", "windows"]
version = "08a1d6f"
[tools."http:et-rp".platforms.linux-arm64]
checksum = "sha256:c26df56bf3c28cb9e134abe95dd0fcf927f05487069a492a6f54ffa1c0f3dc12"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-aarch64-unknown-linux-gnu.tar.gz"
[tools."http:et-rp".platforms.linux-x64]
checksum = "sha256:75b74fd71ba338d542d9c8a512aa6e9475695f31d5e9e3d159b44d1445b9ba21"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-x86_64-unknown-linux-gnu.tar.gz"
[tools."http:et-rp".platforms.macos-arm64]
checksum = "sha256:5cdb5ed45e925ac01d12feeae453be75112d5e4d4725d44c869d63e502fcf393"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-aarch64-apple-darwin.tar.gz"
[tools."http:et-rp".platforms.macos-x64]
checksum = "sha256:2a161b533e6eab988b7a16d400b05216c37be371a142e761b917044c14cacad2"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-x86_64-apple-darwin.tar.gz"
[tools."http:et-rp".platforms.windows-x64]
checksum = "sha256:30b96e2d50ec15f7da5563b5bbce4170ee23f5fbf8565a8973889d8f25c6279a"
url = "https://github.com/edge-toolkit/core/releases/download/rp-v1/rustpython-08a1d6f-x86_64-pc-windows-msvc.tar.gz"

[vars]
# Tier-`a_` prefix: a_* vars are leaf values referenced by later vars
# (face1_src), and mise renders [vars] in alphabetical order; `a_` sorts
# before every non-prefixed var name so the reference resolves. Shared
# GitHub release tag for the HF-asset mirror; referenced by face1_src
# below + by config.maint.toml's publish-*-to-hf-cache task body. Bump
# (`hf-cache-v2`, …) when an upstream asset changes -- updating this
# single var rolls both sides.
a_hf_cache_tag = "hf-cache-v1"
# Shared GitHub release tag for both the wasm-pack rustpython_wasm tarball
# and the per-platform native rustpython binaries (both built from the
# same upstream RustPython commit, stored together). Referenced by rp_*
# vars below + by config.maint.toml's publish-rp-* task bodies.
a_rp_release = "rp-v1"
# clang-tidy's resource-dir arg (points clang at its builtin headers, e.g.
# stddef.h). Empty default; config.linux.toml sets it from conda:clangxx.
clang_resource_arg = ""
conda_openssl = "{{ env.HOME }}/.local/share/mise/installs/conda-openssl/3"
# Forward-slashed config_root (Windows mise returns a backslash-form path
# like `D:\a\core\core`; substituting that verbatim into a bash command
# line trips `\a` -> alert, `\c` -> "suppress output" string mangling
# inside busybox ash, so paths like `D:\a\core\core/target/...` become
# `D:acorecore/target/...`). Forward slashes Just Work on both shells.
# Used as the root of every workspace-relative var below.
config_root_fwd = "{{ config_root | replace(from='\\', to='/') }}"
# Absolute path to the workspace-built et-cli binary. The parallel
# build-ws-*-module tasks each invoke `et-cli module-package-json`; using
# this var (rather than `cargo run -p et-cli`) means every invocation
# execs the same pre-built binary instead of re-entering cargo, which
# avoids a race seen on macOS where one cargo's link step transiently
# unlinks `target/debug/et-cli` while another cargo's `cargo run` tries
# to exec it (`error: ... (never executed) ... No such file or directory
# (os error 2)`). The `build-et-cli` task is the dependency that puts the
# binary in place; every et-cli-using task must (directly or transitively)
# depend on it. `.exe` suffix on Windows matches cargo's output naming.
a_et_cli_exe = "et-cli{% if os() == 'windows' %}.exe{% endif %}"
a_et_cli_target_dir = "target{% if os() == 'windows' %}/x86_64-pc-windows-gnullvm{% endif %}/debug"
et_cli = "{{ vars.config_root_fwd }}/{{ vars.a_et_cli_target_dir }}/{{ vars.a_et_cli_exe }}"
# mise-managed CPython (Linux/macOS); the PYO3_PYTHON default below. Windows
# overrides PYO3_PYTHON with its own py3_win in config.windows.toml. The version
# segment must equal the `python` [tools] pin (conftest enforces both).
py3_unix = "{{ env.HOME }}/.local/share/mise/installs/python/3.13.14/bin/python3"
# RUSTFLAGS fragments shared by the CARGO_TARGET_* env in config.<os>.toml
rpath_flag = "-C link-arg=-Wl,-rpath,{{ vars.conda_openssl }}/lib"
# rpath to the mise CPython lib dir so the et-ws-pyo3-runner binary finds
# libpython at runtime (libpython3.13.so on Linux, libpython3.13.dylib on macOS
# via its @rpath install name). Points at the exact `3.x.y` install dir (the
# `python` pin), since the minor-version alias dir isn't created everywhere.
pylib_flag = "-C link-arg=-Wl,-rpath,{{ env.HOME }}/.local/share/mise/installs/python/3.13.14/lib"
wasm_rustflags = "-C target-cpu=mvp -C target-feature=+mutable-globals,+sign-ext,+nontrapping-fptoint"
# Extra flag for the wasm-pack module builds; empty so wasm-opt runs.
# config.windows.toml overrides it to --no-opt where wasm-opt can't execute.
no_opt = ""
# Linux/macOS install root for the github:microsoft/onnxruntime tool. The
# ORT_LIB_LOCATION env below resolves to it via the OS conditional. Version
# segment must match the [tools] pin (conftest's version_drift enforces this).
ort_loc_unix = "{{ env.HOME }}/.local/share/mise/installs/github-microsoft-onnxruntime/1.22.0"
# Source/dest paths for the fetch-*-rclone model downloads — kept as vars so
# each `rclone copyto` command stays on a single line without continuations.
# face1's RetinaFace_int.onnx is mirrored to edge-toolkit/core's hf-cache-v<N>
# release because HuggingFace 429s the CI runner IP pool during prefetch
# (every docker-linux lane that hits amd/retinaface concurrently exhausts
# recur's 10 retries). face1_asset pins the upstream amd/retinaface commit
# SHA (short); config/checksums.toml records the matching SHA256; the
# `publish-face1-to-hf-cache` task in config.maint.toml (MISE_ENV=maint)
# refreshes both sides + the release asset together.
# config/conftest/policy/checksums.rego cross-checks them.
face1_asset = "RetinaFace_int-7b69507.onnx"
face1_dst = "data/model-modules/model-face1/pkg/video_cv.onnx"
face1_src = ":http:edge-toolkit/core/releases/download/{{ vars.a_hf_cache_tag }}/{{ vars.face1_asset }}"
har_dst = "data/model-modules/model-har-motion1/pkg/har-motion1.onnx"
har_repo = ":http:acd17sk/MET-Metabolic-Equivalent-of-Task-AI-Android-APP"
har_src = "{{ vars.har_repo }}/raw/refs/heads/main/Models/onnx/hybrid_met.onnx"
mnist_dst = "services/ws-modules/wasi-graphics-info/pkg/mnist-12.onnx"
mnist_src = ":http:onnx/models/raw/main/validated/vision/classification/mnist/model/mnist-12.onnx"
# Pip 26.0.1 wheel via PyPI -- pinned because pip 26.1.1+ calls
# `sys.addaudithook` in `_prevent_further_imports`, which RustPython 0.5.0
# doesn't implement (RustPython#7956). Used to bootstrap pipx on rustpython
# (config.windows.toml's preinstall, the Nano-Server arm) and to probe pip
# + pipx behaviour generally (config.maint.toml's rustpython-investigation).
# `_sha` is the SHA256-prefix dir PyPI uses for `packages/`; rclone composes
# the full URL via `--http-url https://files.pythonhosted.org`.
pip_for_rustpython = "26.0.1"
pip_for_rustpython_sha = "de/f0/c81e05b613866b76d2d1066490adf1a3dbc4ee9d9c839961c3fc8a6997af"
pip_for_rustpython_wheel = "pip-{{ vars.pip_for_rustpython }}-py3-none-any.whl"
pip_for_rustpython_wheel_url = ":http:packages/{{ vars.pip_for_rustpython_sha }}/{{ vars.pip_for_rustpython_wheel }}"
# Pre-built rustpython_wasm tarball: upstream RustPython main built with
# wasm-pack --target web; `freeze-stdlib` is the default crates/wasm
# feature so the .wasm embeds the Python stdlib (no RUSTPYTHONPATH dance
# needed at consumer-side). Tracks main HEAD so the upstream `pip` audit-
# hook fix (RustPython#7956) is in. rp_wasm_asset pins the upstream short
# SHA; config/checksums.toml records the matching SHA256; built + uploaded
# by config.maint.toml's `publish-rp-wasm-to-release` (sharing the rp-v<N>
# release tag with the native rustpython binary builds).
rp_wasm_asset = "rustpython-wasm-08a1d6f.tar.gz"
rp_wasm_dir = "{{ vars.config_root_fwd }}/target/cache/rp-wasm"
rp_wasm_src = ":http:edge-toolkit/core/releases/download/{{ vars.a_rp_release }}/{{ vars.rp_wasm_asset }}"
# `retry` prefixes each fetch with recur for exponential-backoff-with-jitter
# retries (10 tries, 2s base doubling, capped 3m, 0-15s jitter). `-v` makes
# recur log each attempt's exit code + delay so an exhausted retry chain
# shows what happened on every attempt, not just the terminal "maximum N
# attempts reached". Pair with `echo "[task] fetching X..."` before the
# retry call so the chain knows what was being fetched.
#
# `mise exec -- recur` instead of bare `recur` is load-bearing on Windows:
# mise installs recur with a .cmd file-shim, and mise's own task runner
# (without `shell =`) only resolves `.exe` extensions on PATH, so a bare
# `recur` from cmd.exe fails with "not recognized". Routing via `mise exec`
# lets mise's tool-registry resolution find the binary directly. The
# alternative -- `shell = "bash -euo pipefail -c"` on every retry-using
# task -- forces recur to run under MSYS2 bash, whose fork emulation
# eventually exhausts the parent process's address space (cygheap copy
# failed, Win32 error 299) when prefetch tasks issue many retries in
# series; mise exec calls Windows CreateProcess directly so each retry
# is a clean process spawn with no inherited heap.
gh_http = "--http-url https://github.com --progress --ignore-existing"
# Both halves go through `mise exec`: the outer one runs recur via mise's tool
# registry (so cmd.exe doesn't have to find recur on PATH), the inner one
# does the same for the retried command. The inner wrap is load-bearing on
# Windows: without it, recur spawns the child via PATH, Windows finds the
# `.cmd` file-shim under `%LOCALAPPDATA%\mise\shims` first (prepended to
# PATH by install-mise), and the shim re-enters cmd.exe with another
# `setlocal` -- the chain blows cmd's setlocal stack with
#   Maximum setlocal recursion level reached.
#   The syntax of the command is incorrect.
# (Observed in https://github.com/edge-toolkit/core/actions/runs/27757019179/job/82121311779
# on bc0c48318c29178bba2eb0c9a1b3f8098a7574e1 — `mise run prefetch:rust` under pwsh.)
# Routing the inner command through mise exec uses the tool-registry path,
# bypasses the .cmd shim, and exits cleanly.
retry = "mise exec -- recur -v --attempts 10 --delay 2s --backoff 2s --max-delay 3m --jitter 0,15s -- mise exec --"

[env]
# Comma-separated list of every language env (one per .mise/config.<lang>.toml).
# Used as MISE_ENV by the *-all tasks to act on every language at once (mise has
# no MISE_ENV=all). Hardcoded rather than shell-discovered so it works on Windows
# too — keep in sync when adding/removing a config.<lang>.toml.
ALL_LANGS = "dart,dotnet,java,python,rust,zig"
CLIPPY_CONF_DIR = "{{ config_root }}/config"
TAPLO_CONFIG = "{{ config_root }}/config/taplo.toml"
# Use the conda:openssl install for Rust's OPENSSL_DIR so openssl-sys crate builds.
OPENSSL_DIR = "{{ vars.conda_openssl }}"

# pyo3-ffi (et-ws-pyo3-runner) links its embedded interpreter at build time from
# PYO3_PYTHON, else the first python on PATH -- under mise that's the 32-bit
# Pyodide shim ("target architecture (64-bit) does not match ... (32-bit)"). Pin
# it to the mise-managed CPython. Always-loaded so `cargo check --workspace`
# builds the pyo3 runner without MISE_ENV=python. This is the Linux/macOS path;
# config.windows.toml overrides it with py3_win.
PYO3_PYTHON = "{{ vars.py3_unix }}"
RCLONE_CONFIG = "{{ config_root }}/config/rclone.conf"
RCLONE_RETRIES = "1"

# Direct ort-sys (workspace `ort` dep) at the mise-staged ONNX Runtime install
# (github:microsoft/onnxruntime above) instead of fetching at build time. The
# workspace dep dropped the `download-binaries` feature, so SKIP_DOWNLOAD is
# belt-and-braces (the download code path is gone).
ORT_LIB_LOCATION = "{% if os() == 'windows' %}{{ vars.ort_loc_win }}{% else %}{{ vars.ort_loc_unix }}{% endif %}"
ORT_SKIP_DOWNLOAD = "1"

[tasks]
ec = "ec"
editorconfig-check = "ec"

[tasks.dprint-check]
env = { DPRINT_CACHE_DIR = "{{ config_root }}/target/dprint-cache" }
run = "dprint check"

[tasks.dprint-fmt]
run = "dprint fmt"

[tasks.jq-fmt]
description = "Format every checked-in .jq file with jqfmt (in-place)"
# jqfmt prints the formatted body to stdout (no -w flag); pipe it through
# goawk to strip the trailing space jqfmt's `-op pipe` mode leaves at the
# end of each broken-pipe line, then rewrite via tmp + rename.
# NOTE: jqfmt strips leading/trailing `#` comments -- if a .jq file has
# docstring-style header comments worth keeping, lift them into the
# calling task / source-of-truth file before running this.
run = """
git ls-files '*.jq' | while read -r f; do
  jqfmt -f "$f" -op pipe -ob -ar | goawk '{ sub(/[ \\t]+$/, ""); print }' > "$f.tmp"
  coreutils mv "$f.tmp" "$f"
done
"""
shell = "bash -euo pipefail -c"

[tasks.oxfmt-check]
description = "Check JS/TS formatting (oxfmt)"
# oxfmt walks the working tree from CWD, honouring .gitignore (so target/,
# all pkg/ dirs, node_modules, etc. are skipped). Runs alongside dprint --
# dprint's typescript plugin formats the same files, and config/oxfmtrc.jsonc
# tunes oxfmt (printWidth=120) so its output matches dprint's typescript
# plugin (which is matched-back via arrowFunction.useParentheses + member
# linePerExpression in config/dprint.jsonc). `fmt:rust` orders oxfmt-fmt
# before dprint-fmt so dprint has the last word on residual disagreements.
#
# The positional `!.mise/config*.toml` is a workaround for an oxfmt 0.54.0
# bug: oxfmt's content-based JS detection mis-parses the multiple `"""..."""`
# TOML basic-multiline strings in these files as JS template literals (and
# silently concatenates `description = "..."` into the closing `"""` of an
# adjacent `run = """..."""` block on --write); it also flattens short TOML
# arrays like `depends = [...]` into single lines because they look like JS
# arrays under 120 chars. The `ignorePatterns: ["**/*.toml"]` in
# config/oxfmtrc.jsonc filters every other TOML file correctly but fails to
# match dotfile-directory paths like `.mise/config*.toml`, so we override
# here positionally.
run = "oxfmt --config config/oxfmtrc.jsonc --check . '!.mise/config*.toml'"

[tasks.oxfmt-fmt]
description = "Format JS/TS sources in place (oxfmt)"
run = "oxfmt --config config/oxfmtrc.jsonc --write . '!.mise/config*.toml'"

[tasks."fmt:rust"]
# Rust + universal formatters. Always-loaded, so `fmt`'s glob always matches it.
# oxfmt-fmt before dprint-fmt: both touch JS/TS, so the second pass wins;
# dprint stays the source of truth for any disagreements on JS style.
depends = ["cargo-clippy-fix", "cargo-fmt", "dprint-fmt", "jq-fmt", "oxfmt-fmt", "taplo-fmt"]
description = "Run the Rust + universal repo-wide formatters"

[tasks.fmt]
# Native `depends` glob (not a nested `mise run`) so it works on Windows and
# activates each task's tools. fmt:rust is always loaded, so the glob never
# matches zero (which mise would error on); guest fmt:<lang> join when loaded.
depends = ["fmt:*"]
description = "Run all formatters: fmt:rust + any loaded guest fmt:<lang>"

[tasks."check:rust"]
# Rust + universal repo-wide checks. Lives in the always-loaded default config,
# so `check`'s `check:*` glob always matches at least this one (Rust is in the
# default config this pass; the guest `check:<lang>` tasks come from their
# loaded MISE_ENV configs).
depends = [
  "action-validator",
  "ast-grep-check",
  "cargo-check",
  "cargo-clippy-check",
  "cargo-doc-check",
  "cargo-fmt-check",
  "conftest-check",
  "docker-check",
  "dprint-check",
  "editorconfig-check",
  "gen-help-check",
  "gen-specs-check",
  "hadolint-check",
  "link-check",
  "ls-lint-check",
  "oxfmt-check",
  "oxlint-check",
  "regal-check",
  "ryl-check",
  "semgrep-check",
  "shellcheck-mise-check",
  "taplo-check",
  "taplo-fmt-check",
  "typos",
  "verification-check",
  "zizmor-check",
]
description = "Run the Rust + universal repo-wide checks"

[tasks.check]
# Native `depends` glob: check:rust and every loaded guest check:<lang> run as
# parallel siblings (all report, none gated), with each task's tools activated.
# check:rust is always loaded so the glob never matches zero. (Avoid a nested
# `mise run 'check:*'` — that breaks tool activation and the `[env]` exec on
# Windows.)
depends = ["check:*"]
description = "Run all checks: check:rust + any loaded guest check:<lang>"

[tasks."fix:rust"]
# Rust + universal lint-fix passes. Distinct from fmt:rust (style/whitespace
# formatters) -- these apply auto-rewrites for actual lint violations.
depends = ["ast-grep-fix", "cargo-clippy-fix", "oxlint-fix", "regal-fix", "semgrep-fix", "typos-fix"]
description = "Apply Rust + universal lint-fix passes"

[tasks.fix]
# Same glob shape as fmt/check. fix:rust is always loaded, so the glob never
# matches zero; guest fix:<lang> tasks join when their MISE_ENV is loaded.
depends = ["fix:*"]
description = "Apply all lint-fix passes: fix:rust + any loaded guest fix:<lang>"

[tasks.action-validator]
description = "Validate GitHub Actions workflow YAML"
run = "action-validator .github/workflows/*.yaml"

[tasks.zizmor-check]
description = "Audit GitHub Actions workflows for security issues (zizmor)"
# --offline so it needs no GH token and stays deterministic; config/zizmor.yaml
# turns off the hash-pin policy (we pin actions by tag, not commit).
run = "zizmor --offline --no-progress -c config/zizmor.yaml .github/workflows"

[tasks.ls-lint-check]
description = "Lint file and directory naming conventions (ls-lint)"
run = "ls-lint --config config/ls-lint.yaml"

[tasks.oxlint-check]
description = "Lint JavaScript/TypeScript sources (oxlint)"
# oxlint walks the working tree from CWD, honouring .gitignore; no path arg
# needed. Errors fail the task (correctness category, lifted in oxlintrc); warnings
# print but don't fail -- the initial introduction kept stylistic warnings visible
# rather than blocking on the existing module shims' style. Tighten with
# `--deny-warnings` once those are cleaned up.
run = "oxlint --config config/oxlintrc.jsonc"

[tasks.oxlint-fix]
description = "Auto-fix oxlint violations that have a machine-applicable suggestion"
run = "oxlint --config config/oxlintrc.jsonc --fix"

[tasks.ast-grep-check]
# --no-ignore hidden so the gha-* YAML rules reach .github/workflows (ast-grep
# skips dot-dirs by default); gitignored paths like target/ stay skipped.
description = "Run ast-grep structural-search rules"
run = "ast-grep scan --error --no-ignore hidden -c config/ast-grep/sgconfig.yaml"

[tasks.ast-grep-fix]
description = "Apply autofix for ast-grep rules that define a `fix:` field"
run = "ast-grep scan --update-all --no-ignore hidden -c config/ast-grep/sgconfig.yaml"

[tasks.semgrep-check]
description = "Run Semgrep generic-mode rules (e.g. Cargo.toml style)"
run = "semgrep scan --config config/semgrep --error --metrics=off ."

[tasks.semgrep-fix]
description = "Apply autofix for Semgrep rules that define a `fix:` field"
run = "semgrep scan --config config/semgrep --autofix --metrics=off ."

[tasks.hadolint-check]
description = "Lint the Dockerfiles with hadolint"
run = "git ls-files '*Dockerfile' '*Dockerfile.*' | xargs hadolint --config config/hadolint.yaml"

[tasks.cargo-check]
run = "cargo check --workspace"

[tasks.cargo-fmt]
run = "cargo +nightly fmt"

[tasks.cargo-fmt-check]
run = "cargo +nightly fmt -- --check"

[tasks.cargo-clippy-check]
alias = ["cargo-clippy", "clippy", "clippy-check"]
run = "cargo clippy --keep-going --workspace --tests"

[tasks.cargo-clippy-check-pkg]
alias = ["clippy-pkg"]
description = "cargo clippy on a single workspace package (narrow inner-loop check)"
# Same flags as cargo-clippy-check minus --workspace. Usage-spec captures
# the package name and exposes it as $usage_package; a missing arg fails up
# front with mise's auto-generated usage message instead of clippy's generic
# "--package <SPEC> not found" error.
run = 'cargo clippy --keep-going --tests -p "$usage_package"'
usage = 'arg "<package>" help="Workspace package name (e.g. edge-toolkit)"'

[tasks.cargo-doc-check]
description = "Type-check rustdoc with -D warnings to fail on any doc issues"
# Uses nightly rustdoc's `--check` (gated behind -Z unstable-options) so the
# task runs the front-end -- intra-doc link resolution + doc-comment
# type-check -- but skips HTML emission. No `target/doc/` churn; faster
# than a full doc build. Nightly is already in [tools] for `cargo +nightly
# fmt`. Drop `-Z unstable-options --check` and switch back to plain
# `cargo doc` once rustdoc stabilises `--check`.
env = { RUSTDOCFLAGS = "-Z unstable-options --check -D warnings" }
run = "cargo +nightly doc --keep-going --workspace --no-deps --document-private-items"

[tasks.cargo-clippy-fix]
run = "cargo clippy --fix --allow-dirty --allow-staged --keep-going --workspace --tests"

[tasks.taplo-fmt]
alias = "toml-fmt"
run = "taplo format"

[tasks.taplo-fmt-check]
alias = "toml-fmt-check"
run = "taplo format --check"

[tasks.conftest-check]
depends = ["conftest-check-*"]
description = "Run all conftest policy checks (one per parsed file format)"

[tasks.conftest-check-toml]
description = "Run conftest OPA/Rego policies over the TOML config + lock files"
# --combine feeds every listed file to one policy evaluation as an array of
# {path, contents}, so a policy can both check each file and compare across files
# (the mise wasm-bindgen pin vs Cargo.lock; the .mise/config*.toml *_asset vars
# vs config/checksums.toml). --parser toml: Cargo.lock has no .toml suffix.
# The TOML rule namespaces are listed explicitly, so the per-file `gha` (YAML)
# namespace is never evaluated against this combined TOML input.
run = """
ns_list="cross cargo mise pyproject no_trailing_backslash checksums"
# $ns_list iteration relies on word-splitting; $ns expands to repeated `--namespace <n>` pairs.
# shellcheck disable=SC2086
ns=$(for n in $ns_list; do echo -n " --namespace $n"; done)
# shellcheck disable=SC2086
git ls-files '*Cargo.toml' '.mise/config*.toml' '*pyproject.toml' Cargo.lock config/checksums.toml |
  xargs conftest test --combine --parser toml $ns -p config/conftest/policy
"""
shell = "bash -euo pipefail -c"

[tasks.conftest-check-yaml]
description = "Run conftest OPA/Rego policies over the GitHub Actions workflow YAML"
# Two passes: per-file rules (gha, no_trailing_backslash) for shape/content
# checks that don't need a file path; --combine rules (gha_combined) for
# cross-cutting invariants where the rule has to compare each workflow's
# parsed body against its own filename (the `paths:` self-reference check).
# Conftest's per-file mode has no `input.path`, so `gha_combined` lives in
# its own pass.
run = """
ns="--namespace gha --namespace no_trailing_backslash"
# $ns expands to repeated `--namespace <n>` pairs; word-splitting is intentional.
# shellcheck disable=SC2086
conftest test --parser yaml $ns -p config/conftest/policy .github/workflows
conftest test --parser yaml --combine --namespace gha_combined -p config/conftest/policy .github/workflows
"""
shell = "bash -euo pipefail -c"

[tasks.conftest-check-dockerfile]
description = "Cross-check Dockerfiles against mise [tools] pins + heredoc body-first-line invariants"
# Two passes over each Dockerfile:
#   1. `dockerfile` parser (default) for AST-shape rules: version drift,
#      pipx-disable, RUN heredoc must invoke bash. Combined with .mise so the
#      AST rules can compare against [tools] pins.
#   2. `ignore` parser, which preserves every line of the file as a separate
#      entry -- conftest's dockerfile parser flattens heredoc bodies out of the
#      AST, so the body-first-line `set -euo pipefail` check lives in its own
#      namespace + parser.
# Each git-tracked Dockerfile* gets both passes.
run = """
files=$(git ls-files '*Dockerfile' '*Dockerfile.*')
# $files is a newline-separated path list; word-splitting is intentional (no spaces in paths).
# shellcheck disable=SC2086
conftest test --combine --namespace dockerfile -p config/conftest/policy $files .mise
# Filter to Dockerfiles that actually use heredocs before invoking the
# `ignore` parser: conftest 0.68.2's ignore parser panics with
# `runtime error: slice bounds out of range` on plain Dockerfiles (no
# heredocs). The body-first-line rule has nothing to check there anyway.
for f in $files; do
  if rg -q '^RUN[^\n]*<<' "$f"; then
    conftest test --parser ignore --namespace dockerfile_heredoc -p config/conftest/policy "$f"
  fi
done
"""
shell = "bash -euo pipefail -c"

[tasks.regal-check]
description = "Lint Rego policy files with Regal (style, idiomatic, bugs)"
# config/regal.yaml carves out conftest-specific patterns (multiple `deny`
# rules per file, cross-package data references, no OPA entrypoints).
run = "regal lint -c config/regal.yaml config/conftest/policy/"

[tasks.regal-fix]
description = "Auto-fix the regal violations that have an auto-fixer (e.g. opa-fmt)"
run = "regal fix -c config/regal.yaml config/conftest/policy/"

[tasks.shellcheck-mise-check]
description = "shellcheck every bash-shell mise task body across .mise/config*.toml"
# Extract each `[tasks.X] run = """..."""` whose `shell` starts with bash and
# whose `run` is multi-line, drop it into target/scratch/shellcheck-mise/ with
# a synthetic shebang + `set -euo pipefail`, then shellcheck the lot.
# Tera tokens `{{ ... }}` are masked to `MISEVAR` (a valid bash word) and
# `{% ... %}` to empty so shellcheck doesn't choke on template syntax. The
# awk regex uses character classes (`[{][{]` not `{{`) so mise's own Tera
# render of this task body doesn't itself trip on the awk source. The jq
# filter at .mise/shellcheck-mise.jq emits one `<name> <body-b64>` line per
# eligible task (base64 so newlines + quotes survive the pipe).
run = '''
boot="{{ vars.config_root_fwd }}/target/scratch/shellcheck-mise"
coreutils rm -rf "$boot"
coreutils mkdir -p "$boot"
mask='{ gsub(/[{][{][^}]*[}][}]/, "MISEVAR"); gsub(/[{][%][^%]*[%][}]/, ""); print }'
for cfg in .mise/config*.toml; do
  stem=$(coreutils basename "$cfg" .toml)
  yq -p toml -o json "$cfg" | jaq -r -f .mise/shellcheck-mise.jq | while read -r name b64; do
    out="$boot/${stem}__${name}.sh"
    {
      echo '#!/usr/bin/env bash'
      echo 'set -euo pipefail'
      printf '%s' "$b64" | coreutils base64 -d | goawk "$mask"
    } > "$out"
  done
done
shellcheck --shell=bash --exclude=SC2034,SC2154 "$boot"/*.sh
'''
shell = "bash -euo pipefail -c"

[tasks.taplo-check]
alias = "toml-check"
# `taplo lint` reads config/taplo.toml's `[[rule]] schema` entries for editor /
# LSP-style validation, but silently ignores their nested constraints in
# CLI mode (verified: injecting `path = "../foo"` into a member Cargo.toml
# doesn't fire `no-path-deps` via the rule alone). We work around it by
# applying each schema explicitly with `taplo lint --schema file://...`.
# conftest-check-toml (config/conftest/policy) intentionally duplicates these
# lints; running both is fine.
run = """
taplo lint

# The --schema lints below pass file://$PWD URLs, which aren't well-formed on
# Windows (drive-letter paths); run them on Linux/macOS only. conftest-check-toml
# applies the same rules on every OS.
[ "${OS:-}" = "Windows_NT" ] && exit 0

# All member Cargo.tomls — exclude workspace root and any build output.
# `-prune` target/ and .git so find never descends into them: `-not -path`
# alone still walks the whole tree, and target/debug/deps/ churns constantly
# under a concurrent `cargo-check`, racing find into "No such file" errors.
# POSIX sh (no bash arrays / process substitution -- the tasks run on busybox
# ash on Windows): collect the paths into a temp file once and feed each schema
# run via xargs.
members="$(mktemp)"
trap 'rm -f "$members"' EXIT
find . -path ./target -prune -o -path ./.git -prune -o -name Cargo.toml ! -path ./Cargo.toml -print >"$members"

# Banned deps only need to be checked at the workspace root: member
# crates are required to reference deps via `workspace = true` (the
# `require-workspace-deps` schema below), so any banned dep can only
# enter the build through `[workspace.dependencies]` here.
taplo lint --schema "file://$PWD/config/taplo/no-banned-deps.schema.json" Cargo.toml

# Schemas that apply to every member crate.
xargs taplo lint --schema "file://$PWD/config/taplo/no-path-deps.schema.json" <"$members"
xargs taplo lint --schema "file://$PWD/config/taplo/no-wildcard-or-git-deps.schema.json" <"$members"
xargs taplo lint --schema "file://$PWD/config/taplo/require-workspace-deps.schema.json" <"$members"
xargs taplo lint --schema "file://$PWD/config/taplo/require-lib-doctest-false.schema.json" <"$members"
xargs taplo lint --schema "file://$PWD/config/taplo/no-lib-name.schema.json" <"$members"

# `require-lints-section` exempts generated/rust-rest/Cargo.toml because
# progenitor's emitted `src/lib.rs` contains patterns our workspace lint
# table flags (e.g. doc-comment shapes that trip rustdoc's invalid-code-
# block lint). Inheriting `[lints] workspace = true` would fail the build
# on the generated source. The exemption is about the lint table, not
# about the deps — its `[dependencies]` still inherits from
# `[workspace.dependencies]` like every other crate.
rg -vxF './generated/rust-rest/Cargo.toml' "$members" |
  xargs taplo lint --schema "file://$PWD/config/taplo/require-lints-section.schema.json"

taplo lint --schema "file://$PWD/config/taplo/mise-run-not-array.schema.json" .mise/config*.toml

taplo lint --schema "file://$PWD/config/taplo/mise-no-ubi-backend.schema.json" .mise/config*.toml
# config.maint.toml is exempted from the cargo:-backend allowlist (one-off
# maint tools can be slow cargo source-builds; see mise.rego's matching note).
non_maint=$(find .mise -maxdepth 1 -name 'config*.toml' ! -name 'config.maint.toml')
# $non_maint holds a space-separated path list; word-splitting is intentional.
# shellcheck disable=SC2086
taplo lint --schema "file://$PWD/config/taplo/mise-cargo-backend-allowlist.schema.json" $non_maint
"""
shell = "bash -euo pipefail -c"

[tasks.typos]
run = "typos --config config/typos.toml"

[tasks.typos-fix]
description = "Auto-correct typos detected by the typos linter"
run = "typos --config config/typos.toml --write-changes"

# Part of the `check` aggregate. lychee makes live network requests, so
# config/lychee.toml is tuned (retries, 429-tolerance, disk cache) to keep it
# from being flaky. Checks every URL in the repo's Markdown + Rust sources;
# lychee extracts URLs from .rs comments and string literals too.
[tasks.link-check]
description = "Check that URLs in .md and .rs files are reachable (network)"
run = "lychee --config config/lychee.toml '**/*.md' '**/*.rs'"

[tasks.ryl-check]
description = "Lint YAML with ryl (a yamllint-compatible Rust linter)"
run = "ryl -c config/ryl.yaml .github config"

[tasks.setup-aube]
# `aube` is an OPTIONAL faster npm backend, kept out of the mandatory `[tools]`
# list because its install is flaky on some platforms and edge-toolkit falls
# back to the classical `lib/node_modules` layout without it (see
# `find_npm_modules_path_in`).
#
# CI (check.yaml / test.yaml) runs this task in its own allowed-to-fail step,
# placed BEFORE the main `mise install` so the `npm:onnxruntime-web` install
# can pick up aube as its backend.
#
# Platform split: aqua ships aube for linux/macos-arm64/windows; macos/x64 has
# no aqua asset, so use the cargo backend there. The branch is rendered by
# mise's tera templating to pick the right backend per platform.
description = "Install the optional aube npm backend (platform-specific, best-effort)"
run = """
{% if os() == "macos" and arch() == "x64" %}
mise install cargo:aube@latest
{% else %}
mise install aube@latest
{% endif %}
"""
shell = "bash -euo pipefail -c"

[tasks._setup_all]
description = "Private shared cross-platform preinstall"
hide = true
run = """
# gpg must land BEFORE `mise install node` below: node's gpg-verify path
# (mise/src/plugins/core/node.rs) hard-fails when gpg_verify is enabled and
# gpg isn't reachable. Per-platform package: conda:gnupg on Linux/macOS
# (conda-forge has no win-64 build), conda:m2-gnupg on Windows (msys2 mirror
# package; config.windows.toml adds its bin to `_.path` so subprocess PATH
# picks up gpg.exe -- otherwise mise's per-tool .mise-bins misses the nested
# `Library/usr/bin` layout).
{% if os() == 'windows' %}mise install conda:m2-gnupg{% else %}mise install conda:gnupg{% endif %}
mise install gh
mise install cargo-binstall
mise install node
mise install conda:openssl
mise install coreutils
mise install ripgrep
# goawk lands here in _setup_all so it's available to every later step that
# may need `awk` -- third-party scripts (dotnet-install.sh on Linux, others)
# hard-code bare `awk`, and the per-OS preinstalls below symlink mise's
# `goawk` into `awk` on hosts where the base image lacks one (Azure Linux
# base/core notably). Installing here, not in the per-OS preinstall body,
# keeps the `mise which goawk` call those use guaranteed to resolve.
mise install github:benhoyt/goawk
# recur is the `{{ vars.retry }}` prefix used by every rclone fetch in
# the preinstall task bodies below (face1/har/mnist/pip-for-rustpython).
# Land it here so the per-OS preinstalls don't trip with `recur: not
# found` (seen on Nano Server: the per-OS preinstall ran the pip-26.0.1
# fetch before `mise install` -- which would have installed recur --
# had run).
mise install github:dbohdan/recur
# rclone is the actual fetcher recur wraps. Same reasoning: without
# this, the rustpython pipx bootstrap in config.windows.toml's preinstall
# trips `recur: command was not found` for 10 attempts because rclone
# wasn't installed yet.
mise install rclone
"""
shell = "bash -euo pipefail -c"

[tasks.osv-scanner]
# Scans the committed Cargo.lock only -- no build dependency, so the same task
# serves both ad-hoc local use and the dependencies workflow.
run = "osv-scanner --lockfile Cargo.lock --config config/osv-scanner.toml"

[tasks."gen:osv-scanner"]
description = "Regenerate config/osv-scanner.toml from config/deny.toml's [advisories].ignore list"
# osv-scanner and cargo-deny must ignore the same advisory IDs; config/deny.toml
# is the source of truth (it carries the per-ID rationale). rg + coreutils only, so
# the `dependencies` workflow can run it (via mise) next to the audit binaries.
run = """
{
  # backticks in the echoed line are literal markdown, not command substitution.
  # shellcheck disable=SC2016
  echo '# AUTO-GENERATED from config/deny.toml by `mise run gen:osv-scanner`.'
  echo 'IgnoredVulns = ['
  rg -oN -r '  { id = $0 },' '"RUSTSEC-[0-9]{4}-[0-9]{4}"' config/deny.toml | coreutils sort -u
  echo ']'
} > config/osv-scanner.toml
"""
shell = "bash -euo pipefail -c"

[tasks.cargo-deny-check]
description = "Audit dependencies with cargo-deny (advisories, bans, licenses, sources)"
# Escalate `no-license-field` to a hard error, EXCEPT for crates with an
# explicit clarify entry in config/deny.toml. cargo-deny has no per-crate
# diagnostic-level config, so we post-filter its output: any
# `warning[no-license-field]` whose crate isn't allowlisted (currently just
# `saffron`) fails the task. A new transitive dep without an SPDX `license`
# expression must then land in clarify intentionally, not silently.
run = """
rc=0
out="$(cargo deny check --config config/deny.toml 2>&1)" || rc=$?
echo "$out"
extra="$(echo "$out" | rg 'warning\\[no-license-field\\]' | rg -v 'saffron' || true)"
if [ -n "$extra" ]; then
  echo "ERROR: no-license-field warning for crate not in clarify allowlist:" >&2
  echo "$extra" >&2
  exit 1
fi
exit "$rc"
"""
shell = "bash -euo pipefail -c"

[tasks.cargo-unmaintained-check]
description = "Flag dependencies whose upstream repo is archived or unmaintained"
# cargo-unmaintained is deliberately NOT a mise [tool]: it has no prebuilt and a
# from-source `cargo install` is too heavy to pay on every `mise install`. The
# `dependencies` workflow installs it via taiki-e/install-action; this task just
# runs the binary so the audit command lives beside the others. A GITHUB_TOKEN in
# the env lets it check each upstream repo's archival status.
run = "cargo unmaintained"

[tasks."gen:dockerignore"]
description = "Regenerate .dockerignore from .gitignore + Docker-only excludes"
# Docker reads only the root .dockerignore (never .gitignore or nested ignore
# files), and a bare pattern there is root-anchored -- whereas a slash-less
# .gitignore pattern matches at any depth. So mirror .gitignore, add the
# Docker-only excludes (`.git/`, plus the build recipe + docs so editing them
# doesn't bust the `COPY . .` cache), and `**/`-prefix each non-anchored pattern.
run = '''
{
  echo "# AUTO-GENERATED from .gitignore by 'mise run gen:dockerignore' -- do not edit."
  echo "# Docker reads only this file; patterns are **/-prefixed to match at any depth"
  echo "# like .gitignore. Edit .gitignore and regenerate."
  echo
  {
    cat .gitignore
    printf '%s\n' '.git/' 'Dockerfile*' '/README.md' '.dockerignore'
  } | goawk '
    /^[[:space:]]*#/ { print; next }
    /^[[:space:]]*$/ { print; next }
    {
      neg = ""; line = $0
      if (substr(line, 1, 1) == "!") { neg = "!"; line = substr(line, 2) }
      if (substr(line, 1, 1) == "/") { print neg substr(line, 2); next }
      core = line; sub(/\/$/, "", core)
      if (index(core, "/") > 0) print neg line; else print neg "**/" line
    }
  '
} >.dockerignore
'''
shell = "bash -euo pipefail -c"

[tasks.docker-check]
depends = ["gen:dockerignore"]
description = "Fail if .dockerignore is stale vs .gitignore (run `mise run gen:dockerignore`)"
run = "git diff --exit-code -- .dockerignore"

[tasks.prefetch-ci]
# `build-ws-wasm-agent` produces `services/ws-wasm-agent/pkg/`, which the
# static workspace references via a `link:` path. Run it before `pnpm install`
# so the link target exists. Only `fetch-mnist-rclone` is pulled here —
# CI tests don't exercise the face1 / har-motion1 models, and skipping
# those avoids the HuggingFace rate-limit that bites Windows runners.
#
# `prefetch:rust` + `prefetch:node` live in this default config (always
# loaded), so the `prefetch:*` glob never matches zero; guest-language
# `prefetch:<lang>` tasks join from their loaded MISE_ENV configs. Native
# `depends` glob (not a nested `mise run`) so each task's tools are activated —
# a nested run left `dart`/`zig` off PATH on Windows.
depends = ["fetch-mnist-rclone", "prefetch:*"]
description = "Pre-download CI-required dependencies + the MNIST model"

[tasks.prefetch]
depends = ["fetch-face1-rclone", "fetch-har-motion1-rclone", "prefetch-ci"]
description = "Pre-download all dependencies and models (superset of prefetch-ci)"

[tasks."prefetch:rust"]
description = "Prefetch the Rust (cargo) dependencies"
# `cargo fetch` downloads the full Cargo.lock graph (all targets) without
# compiling — the actual build happens in build-modules / the test step. Avoids
# the redundant `cargo check --workspace` compile (and its large target/ dir).
# Wrapped in `recur` (the same retry shim the rclone fetches use) because
# crates.io occasionally drops the HTTP/2 framing mid-fetch (`[16] Error
# in the HTTP2 framing layer (Send failure: Connection reset by peer)`,
# surfacing as `curl failed`). cargo's built-in CARGO_NET_RETRY doesn't
# cover that class of failure -- the HTTP/2 framing reset bypasses
# cargo's own retry path. recur wraps the entire command so any
# non-zero exit triggers a retry with exponential backoff + jitter.
# `{{ vars.retry }}` expands to `mise exec -- recur ...` so the cmd.exe
# default shell on Windows can find recur via mise's tool registry
# (no .cmd-extension PATH search, no MSYS-bash fork chain).
run = "{{ vars.retry }} cargo fetch"

[tasks."prefetch:node"]
# Needs `build-ws-wasm-agent` first: the static workspace `link:`s its `pkg/`,
# so the link target must exist before `pnpm install`.
depends = ["build-ws-wasm-agent"]
description = "Prefetch the Node (pnpm) static workspace"
# pnpm refuses non-TTY destructive node_modules cleanup unless CI=true, which
# fires when an earlier install left a different layout. Treat as a CI batch.
env = { CI = "true" }
run = "pnpm install --dir services/ws-server/static --ignore-scripts --config.ignoredBuiltDependencies=protobufjs"

[tasks.regenerate-verification]
alias = "regen-verification"
description = "Regenerate checked-in verification output files"
run = "cargo run -p et-cli -- regen-verification"

[tasks.verification-check]
depends = ["regenerate-verification"]
description = "Fail if generated scenario output files are stale"
run = "git diff --exit-code -- verification/"

# HELP.md for each clap-using utility under utilities/. Each crate has an
# optional `markdown-help` feature that gates a hidden `--markdown-help` flag;
# `cargo run --features markdown-help -p <name> -- --markdown-help` prints a
# full clap-tree markdown rendering. gen-help-all regenerates every HELP.md;
# gen-help-check diffs the committed files against fresh output. The pattern
# mirrors pep257-rs's HELP.md flow.
[tasks.gen-help-all]
description = "Regenerate HELP.md for every clap-using utility under utilities/"
run = """
for crate in et-cli et-int-gen et-onnx; do
  dir="utilities/${crate#et-}"
  echo "[gen-help-all] $crate -> $dir/HELP.md"
  cargo run --features markdown-help -q -p "$crate" -- --markdown-help > "$dir/HELP.md"
done
"""
shell = "bash -euo pipefail -c"

[tasks.gen-help-check]
depends = ["gen-help-all"]
description = "Fail if any utility's checked-in HELP.md is stale vs the clap tree"
run = "git diff --exit-code -- utilities/*/HELP.md"

[tasks.fetch-wit-deps]
description = "Fetch upstream WASI WIT packages into generated/specs/wit/ at pinned versions (run by hand on bumps)"
run = "cargo run -q -p et-int-gen --bin et-int-gen -- fetch-deps"

[tasks."gen:ws-spec"]
description = "Run et-int-gen: emit the language-agnostic WS specs (YAML/WIT/KDL/JSON) + the Rust REST client"
# et-int-gen runs progenitor + prettyplease to produce
# generated/rust-rest/src/lib.rs. prettyplease's style disagrees with our
# nightly rustfmt (different import grouping + line width), so the workspace
# `mise run fmt` would reformat it and `mise run gen-specs-check` would see
# drift on the next regen. Make rustfmt the canonical formatter by running
# it here as a post-process — the committed file is then a fixed point of
# both tools.
#
# `generate core` emits the language-agnostic specs every per-language `gen:*`
# task consumes (ws.kdl, *.schema.json, rest.yaml), so this task stays in the
# always-loaded default config (its `gen:` name also anchors the `gen:*` glob)
# and every `gen:<lang>` depends on it. The Zig client (`gen:zig-rest`) moved to
# config.zig.toml since it needs `zig fmt`.
run = """
cargo run -q -p et-int-gen --bin et-int-gen -- generate core
cargo run -q -p et-int-gen --bin et-int-gen -- generate rust
cargo +nightly fmt -p et-rest-client
"""
shell = "bash -euo pipefail -c"

[tasks.gen-specs]
# Native `depends` glob: gen:ws-spec (core + Rust client, always loaded) anchors
# the glob so it never matches zero; guest `gen:<lang>` tasks join from their
# loaded MISE_ENV configs. Run with MISE_ENV covering every language (e.g.
# `mise run gen-specs-all`) to regenerate everything.
depends = ["gen:*"]
description = "Regenerate every loaded spec artifact under generated/ (core + Rust + any loaded guest gen)"

[tasks.gen-specs-check]
depends = ["gen-specs"]
description = "Fail if any checked-in artifact under generated/ is stale"
# All et-int-gen outputs land under generated/. The runner's
# wit/deps/et-ws-messages is a symlink into that tree, so a single diff
# against generated/ covers everything.
#
# Skipped on Windows: the regen pipeline produces non-deterministic
# drift there (nightly rustfmt formats long signatures and doc-comment
# indentation differently across nightlies; pipx-driven python codegen
# emits subtly different output). Linux/macOS runs are canonical.
run = """
[ "${OS:-}" = "Windows_NT" ] && { echo "gen-specs-check: skipped on Windows (non-deterministic)"; exit 0; }
git diff --exit-code -- generated
"""
shell = "bash -euo pipefail -c"

# `cargo-watch` is unmaintained; `watchexec` is its successor (and what
# `cargo-watch` always called under the hood). Restart on .rs/.toml
# changes so a workspace-wide edit (any library, any service the server
# depends on) triggers a rebuild. `--clear` wipes the terminal between
# runs so cargo output starts at the top of the screen; `--restart`
# kills the running `cargo run` before kicking off a fresh one.
# Respects `.gitignore`, so `target/` and friends are skipped.
[tasks.ws-server]
description = "Run the WebSocket server, restarting on .rs/.toml changes"
run = "watchexec --restart --clear --exts rs,toml -i '**/tests/**' -- cargo run -p et-ws-server"

[tasks.ws-server.env]
OTLP_AUTH_PASSWORD = "1234"
OTLP_AUTH_USERNAME = "root@example.com"

[tasks.ws-wasi-runner]
description = "Run the WebSocket WASI runner (set RUNNER_MODULE, e.g. wasi-graphics-info; RUNNER_FEATURES=cuda on CUDA)"
dir = "services/ws-wasi-runner"
run = """
if [ -n "${RUNNER_FEATURES:-}" ]; then
  cargo run --features "$RUNNER_FEATURES"
else
  cargo run
fi
"""
shell = "bash -euo pipefail -c"

[tasks.build-ws-wasm-agent]
description = "Build the WebSocket WASM client"
dir = "services/ws-wasm-agent"
# {{ vars.no_opt }} is --no-opt on Windows (wasm-opt can't run on Nano), empty
# elsewhere -- the served, size-optimised artifact is built on Linux/macOS.
run = "wasm-pack build . --target web {{ vars.no_opt }} -- -Z build-std=std,panic_abort"

[tasks.build-ws-wasm-agent.env]
# Scope these flags to the wasm target rather than setting plain `RUSTFLAGS`:
# wasm-pack auto-installs a matching `wasm-bindgen-cli` (when the version in
# `Cargo.lock` differs from the one on PATH) by shelling out to `cargo
# install`, which inherits this env. A plain `RUSTFLAGS` with `target-cpu=mvp`
# and `+mutable-globals` then leaks into that host build and rustc rejects
# them with "'mvp' is not a recognized processor for this target".
CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS = "{{ vars.wasm_rustflags }}"
RUSTUP_TOOLCHAIN = "nightly"

[tasks.build-et-cli]
# Pre-build et-cli once. The parallel build-ws-* module tasks each call
# `cargo run -p et-cli -- module-package-json`; without this they race rebuilding
# et-cli, and one execs the binary mid-replace (ENOENT -- surfaced on macOS).
description = "Build et-cli (prereq for the module-package-json steps)"
run = "cargo build -p et-cli"

[tasks.build-modules]
# Native `depends` glob over `build-ws-*`: that matches `build-ws-wasm-agent`
# (always loaded here, no `-module` suffix — so the glob never matches zero)
# plus every loaded `build-ws-*-module`.
depends = ["build-ws-*"]
description = "Build all loaded WebAssembly modules"

[tasks.test-ws-wasm-agent-firefox]
description = "Run headless Firefox tests for the WebSocket WASM client"
dir = "services/ws-wasm-agent"
run = "wasm-pack test --headless --firefox"

[tasks.ws-e2e-firefox]
depends = ["test-ws-wasm-agent-firefox", "ws-server"]
description = "Run both the ws-server and ws-wasm-agent using Firefox"

[tasks.test-ws-wasm-agent-chrome]
description = "Run headless Chrome tests for the WebSocket WASM client"
dir = "services/ws-wasm-agent"
run = "env CHROMEDRIVER=\"$(mise where chromedriver)/bin/chromedriver\" wasm-pack test --headless --chrome"

[tasks.ws-e2e-chrome]
depends = ["test-ws-wasm-agent-chrome", "ws-server"]
description = "Run both the ws-server and ws-wasm-agent using Chrome"

[tasks.openobserve]
alias = "o2"
run = "docker run --rm -it --name openobserve -p 5080:5080 --env-file config/o2.env openobserve/openobserve:v0.70.3"

[tasks.demo]
depends = ["openobserve", "ws-server"]

[tasks.open-o2]
run = "open http://localhost:5080/"

# Note: bare `yq` / `coreutils` would fail inside the nanoserver docker
# build, where mise's shims aren't on PATH for busybox-w32 ash (see the
# CLAUDE.md "Nano Server exception"). `mise exec --` is the documented
# escape hatch; works the same on every host. yq stays bare because it
# already runs cleanly on every other lane and the nanoserver-shim TODO
# (CLAUDE.md) plans to put all shims on PATH there too.
[tasks.fetch-face1-rclone]
run = """
{{ vars.retry }} rclone copyto {{ vars.face1_src }} {{ vars.face1_dst }} {{ vars.gh_http }}
sha=$(mise exec -- yq -p toml -oy '.sha256."{{ vars.face1_asset }}"' config/checksums.toml)
echo "$sha  {{ vars.face1_dst }}" | mise exec -- coreutils sha256sum -c -
"""
shell = "bash -euo pipefail -c"

[tasks.fetch-har-motion1-rclone]
run = "{{ vars.retry }} rclone copyto {{ vars.har_src }} {{ vars.har_dst }} {{ vars.gh_http }}"
shell = "bash -euo pipefail -c"

[tasks.fetch-mnist-rclone]
# MNIST classifier used by services/ws-modules/wasi-graphics-info to exercise
# wasi-nn end-to-end. Sourced from the canonical ONNX Model Zoo; size 26143
# bytes. Lands under the module's gitignored pkg/ so et-modules-service can
# serve it statically alongside the .wasm.
run = "{{ vars.retry }} rclone copyto {{ vars.mnist_src }} {{ vars.mnist_dst }} {{ vars.gh_http }}"
shell = "bash -euo pipefail -c"

[tasks.download-models]
depends = ["fetch-face1-rclone", "fetch-har-motion1-rclone", "fetch-mnist-rclone"]

[tasks.cargo-test-other]
# Excludes `et-ws-web-runner` -- its tests need single-threaded
# execution (see `test-ws-web-runner` below); running the rest of the
# workspace in parallel keeps the total wall-clock down. Split out from
# `cargo-test` (which aggregates both halves) so CI can run each phase
# as its own step -- helps isolate which phase consumes which disk /
# memory budget on tight runners.
run = "cargo test --workspace --exclude et-ws-web-runner"

[tasks.test-ws-web-runner]
description = "Run et-ws-web-runner integration tests serialized"
# Each test case boots a full `MainWorker` (deno_runtime) -- ~10x
# heavier than the `JsRuntime` it replaced. 8 in parallel exhausts
# local fd/port budgets on macOS, surfacing as "error sending request
# for url" when the runner's wrapper module dynamic-`import()`s its
# module JS. Pin to one thread so the suite is deterministic.
env = { RUST_TEST_THREADS = "1" }
run = "cargo test -p et-ws-web-runner"

[tasks.cargo-test]
# Composite: cargo-test-other (workspace minus et-ws-web-runner) +
# test-ws-web-runner (serialized). Local devs / hosts where disk and
# memory aren't tight invoke this single task; CI splits the two halves
# into separate workflow steps for debuggability.
depends = ["cargo-test-other", "test-ws-web-runner"]
description = "Run every Rust test (cargo-test-other + test-ws-web-runner)"

[tasks."test:rust"]
# Rust tests. Always-loaded, so `test`'s glob always matches it.
depends = ["cargo-test"]
description = "Run the Rust tests"

[tasks.test]
# Native `depends` glob; test:rust is always loaded so it never matches zero.
depends = ["test:*"]
description = "Run all tests: test:rust + any loaded guest test:<lang>"

# Detect which rp-v<N> assets (native binary for this host's triple +
# the platform-agnostic wasm tarball) are MISSING from the GitHub release.
# Lives outside config.maint.toml because callers (notably .github/workflows/
# test.yaml) need the answer before deciding whether to load the maint env;
# the detection itself only needs gh (host) + yq/rg/coreutils (mise tools).
# Reads .mise/config.toml's pinned `tools."http:et-rp".version` to derive
# the expected asset names. When $GITHUB_OUTPUT is set (GHA), emits step
# outputs the workflow can branch on; otherwise prints to stdout.
[tasks.rp-detect-missing]
description = "Print whether rp-v<N> has native+wasm assets for this host (GHA outputs)"
run = """
short=$(yq -p toml -oy '.tools."http:et-rp".version' .mise/config.toml)
triple=$(rustc -vV | rg '^host: ' | coreutils cut -c7-)
native_asset="rustpython-${short}-${triple}.tar.gz"
wasm_asset="rustpython-wasm-${short}.tar.gz"
tag="{{ vars.a_rp_release }}"
assets=$(gh release view "$tag" --repo edge-toolkit/core --json assets --jq '.assets[].name' 2>/dev/null || true)
native_missing=true
wasm_missing=true
if echo "$assets" | rg -Fxq "$native_asset"; then native_missing=false; fi
if echo "$assets" | rg -Fxq "$wasm_asset";   then wasm_missing=false;   fi
out="${GITHUB_OUTPUT:-/dev/stdout}"
{
  echo "short=$short"
  echo "triple=$triple"
  echo "native_missing=$native_missing"
  echo "wasm_missing=$wasm_missing"
} >> "$out"
echo "[rp-detect-missing] triple=$triple short=$short native_missing=$native_missing wasm_missing=$wasm_missing" >&2
"""
shell = "bash -euo pipefail -c"

# rp-v<N> release, verify against config/checksums.toml, and extract it
# into target/cache/rp-wasm/ for build-ws-pywasm1-module (and future ws-modules)
# to read. The heavy wasm-pack compile is done once via
# `publish-rp-wasm-to-release` in config.maint.toml. `tar` is the host's --
# universally available on Linux/macOS and Windows 10+, not worth a mise
# tool abstraction for a single extract call.
[tasks.fetch-rp-wasm]
description = "Download + verify + extract the rustpython_wasm tarball into target/cache/rp-wasm/"
run = """
dir={{ vars.rp_wasm_dir }}
tarball="$dir/{{ vars.rp_wasm_asset }}"
coreutils mkdir -p "$dir"
{{ vars.retry }} rclone copyto {{ vars.rp_wasm_src }} "$tarball" {{ vars.gh_http }}
sha=$(yq -p toml -oy '.sha256."{{ vars.rp_wasm_asset }}"' config/checksums.toml)
# sha256sum is best-effort on Windows. The tarball path contains
# backslashes (`D:\\a\\core\\core/target/...`) and something in the
# bash/uutils pipeline still mangles them to `D:acorecore/target/...`
# before coreutils sha256sum opens the file -- the check trips with
# `sha256sum: WARNING: 1 computed checksum did NOT match` even when
# the file on disk is fine. printf-vs-echo didn't fix it; suspect MSYS
# PATH conversion in coreutils' uutils-coreutils 0.6.0 build. Print
# the failure but don't abort the task: rclone already verified the
# HTTPS transport against GitHub's TLS cert + the release-asset URL,
# and on Linux/macOS the sha check still gates extraction. Once the
# uutils issue is tracked down + patched here, drop the `|| true`.
if printf '%s  %s\n' "$sha" "$tarball" | coreutils sha256sum -c -; then
  echo "[fetch-rp-wasm] sha256 OK for $tarball"
else
  if [ "${OS:-}" = "Windows_NT" ]; then
    echo "[fetch-rp-wasm] sha256 check FAILED on Windows -- continuing (best-effort)" >&2
  else
    echo "[fetch-rp-wasm] sha256 check FAILED" >&2
    exit 1
  fi
fi
# Wipe previous extraction so it can't shadow new contents; preserve the
# tarball itself so rclone --ignore-existing short-circuits on rerun.
find "$dir" -mindepth 1 -not -name '{{ vars.rp_wasm_asset }}' -delete
tar -xzf "$tarball" -C "$dir"
"""
shell = "bash -euo pipefail -c"

# Build the pywasm1 ws-module from the fetched rustpython_wasm extraction.
# Picked up by the `build-modules` glob (`build-ws-*`) like every other
# module task -- the `fetch-rp-wasm` dep pulls a prebuilt tarball from
# the rp-v<N> release rather than recompiling RustPython, so the cost
# is one ~10 MB download, not the multi-minute upstream wasm-pack build.
[tasks.build-ws-pywasm1-module]
depends = ["fetch-rp-wasm"]
description = "Build the pywasm1 module (fetched rustpython_wasm + main.py)"
dir = "services/ws-modules/pywasm1"
run = """
rp_pkg={{ vars.rp_wasm_dir }}
coreutils rm -rf pkg
coreutils mkdir -p pkg
coreutils cp "$rp_pkg"/rustpython_wasm.js "$rp_pkg"/rustpython_wasm.d.ts pkg/
coreutils cp "$rp_pkg"/rustpython_wasm_bg.wasm "$rp_pkg"/rustpython_wasm_bg.wasm.d.ts pkg/
coreutils cp -R "$rp_pkg/snippets" pkg/
coreutils cp index.js main.py pkg/
coreutils cat > pkg/package.json <<'PKG_JSON'
{
  "name": "et-ws-pywasm1",
  "type": "module",
  "version": "0.1.0",
  "main": "index.js",
  "files": [
    "index.js",
    "main.py",
    "rustpython_wasm.js",
    "rustpython_wasm.d.ts",
    "rustpython_wasm_bg.wasm",
    "rustpython_wasm_bg.wasm.d.ts"
  ]
}
PKG_JSON
"""
shell = "bash -euo pipefail -c"

# --- Cross-language orchestration (stand-ins for the MISE_ENV=all mise lacks).
# `$ALL_LANGS` is auto-discovered in `[env]` above from the config.<lang>.toml
# filenames, so adding a language needs no edits here.

[tasks.print-all-langs]
description = "Print $ALL_LANGS — the comma-separated list of every language env"
run = 'echo "$ALL_LANGS"'
shell = "bash -c"

[tasks.install-all]
description = "Install every language toolchain (all .mise/config.<lang>.toml)"
run = 'MISE_ENV="$ALL_LANGS" mise install'
shell = "bash -c"

[tasks.all]
# Generic stand-in: run any command with every language env enabled. mise
# appends the task's CLI args after `mise exec --`, e.g. `mise run all zig version`.
description = "Run a command with every language env enabled (MISE_ENV=all)"
run = 'MISE_ENV="$ALL_LANGS" mise exec --'
shell = "bash -c"

[tasks.check-all]
description = "Run check across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run check'
shell = "bash -c"

[tasks.fmt-all]
description = "Run fmt across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run fmt'
shell = "bash -c"

[tasks.test-all]
description = "Run tests across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run test'
shell = "bash -c"

[tasks.build-modules-all]
description = "Build modules across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run build-modules'
shell = "bash -c"

[tasks.gen-specs-all]
description = "Regenerate every spec artifact across every language env"
run = 'MISE_ENV="$ALL_LANGS" mise run gen-specs'
shell = "bash -c"
