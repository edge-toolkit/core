# Linux-only mise config. Shared vars (rpath_flag, pylib_flag, conda_openssl,
# py3_unix, …) come from config.toml, which loads first; PYO3_PYTHON keeps its
# config.toml default (py3_unix).

[tools]
# Ships the C `libclang.so` (+ clang resource headers) bindgen needs to build the
# deno web runner's libsqlite3-sys; a mise-only box usually only has libclang-cpp
# (the C++ API), not the C one.
"conda:clangxx" = "latest"

[vars]
# `a_`/`b_`/`c_` tiers keep taplo's alphabetical reorder_keys from moving a var
# ahead of one it reads (`b_` reads `a_`, `c_` reads `b_`), which mise can't render.
# a_conda_arch: conda's target-triple dir (x86_64/aarch64 vs mise's x64/arm64).
a_conda_arch = "{% if arch() == 'arm64' %}aarch64{% else %}x86_64{% endif %}"
a_conda_clangxx = "{{ env.HOME }}/.local/share/mise/installs/conda-clangxx/latest"
b_clang_resource = "{{ vars.a_conda_clangxx }}/lib/clang/22"
b_clang_sysroot = "{{ vars.a_conda_clangxx }}/{{ vars.a_conda_arch }}-conda-linux-gnu/sysroot"
# bindgen loads libclang directly rather than driving the clang binary, so it
# can't auto-find its resource dir (builtins like stddef.h) or conda's bundled
# sysroot. Pass `-resource-dir` + `--sysroot` so header resolution is identical
# on every machine (a bare `-isystem` leaves builtin type macros unset and fails
# in CI). Using conda's sysroot rather than the host's /usr/include keeps bindgen
# self-contained.
c_bindgen_args = "-resource-dir {{ vars.b_clang_resource }} --sysroot={{ vars.b_clang_sysroot }}"
# clang-tidy gets the same resource-dir + conda sysroot as bindgen: the sysroot
# also stops clang scanning the host's multiple /usr/lib/gcc installs for
# libstdc++ (which otherwise warns, and -warnings-as-errors fails the run).
clang_resource_arg = "{{ vars.c_bindgen_args }}"

[env]
# clang-sys finds conda's libclang.so via LIBCLANG_PATH; bindgen gets conda's
# resource headers + sysroot via BINDGEN_EXTRA_CLANG_ARGS (see c_bindgen_args).
BINDGEN_EXTRA_CLANG_ARGS = "{{ vars.c_bindgen_args }}"
# rpath/pylib flags (shared, from config.toml): OPENSSL_DIR points openssl-sys at
# conda's OpenSSL, so anything linking it records conda's libssl soname; without
# an rpath the loader only finds it when conda's soname matches the system one
# (it broke when conda bumped to libssl.so.4). pylib_flag does the same for the
# CPython lib dir. No `-fuse-ld=lld` needed: the system linker accepts
# `-Wl,-rpath` directly.
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "{{ vars.rpath_flag }} {{ vars.pylib_flag }}"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "{{ vars.rpath_flag }} {{ vars.pylib_flag }}"
LIBCLANG_PATH = "{{ vars.a_conda_clangxx }}/lib"

[tasks.preinstall]
# Preinstall: the shared cross-platform base (via _setup_all), then verify the
# build prerequisites mise can't supply. The package list has a single source
# of truth -- the Dockerfile's APT_PACKAGES (Debian/Ubuntu) and DNF_PACKAGES
# (Fedora) ARGs: the Docker build exposes them as env vars (the ARG is in
# scope for the preinstall RUN), and a workstation reads the appropriate one
# back from the Dockerfile in the checkout. The package manager on the host
# picks which list applies. Each pkg is probed for presence; union case
# patterns handle apt/dnf name differences (`gnupg|gnupg2`, `xz-utils|xz`,
# `libc6-dev|glibc-devel`, `g++|gcc-c++`). libicu is checked version-agnostic
# (Dockerfile detects the exact apt name at build time; dnf uses unversioned
# `libicu`). An empty list is a hard error, not a silent skip.
depends = ["_setup_all"]
description = "Preinstall: shared base + verify system build prerequisites"
run = """
dockerfile="{{ config_root }}/Dockerfile"
if command -v apt-get >/dev/null 2>&1; then
  arg=APT_PACKAGES
  pkgs="${APT_PACKAGES:-}"
elif command -v dnf >/dev/null 2>&1; then
  arg=DNF_PACKAGES
  pkgs="${DNF_PACKAGES:-}"
else
  echo "preinstall: no supported package manager (apt-get or dnf) on PATH" >&2
  exit 1
fi
if [ -z "$pkgs" ]; then
  pkgs="$(rg "^ARG ${arg}=" "$dockerfile" 2>/dev/null | coreutils cut -d'"' -f2 || true)"
fi
if [ -z "$pkgs" ]; then
  echo "preinstall: could not read the $arg prerequisite list" >&2
  exit 1
fi
# Append a generic `libicu` sentinel: the apt path's APT_PACKAGES intentionally
# omits libicu (the Dockerfile auto-detects the versioned `libicu<NN>` at build
# time via `apt-cache search`), so the iteration above would otherwise skip the
# check on a Debian/Ubuntu workstation. dnf's DNF_PACKAGES already includes
# the unversioned `libicu`; appending again is harmless (case match accepts both).
pkgs="$pkgs libicu"
missing=""
for pkg in $pkgs; do
  case "$pkg" in
    ca-certificates) [ -r /etc/ssl/certs/ca-certificates.crt ] || [ -r /etc/pki/tls/certs/ca-bundle.crt ] ;;
    libc6-dev|glibc-devel) [ -r /usr/include/stdio.h ] ;;
    g++|gcc-c++) command -v g++ >/dev/null 2>&1 ;;
    libicu*)
      # Debian/Ubuntu install libicu under /usr/lib/<triple>/, Fedora under
      # /usr/lib64/ directly -- try both.
      coreutils ls /usr/lib/*/libicui18n.so.* >/dev/null 2>&1 ||
      coreutils ls /usr/lib64/libicui18n.so.* >/dev/null 2>&1 ;;
    libatomic*)
      # Fedora needs libatomic explicitly for pnpm's prebuilt binary (Ubuntu
      # gcc pulls it via libgcc-s1 by default). Same dual-layout split as
      # libicu above (Debian/Ubuntu per-triple subdir vs Fedora's /usr/lib64).
      coreutils ls /usr/lib/*/libatomic.so.* >/dev/null 2>&1 ||
      coreutils ls /usr/lib64/libatomic.so.* >/dev/null 2>&1 ;;
    *) command -v "$pkg" >/dev/null 2>&1 ;;
  esac || missing="$missing $pkg"
done
if [ -n "$missing" ]; then
  echo "preinstall: missing required build prerequisites:$missing" >&2
  if [ "$arg" = "APT_PACKAGES" ]; then
    echo "Install with: sudo apt-get install -y $pkgs" >&2
  else
    echo "Install with: sudo dnf install -y $pkgs" >&2
  fi
  exit 1
fi
"""
shell = "bash -euo pipefail -c"
