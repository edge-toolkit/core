# Java toolchain + tasks. Loaded when MISE_ENV includes `java`.

[tools]
# Pinned (not "latest") because the version is templated into install-dir segments in two places.
# The JAVA_HOME path below + config.windows.toml's maven_bin _.path entry both template install-dir
# segments with version. Bump in lockstep, AND on bump verify the Windows OpenJDK wrapper name in the
# java_home var below (build-number suffix changes with each GA release).
java = "26.0.1"
maven = "3.9.16"

[vars]
# JDK install root for JAVA_HOME (see [env] below).
# mise's java plugin extracts the OpenJDK archive flat on every platform (Linux/macOS tarball and Windows zip
# alike -- `bin/java[.exe]` sits directly under the install dir; no `jdk-X.Y.Z+N\` wrapper). Default base
# directory is mise's per-platform data dir (`~/.local/share/mise` on Unix, `%LOCALAPPDATA%\mise` on Windows);
# MISE_DATA_DIR overrides on either.
#
# Windows-only slash normalization: %LOCALAPPDATA% arrives in mise's tera context with forward slashes
# (`C:/Users/.../AppData/Local`) but our literal segments use backslashes; the resulting mixed-slash path
# passes busybox `ls` but mvn.cmd's `if not exist "%JAVA_HOME%\bin\java.exe"` rejects it. The
# `| replace(from="/", to="\\")` pass on the prefix normalizes everything to a single backslash. Note the
# `"\\"` escape: Tera v2 (mise 2026.7.1+) parses C-style backslash escapes in double-quoted strings, so `"\\"`
# is one literal `\`. (Tera v1 had no escapes and needed a backtick raw-string; Tera v2 dropped backtick strings.)
java_home = '''{% if os() == "windows" -%}
{%- set win_base = (env?.LOCALAPPDATA or "") ~ "\\mise" -%}
{{- (env?.MISE_DATA_DIR or win_base) | replace(from="/", to="\\") -}}
\installs\java\26.0.1
{%- else -%}
{{- env?.MISE_DATA_DIR or (env.HOME ~ "/.local/share/mise") -}}
/installs/java/26.0.1
{%- endif %}'''

[env]
# JAVA_HOME must be set in the env because mvn.cmd requires it.
# mvn.cmd's first action is `if "%JAVA_HOME%" == "" goto :error` -- it REQUIRES JAVA_HOME in the env
# (PATH-discovered java.exe is not enough). Linux/macOS mvn shells are more relaxed but still benefit from a
# pinned JAVA_HOME (otherwise java-toolchains.xml lookups vary by host).
JAVA_HOME = "{{ vars.java_home }}"
# Silence Maven's per-artifact download/upload progress lines.
# These are the "Downloading from central:" / "Downloaded" spam. Build output and real errors still print.
# MAVEN_ARGS is honored by Maven 3.9+ and prepends to every `mvn` invocation.
MAVEN_ARGS = "--no-transfer-progress"
# Cross-platform mvn invocation.
# On Windows we must NOT let busybox bash resolve `mvn`: the maven distribution ships both files side-by-side
# in bin/ (`mvn` is a Unix shell script; `mvn.cmd` is the Windows wrapper), and busybox-w32's PATH lookup
# picks the bare `mvn` first via `file_is_executable`, parses its `#!/bin/sh` shebang, and runs it through
# busybox's own sh applet -- but the Unix script's JAVACMD composition (`JAVACMD="$JAVA_HOME/bin/java"`, no
# `.exe`) then fails its `[ -x "$JAVACMD" ]` test because on Windows the file is named `bin/java.exe`. Bare
# `mvn.cmd` (and `cmd.exe /c mvn`) both fail in the all-langs MISE_ENV with "'mvn[.cmd]' is not recognized" --
# the wrapping cmd.exe discards the over-long PATH it inherits, so maven\bin is not there to be found (which
# is also why MISE_ENV=java alone works: its narrower tool set stays under cmd.exe's per-variable PATH limit).
# Use the absolute path to `mvn.cmd` instead:
# busybox-w32's spawnve detects `.cmd` and auto-wraps with cmd.exe, which runs the full path directly with no
# PATH lookup required. `vars.maven_bin` is defined in config.windows.toml; vars merge across all loaded
# configs.
MVN = '''{% if os() == "windows" -%}
{{- vars.maven_bin -}}\mvn.cmd
{%- else -%}
mvn
{%- endif %}'''

[tasks.build-ws-java-data1-module]
description = "Build the java-data1 workflow module"
run = "\"$MVN\" package"
shell = "{{ vars.task_shell }}"

# Namespaced aggregator picked up by the default config's globbed `check`.
# The compile triggers maven-compiler-plugin with -Xlint:all -Werror + Error Prone.
[tasks."check:java"]
description = "Run Java checks (javac -Xlint:all -Werror, Error Prone)"
run = "\"$MVN\" -q compile"
shell = "{{ vars.task_shell }}"

[tasks."prefetch:java"]
description = "Prefetch Java (Maven) dependencies"
run = "\"$MVN\" dependency:resolve --quiet"
shell = "{{ vars.task_shell }}"
