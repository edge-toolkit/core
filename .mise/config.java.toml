# Java toolchain + tasks. Loaded when MISE_ENV includes `java`.

[tools]
# Pinned (not "latest") because the JAVA_HOME path below + config.windows.toml's
# maven_bin _.path entry both template install-dir segments with version. Bump
# in lockstep, AND on bump verify the Windows OpenJDK wrapper name in the
# java_home var below (build-number suffix changes with each GA release).
java = "26.0.1"
maven = "3.9.16"

[vars]
# JDK install root for JAVA_HOME (see [env] below). mise's java plugin
# extracts the OpenJDK archive flat on every platform (Linux/macOS tarball
# and Windows zip alike -- `bin/java[.exe]` sits directly under the install
# dir; no `jdk-X.Y.Z+N\` wrapper). Default base directory is mise's
# per-platform data dir (`~/.local/share/mise` on Unix, `%LOCALAPPDATA%\mise`
# on Windows); MISE_DATA_DIR overrides on either.
#
# Windows-only slash normalization: %LOCALAPPDATA% arrives in mise's tera
# context with forward slashes (`C:/Users/.../AppData/Local`) but our
# literal segments use backslashes; the resulting mixed-slash path passes
# busybox `ls` but mvn.cmd's `if not exist "%JAVA_HOME%\bin\java.exe"`
# rejects it. The `| replace(from="/", to=`\`)` pass on the prefix
# normalizes everything to a single backslash. Note the backtick-quoted
# string for the replacement: tera 1.20's pest grammar treats strings
# verbatim (no `\\`-as-`\` escape), so backticks + a single literal
# backslash are the way to express a one-char `\` argument.
java_home = '''{% if os() == "windows" -%}
{{- get_env(name="MISE_DATA_DIR", default=get_env(name="LOCALAPPDATA", default="") ~ "\mise") | replace(from="/", to=`\`) -}}
\installs\java\26.0.1
{%- else -%}
{{- get_env(name="MISE_DATA_DIR", default=env.HOME ~ "/.local/share/mise") -}}
/installs/java/26.0.1
{%- endif %}'''

[env]
# mvn.cmd's first action is `if "%JAVA_HOME%" == "" goto :error` -- it
# REQUIRES JAVA_HOME in the env (PATH-discovered java.exe is not enough).
# Linux/macOS mvn shells are more relaxed but still benefit from a pinned
# JAVA_HOME (otherwise java-toolchains.xml lookups vary by host).
JAVA_HOME = "{{ vars.java_home }}"
# Silence Maven's per-artifact download/upload progress lines (the
# "Downloading from central:" / "Downloaded" spam). Build output and real
# errors still print. MAVEN_ARGS is honored by Maven 3.9+ and prepends to
# every `mvn` invocation.
MAVEN_ARGS = "--no-transfer-progress"

[tasks.build-ws-java-data1-module]
description = "Build the java-data1 workflow module"
# TEMPORARY: prove what cmd.exe sees for JAVA_HOME -- mvn.cmd's "JAVA_HOME
# environment variable is not defined correctly" message is emitted only
# when its `if exist "%JAVA_HOME%\bin\java.exe"` returns false (lines
# 60-64 of upstream apache-maven 3.9.16 bin/mvn.cmd). The bash diagnostic
# shows ls of $JAVA_HOME and $JAVA_HOME/bin both work, so the path is
# valid from busybox's view. The remaining question is the env value
# cmd.exe receives when busybox spawns mvn.cmd.
run = """
echo "[diag] bash JAVA_HOME=${JAVA_HOME:-<unset>}"
echo "[diag] bash hexdump of JAVA_HOME:"
printf '%s' "${JAVA_HOME:-}" | od -c | head -5
echo "[diag] cmd.exe set JAVA_HOME (what cmd sees):"
cmd.exe //C "set JAVA_HOME" || true
echo "[diag] cmd.exe if exist test:"
cmd.exe //C "if exist \\"%JAVA_HOME%\\\\bin\\\\java.exe\\" (echo FOUND) else (echo MISSING)" || true
echo "[diag] cmd.exe explicit absolute path:"
cmd.exe //C "if exist \\"C:\\\\Users\\\\runneradmin\\\\AppData\\\\Local\\\\mise\\\\installs\\\\java\\\\26.0.1\\\\bin\\\\java.exe\\" (echo FOUND ABS) else (echo MISSING ABS)" || true
mvn package
"""
shell = "bash -euo pipefail -c"

# Namespaced aggregator picked up by the default config's globbed `check`. The
# compile triggers maven-compiler-plugin with -Xlint:all -Werror + Error Prone.
[tasks."check:java"]
description = "Run Java checks (javac -Xlint:all -Werror, Error Prone)"
run = "mvn -q compile"

[tasks."prefetch:java"]
description = "Prefetch Java (Maven) dependencies"
run = "mvn dependency:resolve --quiet"
