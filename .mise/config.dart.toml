# Dart toolchain + tasks. Loaded when MISE_ENV includes `dart`.

[vars]
# Every tracked Dart package: the two generated clients plus the two modules. Shared by analyze/format.
dart_paths = "generated/dart-ws generated/dart-rest services/ws-modules/dart-comm1 services/ws-modules/dart-data1"

[tools]
"cargo:dart-typegen" = { version = "latest", os = ["linux", "macos"] }

# dart isn't an aqua/registry tool, so install it straight from Google's dart archive.
# The latest stable is discovered from the bucket listing. `{{ version }}`
# etc. resolve in the tool-url context; the static host/path prefix is a var.
#
# `strip_components = 1` makes mise drop the `dart-sdk/` wrapper every dartsdk zip uses (Windows/macOS/Linux
# ship the same `dart-sdk/<files>` shape). mise normally auto-detects single-top-level-dir archives and strips,
# but that auto-detect doesn't fire reliably on Windows ZIPs, leaving the binary at `<install>/dart-sdk/bin/dart.exe`
# instead of the `<install>/bin/dart.exe` mise's PATH activation expects. Explicit beats auto.
[tools.dart]
strip_components = 1
url = "{{ vars.dart_release }}/{{ version }}/sdk/dartsdk-{{ os() }}-{{ arch() }}-release.zip"
version = "latest"
version_expr = '''
fromJSON(body).prefixes
| filter({ # matches "^channels/stable/release/(\\d+\\.\\d+\\.\\d+)/$" })
| map({split(#, "/")[3]})
| sortVersions()'''
version_list_url = "{{ vars.dart_bucket }}?prefix=channels/stable/release/&delimiter=/"

[tasks.dart-pub-get]
# Resolve the whole Dart pub workspace before any dart-* task.
# One `dart pub get` at the workspace root (pubspec.yaml's `workspace:` list) resolves every member into the
# single root pubspec.lock and writes the shared .dart_tool/package_config.json. `dart format` and `dart analyze`
# walk up from each member to find pubspec.yaml *and* that package_config.json; with it, the formatter picks the
# exact language version, without it a different default -- same source, different output. That mismatch is
# invisible locally (we accumulate .dart_tool/ over time) but bites CI's fresh checkout.
run = "dart pub get"

[tasks.dart-check]
depends = ["dart-pub-get"]
run = "dart analyze {{ vars.dart_paths }}"

[tasks.dart-fmt]
depends = ["dart-pub-get"]
run = "dart format {{ vars.dart_paths }}"

[tasks.dart-fmt-check]
depends = ["dart-pub-get"]
# Parallel of cargo-fmt-check: fail if any tracked Dart source would be reformatted.
# This lets CI enforce the same formatting `dart-fmt` applies.
run = "dart format --output=none --set-exit-if-changed {{ vars.dart_paths }}"

# Namespaced aggregators picked up by the default config's globbed `check`/`fmt`.
[tasks."check:dart"]
depends = ["dart-check", "dart-fmt-check"]
description = "Run Dart checks (analyze + format-check)"

[tasks."fmt:dart"]
depends = ["dart-fmt"]
description = "Format Dart sources"

[tasks.build-ws-dart-comm1-module]
description = "Build the dart-comm1 workflow module"
dir = "services/ws-modules/dart-comm1"
run = """
dart pub get
dart compile js lib/dart_comm1.dart -o pkg/et_ws_dart_comm1_compiled.js --no-source-maps
"""
shell = "bash -euo pipefail -c"

[tasks.build-ws-dart-data1-module]
description = "Build the dart-data1 workflow module"
dir = "services/ws-modules/dart-data1"
run = """
dart pub get
dart compile js lib/dart_data1.dart -o pkg/et_ws_dart_data1_compiled.js --no-source-maps
"""
shell = "bash -euo pipefail -c"

[tasks.build-ws-dart-math1-module]
description = "Build the dart-math1 FedAvg module"
dir = "services/ws-modules/dart-math1"
run = """
dart pub get
dart compile js lib/dart_math1.dart -o pkg/et_ws_dart_math1_compiled.js --no-source-maps
"""
shell = "bash -euo pipefail -c"

[tasks."prefetch:dart"]
description = "Prefetch Dart (pub) dependencies"
run = """
dart pub get --directory generated/dart-rest
dart pub get --directory services/ws-modules/dart-comm1
dart pub get --directory services/ws-modules/dart-data1
dart pub get --directory services/ws-modules/dart-math1
"""
shell = "bash -euo pipefail -c"

[tasks."gen:dart-ws"]
depends = ["gen:ws-spec"]
description = "Emit the Dart sealed-class WS client via dart-typegen (consumes generated/specs/ws.kdl from gen:ws-spec)"
run = """
mkdir -p generated/dart-ws/lib
dart-typegen generate -i generated/specs/ws.kdl -o generated/dart-ws/lib/ws_messages.dart
dart format generated/dart-ws/lib/ws_messages.dart
"""
shell = "bash -euo pipefail -c"

[tasks."gen:dart-rest"]
depends = ["gen:ws-spec"]
description = "Emit the Dart REST client via swagger_parser + build_runner (consumes generated/specs/rest.yaml)"
dir = "generated/dart-rest"
# Regenerate the Dart REST client, applying two swagger_parser output fixups.
# `rm -rf lib` first so a renamed output (e.g. client_postfix change) can't leave orphaned files behind. The
# goawk rewrites pipe through `tr -d '\r'` because goawk emits CRLF on Windows and dart format preserves
# whatever line endings it finds.
#
# Fixup 1 (storage.dart): swagger_parser renders the application/octet-stream storage endpoints unusably for the
# browser -- a `dart:io` `File` PUT body and a `void` GET response. goawk rewrites it before build_runner so putFile
# takes a Uint8List (dio sends Uint8List as raw bytes; a List<int> would be JSON-encoded) and getFile returns the
# bytes. The END guard fails loudly if a swagger_parser bump moves those sites.
#
# Fixup 2 (rest_client.dart): with client_postfix = "" (which drops the `_client` suffix) swagger_parser emits the
# root client's sub-client imports as `clients/<name>_.dart` -- a stray trailing underscore that export.dart does
# not have. goawk strips it. Idempotent: a no-op if upstream fixes the inconsistency.
run = """
dart pub get
coreutils rm -rf lib
dart run swagger_parser
s=../../target/scratch
mkdir -p "$s"
goawk 'BEGIN { q = sprintf("%c", 39) }
/^import / && /dart:io/ { print "import " q "dart:typed_data" q ";"; io++; next }
/^  Future<void> getFile\\(\\{$/ {
  print "  @DioResponseType(ResponseType.bytes)"
  print "  Future<List<int>> getFile({"
  get++
  next
}
/@Body\\(\\) required File body,/ { sub(/File body/, "Uint8List body"); print; body++; next }
{ print }
END {
  if (io != 1 || get != 1 || body != 1) {
    printf("gen:dart-rest storage fixup miss: io=%d get=%d body=%d\\n", io, get, body) > "/dev/stderr"
    exit 1
  }
}' lib/clients/storage.dart | coreutils tr -d '\\r' >"$s/storage.dart"
coreutils mv "$s/storage.dart" lib/clients/storage.dart
goawk '/^import / && /clients/ { gsub(/_\\.dart/, ".dart") } { print }' lib/rest_client.dart |
  coreutils tr -d '\\r' >"$s/rest_client.dart"
coreutils mv "$s/rest_client.dart" lib/rest_client.dart
dart run build_runner build
dart format lib
"""
shell = "bash -euo pipefail -c"
