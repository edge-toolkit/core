---
name: Install mise tools
description: >-
  Runs `install-mise` action, then installs all of the tools in the per-language
  toolchains named by the workflow's MISE_ENV (with one retry on transient
  HTTP flakes). Shared by check.yaml and test.yaml; the caller must run
  `actions/checkout` before this so .mise/config*.toml exists for `mise trust`.

inputs:
  github-token:
    description: >-
      GitHub token forwarded as `$GITHUB_TOKEN` to the mise install steps.
    required: true
  install-action-tools:
    description: >-
      Comma-separated tools to co-install via taiki-e/install-action in the
      same step as mise. Forwarded to install-mise's `extra-tools` input.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No cargo: tool installs on the Windows lane right now -- cargo-binstall fails to execute there (os error 193).
    # open-o2's opener isn't needed in CI, so skip cargo:open rather than let the install fail.
    - name: Skip cargo:open on Windows
      if: runner.os == 'Windows'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: echo "MISE_DISABLE_TOOLS=cargo:open" >> "$GITHUB_ENV"

    - name: Install mise binary
      uses: ./.github/actions/install-mise
      with:
        install-action-tools: ${{ inputs.install-action-tools }}

    - name: Install mise tools
      id: install-mise-tools
      continue-on-error: true
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        mise run preinstall
        mise install

    - name: Install mise tools (retry)
      if: steps.install-mise-tools.outcome == 'failure'
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # Drop mise's self-referential shim before retrying, so PATH falls through to the real mise.exe.
        # A failed first install has usually already written that shim, and this fresh bash then resolves
        # `mise` to it, aborting the whole retry in seconds with
        #
        #     mise: recursive shim invocation detected for mise: /c/Users/runneradmin/AppData/Local/mise/shims/mise
        #
        # (the removal step below runs too late for this step, and is skipped entirely once this step fails)
        # -- observed on commit d801ec192814cf8de880c5935d83232222907975 at
        # https://github.com/edge-toolkit/core/actions/runs/31652059090/job/94298363388, where the first
        # install died on a frippery.org (http:busybox) connect timeout.
        if [ "$RUNNER_OS" = "Windows" ]; then
          rm -fv "$LOCALAPPDATA/mise/shims/mise.cmd" "$LOCALAPPDATA/mise/shims/mise"
        fi
        sleep 20
        mise install

    # Delete mise's auto-generated `mise.cmd` shim on Windows.
    # This lets cmd's PATH search fall through to the real `mise.exe` at `~/.cargo/bin/mise.exe` (staged by
    # taiki-e/install-action). Must run AFTER `mise install` -- that's the step that creates the shims.
    - name: Remove self-recursive mise.cmd shim on Windows
      if: runner.os == 'Windows'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        shims="$LOCALAPPDATA/mise/shims"
        rm -fv "$shims/mise.cmd" "$shims/mise"
        ls "$shims" | grep -i '^mise' || true
