name: Install Mesa Vulkan drivers (lavapipe)
description: Install Mesa's lavapipe Vulkan driver on Linux for WebGPU w/o GPU.

runs:
  using: composite
  steps:
    - name: Install mesa-vulkan-drivers
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
