---
name: Install mise
description: >-
  Install the mise binary via taiki-e/install-action, and on Windows add mise's
  file-shim dir to PATH so subsequent steps can resolve mise-managed tools by
  bare name.

inputs:
  install-action-tools:
    description: >-
      Comma-separated tools to co-install via taiki-e/install-action.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Verify actions/checkout has run
      shell: bash --noprofile --norc -euo pipefail {0}
      run: git rev-parse --is-inside-work-tree >/dev/null

    - name: Install mise
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-binstall,mise@2026.9.0

    - name: Install extra tools via install-action
      if: inputs.install-action-tools != ''
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.install-action-tools }}

    # On Windows, put mise's file-shim dir on PATH and pin the shim mode to "file".
    # taiki-e/install-action's mise manifest stages only `mise.exe`; mise's per-tool `.cmd` "file" shims under
    # `%LOCALAPPDATA%\mise\shims` aren't on PATH by default, so tool lookups inside `mise run` fail with
    # `'dart' / 'mvn' / 'recur' / 'wasm-pack' / 'zig' is not recognized...`. The companion `mise-shim.exe`
    # (single-binary shim) ALSO ships in the Windows zip, but staging it triggers a CreateProcess
    # `ERROR_FILENAME_EXCED_RANGE` (os error 206) when mise-shim re-execs mise.exe with the runner's already-long
    # PATH inherited -- the file-shim fallback doesn't have this problem (each .cmd shim invokes `mise exec --`
    # plainly via cmd). Since `mise-shim.exe` is deliberately absent, pin `MISE_WINDOWS_SHIM_MODE=file` so mise
    # selects file mode up front rather than defaulting to "exe", failing to find `mise-shim.exe`, and logging a
    # "falling back to file shim mode" WARN on every reshim.
    # MISE_INSTALLS_DIR moves the per-tool install dirs to a short root, because mise puts one PATH entry per
    # tool and the default `C:\Users\runneradmin\AppData\Local\mise\installs\` root spends 48 of each entry's
    # characters on a prefix that repeats. Windows hands a child process at most 8191 characters of PATH and
    # ignores the variable outright past that, so every tool stops resolving at the same moment -- the mingw
    # lane reached 11215 characters and reported `dart: not found`, `uv: not found`, `cargo: not found`,
    # `rclone: not found` and `zig: not found` in one go, on commit
    # eb5ade87e8bbf7c31b6e0e2c39fbaf0f4e2e01c2 at
    # https://github.com/edge-toolkit/core/actions/runs/33746317422/job/100619492734. Trimming the prefix to
    # `C:\i` reclaims ~43 characters per entry, which scales with the toolset -- so the lanes carrying the most
    # tools, the ones that overran first, save the most. config.windows.toml's mise_installs reads this same
    # variable, which is what keeps MISE_BASH_PATH and the other install-path vars pointing at the tools.
    - name: Configure mise file shims on Windows
      if: runner.os == 'Windows'
      shell: bash --noprofile --norc -euo pipefail {0}
      # The github-env audit's arbitrary-code-execution shape doesn't apply here.
      # The appended values are hardcoded constants under our control -- no user input flows in.
      run: | # zizmor: ignore[github-env]
        echo "$LOCALAPPDATA\mise\shims" >> "$GITHUB_PATH"
        echo "MISE_WINDOWS_SHIM_MODE=file" >> "$GITHUB_ENV"
        echo 'MISE_INSTALLS_DIR=C:\i' >> "$GITHUB_ENV"

    - name: Trust mise config
      shell: bash --noprofile --norc -euo pipefail {0}
      run: mise trust

    - name: Show MISE_ENV
      shell: bash --noprofile --norc -euo pipefail {0}
      run: echo "MISE_ENV=$MISE_ENV"
