---
name: test-alt

# Alternate-compiler Windows lanes, one per mise target env (.mise/config.<compiler>.toml).
# Both exist for et-ws-web-runner: rusty_v8 has no gnullvm prebuilt, so `msvc` builds it against the
# native prebuilt with the portable MSVC toolchain (prefetch:msvc) and `mingw` links the msvc archive
# into an x86_64-pc-windows-gnu binary with winlibs GCC. Everything installs through mise and the steps
# mirror test.yaml's Windows job -- build-modules covers every module, dotnet-data1 included.
"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# this allows a subsequently queued workflow run to interrupt previous runs in pull requests only
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: "dart,dotnet,java,js,python,rust,zig"

jobs:
  web-runner:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [mingw, msvc]
    # Append the compiler's target env to the workflow-level language set.
    # Job-level rather than a GITHUB_ENV step because the alias must already be loaded when
    # install-mise-tools runs its first `mise install`: that pass installs the compiler env's tools and
    # the rust toolchains' extra target std, and mise does not reconcile a changed `targets` list on an
    # already-installed toolchain.
    env:
      MISE_ENV: "dart,dotnet,java,js,python,rust,zig,${{ matrix.compiler }}"
    # Same busybox-w32 ash default as test.yaml's Windows runs.
    # It is installed by `_setup_all` before the first `run:` step executes, and avoids Git Bash's MSYS
    # fork-emulation cygheap pathology on long mise task chains. The path matches the version pin in
    # `.mise/config.windows.toml`'s [tools."http:busybox"] entry.
    defaults:
      run:
        shell: C:\Users\runneradmin\AppData\Local\mise\installs\http-busybox\1.37.0\ash.exe -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space on Windows
        uses: ./.github/actions/free-disk-space-windows

      - name: Install mise + tools
        uses: ./.github/actions/install-mise-tools
        timeout-minutes: 25
        with:
          github-token: ${{ github.token }}

      # Covers the compiler env's prefetch:mingw / prefetch:msvc via prefetch-ci's `prefetch:*` glob.
      # GITHUB_TOKEN raises the rate-limit ceiling on mise's fetch of the rp-v<N> rustpython_wasm tarball.
      - name: Prefetch dependencies
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run prefetch-ci

      # MISE_JOBS=1 serializes mise's task scheduler.
      # See test.yaml's matching step for the captured cargo registry-lock race this avoids on Windows.
      - name: Serialize mise tasks
        run: echo "MISE_JOBS=1" >> "$GITHUB_ENV"

      - name: Build WASM modules
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run build-modules

      - name: Run tests
        timeout-minutes: 40
        run: mise run test
