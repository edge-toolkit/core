---
name: no-std

# The crates that build without std, built where there is none, and et-ws-server as Raspberry Pi Pico 2 W firmware.
# The firmware is linted bare, and built as a generated scenario's, whose modules its host build then serves to a
# test that fetches each. One Linux job: a bare-metal target compiles the same on every host, so another platform
# would only repeat it. The board is not here, so the firmware itself is built and linted, not run; nothing is
# uploaded or published.
#
# Not path-gated: what breaks a no_std build is a dependency or a feature gaining std somewhere in the tree, which a
# path list would have to name every crate to catch.
"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,js,kotlin,python,r,rust,zig

jobs:
  no-std:
    runs-on: ubuntu-latest
    # Read-only pull of the maintainer-published ghcr.io mise-tools store (install-mise-tools restore step).
    # Never write: the stores are published only from a maintainer's machine via `mise run push-mise-tools`.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show MISE_ENV
        run: echo "MISE_ENV=$MISE_ENV"

      - name: Install mise + tools
        uses: $/.github/actions/install-mise-tools
        timeout-minutes: 60
        with:
          github-token: ${{ github.token }}

      - name: Build the no_std crates for a bare-metal target
        timeout-minutes: 20
        run: mise run build-no-std

      - name: Test the no_std crates built without std
        timeout-minutes: 20
        run: mise run test-no-std

      # The firmware bakes in the network it joins, so CI builds it for one that does not exist.
      # The lint covers the firmware with no modules in it, and the build the default scenario's, as et-cli generates
      # a deployment of it: the page and the wasm agent built in, which the agent's package has to be built for first.
      # The same modules are then served from this host by the firmware's host build, and every one it lists fetched.
      - name: Lint the Pico 2 W firmware, then build and serve a generated scenario's
        timeout-minutes: 45
        env:
          WIFI_NETWORK: edge-toolkit-ci
          WIFI_PASSWORD: not-a-real-passphrase
        run: |
          mise run cargo-clippy-check-pico2w
          mise run build-ws-wasm-agent
          src=verification/local/input/default.yaml
          dst=target/firmware-default
          fmt=firmware-pico2
          cargo run -q -p et-cli -- generate-deployment --input-file "$src" --output-dir "$dst" --output-type "$fmt"
          cd "$dst"
          MISE_ENV="$fmt" mise run firmware-build
          MISE_ENV="$fmt" mise run firmware-host-test
