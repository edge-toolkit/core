---
name: dependencies

"on":
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - config/deny.toml
      - config/osv-scanner.toml
      - .github/workflows/dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The audit binaries come from taiki-e (fast prebuilts); the checks below
      # are driven through `mise run` so the commands + config paths have one
      # source of truth in .mise/config.toml. mise's `task.run_auto_install =
      # false` means `mise run` won't drag in the whole toolchain just to run a
      # task, so this stays a lightweight, audit-only job.
      - name: Install dep-audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-unmaintained,mise,osv-scanner

      - name: Trust mise config
        run: mise trust

      - name: Generate config/osv-scanner.toml from config/deny.toml
        run: mise run gen:osv-scanner

      - name: cargo deny check
        run: mise run cargo-deny-check

      # osv-scanner runs directly, not via `mise run osv-scanner`: that task
      # depends on `cargo-check` (a full workspace build) for local use, which
      # this job intentionally skips -- it only scans the committed lockfile.
      - name: osv-scanner
        run: osv-scanner --lockfile Cargo.lock --config config/osv-scanner.toml

      # `cargo unmaintained` persists per-repository archival/last-commit
      # lookups under `$XDG_CACHE_HOME/cargo-unmaintained` (default
      # `~/.cache/cargo-unmaintained`, with a versioned `v2/` subdir). On a
      # cold runner the per-dependency GitHub round-trips take ~12 min, which
      # nearly blew the old 15-min timeout; restoring this cache keeps reruns
      # fast. Key on Cargo.lock so a dependency change refreshes; the prefix
      # restore-key reuses the previous cache for crates that didn't change.
      - name: Cache cargo-unmaintained lookups
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-unmaintained
          key: cargo-unmaintained-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-unmaintained-

      # `cargo unmaintained` queries the GitHub API to check whether each
      # declared upstream repository is archived. Without a token the
      # archival check is skipped with a warning, leaving an unmaintained
      # archived crate undetected.
      - name: cargo unmaintained
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run cargo-unmaintained-check

      - name: Check config/osv-scanner.toml is committed
        run: git diff --exit-code -- config/osv-scanner.toml
