---
name: docker-linux

"on":
  pull_request:
    paths:
      - .github/workflows/docker-linux.yaml
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:bookworm
          - debian:trixie
          - fedora:42
    name: build (${{ matrix.base }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The image is huge (every language toolchain + prefetched models + a full
      # debug build, incl. aws-lc-sys's large C objects), and its peak `target/`
      # overruns a single runner disk. Reclaim the unused preinstalled SDKs and
      # concatenate the freed root space with /mnt into one LVM volume mounted at
      # Docker's data dir, then restart Docker so the build uses the combined space.
      - name: Maximize build space (combine root + /mnt for Docker)
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /var/lib/docker
          build-mount-path-ownership: "root:root"

      - name: Restart Docker on the maximized volume
        run: sudo systemctl restart docker

      - name: Build stage test
        env:
          BASE_IMAGE: ${{ matrix.base }}
          DOCKER_BUILDKIT: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: docker build --target test --build-arg BASE_IMAGE --secret id=gh_token,env=GITHUB_TOKEN -t et-test .

      # The check stage needs `.git/` + the Dockerfiles. Both are excluded
      # from the main `.dockerignore`, so we pre-stage them into a directory
      # and hand it to docker as a named build context (`c=$CTX`). The check
      # stage then does `COPY --from=c . ./` to land them in /workspace.
      - name: Build stage check
        env:
          BASE_IMAGE: ${{ matrix.base }}
          CTX: target/check-ctx
          DOCKER_BUILDKIT: "1"
          TAG: et-check
          gh_token: ${{ github.token }}
        run: |
          mkdir -p "$CTX"
          cp -r .git Dockerfile Dockerfile.nanoserver "$CTX/"
          docker build --target check --build-arg BASE_IMAGE --build-context extras=$CTX --secret id=gh_token -t $TAG .

      - name: Run the test suite
        run: docker run --rm et-test

      - name: Run mise check
        run: docker run --rm et-check
