---
name: test

"on":
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "OS(es) to run"
        type: choice
        default: windows-latest
        options:
          - all
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: "dart,dotnet,java,js,python,rust,zig"

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # Override the workflow-level `shell: bash` default for Windows runs to
    # use the busybox-w32 ash that mise installs in `_setup_all` (the same
    # shell `MISE_BASH_PATH` already points at for `shell = "bash"` tasks on
    # the Windows Docker images). Avoids Git Bash's MSYS fork-emulation
    # cygheap pathology -- see OLD_NOTES.md for the captured error
    # signatures and the diagnostic harness that found the root cause. The
    # path matches the version pin in `.mise/config.windows.toml`'s
    # [tools."http:busybox"] entry. The `Set HOME = USERPROFILE on Windows`
    # step below explicitly overrides back to `shell: bash` because it
    # runs BEFORE `Install mise + tools` (which is what installs
    # busybox-w32). All later run-bodies use ash.
    defaults:
      run:
        shell: >-
          ${{ startsWith(matrix.os, 'windows') &&
              'C:\Users\runneradmin\AppData\Local\mise\installs\http-busybox\1.37.0\ash.exe -euo pipefail {0}'
              || 'bash --noprofile --norc -euo pipefail {0}' }}
    strategy:
      fail-fast: false
      # `matrix` context isn't available in job-level `if:`, so we compute the
      # OS list right here in the strategy block (where `github.*` IS in scope):
      #   pull_request       → ubuntu-latest + ubuntu-24.04-arm + macos-latest
      #                        + windows-latest (skip slow Intel Mac;
      #                        ubuntu-26.04 + windows-11-arm are dispatch-only)
      #   workflow_dispatch  → the OS picked in the dropdown, or all of them
      # The combos are emitted as a fully-formed list of `{os, timeout}`
      # objects so the `include:` "unmatched entries append as new jobs"
      # behavior doesn't bring back the OSes we just filtered out.
      matrix:
        include: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && (
          github.event.inputs.os == 'all' && format(
          '[{0},{1},{2},{3},{4},{5},{6}]',
          '{"os":"ubuntu-latest","timeout":40}',
          '{"os":"ubuntu-26.04","timeout":40}',
          '{"os":"ubuntu-24.04-arm","timeout":40}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"macos-26-intel","timeout":60}',
          '{"os":"windows-latest","timeout":60}',
          '{"os":"windows-11-arm","timeout":60}'
          )
          || github.event.inputs.os == 'ubuntu-latest' && '[{"os":"ubuntu-latest","timeout":40}]'
          || github.event.inputs.os == 'ubuntu-26.04' && '[{"os":"ubuntu-26.04","timeout":40}]'
          || github.event.inputs.os == 'ubuntu-24.04-arm' && '[{"os":"ubuntu-24.04-arm","timeout":40}]'
          || github.event.inputs.os == 'macos-latest' && '[{"os":"macos-latest","timeout":45}]'
          || github.event.inputs.os == 'macos-26-intel' && '[{"os":"macos-26-intel","timeout":60}]'
          || github.event.inputs.os == 'windows-latest' && '[{"os":"windows-latest","timeout":60}]'
          || github.event.inputs.os == 'windows-11-arm' && '[{"os":"windows-11-arm","timeout":60}]'
          )
          || format('[{0},{1},{2},{3}]',
          '{"os":"ubuntu-latest","timeout":40}',
          '{"os":"ubuntu-24.04-arm","timeout":40}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"windows-latest","timeout":60}')
          ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Install Mesa Vulkan drivers (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      # mise's Tera renderer expects $HOME to be set when evaluating env.HOME
      # in [vars] (config.toml has e.g. `conda_openssl = "{{ env.HOME }}/.local
      # /share/mise/installs/conda-openssl/3"`). MSYS bash auto-sets HOME from
      # USERPROFILE; pwsh and cmd do not, so mise tasks invoked from a pwsh
      # step fail with `Variable env.HOME not found in context while rendering
      # __tera_one_off`. Plumb HOME = USERPROFILE so every subsequent step
      # (incl. our pwsh diagnostic ones) sees it.
      - name: "Setup: HOME = USERPROFILE on Windows"
        if: runner.os == 'Windows'
        timeout-minutes: 1
        # Explicit `shell: bash` because the job-level defaults point at the
        # busybox ash that's installed by the next step (Install mise +
        # tools), so we can't use it here yet. Git Bash is on the runner
        # image by default.
        shell: bash --noprofile --norc -euo pipefail {0}
        run: echo "HOME=$USERPROFILE" >> "$GITHUB_ENV"

      - name: Install mise + tools
        uses: ./.github/actions/install-mise-tools
        timeout-minutes: 20
        with:
          github-token: ${{ github.token }}

      - name: Prefetch dependencies
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run prefetch-ci

      # GITHUB_TOKEN raises the rate-limit ceiling on mise's fetch of the
      # rp-v<N> rustpython_wasm tarball ([tools."http:rp-wasm"] → mise's
      # http backend against github.com release assets).
      # MISE_JOBS=1 on Windows serializes mise's task scheduler so the parallel
      # `build-ws-*-module` deps don't race on cargo's `.cargo/registry/index`
      # lock -- on Linux/macOS cargo waits gracefully, but on Windows it fails
      # fast with `cargo metadata exited with an error: Blocking waiting for
      # file lock on package cache` (observed in job 82448665293, where
      # build-ws-graphics-info-module + build-ws-nfc-module + build-ws-har1-
      # module all kicked off in parallel). Conditional via a separate step
      # rather than a step-level `env:` because mise rejects an empty
      # MISE_JOBS value ("cannot parse integer from empty string"), and GHA
      # has no `if:` on individual env entries.
      - name: Serialize mise tasks on Windows
        if: runner.os == 'Windows'
        run: echo "MISE_JOBS=1" >> "$GITHUB_ENV"

      - name: Build WASM modules
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run build-modules

      - name: Run tests
        timeout-minutes: 30
        run: mise run test
