---
name: test

"on":
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "OS(es) to run"
        type: choice
        default: windows-latest
        options:
          - all
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # TEMPORARY: MISE_ENV being re-expanded one language at a time after the
  # cygheap/setlocal pathology was traced to the mise.cmd self-recursive
  # shim (fix landed in a prior commit). The previous "" baseline went green
  # at cb717094; now bisecting upward one language at a time to confirm none
  # of the per-language configs re-trigger a Windows pathology. Currently:
  # `rust`. Next: `rust,python`, then add another, etc., ending at the
  # canonical `dart,dotnet,java,js,python,rust,zig`. The matching gha.rego
  # carve-out allows the narrowed value on this workflow only.
  MISE_ENV: "rust,python,zig,java"
  # Crank mise's logging to debug while we chase the prefetch-ci hang on
  # Windows -- silent 53-min stalls give us nothing to diagnose with. Drop
  # both back to defaults once the root cause is in hand.
  MISE_VERBOSE: "1"
  MISE_DEBUG: "1"

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # `matrix` context isn't available in job-level `if:`, so we compute the
      # OS list right here in the strategy block (where `github.*` IS in scope):
      #   pull_request       → ubuntu-latest + ubuntu-24.04-arm + macos-latest
      #                        + windows-latest (skip slow Intel Mac;
      #                        ubuntu-26.04 + windows-11-arm are dispatch-only)
      #   workflow_dispatch  → the OS picked in the dropdown, or all of them
      # The combos are emitted as a fully-formed list of `{os, timeout}`
      # objects so the `include:` "unmatched entries append as new jobs"
      # behavior doesn't bring back the OSes we just filtered out.
      matrix:
        include: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && (
          github.event.inputs.os == 'all' && format(
          '[{0},{1},{2},{3},{4},{5},{6}]',
          '{"os":"ubuntu-latest","timeout":40}',
          '{"os":"ubuntu-26.04","timeout":40}',
          '{"os":"ubuntu-24.04-arm","timeout":40}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"macos-26-intel","timeout":60}',
          '{"os":"windows-latest","timeout":60}',
          '{"os":"windows-11-arm","timeout":60}'
          )
          || github.event.inputs.os == 'ubuntu-latest' && '[{"os":"ubuntu-latest","timeout":40}]'
          || github.event.inputs.os == 'ubuntu-26.04' && '[{"os":"ubuntu-26.04","timeout":40}]'
          || github.event.inputs.os == 'ubuntu-24.04-arm' && '[{"os":"ubuntu-24.04-arm","timeout":40}]'
          || github.event.inputs.os == 'macos-latest' && '[{"os":"macos-latest","timeout":45}]'
          || github.event.inputs.os == 'macos-26-intel' && '[{"os":"macos-26-intel","timeout":60}]'
          || github.event.inputs.os == 'windows-latest' && '[{"os":"windows-latest","timeout":60}]'
          || github.event.inputs.os == 'windows-11-arm' && '[{"os":"windows-11-arm","timeout":60}]'
          )
          || '[{"os":"windows-latest","timeout":60}]'
          ) }}
    # TEMPORARY: PR matrix narrowed to windows-latest only while we
    # chase the prefetch-hang / cygheap-fork investigation. Restore the
    # original four-OS PR matrix
    #   format('[{0},{1},{2},{3}]',
    #     '{"os":"ubuntu-latest","timeout":40}',
    #     '{"os":"ubuntu-24.04-arm","timeout":40}',
    #     '{"os":"macos-latest","timeout":45}',
    #     '{"os":"windows-latest","timeout":60}')
    # once the root cause lands.
    env:
      # Windows-only: skip the cargo: source-build that would otherwise be
      # triggered when the gnullvm rust-std isn't fully laid down -- rustc fails
      # with:
      #   error[E0463]: can't find crate for `core`
      #     = note: the `x86_64-pc-windows-gnullvm` target may not be installed
      # cargo:dart-typegen is dev-only (used only by `mise run gen:dart-ws`,
      # which the dart config skips on Windows) and has no quickinstall release,
      # so it can't be steered to a prebuilt the way cargo:cargo-expand can
      # (see config.windows.toml's install_env override).
      MISE_DISABLE_TOOLS: ${{ startsWith(matrix.os, 'windows') && 'cargo:dart-typegen' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Install Mesa Vulkan drivers (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      # mise's Tera renderer expects $HOME to be set when evaluating env.HOME
      # in [vars] (config.toml has e.g. `conda_openssl = "{{ env.HOME }}/.local
      # /share/mise/installs/conda-openssl/3"`). MSYS bash auto-sets HOME from
      # USERPROFILE; pwsh and cmd do not, so mise tasks invoked from a pwsh
      # step fail with `Variable env.HOME not found in context while rendering
      # __tera_one_off`. Plumb HOME = USERPROFILE so every subsequent step
      # (incl. our pwsh diagnostic ones) sees it.
      - name: Set HOME = USERPROFILE on Windows
        if: runner.os == 'Windows'
        run: echo "HOME=$USERPROFILE" >> "$GITHUB_ENV"

      - name: Install mise + tools
        uses: ./.github/actions/install-mise-tools
        with:
          github-token: ${{ github.token }}

      # Non-Windows: prefetch is well-behaved on Linux / macOS, so we keep the
      # original single-step form there. The Windows lane below replaces it
      # with a diagnostic split to chase the silent prefetch stall.
      - name: Prefetch dependencies (non-Windows)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run prefetch-ci

      # Diagnostic split of `mise run prefetch-ci` for Windows runners. The
      # single-step form has been silently stalling with zero output and then
      # failing with MSYS2 / Git Bash cygheap-fork errors at the cancel
      # boundary. Two captured failure signatures so a future contributor
      # grepping the runner log finds this block:
      #
      #   0 [main] bash (31360) child_copy: cygheap read copy failed,
      #     0x800000000..0x8DA05AC60, done 964984832, windows pid 31360,
      #     Win32 error 299
      #
      # First observed on dcd7346bac780892228397e8a5522380eb191a80, in
      #   https://github.com/edge-toolkit/core/actions/runs/27742669243/job/82073365968
      # (rust (windows-latest) matrix entry of this workflow).
      #
      #   0 [main] bash (16912) child_copy: cygheap read copy failed,
      #     0x800000000..0x825997930, done 0, windows pid 16912,
      #     Win32 error 299
      #
      # Reproduced on d30ae7c42152f29a477d6a36359b83f9d1598bdb (same workflow
      # entry; user-cancelled before run could complete -- exact GHA job URL
      # not captured at the time, sorry).
      #
      # Both are `child_copy: cygheap read copy failed` from MSYS' fork
      # emulation (Win32 ERROR_PARTIAL_COPY == decimal 299) when MSYS bash
      # tries to copy its cygheap region (reserved at 0x800000000) into a
      # newly-forked child. The `done <N>` count varies between runs
      # -- sometimes 0 bytes, sometimes ~1 GB -- but the symptom is the same
      # silent stall in the prefetch-ci step body.
      #
      # The split tests three things on Windows:
      #   * Per-task isolation -- we see exactly which sub-task is silent
      #     (`mise run prefetch:rust`, `:node`, or `fetch-mnist-rclone`).
      #   * `shell: pwsh` on the prefetch:rust + prefetch:node steps bypasses
      #     MSYS bash entirely. If those pwsh steps run cleanly the cygheap
      #     theory is corroborated; if they ALSO stall then MSYS bash is
      #     exonerated. (Matching gha.rego "Diagnostic:" prefix carve-out
      #     allows the per-step `shell:` override.)
      #   * The bash step (fetch-mnist-rclone) sets `set -x` + a timestamped
      #     `PS4` + `exec 2>&1` so xtrace logs every command bash runs and
      #     how long each one sat -- defeats the "we have no idea what bash
      #     was waiting on" problem when the cygheap fork eventually fails.
      #
      # fetch-mnist-rclone runs LAST: the bash cygheap fork-copy fails on the
      # FIRST bash step regardless of what work was queued for it. Running it
      # after the pwsh steps tests whether the failure repeats once bash has
      # had time to start fresh later in the job (or whether something the
      # pwsh steps did clears the blocker). Roll the whole block back to a
      # single `mise run prefetch-ci` step once the root cause is in hand.
      - name: "Diagnostic: prefetch prefetch:rust (pwsh shell)"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $now = { Get-Date -Format 'HH:mm:ss.fff' }
          Write-Host "::group::shim diagnostics (what cmd is recursing on)"
          $shims = "$env:LOCALAPPDATA\mise\shims"
          Write-Host "shims dir: $shims (exists: $(Test-Path $shims))"
          if (Test-Path $shims) {
            $cmdFiles = @(Get-ChildItem $shims -Filter '*.cmd' -ErrorAction SilentlyContinue)
            Write-Host "total .cmd shims in dir: $($cmdFiles.Count)"
            foreach ($name in 'cargo.cmd','rustc.cmd','mise.cmd','recur.cmd','rclone.cmd','wasm-pack.cmd') {
              $p = Join-Path $shims $name
              if (Test-Path $p) {
                Write-Host "----- $name -----"
                Get-Content $p
                Write-Host "----- end $name -----"
              } else {
                Write-Host "${name}: NOT FOUND"
              }
            }
          }
          Write-Host "where.exe mise:"
          where.exe mise 2>&1
          Write-Host "where.exe cargo:"
          where.exe cargo 2>&1
          Write-Host "::endgroup::"
          Write-Host "[$(& $now)] starting mise run prefetch:rust"
          mise run prefetch:rust
          Write-Host "[$(& $now)] finished mise run prefetch:rust"

      - name: "Diagnostic: prefetch prefetch:node (pwsh shell)"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $now = { Get-Date -Format 'HH:mm:ss.fff' }
          Write-Host "[$(& $now)] starting mise run prefetch:node"
          mise run prefetch:node
          Write-Host "[$(& $now)] finished mise run prefetch:node"

      - name: "Diagnostic: prefetch fetch-mnist-rclone (bash + xtrace)"
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -x
          export PS4='+ $(date +%H:%M:%S.%N) '
          exec 2>&1
          mise run fetch-mnist-rclone

      # GITHUB_TOKEN raises the rate-limit ceiling on rclone's fetch of the
      # rp-v<N> rustpython_wasm tarball (build-ws-pywasm1-module → fetch-rp-wasm
      # → rclone via :http: against api.github.com).
      - name: Build WASM modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run build-modules

      - name: Run tests
        run: mise run test
