---
name: test

"on":
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "OS(es) to run"
        type: choice
        default: windows-latest
        options:
          - all
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: "dart,dotnet,java,js,python,r,rust,zig"

jobs:
  default:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # Override the workflow-level `shell: bash` default for Windows runs.
    # This uses the busybox-w32 ash that mise installs in `_setup_all` (the same shell `MISE_BASH_PATH` already
    # points at for `shell = "bash"` tasks on the Windows Docker images). Avoids Git Bash's MSYS fork-emulation
    # cygheap pathology on long-running mise task chains. The path matches the version pin in
    # `.mise/config.windows.toml`'s [tools."http:busybox"] entry.
    defaults:
      run:
        shell: >-
          ${{ startsWith(matrix.os, 'windows') &&
              'C:\Users\runneradmin\AppData\Local\mise\installs\http-busybox\1.37.0\ash.exe -euo pipefail {0}'
              || 'bash --noprofile --norc -euo pipefail {0}' }}
    strategy:
      fail-fast: false
      # Compute the OS list here in the strategy block, where `github.*` IS in scope.
      # `matrix` context isn't available in job-level `if:`, so we compute the
      # OS list right here:
      #   pull_request       -> ubuntu-24.04-arm + macos-latest + windows-latest
      #                        (ubuntu-latest x64 is exercised by coverage.yaml, so
      #                        it's dispatch-only here; skip slow Intel Mac;
      #                        ubuntu-26.04 + windows-11-arm are dispatch-only)
      #   workflow_dispatch  -> the OS picked in the dropdown, or all of them
      # The combos are emitted as a fully-formed list of `{os, timeout}`
      # objects so the `include:` "unmatched entries append as new jobs"
      # behavior doesn't bring back the OSes we just filtered out.
      matrix:
        include: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && (
          github.event.inputs.os == 'all' && format(
          '[{0},{1},{2},{3},{4},{5},{6}]',
          '{"os":"ubuntu-latest","timeout":40}',
          '{"os":"ubuntu-26.04","timeout":40}',
          '{"os":"ubuntu-24.04-arm","timeout":40}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"macos-26-intel","timeout":60}',
          '{"os":"windows-latest","timeout":120}',
          '{"os":"windows-11-arm","timeout":60}'
          )
          || github.event.inputs.os == 'ubuntu-latest' && '[{"os":"ubuntu-latest","timeout":40}]'
          || github.event.inputs.os == 'ubuntu-26.04' && '[{"os":"ubuntu-26.04","timeout":40}]'
          || github.event.inputs.os == 'ubuntu-24.04-arm' && '[{"os":"ubuntu-24.04-arm","timeout":40}]'
          || github.event.inputs.os == 'macos-latest' && '[{"os":"macos-latest","timeout":45}]'
          || github.event.inputs.os == 'macos-26-intel' && '[{"os":"macos-26-intel","timeout":60}]'
          || github.event.inputs.os == 'windows-latest' && '[{"os":"windows-latest","timeout":120}]'
          || github.event.inputs.os == 'windows-11-arm' && '[{"os":"windows-11-arm","timeout":60}]'
          )
          || format('[{0},{1},{2}]',
          '{"os":"ubuntu-24.04-arm","timeout":40}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"windows-latest","timeout":120}')
          ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Free disk space on Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/free-disk-space-windows

      - name: Install Mesa Vulkan drivers (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      # Windows tools source-build under mise 2026.7.1, so this step runs long (bumped from 20).
      # The per-tool msvc `install_env` override no longer reaches cargo-binstall there, so cargo tools like
      # action-validator compile from source instead of fetching their msvc prebuilts. Revert once mise fixes it.
      - name: Install mise + tools
        uses: ./.github/actions/install-mise-tools
        timeout-minutes: 60
        with:
          github-token: ${{ github.token }}

      # GITHUB_TOKEN raises the rate-limit ceiling on mise's fetch of the rp-v<N> rustpython_wasm tarball.
      # (The fetch is [tools."http:rp-wasm"], via mise's http backend against github.com release assets.)
      - name: Prefetch dependencies
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run prefetch-ci

      # MISE_JOBS=1 on Windows serializes mise's task scheduler so parallel `build-ws-*-module` deps don't race.
      # The contention is on cargo's `.cargo/registry/index` lock -- on Linux/macOS cargo waits gracefully, but
      # on Windows it fails fast with
      # `cargo metadata exited with an error: Blocking waiting for file lock on package cache`
      # (observed in job 82448665293, where build-ws-graphics-info-module + build-ws-nfc-module +
      # build-ws-har1-module all kicked off in parallel). Conditional via a separate step rather than a step-level
      # `env:` because mise rejects an empty MISE_JOBS value ("cannot parse integer from empty string"), and GHA
      # has no `if:` on individual env entries.
      - name: Serialize mise tasks on Windows
        if: runner.os == 'Windows'
        run: echo "MISE_JOBS=1" >> "$GITHUB_ENV"

      - name: Build WASM modules
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run build-modules

      - name: Run tests
        timeout-minutes: 30
        run: mise run test

  # Alternate-compiler Windows lanes, one per mise target env (.mise/config.<compiler>.toml).
  # `msvc` builds et-ws-web-runner against the native rusty_v8 prebuilt with the portable MSVC toolchain;
  # `mingw` links that msvc archive into an x86_64-pc-windows-gnu binary with winlibs GCC. Separate from
  # the `default` job because they override the gnullvm default target rather than exercising it.
  override:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        compiler: [mingw, msvc]
    # Append the compiler's target env to the workflow-level language set.
    # Job-level rather than a GITHUB_ENV step because the alias must already be loaded when
    # install-mise-tools runs its first `mise install`: that pass installs the compiler env's tools and
    # the rust toolchains' extra target std, and mise does not reconcile a changed `targets` list on an
    # already-installed toolchain.
    env:
      MISE_ENV: "dart,dotnet,java,js,python,r,rust,zig,${{ matrix.compiler }}"
    # Static busybox-w32 ash default (this job is always windows-latest, so no per-OS ternary).
    defaults:
      run:
        shell: C:\Users\runneradmin\AppData\Local\mise\installs\http-busybox\1.37.0\ash.exe -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space on Windows
        uses: ./.github/actions/free-disk-space-windows

      # Windows tools source-build under mise 2026.7.1, so this step runs long (bumped from 25).
      # The per-tool msvc `install_env` override no longer reaches cargo-binstall there, so cargo tools like
      # action-validator compile from source instead of fetching their msvc prebuilts. Revert once mise fixes it.
      - name: Install mise + tools
        uses: ./.github/actions/install-mise-tools
        timeout-minutes: 60
        with:
          github-token: ${{ github.token }}

      - name: Prefetch dependencies
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run prefetch-ci

      # MISE_JOBS=1 serializes mise's task scheduler.
      - name: Serialize mise tasks
        run: echo "MISE_JOBS=1" >> "$GITHUB_ENV"

      - name: Build WASM modules
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run build-modules

      - name: Run tests
        timeout-minutes: 40
        run: mise run test
