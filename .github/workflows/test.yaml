---
name: test

"on":
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "OS(es) to run"
        type: choice
        default: windows-latest
        options:
          - all
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # `matrix` context isn't available in job-level `if:`, so we compute the
      # OS list right here in the strategy block (where `github.*` IS in scope):
      #   pull_request       → ubuntu-latest + ubuntu-24.04-arm + macos-latest
      #                        (skip slow Intel Mac & Windows)
      #   workflow_dispatch  → the OS picked in the dropdown, or all of them
      # The combos are emitted as a fully-formed list of `{os, timeout}`
      # objects so the `include:` "unmatched entries append as new jobs"
      # behavior doesn't bring back the OSes we just filtered out.
      matrix:
        include: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && (
          github.event.inputs.os == 'all' && format(
          '[{0},{1},{2},{3},{4}]',
          '{"os":"ubuntu-latest","timeout":30}',
          '{"os":"ubuntu-24.04-arm","timeout":30}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"macos-26-intel","timeout":60}',
          '{"os":"windows-latest","timeout":60}'
          )
          || github.event.inputs.os == 'ubuntu-latest' && '[{"os":"ubuntu-latest","timeout":30}]'
          || github.event.inputs.os == 'ubuntu-24.04-arm' && '[{"os":"ubuntu-24.04-arm","timeout":30}]'
          || github.event.inputs.os == 'macos-latest' && '[{"os":"macos-latest","timeout":45}]'
          || github.event.inputs.os == 'macos-26-intel' && '[{"os":"macos-26-intel","timeout":60}]'
          || github.event.inputs.os == 'windows-latest' && '[{"os":"windows-latest","timeout":60}]'
          )
          || format(
          '[{0},{1},{2}]',
          '{"os":"ubuntu-latest","timeout":30}',
          '{"os":"ubuntu-24.04-arm","timeout":30}',
          '{"os":"macos-latest","timeout":45}'
          )
          ) }}
    env:
      # Windows-only: skip the cargo: source-build that would otherwise be
      # triggered when the gnullvm rust-std isn't fully laid down -- rustc fails
      # with:
      #   error[E0463]: can't find crate for `core`
      #     = note: the `x86_64-pc-windows-gnullvm` target may not be installed
      # cargo:dart-typegen is dev-only (used only by `mise run gen:dart-ws`,
      # which the dart config skips on Windows) and has no quickinstall release,
      # so it can't be steered to a prebuilt the way cargo:cargo-expand and
      # cargo:rustpython can (see config.windows.toml's install_env overrides).
      MISE_DISABLE_TOOLS: ${{ startsWith(matrix.os, 'windows') && 'cargo:dart-typegen' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Reclaim the large preinstalled toolchains we never use (~30 GB).
      # `|| true` so a missing dir (e.g. on the arm image) is not fatal.
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Mesa Vulkan drivers (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Install mise
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall,mise@2026.6.5

      - name: Select all language envs
        run: echo "MISE_ENV=$(mise run print-all-langs)" >> "$GITHUB_ENV"

      # Optional npm backend, installed before the main `mise install`.
      # See [tasks.setup-aube] in .mise/config.toml for the full rationale.
      - name: Install aube (optional npm backend, allowed to fail)
        continue-on-error: true
        run: |
          mise settings experimental=true
          mise run setup-aube
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_HTTP_TIMEOUT: "120"

      - name: Install mise tools
        run: |
          mise run preinstall
          mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Match check.yaml: bump mise's 30s HTTP timeout so GitHub-release
          # downloads don't fail the install on transient slowness.
          MISE_HTTP_TIMEOUT: "120"

      - name: Prefetch dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run prefetch-ci

      - name: Build WASM modules
        run: mise run build-modules

      # Separate step (not in the default build-modules glob) because the
      # rustpython compile is ~5 min on its own. Without these two steps,
      # the et-ws-pywasm1 case in `services/ws-web-runner/tests/modules.rs`
      # short-circuits with a "skipping {module}: pkg/ not built" log line.
      - name: Clone RustPython for pywasm1
        run: git clone --depth=1 https://github.com/RustPython/RustPython.git "$HOME/rust/RustPython"

      - name: Build pywasm1 module
        run: mise run build-pywasm1-module

      # `build-pywasm1-module` already copied the wasm-pack output into
      # services/ws-modules/pywasm1/pkg/, so the RustPython source tree + its
      # ~3 GB cargo target/ is dead weight once we get here. Removing it
      # reclaims the disk headroom the test-ws-web-runner link phase needs
      # (it otherwise hit `No space left on device (os error 28)` on
      # ubuntu-latest's 14 GB runner). Free both the per-language tier
      # subdir and the wasm-pack output dir.
      - name: Free disk space after pywasm1 build
        if: runner.os == 'Linux'
        run: |
          rm -rf "$HOME/rust/RustPython"
          df -h /

      - name: Run tests
        run: mise run test
