---
name: test

"on":
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "OS(es) to run"
        type: choice
        default: windows-latest
        options:
          - all
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,python,rust,zig

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # `matrix` context isn't available in job-level `if:`, so we compute the
      # OS list right here in the strategy block (where `github.*` IS in scope):
      #   pull_request       → ubuntu-latest + ubuntu-24.04-arm + macos-latest
      #                        + windows-latest (skip slow Intel Mac;
      #                        ubuntu-26.04 + windows-11-arm are dispatch-only)
      #   workflow_dispatch  → the OS picked in the dropdown, or all of them
      # The combos are emitted as a fully-formed list of `{os, timeout}`
      # objects so the `include:` "unmatched entries append as new jobs"
      # behavior doesn't bring back the OSes we just filtered out.
      matrix:
        include: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && (
          github.event.inputs.os == 'all' && format(
          '[{0},{1},{2},{3},{4},{5},{6}]',
          '{"os":"ubuntu-latest","timeout":40}',
          '{"os":"ubuntu-26.04","timeout":40}',
          '{"os":"ubuntu-24.04-arm","timeout":40}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"macos-26-intel","timeout":60}',
          '{"os":"windows-latest","timeout":60}',
          '{"os":"windows-11-arm","timeout":60}'
          )
          || github.event.inputs.os == 'ubuntu-latest' && '[{"os":"ubuntu-latest","timeout":40}]'
          || github.event.inputs.os == 'ubuntu-26.04' && '[{"os":"ubuntu-26.04","timeout":40}]'
          || github.event.inputs.os == 'ubuntu-24.04-arm' && '[{"os":"ubuntu-24.04-arm","timeout":40}]'
          || github.event.inputs.os == 'macos-latest' && '[{"os":"macos-latest","timeout":45}]'
          || github.event.inputs.os == 'macos-26-intel' && '[{"os":"macos-26-intel","timeout":60}]'
          || github.event.inputs.os == 'windows-latest' && '[{"os":"windows-latest","timeout":60}]'
          || github.event.inputs.os == 'windows-11-arm' && '[{"os":"windows-11-arm","timeout":60}]'
          )
          || format(
          '[{0},{1},{2},{3}]',
          '{"os":"ubuntu-latest","timeout":40}',
          '{"os":"ubuntu-24.04-arm","timeout":40}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"windows-latest","timeout":60}'
          )
          ) }}
    env:
      # Windows-only: skip the cargo: source-build that would otherwise be
      # triggered when the gnullvm rust-std isn't fully laid down -- rustc fails
      # with:
      #   error[E0463]: can't find crate for `core`
      #     = note: the `x86_64-pc-windows-gnullvm` target may not be installed
      # cargo:dart-typegen is dev-only (used only by `mise run gen:dart-ws`,
      # which the dart config skips on Windows) and has no quickinstall release,
      # so it can't be steered to a prebuilt the way cargo:cargo-expand can
      # (see config.windows.toml's install_env override).
      MISE_DISABLE_TOOLS: ${{ startsWith(matrix.os, 'windows') && 'cargo:dart-typegen' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Install Mesa Vulkan drivers (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Install mise
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall,mise@2026.6.5

      - name: Trust mise config
        run: mise trust

      - name: Show MISE_ENV
        run: echo "MISE_ENV=$MISE_ENV"

      # Optional npm backend, installed before the main `mise install`.
      # See [tasks.setup-aube] in .mise/config.toml for the full rationale.
      - name: Install aube (optional npm backend, allowed to fail)
        continue-on-error: true
        run: |
          mise settings experimental=true
          mise run setup-aube
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install mise tools
        run: |
          mise run preinstall
          # Retry once on transient api.github.com 5xx during the aqua attestation
          # / asset fetches: the first attempt re-uses what's already on disk, so
          # the retry usually clears single-tool HTTP flakes in seconds.
          mise install || { echo "::warning::mise install failed, retrying once"; mise install; }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prefetch dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run prefetch-ci

      # Diagnostic: the `build-ws-dotnet-data1-module` task has repeatedly failed
      # on windows-latest with `'emcc' is not recognized as an internal or
      # external command, operable program or batch file.` after our task body
      # prepends the Emscripten SDK pack dir to PATH. Several rounds of fixes
      # have speculated about MSYS PATH conversion semantics without observing
      # the actual subprocess state on the runner. This step probes:
      #   - where the dotnet workload installed emcc.bat
      #   - what bash, Win32 `where`, and cmd.exe each report for emcc lookup,
      #     both before and after PATH-prepend (mirroring the failing task)
      #   - whether cmd.exe receives the prepended dir after MSYS' Win32-spawn
      #     PATH conversion (since MSBuild's <Exec> for `emcc` runs through cmd)
      # Output is captured even if subsequent steps fail. Drop the step once
      # the dotnet-data1 windows build is reliably green.
      - name: Debug emcc lookup on Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          # Diagnostic step: let individual lookups fail without aborting.
          set +e
          echo '===== [emcc-debug] env preconditions ====='
          echo "OS=${OS:-<unset>} MSYSTEM=${MSYSTEM:-<unset>}"
          echo "LOCALAPPDATA=${LOCALAPPDATA:-<unset>}"
          echo
          echo '===== [emcc-debug] dotnet workloads ====='
          dotnet workload list 2>&1 | head -20
          echo
          echo '===== [emcc-debug] locate emcc.bat ====='
          emcc_bat="$(find "$LOCALAPPDATA/mise/dotnet-root/packs" -name 'emcc.bat' 2>/dev/null | head -1)"
          echo "emcc_bat=${emcc_bat:-<empty>}"
          if [ -z "$emcc_bat" ]; then
            echo "(emcc.bat not found -- dotnet workload may have failed; check earlier steps)"
            find "$LOCALAPPDATA/mise/dotnet-root/packs" -maxdepth 3 -type d 2>&1 | head -20
            exit 0
          fi
          emcc_dir="$(dirname "$emcc_bat")"
          echo "emcc_dir=${emcc_dir}"
          ls "$emcc_dir" 2>&1 | head -10
          echo
          echo '===== [emcc-debug] lookups BEFORE PATH prepend ====='
          echo "bash command -v emcc:"; command -v emcc 2>&1 || echo "(not found by bash)"
          echo "Win32 where emcc:"; where emcc 2>&1 || echo "(not found by Win32 where)"
          echo "cmd.exe 'where emcc':"; cmd.exe //c "where emcc" 2>&1 || echo "(not found by cmd where)"
          echo
          echo '===== [emcc-debug] lookups AFTER PATH prepend (cygpath -u) ====='
          if command -v cygpath >/dev/null 2>&1; then
            emcc_dir_unix="$(cygpath -u "$emcc_dir")"
            echo "cygpath -u: $emcc_dir -> $emcc_dir_unix"
            export PATH="$emcc_dir_unix:$PATH"
          else
            export PATH="$emcc_dir:$PATH"
          fi
          echo "bash PATH (first 5 entries):"
          echo "$PATH" | tr ':' '\n' | head -5
          echo "bash command -v emcc:"; command -v emcc 2>&1 || echo "(not found by bash)"
          echo "Win32 where emcc:"; where emcc 2>&1 || echo "(not found by Win32 where)"
          echo "cmd.exe 'where emcc':"; cmd.exe //c "where emcc" 2>&1 || echo "(not found by cmd where)"
          echo "cmd.exe %PATH% (first 800 chars):"
          cmd.exe //c "echo %PATH%" 2>&1 | cut -c1-800
          echo
          echo '===== [emcc-debug] env candidates ====='
          env | grep -iE '^(EMSDK|EMSCRIPTEN|EMCC|MSBuildSDKsPath)=' || echo "(no emcc-related env)"
          echo
          echo '===== [emcc-debug] end ====='

      # GITHUB_TOKEN raises the rate-limit ceiling on rclone's fetch of the
      # rp-v<N> rustpython_wasm tarball (build-ws-pywasm1-module → fetch-rp-wasm
      # → rclone via :http: against api.github.com).
      - name: Build WASM modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run build-modules

      - name: Run tests
        run: mise run test
