---
name: bench

# The et-gpu-probe benchmarks on every platform test.yaml runs on, and the hub benchmarks on its Linux runners.
# Each job uploads its results files as an artifact, ready to download into the crate's benches/results/. The job
# then fails unless the repository holds each of that runner's files and this run's latencies match them within the
# factor `bench-compare` allows. Every runner is named by its label, since a hosted runner reports no maker or model
# that stays the same from one run to the next.
#
# Not path-gated: a benchmark is slowed as readily by a dependency or a toolchain bump as by the probe's own code.
"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,js,kotlin,python,r,rust,zig

jobs:
  gpu-probe:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # Every runner test.yaml runs on, whether on each pull request or on dispatch alone.
      # Its ubuntu-26.04 is left out: ubuntu-latest is that image, so it would measure the same runner twice.
      # `machine` names the results file, and `system` is the OS name the bench task adds to it.
      # `linker` is the linker the runner's Rust target needs from mise, where it needs one: config.macos.toml links
      # through conda:lld, and x64 Windows builds for the gnullvm target, which links through llvm-mingw's clang. The
      # arm64 Windows runner needs none -- test.yaml's `minimal` job builds the whole workspace there without one.
      matrix:
        include:
          - os: ubuntu-latest
            machine: gha-ubuntu-latest
            system: linux
            linker: ""
            timeout: 45
          - os: ubuntu-24.04-arm
            machine: gha-ubuntu-24-04-arm
            system: linux
            linker: ""
            timeout: 45
          - os: macos-latest
            machine: gha-macos-latest
            system: macos
            linker: conda:lld
            timeout: 45
          - os: macos-26-intel
            machine: gha-macos-26-intel
            system: macos
            linker: conda:lld
            timeout: 90
          - os: windows-latest
            machine: gha-windows-latest
            system: windows
            linker: github:mstorsjo/llvm-mingw
            timeout: 60
          - os: windows-11-arm
            machine: gha-windows-11-arm
            system: windows
            linker: ""
            timeout: 60
    # Only rust, as in test.yaml's `minimal` job: the bench needs the toolchain and the tools its tasks call.
    # `RESULTS` is the runner's own file, and each GPU it opens has a file of its own beside it, named between the two.
    env:
      MISE_ENV: rust
      MACHINE: ${{ matrix.machine }}
      SYSTEM: ${{ matrix.system }}
      RESULTS_DIR: libs/gpu-probe/benches/results
      RESULTS: libs/gpu-probe/benches/results/${{ matrix.machine }}-${{ matrix.system }}.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show MISE_ENV
        run: echo "MISE_ENV=$MISE_ENV"

      # A hosted Linux runner has no GPU, so lavapipe gives wgpu a Vulkan adapter to probe.
      - name: Install Mesa Vulkan drivers (lavapipe)
        if: runner.os == 'Linux'
        uses: $/.github/actions/install-lavapipe

      # install-mise rather than install-mise-tools, whose full `mise install` cannot complete on every runner here.
      - name: Install mise
        uses: $/.github/actions/install-mise

      # The toolchain, its linker, and the tools bench and bench-compare run, in one install.
      # A second `mise` call before the shim is removed fails on Windows, where the first install leaves a `mise`
      # shim that then invokes itself:
      #   mise: recursive shim invocation detected for mise: /c/Users/runneradmin/AppData/Local/mise/shims/mise
      # on commit https://github.com/edge-toolkit/core/commit/5b595380636f2e85e16e0bd463f4d19c8354dff2 at
      # https://github.com/edge-toolkit/core/actions/runs/43864664483/job/133290028442.
      # GITHUB_TOKEN raises the api.github.com ceiling that mise's version lookups draw on.
      - name: Install the tools the bench needs
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINKER: ${{ matrix.linker }}
        run: mise install rust aqua:01mf02/jaq yq ripgrep github:uutils/coreutils ${LINKER:+"$LINKER"}

      - name: Remove mise shim
        uses: $/.github/actions/remove-mise-shim

      # The bench writes over the repository's files, so the recorded ones are moved aside first.
      # Moved rather than copied, so a GPU's recorded file this run does not write again is not uploaded as its own.
      - name: Set aside the recorded results
        run: |
          mkdir -p target/recorded-results
          for recorded in "$RESULTS" "$RESULTS_DIR/$MACHINE"-*-"$SYSTEM.yaml"; do
            if [ -f "$recorded" ]; then
              mv "$recorded" target/recorded-results/
            fi
          done

      - name: Benchmark
        timeout-minutes: 40
        run: mise run bench libs/gpu-probe "$MACHINE"

      - name: Upload the results
        uses: actions/upload-artifact@v7
        with:
          name: gpu-probe-bench-${{ matrix.machine }}-${{ matrix.system }}
          path: |
            ${{ env.RESULTS }}
            ${{ env.RESULTS_DIR }}/${{ matrix.machine }}-*-${{ matrix.system }}.yaml
          if-no-files-found: error

      # A run that opened no GPU adapter measured none of the probe sets on a GPU, which is what the bench is for.
      # A hosted runner's GPU is a virtual one (lavapipe, WARP, Apple's paravirtual device), so this is how a driver
      # that failed to install, or an adapter wgpu stopped finding, shows up.
      - name: Require a GPU
        run: |
          opened=$(yq '[.machine.adapters[] | select(.name)] | length' "$RESULTS")
          if [ "$opened" -eq 0 ]; then
            echo "::error file=$RESULTS::the bench opened no GPU adapter, so no GPU was benchmarked"
            yq '.machine.adapters' "$RESULTS"
            exit 1
          fi

      # A file the repository does not hold fails, and so does one it holds that this run did not write.
      # So a platform or one of its GPUs is never left unmeasured unnoticed. The artifact is already uploaded by now,
      # ready to download into the repository.
      # The factor is 8 because a hosted runner label is a pool of machines. Between two runs of one tree,
      # ubuntu-latest's slowest benchmark moved 5.09 times and macos-26-intel's 2.94, while ubuntu-24.04-arm stayed
      # within 1.11, so a factor of 8 still fails a regression of an order of magnitude without failing on the pool.
      - name: Compare with the recorded results
        run: |
          status=0
          for measured in "$RESULTS" "$RESULTS_DIR/$MACHINE"-*-"$SYSTEM.yaml"; do
            if [ ! -f "$measured" ]; then
              continue
            fi
            recorded="target/recorded-results/${measured##*/}"
            if [ ! -f "$recorded" ]; then
              echo "::error file=$measured::$measured is not in the repository; add this run's artifact there"
              status=1
            elif ! mise run bench-compare "$recorded" "$measured" --factor 8; then
              status=1
            fi
          done
          for recorded in target/recorded-results/*.yaml; do
            if [ -f "$recorded" ] && [ ! -f "$RESULTS_DIR/${recorded##*/}" ]; then
              echo "::error file=$RESULTS_DIR/${recorded##*/}::recorded, but this run did not write it"
              status=1
            fi
          done
          exit "$status"

  # One hub held to one core, serving 25,000 agents, on the Linux runners only.
  # On macOS and Windows a client reaches one loopback address through about 16,000 ephemeral ports, and the hub
  # covers that locally by listening on two, but hosted runners of those OSes were left out of this job by choice.
  # The two Linux runners give each address 28,000.
  hub:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # `machine` names the results file, as in the gpu-probe job.
      matrix:
        include:
          - os: ubuntu-latest
            machine: gha-ubuntu-latest
          - os: ubuntu-24.04-arm
            machine: gha-ubuntu-24-04-arm
    env:
      MISE_ENV: rust
      RESULTS: services/ws-test-server/benches/results/${{ matrix.machine }}-linux.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show MISE_ENV
        run: echo "MISE_ENV=$MISE_ENV"

      - name: Install mise
        uses: $/.github/actions/install-mise

      - name: Install the tools the bench needs
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install rust aqua:01mf02/jaq yq ripgrep github:uutils/coreutils

      - name: Remove mise shim
        uses: $/.github/actions/remove-mise-shim

      - name: Set aside the recorded results
        run: |
          if [ -f "$RESULTS" ]; then
            mkdir -p target
            cp "$RESULTS" target/recorded-results.yaml
          fi

      # Both ends of 25,000 sockets are open in the one bench process.
      - name: Benchmark
        timeout-minutes: 40
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          ulimit -n 65536
          mise run bench services/ws-test-server "$MACHINE"

      - name: Upload the results
        uses: actions/upload-artifact@v7
        with:
          name: hub-bench-${{ matrix.machine }}-linux
          path: ${{ env.RESULTS }}
          if-no-files-found: error

      # The factor is the gpu-probe job's, for the same reason: a hosted runner label is a pool of machines.
      - name: Compare with the recorded results
        run: |
          if [ ! -f target/recorded-results.yaml ]; then
            echo "::error file=$RESULTS::$RESULTS is not in the repository; add this run's artifact there"
            exit 1
          fi
          mise run bench-compare target/recorded-results.yaml "$RESULTS" --factor 8
