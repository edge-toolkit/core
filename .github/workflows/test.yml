---
name: test

"on":
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "OS(es) to run"
        type: choice
        default: windows-latest
        options:
          - all
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # `matrix` context isn't available in job-level `if:`, so we compute the
      # OS list right here in the strategy block (where `github.*` IS in scope):
      #   pull_request       → ubuntu-latest + ubuntu-24.04-arm + macos-latest
      #                        (skip slow Intel Mac & Windows)
      #   workflow_dispatch  → the OS picked in the dropdown, or all of them
      # The combos are emitted as a fully-formed list of `{os, timeout}`
      # objects so the `include:` "unmatched entries append as new jobs"
      # behavior doesn't bring back the OSes we just filtered out.
      matrix:
        include: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && (
          github.event.inputs.os == 'all' && format(
          '[{0},{1},{2},{3},{4}]',
          '{"os":"ubuntu-latest","timeout":30}',
          '{"os":"ubuntu-24.04-arm","timeout":30}',
          '{"os":"macos-latest","timeout":45}',
          '{"os":"macos-26-intel","timeout":60}',
          '{"os":"windows-latest","timeout":60}'
          )
          || github.event.inputs.os == 'ubuntu-latest' && '[{"os":"ubuntu-latest","timeout":30}]'
          || github.event.inputs.os == 'ubuntu-24.04-arm' && '[{"os":"ubuntu-24.04-arm","timeout":30}]'
          || github.event.inputs.os == 'macos-latest' && '[{"os":"macos-latest","timeout":45}]'
          || github.event.inputs.os == 'macos-26-intel' && '[{"os":"macos-26-intel","timeout":60}]'
          || github.event.inputs.os == 'windows-latest' && '[{"os":"windows-latest","timeout":60}]'
          )
          || format(
          '[{0},{1},{2}]',
          '{"os":"ubuntu-latest","timeout":30}',
          '{"os":"ubuntu-24.04-arm","timeout":30}',
          '{"os":"macos-latest","timeout":45}'
          )
          ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reclaim the large preinstalled toolchains we never use (~30 GB).
      # `|| true` so a missing dir (e.g. on the arm image) is not fatal.
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Mesa Vulkan drivers (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Install mise
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall,mise@2026.6.5

      - name: Select all language envs
        run: echo "MISE_ENV=$(mise run print-all-langs)" >> "$GITHUB_ENV"

      # Optional npm backend, installed before the main `mise install`.
      # See [tasks.setup-aube] in .mise/config.toml for the full rationale.
      - name: Install aube (optional npm backend, allowed to fail)
        continue-on-error: true
        run: |
          mise settings experimental=true
          mise run setup-aube
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_HTTP_TIMEOUT: "120"

      - name: Install mise tools
        run: |
          case "${{ runner.os }}" in
            Linux)   mise run setup-linux ;;
            macOS)   mise run setup-macos ;;
            Windows) mise run setup-windows ;;
          esac

          mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Match check.yml: bump mise's 30s HTTP timeout so GitHub-release
          # downloads don't fail the install on transient slowness.
          MISE_HTTP_TIMEOUT: "120"

      - name: Prefetch dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run prefetch-ci

      - name: Build WASM modules
        run: mise run build-modules

      - name: Run tests
        run: mise run test
