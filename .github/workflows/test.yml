---
name: test

"on":
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "OS(es) to run"
        type: choice
        default: all
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - macos-26-intel
          - windows-latest

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash

jobs:
  rust:
    # On PRs: always skip macos-26-intel (slow) and windows-latest.
    # On workflow_dispatch: run the OS(es) the user picked from the dropdown,
    # or all of them if they left "all" selected.
    if: >-
      (github.event_name == 'pull_request' && matrix.os != 'macos-26-intel' && matrix.os != 'windows-latest')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.os == 'all' || github.event.inputs.os == matrix.os))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-26-intel
          - windows-latest
        include:
          - os: ubuntu-latest
            timeout: 25
          - os: macos-latest
            timeout: 25
          - os: macos-26-intel
            timeout: 60
          - os: windows-latest
            timeout: 40
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mesa Vulkan drivers (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Install mise
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall,mise

      - name: Install mise tools
        run: |
          mise settings add idiomatic_version_file_enable_tools "[]"
          mise settings experimental=true
          mise settings set cargo.binstall true
          # Install conda:openssl up front — the project's OPENSSL_DIR points
          # at its install dir, and `cargo:cargo-unmaintained` (which pulls
          # openssl-sys) reads that during its own `cargo install`. With the
          # default parallel `mise install`, openssl-sys can panic with
          # "OpenSSL include directory does not exist" because conda:openssl
          # hasn't finished populating `include/` yet.
          mise install conda:openssl
          mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Match check.yml: bump mise's 30s HTTP timeout so GitHub-release
          # downloads don't fail the install on transient slowness.
          MISE_HTTP_TIMEOUT: "120"

      - name: Fetch MNIST model
        run: mise run fetch-mnist-rclone

      - name: Prefetch dependencies
        run: mise run prefetch

      - name: Build WASM modules
        run: mise run build-modules

      - name: Run tests
        run: mise run test
