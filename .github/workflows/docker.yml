---
name: docker

# Build the verification images. Only fires when a Dockerfile (or the build
# context's .dockerignore / this workflow) changes, or on manual dispatch --
# these builds are heavy (every toolchain + a release compile), so they don't
# run on every push.
"on":
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.windows
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # Build the Linux `test` stage and run the suite. GitHub runners have no GPU,
  # so the stage's bundled mesa drivers fall back to lavapipe (software Vulkan)
  # for the WebGPU compute test.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image is large (every language toolchain + prefetched models + a
      # release build); the runner's root disk (~14 GB free) can't hold it. Move
      # Docker's storage to the ~70 GB /mnt scratch disk before building.
      - name: Move Docker storage to /mnt
        run: |
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'Docker Root Dir: {{.DockerRootDir}}'

      # GITHUB_TOKEN lifts mise's 60-req/hr anonymous GitHub limit during
      # install-all; passed as a BuildKit secret so it never lands in a layer.
      - name: Build the edge-toolkit test image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: DOCKER_BUILDKIT=1 docker build --target test --secret id=gh_token,env=GITHUB_TOKEN -t edge-toolkit-test .

      # The `test` stage's CMD is `mise run test`; running the image runs the
      # suite. No --device: with no GPU, mesa falls back to lavapipe.
      - name: Run the test suite
        run: docker run --rm edge-toolkit-test

  # Build the Windows setup sketch. Windows containers can only be built on a
  # Windows Docker host, so CI is the only place this is exercised (we can't
  # build it on the Linux dev/CI boxes). Expect to iterate here -- see
  # Dockerfile.windows and the README for the known unknowns.
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # The mise the repo targets. Supplied to the build explicitly (not via a
      # Dockerfile ARG default) because the classic Windows builder only
      # substitutes build-args passed on the command line. (mise's prebuilt
      # windows-x64 "latest" zip is stale at 2026.3.0 and can't read this repo's
      # config -- hence a pinned recent release fetched from GitHub.)
      MISE_VERSION: "2026.6.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hosted Windows runners don't reliably leave the Docker daemon running, so
      # the build can fail connecting to the docker_engine pipe. Start it (no-op
      # if already running) and confirm connectivity before building.
      - name: Start the Docker daemon
        run: |
          if ((Get-Service docker).Status -ne 'Running') { Start-Service docker }
          docker version

      # Both args are build-args: Windows containers use the classic builder, so
      # no BuildKit secret. GITHUB_TOKEN lifts mise's 60-req/hr anonymous GitHub
      # limit during `mise install`; the image is throwaway and the token expires
      # with the job, so its presence in `docker history` is moot.
      - name: Build the Windows setup image (sketch)
        run: >-
          docker build -f Dockerfile.windows
          --build-arg MISE_VERSION=${{ env.MISE_VERSION }}
          --build-arg GITHUB_TOKEN=${{ github.token }}
          -t edge-toolkit-windows .
