---
name: check

"on":
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

# this allows a subsequently queued workflow run to interrupt previous runs in pull requests only
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall,mise

      - name: Select all language envs
        run: echo "MISE_ENV=$(mise run print-all-langs)" >> "$GITHUB_ENV"

      - name: Install pipx (Windows only — aqua has no Windows build)
        if: runner.os == 'Windows'
        run: python -m pip install pipx

      # Optional npm backend, installed before the main `mise install`.
      # See [tasks.setup-aube] in .mise/config.toml for the full rationale.
      - name: Install aube (optional npm backend, allowed to fail)
        continue-on-error: true
        run: |
          mise settings experimental=true
          mise run setup-aube
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_HTTP_TIMEOUT: "120"

      - name: Install mise tools
        run: |
          mise settings add idiomatic_version_file_enable_tools "[]"
          # Platform preinstall via the shared setup task (see .mise/config.toml):
          # setup-all does settings + cargo-binstall + node + conda:openssl;
          # setup-macos adds conda:lld. Running it before the main `mise install`
          # keeps conda:openssl ahead of any parallel cargo:* openssl-sys build.
          # Windows CI uses its native msvc toolchain, so it runs setup-all (the
          # base), not setup-windows whose gnu-host flip is for the bare-box path.
          case "${{ runner.os }}" in
            Linux)   mise run setup-linux ;;
            macOS)   mise run setup-macos ;;
            Windows) mise run setup-all ;;
          esac
          mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub release downloads occasionally take longer than mise's
          # default 30s HTTP timeout; bump it so transient network slowness
          # doesn't fail the whole `mise install` step.
          MISE_HTTP_TIMEOUT: "120"

      - name: Run checkers
        run: |
          mise run check
