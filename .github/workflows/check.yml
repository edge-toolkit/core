---
name: check

"on":
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

# this allows a subsequently queued workflow run to interrupt previous runs in pull requests only
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall,mise

      - name: Install pipx (Windows only — aqua has no Windows build)
        if: runner.os == 'Windows'
        run: python -m pip install pipx

      - name: Install mise tools
        run: |
          mise settings add idiomatic_version_file_enable_tools "[]"
          mise settings experimental=true
          mise settings set cargo.binstall true
          # See test.yml for notes on why conda:openssl is installed up front.
          mise install conda:openssl
          # On macOS, lld is needed to compile Rust binary tools from source
          # (e.g. `cargo:taplo-cli`, see CARGO_TARGET_*_APPLE_DARWIN_RUSTFLAGS).
          mise install conda:lld
          mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub release downloads occasionally take longer than mise's
          # default 30s HTTP timeout; bump it so transient network slowness
          # doesn't fail the whole `mise install` step.
          MISE_HTTP_TIMEOUT: "120"

      # See the equivalent step in test.yml for rationale.
      - name: Debug — mise python resolution
        run: |
          set -x
          mise --version
          mise list python || true
          mise which python || true
          mise which python3 || true
          mise which python3.13 || true
          mise where python || true
          mise exec python -- python --version || true
          mise exec python -- python -c "import sys; print(sys.executable)" || true

      - name: Run checkers
        run: |
          mise run check
