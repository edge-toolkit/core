---
name: check

"on":
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

# this allows a subsequently queued workflow run to interrupt previous runs in pull requests only
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: taiki-e/install-action@v2
        with:
          tool: mise

      - name: Install mise tools
        run: |
          mise settings add idiomatic_version_file_enable_tools "[]"
          mise settings experimental=true
          mise settings set cargo.binstall true
          mise use -g cargo-binstall
          # Install conda:openssl up front — the project's OPENSSL_DIR points
          # at its install dir, and `cargo:cargo-unmaintained` (which pulls
          # openssl-sys) reads that during its own `cargo install`. With the
          # default parallel `mise install`, openssl-sys can panic with
          # "OpenSSL include directory does not exist" because conda:openssl
          # hasn't finished populating `include/` yet.
          mise install conda:openssl
          mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub release downloads occasionally take longer than mise's
          # default 30s HTTP timeout; bump it so transient network slowness
          # doesn't fail the whole `mise install` step.
          MISE_HTTP_TIMEOUT: "120"

      - name: Run checkers
        run: |
          mise run check
