---
name: check

"on":
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

# this allows a subsequently queued workflow run to interrupt previous runs in pull requests only
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,python,rust,zig

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install mise
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall,mise@2026.6.5

      # See test.yaml's identical step for the full rationale: taiki-e/
      # install-action ships only mise.exe, but the Windows mise runtime needs
      # mise-shim.exe + the shims dir on PATH or `mise run` falls back to file
      # shims that aren't reachable.
      - name: Stage mise-shim.exe + shims dir on Windows
        if: runner.os == 'Windows'
        run: |
          v=2026.6.5
          url="https://github.com/jdx/mise/releases/download/v${v}/mise-v${v}-windows-x64.zip"
          zip="$RUNNER_TEMP/mise-win.zip"
          dest="$(dirname "$(command -v mise)")"
          curl -fsSL -o "$zip" "$url"
          unzip -j "$zip" 'mise/bin/mise-shim.exe' -d "$dest"
          echo "$LOCALAPPDATA\mise\shims" >> "$GITHUB_PATH"

      - name: Trust mise config
        run: mise trust

      - name: Show MISE_ENV
        run: echo "MISE_ENV=$MISE_ENV"

      # Optional npm backend, installed before the main `mise install`.
      # See [tasks.setup-aube] in .mise/config.toml for the full rationale.
      - name: Install aube (optional npm backend, allowed to fail)
        continue-on-error: true
        run: |
          mise settings experimental=true
          mise run setup-aube
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install mise tools
        run: |
          mise run preinstall
          # Retry once on transient api.github.com 5xx during the aqua attestation
          # / asset fetches: the first attempt re-uses what's already on disk, so
          # the retry usually clears single-tool HTTP flakes in seconds.
          mise install || { echo "::warning::mise install failed, retrying once"; mise install; }
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub release downloads occasionally take longer than mise's

      - name: Prefetch Rust dependencies
        run: mise run prefetch:rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_NET_RETRY: "5"

      - name: Run checkers
        run: |
          mise run check
