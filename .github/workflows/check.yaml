---
name: check

"on":
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  # Read-only pull of the maintainer-published ghcr.io mise-tools store (install-mise-tools restore step).
  # Never write: the stores are published only from a maintainer's machine via `mise run push-mise-tools`.
  packages: read

# this allows a subsequently queued workflow run to interrupt previous runs in pull requests only
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,js,kotlin,python,r,rust,zig

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 25
          - os: macos-latest
            timeout: 45
          - os: windows-latest
            timeout: 120
    # Windows runs the checkers under busybox-w32 ash, same as test.yaml's Windows lane.
    # That's the shell mise's `shell = "bash"` tasks run on; Git Bash's MSYS fork-emulation cygheap breaks
    # down on long task chains. The path matches the version pin in `.mise/config.windows.toml`'s
    # [tools."http:busybox"] entry.
    defaults:
      run:
        shell: >-
          ${{ startsWith(matrix.os, 'windows') &&
              'C:\Users\runneradmin\AppData\Local\mise\installs\http-busybox\1.37.0\ash.exe -euo pipefail {0}'
              || 'bash --noprofile --norc -euo pipefail {0}' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Free disk space on Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/free-disk-space-windows

      # Windows tools source-build under mise 2026.7.1, so this step runs long (bumped from 25).
      # The per-tool msvc `install_env` override no longer reaches cargo-binstall there, so cargo tools like
      # action-validator compile from source instead of fetching their msvc prebuilts. Revert once mise fixes it.
      - name: Install mise + tools
        uses: ./.github/actions/install-mise-tools
        timeout-minutes: 60
        with:
          github-token: ${{ github.token }}

      - name: Prefetch Rust dependencies
        run: mise run prefetch:rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_NET_RETRY: "5"

      # MISE_JOBS=1 serializes mise's task scheduler so the parallel cargo checkers don't race on Windows.
      # cargo-check / cargo-clippy-check / cargo-doc-check otherwise contend on cargo's
      # `.cargo/registry/index` lock -- on Linux/macOS cargo waits gracefully, on Windows it fails fast
      # (see test.yaml's matching step). mise rejects an empty MISE_JOBS, and GHA has no `if:` on
      # individual env entries, so it's a separate conditional step.
      - name: Serialize mise tasks on Windows
        if: runner.os == 'Windows'
        run: echo "MISE_JOBS=1" >> "$GITHUB_ENV"

      - name: Run checkers
        run: |
          mise run check
