---
name: check

"on":
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

# this allows a subsequently queued workflow run to interrupt previous runs in pull requests only
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,python,rust,zig

jobs:
  check:
    # TEMPORARY: `if: false` parks the job (shows as skipped, no runner time)
    # so all PR-runner capacity goes to the Windows cygheap-fork investigation
    # in test.yaml. Drop this line once the prefetch-hang root cause lands.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install mise + tools
        uses: ./.github/actions/install-mise-tools
        with:
          github-token: ${{ github.token }}

      - name: Prefetch Rust dependencies
        run: mise run prefetch:rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_NET_RETRY: "5"

      - name: Run checkers
        run: |
          mise run check
