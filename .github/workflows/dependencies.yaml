---
name: dependencies

"on":
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - config/deny.toml
      - config/osv-scanner.toml
      - .github/workflows/dependencies.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,python,rust,zig

jobs:
  dependencies:
    # `ubuntu-slim` is GitHub's 1-vCPU / 5-GB-RAM containerised runner with
    # a hard 15-min job cap (docs: `docs/reference/runners`). Sized for
    # automation, not CI/CD compiles -- which is exactly what this workflow
    # is: every step is metadata/network-bound (cargo deny + osv-scanner +
    # cargo unmaintained), zero Rust compilation. The `cache@v4` restore on
    # `cargo-unmaintained` keeps the hot path well under the cap; a cold
    # Cargo.lock-change run is ~12 min, still inside it.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-unmaintained,coreutils,mise@2026.6.5,osv-scanner,ripgrep

      - name: Show MISE_ENV
        run: echo "MISE_ENV=$MISE_ENV"

      - name: Trust mise config
        run: mise trust

      - name: Generate config/osv-scanner.toml from config/deny.toml
        run: mise run gen:osv-scanner

      - name: cargo deny check
        run: mise run cargo-deny-check

      - name: osv-scanner
        run: mise run osv-scanner

      # `cargo unmaintained` persists per-repository archival/last-commit
      # lookups under `$XDG_CACHE_HOME/cargo-unmaintained` (default
      # `~/.cache/cargo-unmaintained`, with a versioned `v2/` subdir). On a
      # cold runner the per-dependency GitHub round-trips take ~12 min, which
      # nearly blew the old 15-min timeout; restoring this cache keeps reruns
      # fast. Key on Cargo.lock so a dependency change refreshes; the prefix
      # restore-key reuses the previous cache for crates that didn't change.
      - name: Cache cargo-unmaintained lookups
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-unmaintained
          key: cargo-unmaintained-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-unmaintained-

      # `cargo unmaintained` queries the GitHub API to check whether each
      # declared upstream repository is archived. Without a token the
      # archival check is skipped with a warning, leaving an unmaintained
      # archived crate undetected.
      - name: cargo unmaintained
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run cargo-unmaintained-check

      - name: Check config/osv-scanner.toml is committed
        run: git diff --exit-code -- config/osv-scanner.toml
