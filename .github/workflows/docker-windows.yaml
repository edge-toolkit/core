---
name: docker-windows

"on":
  pull_request:
    paths:
      - .github/actions/free-disk-space-windows/**
      - .github/workflows/docker-windows.yaml
      - Dockerfile.nanoserver
      - Dockerfile.windows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,js,python,rust,zig

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `base` controls which Dockerfile is built; `runner` picks the host
        # GHA runner. `nanoserver` is the minimal ~120 MB lane; `servercore`
        # is the heavier ~1.25 GB lane with a fuller Windows runtime (used
        # by Dockerfile.windows). Both run on each Windows runner version
        # so we exercise the ltsc2022/ltsc2025 base-image pair against the
        # matching runner kernel. Workflow-level MISE_ENV is the standard
        # set; Dockerfile.nanoserver pins its own narrower MISE_ENV via an
        # ENV that overrides the inherited ARG (Nano can't install python
        # or dotnet).
        include:
          - runner: windows-2022
            base: nanoserver
          - runner: windows-2025
            base: nanoserver
            build_arg: "--build-arg WINDOWS_VERSION=ltsc2025"
          - runner: windows-2022
            base: servercore
          - runner: windows-2025
            base: servercore
            build_arg: "--build-arg WINDOWS_VERSION=ltsc2025"
    name: build (${{ matrix.runner }}, ${{ matrix.base }})
    timeout-minutes: 120
    env:
      # The classic Windows builder on windows-2022 can't substitute build-args into the Dockerfile's RUN,
      # and mise's prebuilt "latest" zip is stale (2026.3.0, too old for the config).
      # 2026.6.5 is the first release with auto_env (loads .mise/config.windows.toml).
      MISE_VERSION: "2026.6.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show MISE_ENV
        run: echo "MISE_ENV=$MISE_ENV"

      # Hosted Windows runners don't reliably leave the Docker daemon running, so
      # the build can fail connecting to the docker_engine pipe. Start it (no-op
      # if already running) and confirm connectivity before building.
      - name: Start the Docker daemon
        run: |
          sc query docker | grep -q RUNNING || net start docker
          docker version

      # Reclaim runner C:\ before any docker work. Windows `docker build`
      # stages HCS layer scratch under `C:\Windows\SystemTemp`, so every GB
      # we free here is a GB that doesn't go to disk-pressure failures
      # inside the build. Preinstalled trees we never touch (Android, old
      # Python / JDK versions, old .NET SDKs, misc DB SDKs) come out first;
      # the docker-prune step below clears any layer-cache leftovers.
      - name: Free disk space on Windows runner
        uses: ./.github/actions/free-disk-space-windows

      # Free runner disk before the build. The Server Core lane has been hitting
      # "There is not enough space on the disk" during the conda-clang-tools
      # install inside `mise install`. `docker system prune -af` clears any
      # unused images/containers from earlier matrix entries on the same
      # runner; `docker builder prune -af` clears BuildKit's layer cache.
      # Disk-free is logged before + after so we can see how much each prune
      # actually reclaims on this runner image -- adjust the cleanup set up or
      # down based on the delta.
      - name: Free disk space before docker build
        env:
          PS_DISKFREE: Get-PSDrive C | Select-Object -Property Used,Free | Format-List
        run: |
          freespace() { powershell.exe -NoProfile -Command "$PS_DISKFREE"; }
          echo "::group::disk-free BEFORE prune"
          freespace
          echo "::endgroup::"
          echo "::group::docker system prune -af"
          docker system prune -af
          echo "::endgroup::"
          echo "::group::docker builder prune -af"
          docker builder prune -af
          echo "::endgroup::"
          echo "::group::disk-free AFTER prune"
          freespace
          echo "::endgroup::"

      - name: Prepare mise and Github token for the build context
        run: |
          v="${{ env.MISE_VERSION }}"
          curl -fsSL -o mise.zip "https://github.com/jdx/mise/releases/download/v$v/mise-v$v-windows-x64.zip"
          printf '%s' "${{ github.token }}" > gh_token

      # Pick which Dockerfile each matrix lane builds. The build is split into
      # `build-minimal` → diagnostics → `precompile` so the et-rp (rustpython)
      # diagnostic runs between the two stages. Both `docker build` calls share
      # BuildKit's layer cache; the second one rebuilds only the layers above
      # `build-minimal`, so the split adds the diagnostic step's runtime, not
      # a second full compile.
      - name: Resolve Dockerfile + image tag
        id: dockerfile
        run: |
          case "${{ matrix.base }}" in
            nanoserver) dockerfile=Dockerfile.nanoserver ;;
            servercore) dockerfile=Dockerfile.windows ;;
            *) echo "unknown matrix.base: ${{ matrix.base }}" >&2; exit 2 ;;
          esac
          tag="et-windows:${{ matrix.runner }}-${{ matrix.base }}-build-minimal"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build stage build-minimal
        env:
          DOCKERFILE: ${{ steps.dockerfile.outputs.dockerfile }}
          IMAGE_TAG: ${{ steps.dockerfile.outputs.tag }}
        run: |
          args="-f $DOCKERFILE ${{ matrix.build_arg }} --build-arg MISE_ENV"
          args="$args --target build-minimal -t $IMAGE_TAG"
          docker build $args .

      # Diagnostic: does the et-rp (rustpython) binary actually run inside this
      # base image? servercore expected: works. nanoserver expected: fails with
      # 0xc0000139 (STATUS_ENTRYPOINT_NOT_FOUND) when rustpython.exe tries to
      # resolve symbols from Nano-stripped shell32/winmm/propsys. Captured here
      # rather than only via the preinstall fallback so the comparison sits
      # side-by-side in the same workflow run. continue-on-error so a Nano
      # failure here doesn't pre-empt the precompile build that follows.
      - name: Diagnose et-rp (rustpython) in build-minimal
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.dockerfile.outputs.tag }}
        run: |
          echo "::group::which rustpython"
          docker run --rm "$IMAGE_TAG" cmd /c "mise where http:et-rp & where rustpython"
          echo "::endgroup::"
          echo "::group::rustpython --version"
          docker run --rm "$IMAGE_TAG" cmd /c "mise exec -- rustpython --version"
          echo "::endgroup::"
          echo "::group::rustpython -c hello"
          docker run --rm "$IMAGE_TAG" cmd /c "mise exec -- rustpython -c \"print('et-rp ok')\""
          echo "::endgroup::"

      # Build target depends on base: nanoserver stops at `precompile` (no
      # python/dotnet/test-runtime; the test stage doesn't exist there),
      # servercore goes all the way through `test` so the next two steps can
      # `docker run` the suite. Both targets compose with the precompile-stage
      # layer cache from the build-minimal step above.
      - name: Build stage precompile (nanoserver) / test (servercore)
        env:
          DOCKERFILE: ${{ steps.dockerfile.outputs.dockerfile }}
        run: |
          if [ "${{ matrix.base }}" = "servercore" ]; then
            target=test
            tag="-t et-windows-test"
          else
            target=precompile
            tag=""
          fi
          args="-f $DOCKERFILE ${{ matrix.build_arg }} --build-arg MISE_ENV"
          args="$args --target $target $tag"
          docker build $args .

      # Run the test suite split the same way docker-linux does: cargo-test-other
      # (workspace minus et-ws-web-runner) and test-ws-web-runner (Deno-runtime
      # gated, self-skips on hosts that can't satisfy it). Each runs in a fresh
      # container so the per-phase compile target/ doesn't share the writable
      # layer with the other phase. servercore-only -- Nano has no test stage.
      - name: Run cargo-test-other
        if: matrix.base == 'servercore'
        run: docker run --rm et-windows-test mise run cargo-test-other

      - name: Run test-ws-web-runner
        if: matrix.base == 'servercore'
        run: docker run --rm et-windows-test mise run test-ws-web-runner
