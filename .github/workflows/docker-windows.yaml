---
name: docker-windows

"on":
  pull_request:
    paths:
      - .github/workflows/docker-windows.yaml
      - Dockerfile.nanoserver
      - Dockerfile.windows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MISE_ENV: dart,dotnet,java,rust,zig

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `base` controls which Dockerfile is built; `runner` picks the host
        # GHA runner. `nanoserver` is the minimal ~120 MB lane; `servercore`
        # is the heavier ~1.25 GB lane with a fuller Windows runtime (used
        # by Dockerfile.windows). Both run on each Windows runner version
        # so we exercise the ltsc2022/ltsc2025 base-image pair against the
        # matching runner kernel.
        include:
          - runner: windows-2022
            base: nanoserver
          - runner: windows-2025
            base: nanoserver
            build_arg: "--build-arg WINDOWS_VERSION=ltsc2025"
          - runner: windows-2022
            base: servercore
          - runner: windows-2025
            base: servercore
            build_arg: "--build-arg WINDOWS_VERSION=ltsc2025"
    name: build (${{ matrix.runner }}, ${{ matrix.base }})
    timeout-minutes: 120
    env:
      # The classic Windows builder on windows-2022 can't substitute build-args into the Dockerfile's RUN,
      # and mise's prebuilt "latest" zip is stale (2026.3.0, too old for the config).
      # 2026.6.5 is the first release with auto_env (loads .mise/config.windows.toml).
      MISE_VERSION: "2026.6.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show MISE_ENV
        run: echo "MISE_ENV=$MISE_ENV"

      # Hosted Windows runners don't reliably leave the Docker daemon running, so
      # the build can fail connecting to the docker_engine pipe. Start it (no-op
      # if already running) and confirm connectivity before building.
      - name: Start the Docker daemon
        run: |
          sc query docker | grep -q RUNNING || net start docker
          docker version

      - name: Prepare mise and Github token for the build context
        run: |
          v="${{ env.MISE_VERSION }}"
          curl -fsSL -o mise.zip "https://github.com/jdx/mise/releases/download/v$v/mise-v$v-windows-x64.zip"
          printf '%s' "${{ github.token }}" > gh_token

      - name: Build stage precompile
        run: |
          case "${{ matrix.base }}" in
            nanoserver) dockerfile=Dockerfile.nanoserver ;;
            servercore) dockerfile=Dockerfile.windows ;;
            *) echo "unknown matrix.base: ${{ matrix.base }}" >&2; exit 2 ;;
          esac
          args="-f $dockerfile ${{ matrix.build_arg }} --build-arg MISE_ENV"
          args="$args --target precompile"
          docker build $args .
