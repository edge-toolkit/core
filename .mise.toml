[tools]
action-validator = "latest"
cargo-binstall = "latest"
"cargo:ast-grep" = "latest"
aube = { version = "latest", os = ["linux", "windows", "macos/arm64"] }
"cargo:aube" = { version = "latest", os = ["macos/x64"] }
"cargo:cargo-expand" = "latest"
"cargo:cargo-unmaintained" = "latest"
"cargo:taplo-cli" = "latest"
"cargo:wasm-pack" = "latest"
"cargo:watchexec-cli" = "latest"
"chromedriver" = "146"
cmake = "latest"
"conda:lld" = "latest"
"conda:openssl" = "latest"
dart = { version = "latest", url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{ version }}/sdk/dartsdk-{{ os() }}-{{ arch() }}-release.zip", version_expr = 'fromJSON(body).prefixes | filter({ # matches "^channels/stable/release/(\\d+\\.\\d+\\.\\d+)/$" }) | map({split(#, "/")[3]}) | sortVersions()', version_list_url = "https://storage.googleapis.com/storage/v1/b/dart-archive/o?prefix=channels/stable/release/&delimiter=/" }
dotnet = "latest"
dotnet-core = "latest"
"dotnet:roslynator.dotnet.cli" = "latest"
dprint = "latest"
editorconfig-checker = "latest"
"github:grok-rs/waitup" = "latest"
"github:wasm-bindgen/wasm-bindgen" = "0.2.114"
# Use the GitHub release tarball, not `npm:pyodide`. The npm package is only
# the runtime (pyodide.js, .wasm, stdlib, micropip) ~5 MB — it's designed for
# JS apps that fetch the rest from JsDelivr's Pyodide custom-CDN namespace
# (https://www.jsdelivr.com/oss-cdn) at runtime. We need the ~200 MB "full"
# distribution served locally so browser modules work offline; that's only
# published as a tarball on GitHub releases. The extracted tarball contains a
# top-level `pyodide/` directory the modules service picks up — see
# `default_modules_folders` in libs/edge-toolkit/src/config.rs.
"http:pyodide" = { version = "0.29.3", url = "https://github.com/pyodide/pyodide/releases/download/{{ version }}/pyodide-{{ version }}.tar.bz2" }
java = "latest"
maven = "latest"
mprocs = "latest"
node = "22"
"npm:onnxruntime-web" = "latest"
osv-scanner = "latest"
pipx = "latest"
"pipx:cmake" = "latest"
"pipx:componentize-py" = "latest"
"pipx:pytest" = "latest"
# The default aqua backend has no darwin/amd64 prebuilt; fall back to
# `npm:pnpm` on Intel Mac (node is already a mise tool above).
pnpm = { version = "latest", os = ["linux", "windows", "macos/arm64"] }
"npm:pnpm" = { version = "latest", os = ["macos/x64"] }
protoc = "latest"
python = "3.13"
rclone = "latest"
ruff = "latest"
rust = [
  { version = "latest", components = "clippy,rust-analyzer", targets = "wasm32-unknown-unknown,wasm32-wasip2" },
  { version = "nightly", components = "rust-src,rustfmt", targets = "wasm32-unknown-unknown,wasm32-wasip2" },
]
typos = "latest"
uv = "0.11.8"
wasm-tools = "latest"
yq = "latest"
zig = "latest"

[env]
# Use the conda:openssl install for Rust's OPENSSL_DIR so openssl-sys crate builds.
OPENSSL_DIR = "{{ env.HOME }}/.local/share/mise/installs/conda-openssl/latest"
CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS = "-C link-arg=-Wl,-rpath,{{ env.HOME }}/.local/share/mise/installs/conda-openssl/latest/lib"
CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS = "-C link-arg=-Wl,-rpath,{{ env.HOME }}/.local/share/mise/installs/conda-openssl/latest/lib"
# Silence Maven's per-artifact download/upload progress lines (the
# "Downloading from central:" / "Downloaded" spam). Build output and real
# errors still print. MAVEN_ARGS is honored by Maven 3.9+ and prepends to
# every `mvn` invocation.
MAVEN_ARGS = "--no-transfer-progress"

[tasks]
ec = "ec"
editorconfig-check = "ec"
ruff-check = "ruff check services/ws-modules/"
ruff-fmt = "ruff format services/ws-modules/"
zig-check = "zig fmt --check services/ws-modules/"
zig-fmt = "zig fmt services/ws-modules/"

[tasks.dotnet-fmt]
description = "Format dotnet C# code"
run = "dotnet format"

[tasks.dotnet-check]
description = "Check dotnet C# formatting"
run = "dotnet format --verify-no-changes"

[tasks.dprint-check]
run = "dprint check"

[tasks.dprint-check.env]
DPRINT_CACHE_DIR = "/tmp/dprint-cache"

[tasks.dprint-fmt]
run = "dprint fmt"

[tasks.fmt]
depends = ["cargo-clippy-fix", "cargo-fmt", "dart-fmt", "dotnet-fmt", "dprint-fmt", "taplo-fmt", "zig-fmt"]
description = "Run repository formatters"

[tasks.dart-check]
run = "dart analyze services/ws-modules/dart-comm1/"

[tasks.dart-fmt]
run = "dart format services/ws-modules/dart-comm1/"

[tasks.check]
depends = [
  "ast-grep-check",
  "cargo-check",
  "cargo-clippy",
  "cargo-doc-check",
  "cargo-fmt-check",
  "dart-check",
  "dotnet-check",
  "dprint-check",
  "editorconfig-check",
  "osv-scanner",
  "taplo-check",
  "typos",
  "verification-check",
  "zig-check",
]
description = "Run repository checks"

[tasks.ast-grep-check]
description = "Run ast-grep structural-search rules"
run = "ast-grep scan --error -c config/ast-grep/sgconfig.yml"

[tasks.cargo-check]
run = "cargo check --workspace"

[tasks.cargo-fmt]
run = "cargo +nightly fmt"

[tasks.cargo-fmt-check]
run = "cargo +nightly fmt -- --check"

[tasks.cargo-clippy]
run = "cargo clippy --workspace --tests"

[tasks.cargo-doc-check]
description = "Build rustdoc with -D warnings to fail on any doc issues"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --document-private-items"

[tasks.cargo-clippy-fix]
run = "cargo clippy --fix --allow-dirty --allow-staged --workspace --tests"

[tasks.taplo-fmt]
run = "taplo format"

[tasks.taplo-check]
run = "taplo lint"

[tasks.typos]
run = "typos"

[tasks.osv-scanner]
depends = ["cargo-check"]
run = "osv-scanner --lockfile Cargo.lock"

[tasks.prefetch]
# `build-ws-wasm-agent` produces `services/ws-wasm-agent/pkg/`, which the
# static workspace references via a `link:` path. Run it before `pnpm install`
# so the link target exists.
depends = ["download-models", "build-ws-wasm-agent"]
description = "Pre-download all dependencies and models (Rust crates, Dart packages, Python envs, Java/Maven, .NET, Node, WIT)"
run = """
cargo check --workspace
dart pub get --directory services/ws-modules/dart-comm1
uv sync --directory services/ws-modules/pydata1
uv sync --directory services/ws-modules/pyface1
mvn dependency:resolve --quiet
dotnet restore
pnpm install --dir services/ws-server/static --ignore-scripts --config.ignoredBuiltDependencies=protobufjs
zig build --fetch --build-file services/ws-modules/zig-data1/build.zig
"""

# pnpm refuses non-TTY destructive node_modules cleanup unless `CI=true`,
# which fires when an earlier install left a different layout (e.g. before
# `link:` was wired up). Treat `mise run prefetch` as a CI-style batch.
[tasks.prefetch.env]
CI = "true"

[tasks.regenerate-verification]
alias = "regen-verification"
description = "Regenerate checked-in verification output files"
run = "cargo run -p et-cli -- regen-verification"

[tasks.verification-check]
depends = ["regenerate-verification"]
description = "Fail if generated scenario output files are stale"
run = "git diff --exit-code -- verification"

# `cargo-watch` is unmaintained; `watchexec` is its successor (and what
# `cargo-watch` always called under the hood). Restart on .rs/.toml
# changes so a workspace-wide edit (any library, any service the server
# depends on) triggers a rebuild. `--clear` wipes the terminal between
# runs so cargo output starts at the top of the screen; `--restart`
# kills the running `cargo run` before kicking off a fresh one.
# Respects `.gitignore`, so `target/` and friends are skipped.
[tasks.ws-server]
description = "Run the WebSocket server, restarting on .rs/.toml changes"
run = "watchexec --restart --clear --exts rs,toml -i '**/tests/**' -- cargo run -p et-ws-server"

[tasks.ws-server.env]
OTLP_AUTH_PASSWORD = "1234"
OTLP_AUTH_USERNAME = "root@example.com"

[tasks.ws-wasi-runner]
description = "Run the WebSocket WASI runner (set RUNNER_MODULE to a WASI module, e.g. wasi-graphics-info; set RUNNER_FEATURES=cuda on CUDA hosts)"
dir = "services/ws-wasi-runner"
run = """
if [ -n "${RUNNER_FEATURES:-}" ]; then
  cargo run --features "$RUNNER_FEATURES"
else
  cargo run
fi
"""

[tasks.build-ws-wasm-agent]
description = "Build the WebSocket WASM client"
dir = "services/ws-wasm-agent"
run = "wasm-pack build . --target web -- -Z build-std=std,panic_abort"

[tasks.build-ws-wasm-agent.env]
# Scope these flags to the wasm target rather than setting plain `RUSTFLAGS`:
# wasm-pack auto-installs a matching `wasm-bindgen-cli` (when the version in
# `Cargo.lock` differs from the one on PATH) by shelling out to `cargo
# install`, which inherits this env. A plain `RUSTFLAGS` with `target-cpu=mvp`
# and `+mutable-globals` then leaks into that host build and rustc rejects
# them with "'mvp' is not a recognized processor for this target".
CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS = "-C target-cpu=mvp -C target-feature=+mutable-globals,+sign-ext,+nontrapping-fptoint"
RUSTUP_TOOLCHAIN = "nightly"

[tasks.build-ws-data1-module]
description = "Build the data1 workflow WASM module"
dir = "services/ws-modules/data1"
run = "wasm-pack build . --target web"

[tasks.build-ws-har1-module]
description = "Build the har1 workflow WASM module"
dir = "services/ws-modules/har1"
run = """
wasm-pack build . --target web
cargo run -p et-cli -- module-package-json
"""

[tasks.build-ws-face-detection-module]
description = "Build the face detection workflow WASM module"
dir = "services/ws-modules/face-detection"
run = """
wasm-pack build . --target web
cargo run -p et-cli -- module-package-json
"""

[tasks.build-ws-comm1-module]
description = "Build the comm1 workflow WASM module"
dir = "services/ws-modules/comm1"
run = "wasm-pack build . --target web"

[tasks.build-ws-sensor1-module]
description = "Build the sensor1 workflow WASM module"
dir = "services/ws-modules/sensor1"
run = "wasm-pack build . --target web"

[tasks.build-ws-audio1-module]
description = "Build the audio1 workflow WASM module"
dir = "services/ws-modules/audio1"
run = "wasm-pack build . --target web"

[tasks.build-ws-video1-module]
description = "Build the video1 workflow WASM module"
dir = "services/ws-modules/video1"
run = "wasm-pack build . --target web"

[tasks.build-ws-bluetooth-module]
description = "Build the bluetooth workflow WASM module"
dir = "services/ws-modules/bluetooth"
run = "wasm-pack build . --target web"

[tasks.build-ws-geolocation-module]
description = "Build the geolocation workflow WASM module"
dir = "services/ws-modules/geolocation"
run = "wasm-pack build . --target web"

[tasks.build-ws-graphics-info-module]
description = "Build the graphics info workflow WASM module"
dir = "services/ws-modules/graphics-info"
run = "wasm-pack build . --target web"

[tasks.build-ws-speech-recognition-module]
description = "Build the speech recognition workflow WASM module"
dir = "services/ws-modules/speech-recognition"
run = "wasm-pack build . --target web"

[tasks.build-ws-nfc-module]
description = "Build the nfc workflow WASM module"
dir = "services/ws-modules/nfc"
run = "wasm-pack build . --target web"

[tasks.build-ws-dart-comm1-module]
description = "Build the dart-comm1 workflow module"
dir = "services/ws-modules/dart-comm1"
run = "dart compile js lib/dart_comm1.dart -o pkg/et_ws_dart_comm1_compiled.js --no-source-maps"

[tasks.build-ws-dotnet-data1-module]
description = "Build the dotnet-data1 C# WASM workflow module"
dir = "services/ws-modules/dotnet-data1"
run = '''
dotnet workload install wasm-tools --skip-manifest-update
dotnet publish -c Release

PUBLISH=bin/Release/net10.0/publish/wwwroot/_framework
cp "$PUBLISH"/*.js "$PUBLISH"/*.wasm "$PUBLISH"/*.dat pkg/
'''

[tasks.build-ws-wasi-graphics-info-module]
description = "Build the WASI graphics-info Python module as a WASI Preview 2 component"
dir = "services/ws-modules/wasi-graphics-info"
# WIT lives once in services/ws-wasi-runner/wit/ - the runner's `runner`
# world is what its bindgen consumes; the `module` world (which `include`s
# `runner` and adds wasi-nn) is what guest modules target. `mnist-12.onnx`
# is fetched into `pkg/` by `mise run download-models` (see
# `fetch-mnist-rclone`); componentize-py 0.23 doesn't bundle arbitrary
# data files inside the component image, so the guest fetches it via the
# `wasi:keyvalue/store` host import from the ws-server at runtime.
# componentize-py 0.23's `bindings` subcommand refuses to overwrite an
# existing output dir, so we wipe it first.
run = """
rm -rf wit_world
componentize-py -d ../../ws-wasi-runner/wit -w module bindings .
componentize-py -d ../../ws-wasi-runner/wit -w module componentize wasi_graphics_info -o pkg/et_ws_wasi_graphics_info.wasm
cargo run -p et-cli -- module-package-json
"""

[tasks.build-ws-wasi-data1-module]
description = "Build the Rust WASI data1 module as a WASI Preview 2 component"
# The crate is a regular workspace member but its lib body is gated on
# `#![cfg(target_os = "wasi")]`, so cargo check from the host target gets
# an empty cdylib while this task explicitly requests wasm32-wasip2. The
# .wasm artifact lands in the workspace-shared `target/` and is then
# copied into the module's pkg/ for et-modules-service to serve.
run = """
cargo build --release -p et-ws-wasi-data1 --target wasm32-wasip2
mkdir -p services/ws-modules/wasi-data1/pkg
cp target/wasm32-wasip2/release/et_ws_wasi_data1.wasm services/ws-modules/wasi-data1/pkg/et_ws_wasi_data1.wasm
cargo run -p et-cli -- module-package-json --module-dir services/ws-modules/wasi-data1
"""

[tasks.build-ws-wasi-comm1-module]
description = "Build the Rust WASI comm1 module as a WASI Preview 2 component"
run = """
cargo build --release -p et-ws-wasi-comm1 --target wasm32-wasip2
mkdir -p services/ws-modules/wasi-comm1/pkg
cp target/wasm32-wasip2/release/et_ws_wasi_comm1.wasm services/ws-modules/wasi-comm1/pkg/et_ws_wasi_comm1.wasm
cargo run -p et-cli -- module-package-json --module-dir services/ws-modules/wasi-comm1
"""

[tasks.build-ws-pydata1-module]
description = "Build the pydata1 Python workflow module"
dir = "services/ws-modules/pydata1"
run = """
uv build --wheel --out-dir pkg
cargo run -p et-cli -- module-package-json
"""

[tasks.build-ws-pyface1-module]
description = "Build the pyface1 Python face detection workflow module"
dir = "services/ws-modules/pyface1"
run = """
uv build --wheel --out-dir pkg
cargo run -p et-cli -- module-package-json
"""

[tasks.build-ws-java-data1-module]
description = "Build the java-data1 workflow module"
run = "mvn package"

[tasks.build-ws-zig-data1-module]
description = "Build the zig-data1 workflow WASM module"
dir = "services/ws-modules/zig-data1"
run = "zig build -Doptimize=ReleaseSmall"

[tasks.build-modules]
depends = [
  "build-ws-audio1-module",
  "build-ws-bluetooth-module",
  "build-ws-comm1-module",
  "build-ws-dart-comm1-module",
  "build-ws-data1-module",
  "build-ws-face-detection-module",
  "build-ws-geolocation-module",
  "build-ws-graphics-info-module",
  "build-ws-har1-module",
  "build-ws-java-data1-module",
  "build-ws-nfc-module",
  "build-ws-pydata1-module",
  "build-ws-pyface1-module",
  "build-ws-sensor1-module",
  "build-ws-speech-recognition-module",
  "build-ws-video1-module",
  "build-ws-wasi-comm1-module",
  "build-ws-wasi-data1-module",
  "build-ws-wasi-graphics-info-module",
  "build-ws-wasm-agent",
  "build-ws-zig-data1-module",
]
description = "Build all WebAssembly modules"

[tasks.test-ws-wasm-agent-firefox]
description = "Run headless Firefox tests for the WebSocket WASM client"
dir = "services/ws-wasm-agent"
run = "wasm-pack test --headless --firefox"

[tasks.ws-e2e-firefox]
depends = ["test-ws-wasm-agent-firefox", "ws-server"]
description = "Run both the ws-server and ws-wasm-agent using Firefox"

[tasks.test-ws-wasm-agent-chrome]
description = "Run headless Chrome tests for the WebSocket WASM client"
dir = "services/ws-wasm-agent"
run = "env CHROMEDRIVER=\"$(mise where chromedriver)/bin/chromedriver\" wasm-pack test --headless --chrome"

[tasks.ws-e2e-chrome]
depends = ["test-ws-wasm-agent-chrome", "ws-server"]
description = "Run both the ws-server and ws-wasm-agent using Chrome"

[tasks.openobserve]
alias = "o2"
run = "docker run --rm -it --name openobserve -p 5080:5080 --env-file config/o2.env openobserve/openobserve:v0.70.3"

[tasks.demo]
depends = ["openobserve", "ws-server"]

[tasks.open-o2]
run = "open http://localhost:5080/"

[tasks.fetch-face1-rclone]
run = """
    rclone copyto :http:amd/retinaface/resolve/main/weights/RetinaFace_int.onnx \
        data/model-modules/model-face1/pkg/video_cv.onnx --http-url https://huggingface.co --progress
"""

[tasks.fetch-har-motion1-rclone]
run = """
    rclone copyto \
        :http:acd17sk/MET-Metabolic-Equivalent-of-Task-AI-Android-APP/raw/refs/heads/main/Models/onnx/hybrid_met.onnx \
        data/model-modules/model-har-motion1/pkg/har-motion1.onnx --http-url https://github.com --progress
"""

[tasks.fetch-mnist-rclone]
# MNIST classifier used by services/ws-modules/wasi-graphics-info to exercise
# wasi-nn end-to-end. Sourced from the canonical ONNX Model Zoo; size 26143
# bytes. Lands under the module's gitignored pkg/ so et-modules-service can
# serve it statically alongside the .wasm.
run = """
    rclone copyto \
        :http:onnx/models/raw/main/validated/vision/classification/mnist/model/mnist-12.onnx \
        services/ws-modules/wasi-graphics-info/pkg/mnist-12.onnx \
        --http-url https://github.com --progress
"""

[tasks.download-models]
depends = ["fetch-face1-rclone", "fetch-har-motion1-rclone", "fetch-mnist-rclone"]

[tasks.cargo-test]
run = "cargo test --workspace"

[tasks.test-pyface1]
dir = "services/ws-modules/pyface1"
run = "uv run pytest"

[tasks.test]
depends = ["cargo-test", "test-pyface1"]
description = "Run all tests"
