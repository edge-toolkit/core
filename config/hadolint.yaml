# hadolint config.
# Each entry below is a best-practice rule we consciously skip, with the reason;
# drop one once it no longer applies.

# Every Dockerfile has to declare where its image came from.
# GHCR reads `org.opencontainers.image.source` to attach a pushed package to the repository, and a package that
# arrives without it stays unlinked until some later push supplies one -- which is a thing nobody notices until
# they are looking at a package page with no source. Requiring it of every Dockerfile rather than only the ones
# published today means an image that starts being published later cannot arrive unlabelled. A `LABEL` in the
# first stage is enough, since a derived image inherits its parent's labels.
#
# DL3049 is `info` by severity and hadolint fails on `info` already, so the override buys no strictness today.
# It is here to say the level is deliberate: a future `failure-threshold` that forgives `info` would otherwise
# turn this requirement off silently.
label-schema:
  org.opencontainers.image.source: url
override:
  error:
    - DL3049

ignored:
  # Pinning apt package versions is brittle.
  # They float with the Ubuntu base image + security updates, so an exact pin breaks on every base bump. We install
  # distro defaults deliberately -- the base FROM line is the version pin.
  - DL3008
  # Same for dnf (Fedora base). Same rationale as DL3008 above.
  - DL3041
  # Same for zypper (openSUSE base). Same rationale as DL3008 above.
  - DL3037
  # Same for npm: `npm install -g pnpm` tracks latest; we don't pin it here.
  - DL3016
  # Consecutive RUNs are kept separate on purpose.
  # For layer caching and so a change to one step doesn't bust the others.
  - DL3059
  # Our RUN <<EOF heredocs start with `set -euo pipefail`, which a policy of our own enforces.
  # hadolint pipes the body through shellcheck under /bin/sh by default, where pipefail isn't POSIX -- but every base
  # image we use ships bash and the heredoc bodies are bash-compatible.
  - SC3040
