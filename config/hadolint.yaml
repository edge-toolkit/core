# hadolint config.
# Each entry below is a best-practice rule we consciously skip, with the reason;
# drop one once it no longer applies.
ignored:
  # Pinning apt package versions is brittle.
  # They float with the Ubuntu base image + security updates, so an exact pin breaks on every base bump. We install
  # distro defaults deliberately -- the base FROM line is the version pin.
  - DL3008
  # Same for dnf (Fedora base). Same rationale as DL3008 above.
  - DL3041
  # Same for zypper (openSUSE base). Same rationale as DL3008 above.
  - DL3037
  # Same for npm: `npm install -g pnpm` tracks latest; we don't pin it here.
  - DL3016
  # Consecutive RUNs are kept separate on purpose.
  # For layer caching and so a change to one step doesn't bust the others.
  - DL3059
  # Our RUN <<EOF heredocs start with `set -euo pipefail`, enforced by our own conftest rule.
  # hadolint pipes the body through shellcheck under /bin/sh by default, where pipefail isn't POSIX -- but every base
  # image we use ships bash and the heredoc bodies are bash-compatible.
  - SC3040
