# Exclude config/jscpd-baseline.json, which holds nothing but machine-written clone fingerprints.
# Its 16-char hex runs spell enough near-words to trip the dictionary ("...b76ded1373" -> "dead", "...747afe01f" ->
# "safe"). Excluded as a whole file rather than via extend-ignore-re, which would have to match any 16-hex run and
# would blind the checker to real typos elsewhere. Nothing is lost: the file contains no prose. It cannot be
# gitignored -- the ratchet in jscpd-check needs it tracked.
[files]
extend-exclude = ["config/jscpd-baseline.json"]

[default]
# Each pattern suppresses one known false positive, anchored so the word is still checked everywhere else.
# `lod-min-clamp` / `lod-max-clamp` are WebGPU sampler fields (level-of-detail) in the vendored
# wasi:webgpu WIT, not misspellings of "load". Scoped to those two identifiers so bare "lod" is still
# flagged everywhere else.
# "Functionality is equivelant to" is upstream wasi-io 0.2.8's own typo in a vendored WIT doc comment;
# the file is fetched verbatim by fetch-wit-deps, so it cannot be corrected here. Anchored to the whole
# phrase so the misspelling is still caught in prose we write.
# `Checksum: <hex>` is the header line openapi2zig writes into each generated Zig client, and a fresh hash can open
# with a near-word ("ba..."). Anchored to that header so other hex runs are still checked.
# `std.compress.flate` is the Zig standard library's DEFLATE module, not a misspelling of "flat". Scoped to that path
# so bare "flate" is still flagged.
extend-ignore-re = [
  "Checksum: [0-9a-f]+",
  "Functionality is equivelant to",
  "lod-(min|max)-clamp",
  "std\\.compress\\.flate",
]

# ser2net is the serial-to-network bridge daemon, whose "ser" is short for serial rather than a misspelling of "set".
[default.extend-identifiers]
ser2net = "ser2net"
# textureLod is GLSL's sampling function that names its level of detail, not a misspelling of "load".
textureLod = "textureLod"
