# data/ is out of scope for the typos check.
# It holds vendored demo + model assets (not our own prose), so its spelling
# is not ours to police.
[files]
extend-exclude = ["data/"]

[default]
# "MIS Quarterly" is a journal title (Management Information Systems), not a typo of MISS/MIST.
# Scoped to the exact two-word title so bare "MIS" elsewhere still gets flagged.
# `lod-min-clamp` / `lod-max-clamp` are WebGPU sampler fields (level-of-detail) in the vendored
# wasi:webgpu WIT, not misspellings of "load". Scoped to those two identifiers so bare "lod" is still
# flagged everywhere else.
extend-ignore-re = ["MIS Quarterly", "lod-(min|max)-clamp"]
