# Starts from yamllint's standard ruleset.
# Then aligns the cosmetic rules with the repo's other tools so they never disagree.
extends: default

rules:
  # A misindented comment reads as attached to the wrong block, so treat it as an error, not a warning.
  comments-indentation:
    level: error
  # dprint (the YAML formatter) writes one space before an inline `#`.
  # yamllint defaults to two. Defer to dprint so the two can't fight.
  comments:
    min-spaces-from-content: 1
  # Match the editorconfig line length (yamllint defaults to 80).
  line-length:
    max: 120
  # The repo's workflows and configs don't use a `---` document-start marker.
  document-start: disable
