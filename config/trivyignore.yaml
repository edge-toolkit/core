# Suppressions for `trivy-check`, each scoped to the paths it applies to and carrying its reason.
#
# Path-scoped rather than bare IDs: trivy's plain `.trivyignore` silences a rule everywhere, so a genuine
# `:latest` or an untrusted registry appearing in a hand-written manifest later would go unreported. Each
# entry below is confined to the generated scenario manifests, so the three findings stay suppressed exactly
# where they are unavoidable and nowhere else.
#
# These patterns only work because `trivy-check` scans the repository root. Trivy reports a path relative to
# the scan root, so scanning an individual file makes that file the root and reduces its reported path to a
# bare basename -- against which any longer pattern matches nothing and silently suppresses nothing.
#
# `statement` is trivy's own field for the justification, so the reason travels with the suppression rather
# than living in a comment beside it.
---
misconfigurations:
  # A locally built image has no registry version for a tag to name.
  # The scenario images are built from this working tree and imported into the node with
  # `k3s ctr images import`; they are never pushed to or pulled from a registry, so a semver tag would be
  # fiction. The hazard the rule actually guards against -- `:latest` implying `imagePullPolicy: Always` --
  # is already closed, because the manifests set `IfNotPresent` explicitly. The one image that does come from
  # a registry, the collector, is pinned.
  - id: KSV-0013
    paths:
      - "verification/*/output/*/k3s.yaml"
    statement: >-
      Locally built, node-imported images have no registry version to tag; imagePullPolicy is pinned to
      IfNotPresent so the implicit-always-pull hazard does not apply.

  # Docker Hub is the only source this image has.
  # The collector is the upstream `openobserve/openobserve` image at the same pinned tag the compose
  # deployment runs. This repository mirrors assets it controls to its own releases (the upstream-cache
  # pattern) but has no mirror for a third-party container image.
  - id: KSV-0125
    paths:
      - "verification/*/output/*/k3s.yaml"
    statement: >-
      The collector image is the pinned upstream openobserve release, matching the compose deployment; no
      private mirror of it exists to prefer.

  # The flagged value is an account name, not a credential.
  # It is `ZO_ROOT_USER_EMAIL=root@example.com`, the collector's dev-only account. Its password is
  # deliberately absent from the ConfigMap and reaches the pods from a Secret the operator creates from the
  # uncommitted env file, which is the whole point of splitting the two.
  - id: KSV-01010
    paths:
      - "verification/*/output/*/k3s.yaml"
    statement: >-
      The ConfigMap holds the collector's dev-only account name, not a secret; the password is held in an
      operator-created Secret and never written to a committed file.

  # The container runtime plugins have to reach the node's NRI socket, which only root can connect to.
  # `/var/run/nri/nri.sock` is root's, mode 0755, and connecting to a Unix socket needs write permission on it, so
  # the plugin containers run as uid 0 with the socket mounted from the host. That is all they keep: every capability
  # is dropped, privilege escalation is off and the root filesystem is read-only. Scoped to the scenarios whose limits
  # need the plugins, so a root container or a host mount anywhere else in a generated manifest is still reported.
  - id: KSV-0012
    paths:
      - "verification/local/output/math1-limits/k3s.yaml"
    statement: >-
      The NRI plugins must run as root to connect to the root-only NRI socket; they drop every capability.
  - id: KSV-0020
    paths:
      - "verification/local/output/math1-limits/k3s.yaml"
    statement: >-
      The NRI plugins run as uid 0, the only user that can connect to the NRI socket.
  - id: KSV-0021
    paths:
      - "verification/local/output/math1-limits/k3s.yaml"
    statement: >-
      The NRI plugins run as root's group alongside uid 0, the only user that can connect to the NRI socket.
  - id: KSV-0105
    paths:
      - "verification/local/output/math1-limits/k3s.yaml"
    statement: >-
      The NRI plugins run as uid 0, the only user that can connect to the NRI socket.
  - id: KSV-0023
    paths:
      - "verification/local/output/math1-limits/k3s.yaml"
    statement: >-
      The NRI plugins mount the node's NRI socket, a single host socket, which is how a runtime plugin attaches.

  # A local scenario image is built on a hub of its own, which has no tag to give.
  # Its final stage is `FROM hub`, a named build context the compose file wires to the hub service it builds and a
  # plain `docker build` supplies with `--build-context`; trivy reads that as an image reference with no tag. A
  # published scenario names the released hub image instead, so the rule still applies there.
  - id: DS-0001
    paths:
      - "verification/local/output/*/Dockerfile"
    statement: >-
      `FROM hub` is a named build context, not a registry reference; a build context cannot carry a tag.

  # A published scenario image is built on the released hub, which is only ever published as `latest`.
  # The maintainer's image publishing assembles that one tag from each architecture's build, so it is the only one a
  # node of either architecture resolves; there is no versioned tag yet for the Dockerfile to pin instead.
  - id: DS-0001
    paths:
      - "verification/published/output/*/Dockerfile"
    statement: >-
      The released hub is published only as `latest`, assembled across architectures; no versioned tag exists.

  # Scenario images serve the hub, whose health is checked by the deployment rather than the image.
  - id: DS-0026
    paths:
      - "verification/*/output/*/Dockerfile"
    statement: >-
      Every generated deployment declares its own /health check on the hub, as for services/ws-server.

  # The runners exit when their module finishes, so there is no steady state for a healthcheck to report.
  # A HEALTHCHECK describes a long-running service. These images run one module to completion and stop, which
  # is why the generated deployments give them no probe either -- the orchestrator restarts them until the hub
  # answers, and their exit is the result rather than a fault.
  - id: DS-0026
    paths:
      - "services/ws-pyo3-runner/Dockerfile"
      - "services/ws-wasi-runner/Dockerfile"
      - "services/ws-web-runner/Dockerfile"
    statement: >-
      A runner runs one module to completion and exits; it has no serving state to health-check.

  # The root Dockerfiles are build and CI harnesses rather than shipped services.
  # Their stages run `mise run test`, `mise run check` and a convenience server build against the in-image
  # source; nothing consumes them as a long-lived deployment, and the hardened server image consumers actually
  # deploy is services/ws-server/Dockerfile.
  - id: DS-0026
    paths:
      - "Dockerfile"
      - "Dockerfile.nanoserver"
      - "Dockerfile.windows"
    statement: >-
      Build and CI images, not deployed services; the deployable server image is services/ws-server.

  # The hub's health endpoint is checked by whatever deploys it, not by the image.
  # `compose.yaml` declares a `healthcheck` against /health and the k3s manifests declare a `readinessProbe`
  # against the same endpoint, both generated by et-cli, so the check exists once per deployment rather than
  # being baked in. The image ships curl specifically so those external checks have a client to use.
  - id: DS-0026
    paths:
      - "services/ws-server/Dockerfile"
    statement: >-
      Every generated deployment declares its own /health check; the image ships curl for exactly that.
