id: prefer-self-mod-use-pub-chain
language: Rust
severity: error
message: |
  This file declares `mod $X;` and re-exports it via `pub use $X::...`.
  Write `pub use self::$X::...` to make the local reference explicit.
rule:
  all:
    - pattern: pub use $X::$$$REST;
    - regex: '^pub use\b'
  inside:
    kind: source_file
    has:
      any:
        - pattern: mod $X;
        - pattern: pub mod $X;
        - pattern: pub(crate) mod $X;
        - pattern: pub(super) mod $X;
fix: pub use self::$X::$$$REST;
ignores:
  - generated/**

