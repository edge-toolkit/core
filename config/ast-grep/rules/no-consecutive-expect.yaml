id: no-consecutive-expect
language: Rust
severity: error
message: |
  Consecutive `#[expect(...)]` attributes on the same item. Merge them into a
  single `#[expect(lint_a, lint_b, reason = "…")]` (one attribute can list
  several lints). Stacking separate `#[expect]`s — even with a comment between
  them — fragments the suppression and makes it easy to leave one behind when
  the underlying issue is fixed. Applies to inner `#![expect(...)]` too.
rule:
  any:
    # Outer `#[expect(...)]` whose nearest non-comment predecessor sibling is
    # itself an `#[expect(...)]`. `stopBy` skips comment nodes but halts at the
    # first real sibling, so an intervening item (fn, derive, …) breaks the run.
    - kind: attribute_item
      regex: '^#\[\s*expect\b'
      follows:
        kind: attribute_item
        regex: '^#\[\s*expect\b'
        stopBy:
          not:
            any:
              - kind: line_comment
              - kind: block_comment
    - kind: inner_attribute_item
      regex: '^#!\[\s*expect\b'
      follows:
        kind: inner_attribute_item
        regex: '^#!\[\s*expect\b'
        stopBy:
          not:
            any:
              - kind: line_comment
              - kind: block_comment
ignores:
  - generated/**
