id: no-mixed-doc-line-comments
language: Rust
severity: error
message: |
  Doc comment (`///`) is adjacent to a regular `//` comment. Either turn the regular comment into a doc comment
  (`///`) or move it away from the doc block -- readers expect a contiguous `///` run to be the item's rustdoc.
rule:
  any:
    - kind: line_comment
      regex: "^///($|[^/])"
      follows:
        kind: line_comment
        regex: "^//($|[^/!])"
        stopBy: neighbor
    - kind: line_comment
      regex: "^///($|[^/])"
      precedes:
        kind: line_comment
        regex: "^//($|[^/!])"
        stopBy: neighbor
ignores:
  - generated/**
