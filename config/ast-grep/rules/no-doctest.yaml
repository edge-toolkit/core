id: no-doctest
language: Rust
severity: error
message: |
  Doctests are forbidden. Move runnable examples into a `tests/` file (every test file must start with
  `#![cfg(test)]`).
rule:
  any:
    - kind: line_comment
      all:
        - regex: "^(///|//!)"
        - regex: "```"
    - kind: block_comment
      all:
        - regex: '^/\*[*!]'
        - regex: "```"
ignores:
  - generated/**
