id: no-std-env-var
language: Rust
severity: error
message: |
  `std::env::var` / `std::env::var_os` is forbidden for app config. Read configuration through a `serde`-derived
  struct deserialised with `serde-env` (see the runner `config` modules and `et-ws-runner-common::config`), so every
  variable is declared in one typed place with defaults and validation. Exemptions, intentionally narrow:
  - `RUST_*` (e.g. `RUST_LOG`, consumed by tracing) -- diagnostics.
  - `ET_TEST_*` -- test-only switches; production binaries must NOT branch on these. The integration test in
    services/ws-wasi-runner/tests/ sets one to opt the spawned runner into a macOS-only fast-exit path.
  - `MISE_*` (e.g. `MISE_ENV`) -- the mise tool's own state, not app config; reading these lets helpers like
    `mise_env_includes` reflect tooling behaviour without round-tripping through a struct.
rule:
  any:
    - pattern: std::env::var($ARG)
    - pattern: env::var($ARG)
    - pattern: std::env::var_os($ARG)
    - pattern: env::var_os($ARG)
constraints:
  ARG:
    not:
      # Allow a string literal or a const identifier with one of the exempt prefixes.
      # That is a string literal ("RUST_LOG" / "ET_TEST_..." / "MISE_...") or a const identifier
      # (RUST_LOG / ET_TEST_... / MISE_...).
      regex: '^"?(RUST_|ET_TEST_|MISE_)'
ignores:
  # The project-root helper reads CARGO_MANIFEST_DIR to locate the repo root from a build script.
  # That is a cargo build variable, not app config.
  - libs/path/src/lib.rs
  # Build scripts have no serde-env config layer, so the app-config rule does not apply there.
  # The CARGO_* / OUT_DIR variables cargo sets are a build script's input API.
  - "**/build.rs"
