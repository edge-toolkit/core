id: gha-default-shell-bash
language: yaml
severity: error
message: |
  Every GitHub Actions workflow must declare the default run shell as bash
  with -euo pipefail, exactly:
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
  so steps run in bash on every runner (Windows included) with strict-mode
  flags on every step -- no per-step `set -euo pipefail` boilerplate needed.
  GHA's bare `shell: bash` already implies `-e -o pipefail`; this explicit
  form additionally adds `-u` (unset variable -> error). (Pairs with
  gha-no-step-shell, which forbids per-step `shell:`.)
files:
  - .github/workflows/*.yaml
# Fire on any workflow whose document does NOT contain the exact defaults -> run -> shell: ... nesting.
# The `has`/`pattern` matches that specific three-level mapping (a stray `shell: ...` on a step does NOT satisfy it --
# it isn't under defaults.run), and `not` turns "present" into "required".
rule:
  kind: stream
  not:
    has:
      stopBy: end
      pattern: |
        defaults:
          run:
            shell: bash --noprofile --norc -euo pipefail {0}
