id: no-test-ignore
language: Rust
severity: error
message: |
  `#[ignore]`, and a `#[cfg_attr(..., ignore)]` that applies it on some platforms, turns a test off while it still
  reads as coverage. A test that cannot pass is a bug to fix, and skipping one needs the operator's explicit
  approval. Where that approval is given, move the test into a file that holds only tests skipped for that reason,
  keep the reason and the evidence beside its skip, and list the file in this rule's `ignores:`.
# Each file holds only tests skipped on some platform, with the operator's approval.
# The evidence sits beside each skip. A test that runs everywhere goes in another file, so it stays under this rule.
ignores:
  - services/storage/tests/s3_backend.rs
  - services/ws-wasi-runner/tests/modules.rs
  - services/ws-wasi-runner/tests/otel_propagation.rs
  - utilities/cli/tests/scenario_runners.rs
rule:
  kind: attribute_item
  any:
    - regex: '^#\[\s*ignore\b'
    # An `ignore` is matched as an identifier token, so the word inside a string argument cannot trip it.
    # That holds wherever the attribute's lines break, and for any argument, such as a `doc` string.
    - all:
        - regex: '^#\[\s*cfg_attr\b'
        - has:
            stopBy: end
            kind: identifier
            regex: "^ignore$"
