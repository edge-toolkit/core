id: semgrep-path-anchored
language: yaml
severity: error
message: |
  Every semgrep `paths.include` / `paths.exclude` entry starts with `/`, anchoring it at the repository root. A pattern
  without one is easy to get wrong in either direction -- an exclusion that lost its slash silently matches nothing,
  while a bare `*.rs` matches at any depth only because of a rule nobody reading the config has to remember -- so
  the anchor is written out every time: `/**/*.rs` for any depth, `/verification/**` for one tree. This rule takes
  the patterns that match at any depth -- a bare name, or one opening with `**/` -- and its autofix rewrites each to
  the same match written from the root, `/**/<name>`. A pattern with a `/` further in is already anchored at the
  root, and `semgrep-path-rooted` takes those.
files:
  - config/semgrep/*.yaml
# An entry is a scalar in the sequence under an `include` or `exclude` key, which sits under a `paths` key.
# Neither key appears anywhere else in a semgrep config, so any enclosing pair carrying it is the one the entry
# belongs to.
rule:
  # `$PATH` binds the matched scalar for the fix's transform; the selector is what restricts it to a scalar.
  pattern:
    context: "- $PATH"
    selector: flow_node
  regex: '^["'']?(\*\*/|[^"''/]*["'']?$)'
  inside:
    kind: block_sequence_item
    inside:
      kind: block_mapping_pair
      stopBy: end
      has:
        field: key
        regex: "^(include|exclude)$"
      inside:
        kind: block_mapping_pair
        stopBy: end
        has:
          field: key
          regex: "^paths$"
transform:
  ANCHORED:
    replace:
      source: $PATH
      replace: '^(["'']?)(\*\*/)?'
      by: "$1/**/"
fix: $ANCHORED
