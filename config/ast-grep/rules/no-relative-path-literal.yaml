id: no-relative-path-literal
language: Rust
severity: error
message: |
  Relative path literals ("." / ".." / "./..." / "../...") are forbidden: they hardcode a location relative to the
  process's current directory or this crate's directory, which is brittle. Anchor paths to the repository root
  instead -- `edge_toolkit::config::get_project_root()` (runtime) or `et_path::find_project_root_from_manifest()`
  (build scripts) -- and join the remainder onto it. (Char literals like `'.'` for splitting are unaffected.)
rule:
  kind: string_content
  regex: '^\.\.?(/.*)?$'
  # A crate root's `#![cfg_attr(doc, doc = include_str!("../README.md"))]` is exempt, and nothing else in its file.
  # include_str! resolves against the source file at compile time rather than the process cwd, so `../README.md`
  # from `src/lib.rs` is the crate's own README by construction. The attribute's macro is a raw token tree, so the
  # match is on the attribute text; the regex names that exact include so no other relative path rides along.
  not:
    inside:
      kind: inner_attribute_item
      stopBy: end
      regex: '^#!\[cfg_attr\(doc, doc = include_str!\("\.\./README\.md"\)\)\]$'
ignores:
  # relative_path_from() deliberately emits "." / ".." for generated mise.toml and compose.yaml output.
  - libs/path/src/lib.rs
  # --module-dir defaults to the current directory.
  - utilities/cli/src/cli.rs
  # include_str! resolves its path against this source file at compile time, not the process cwd.
  # The one `..` up to the crate's committed data/ dir is therefore stable by construction.
  - services/ws-test-server/src/math1.rs
  # Asserts the relative paths that the generators above produce.
  - utilities/cli/tests/scenario_generation.rs
