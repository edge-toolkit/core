id: no-env-macro
language: Rust
severity: error
message: |
  `env!` / `option_env!` read a compile-time environment variable and are forbidden for app config -- read
  configuration through a `serde`-derived struct deserialised with `serde-env` (see the `no-std-env-var` rule
  and `et-ws-runner-common::config`) so every variable is declared in one typed place. Only these
  cargo-provided constants, which have no serde-env equivalent, are exempt:
  - `CARGO_BIN_EXE_<name>` -- the built binary's path, injected by cargo for an integration test.
  - `CARGO_PKG_VERSION` / `CARGO_PKG_NAME` -- crate identity baked into the binary.
  - `ET_WIT_DIR` -- the WIT directory injected at build time for wit-bindgen.
  `CARGO_MANIFEST_DIR` is deliberately NOT exempt -- use `edge_toolkit::config::get_project_root()` at runtime
  (see the `no-cargo-manifest-dir` rule).
rule:
  all:
    - kind: macro_invocation
    - has:
        field: macro
        regex: "^(env|option_env)$"
    # Exempt a call only when its argument is one of the allowlisted names above.
    # `not` matches against this `macro_invocation`'s own text (the whole `env!("...")`); everything else
    # (CARGO_MANIFEST_DIR, OUT_DIR, ad-hoc vars) fires.
    - not:
        regex: '"(CARGO_BIN_EXE_[A-Za-z0-9_.-]+|CARGO_PKG_VERSION|CARGO_PKG_NAME|ET_WIT_DIR)"'
