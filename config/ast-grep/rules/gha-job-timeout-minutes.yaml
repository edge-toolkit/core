id: gha-job-timeout-minutes
language: yaml
severity: error
message: |
  Every GitHub Actions job must declare `timeout-minutes:` at the job level. The runner's default per-job timeout is 360
  minutes (6 hours), which is long enough that a hung job (deadlocked test, infinite-recurse cargo resolver, stuck
  `docker pull`) drains the runner-minutes budget before anyone notices. Pin every job to a realistic ceiling for that
  job's work. Use `${{ matrix.timeout }}` or similar if the right value varies by entry.
files:
  - .github/workflows/*.yaml
# Match every `runs-on:` whose containing block_mapping has no `timeout-minutes:` sibling.
# `runs-on:` is the GHA-required marker that a block is a job. Pattern-based, not kind+constraint-based: tree-sitter's
# `field: key` selector behaved inconsistently in this codebase's grammar version.
rule:
  pattern: "runs-on: $X"
  not:
    inside:
      kind: block_mapping
      has:
        pattern: "timeout-minutes: $Y"
        stopBy: end
