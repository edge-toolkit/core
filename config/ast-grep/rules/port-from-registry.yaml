id: port-from-registry
language: Rust
severity: error
message: |
  A port number is written out here. Every port a server of this repo listens on, or is reached at, is allocated in
  `edge_toolkit::ports::Services`: add a variant there and use `Services::<Variant>.port()`, so two services cannot
  claim the same port unnoticed.
# The rule matches three shapes of a port written as a number.
# A `const` or `static` named for a port and set to a number, a clap `default_value_t` number on a field named for a
# port, and a string holding a loopback or wildcard host with a port. Strings inside attributes are left alone, since
# a proc-macro attribute such as `asyncapi_server(host = ...)` takes only literals. No autofix: which `Services`
# variant a number stands for, or whether it needs a new one, is a judgement call.
rule:
  any:
    - all:
        - any:
            - kind: const_item
            - kind: static_item
        - has:
            field: name
            regex: "(?i)(^|_)port$"
        - has:
            field: value
            kind: integer_literal
    - all:
        - kind: field_declaration
        - has:
            field: name
            regex: "(?i)(^|_)port$"
        # The search walks back across every attribute and comment above the field, stopping at the previous field.
        # Each of those is a sibling of the field rather than a child, so the nearest one alone could miss the port.
        - follows:
            kind: attribute_item
            regex: "default_value_t\\s*=\\s*[0-9]+"
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
    - all:
        - kind: string_literal
        - regex: "(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1?\\]):[0-9]{2,5}\\b"
        - not:
            inside:
              kind: attribute_item
              stopBy: end
ignores:
  - generated/**
  - libs/edge-toolkit/src/ports.rs
  - "**/tests/**"
