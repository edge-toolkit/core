id: no-cargo-manifest-dir
language: Rust
severity: error
message: |
  `CARGO_MANIFEST_DIR` is forbidden outside the project-root helper. It points at the crate directory, not the
  repository root, so reaching repo files through it needs brittle `..` hops. Locate the repository root with
  `et_path::find_project_root_from_manifest()` in a `build.rs` (compile time) or
  `edge_toolkit::config::get_project_root()` (runtime) instead.
rule:
  any:
    - pattern: std::env::var("CARGO_MANIFEST_DIR")
    - pattern: env::var("CARGO_MANIFEST_DIR")
    # Ban `env!("CARGO_MANIFEST_DIR")` in every context, including when nested inside another macro.
    # A nested `env!` parses as a raw token tree the bare pattern can't see, so match any `macro_invocation`
    # node whose tokens contain it; a standalone `env!("CARGO_MANIFEST_DIR")` is itself a `macro_invocation`,
    # so this one rule covers both the direct and the nested forms.
    - kind: macro_invocation
      regex: 'env!\s*\(\s*"CARGO_MANIFEST_DIR"'
ignores:
  - libs/path/src/lib.rs
