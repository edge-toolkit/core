id: pretty-assert-eq-import
valid:
  - |
    #![cfg(test)]

    use pretty_assertions::assert_eq;

    fn check() {
        assert_eq!(1, 1);
    }
  - |
    #![cfg(test)]

    use pretty_assertions::{assert_eq, assert_ne};

    fn check() {
        assert_eq!(1, 1);
    }
  - |
    #![cfg(test)]

    fn check() {
        assert!(true);
    }
  - |
    #![cfg(test)]

    #![expect(clippy::single_call_fn, reason = "named steps")]

    use pretty_assertions::assert_eq;

    fn check() {
        assert_eq!(1, 1);
    }
invalid:
  - |
    #![cfg(test)]

    fn check() {
        assert_eq!(1, 1);
    }
  - |
    #![cfg(test)]

    #![expect(
        clippy::single_call_fn,
        reason = "named steps"
    )]

    fn check() {
        assert_eq!(1, 1);
    }
  - |
    //! Covers one thing.
    #![cfg(test)]

    use pretty_assertions::assert_ne;

    fn check() {
        assert_eq!(1, 1);
    }
