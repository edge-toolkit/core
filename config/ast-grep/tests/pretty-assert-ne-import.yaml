id: pretty-assert-ne-import
valid:
  - |
    #![cfg(test)]

    use pretty_assertions::assert_ne;

    fn check() {
        assert_ne!(1, 2);
    }
  - |
    #![cfg(test)]

    use pretty_assertions::{assert_eq, assert_ne};

    fn check() {
        assert_ne!(1, 2);
    }
  - |
    #![cfg(test)]

    use pretty_assertions::assert_eq;

    fn check() {
        assert_eq!(1, 1);
    }
  - |
    #![cfg(test)]

    #![cfg(unix)]

    use pretty_assertions::assert_ne;

    fn check() {
        assert_ne!(1, 2);
    }
invalid:
  - |
    #![cfg(test)]

    fn check() {
        assert_ne!(1, 2);
    }
  - |
    #![cfg(test)]

    #![cfg(unix)]

    fn check() {
        assert_ne!(1, 2);
    }
  - |
    //! Covers one thing.
    #![cfg(test)]

    use pretty_assertions::assert_eq;

    fn check() {
        assert_ne!(1, 2);
