id: no-test-ignore
valid:
  - |
    #[test] fn runs() {}
  - |
    #[cfg_attr(windows, allow(dead_code))] fn helper() {}
  - |
    #[cfg_attr(
        windows,
        allow(dead_code)
    )]
    fn multiline_helper() {}
  - |
    #[cfg_attr(windows, doc = "On error, ignore this hint.")] fn documented() {}
  - |
    #[cfg_attr(ignore, doc = "Optional documentation")] fn helper() {}
  - |
    #[cfg_attr(all(unix, ignore), doc = "Optional documentation")] fn nested_helper() {}
invalid:
  - |
    #[test] #[ignore] fn skipped() {}
  - |
    #[test] #[ignore = "slow"] fn skipped_with_reason() {}
  - |
    #[test] #[/* reason */ignore] fn skipped_behind_a_comment() {}
  - |
    #[/* reason */cfg_attr(windows, ignore)] #[test] fn skipped_on_windows_behind_a_comment() {}
  - |
    #[cfg_attr(windows, ignore = "flaky")] #[test] fn skipped_on_windows() {}
  - |
    #[cfg_attr(target_os = "macos", ignore)] #[test] fn skipped_on_macos() {}
  - |
    #[cfg_attr(unix, cfg_attr(target_os = "linux", ignore))] #[test] fn skipped_on_linux() {}
  - |
    #[cfg_attr(
        windows,
        ignore = "flaky"
    )]
    #[test]
    fn skipped_on_windows_multiline() {}
