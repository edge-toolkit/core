# cargo-deny config.
# Applied via `mise run cargo-deny-check` -- locally and in .github/workflows/dependencies.yaml.

[advisories]
version = 2
# Crates pulled from a yanked version are an unambiguous bug.
# Pin them back to a live release.
yanked = "deny"
# Advisories we've reviewed and consciously accept until upstream Deno migrates.
# Each entry names the vulnerable crate, the path that pulls it, and the runtime reason it isn't exploitable
# here. Drop entries as upstream catches up; never silence one without a written reason.
ignore = [
  # bincode 1.3.3 (unmaintained; development ceased permanently, so no version is patched).
  # Pulled by deno_core for snapshot / cache serialization -- its only consumer, requiring ^1 through its
  # newest release. Unmaintained != vulnerable. No upgrade clears this: the advisory covers every version of
  # the crate, 2.x and 3.0.0 included, so only deno_core dropping bincode outright would.
  "RUSTSEC-2025-0141",
  # paste 1.0.15 (unmaintained).
  # Proc-macro pulled by v8 (rusty_v8) via deno_core / serde_v8; expands at compile time only, so there is no
  # runtime exposure. Every published v8 release through 152.2.0 declares it as a non-optional dependency, so no
  # upgrade clears this -- only a rusty_v8 move to the maintained pastey fork. Awaiting that migration.
  "RUSTSEC-2024-0436",
  # rustls-pemfile 2.2.0 (unmaintained; final release -- parsing moved into rustls-pki-types).
  # PEM cert parser for loading the system CA bundle. Unmaintained, not vulnerable. Pulled directly by both
  # deno_native_certs and deno_tls, each at its newest release, so no bump drops it. rustls-native-certs
  # migrated at 0.8.1 and our 0.8.4 copy is clean; the affected 0.7.3 copy is pinned by deno_native_certs.
  "RUSTSEC-2025-0134",
  # smartstring 1.0.1 (unmaintained; repo archived 2026-05-03).
  # Pulled only by the swc stack (swc_ecma_lexer/parser 26/27) under deno_ast -> deno_runtime. Maintenance
  # notice, not a vulnerability. Upstream swc migrated to compact_str at swc_ecma_lexer 41.0.0 and
  # swc_ecma_parser 42.0.0, but deno_ast pins both by equality (=26.0.0 / =27.0.7) through its newest release,
  # so no bump on our side reaches them. Drop when a deno_runtime/deno_ast bump pulls the migrated swc.
  "RUSTSEC-2026-0249",
  # hickory-proto 0.25.2 NSEC3 closest-encloser proof unbounded loop (DoS on DNSSEC validation).
  # Pulled by deno_net for resolver. The advisory scopes reachability to builds carrying dnssec-ring or
  # dnssec-aws-lc-rs, and our resolution enables neither -- cargo tree -i hickory-proto -f "{p} [{f}]" reports
  # default,futures-io,serde,std,tokio -- so DnssecDnsHandle is never compiled in. (Cargo.lock listing ring
  # under hickory-proto is not evidence otherwise; it records optional deps regardless of activation.) The fix
  # landed in 0.26.0-beta.1, but deno_net requires ^0.25.2 through its newest release, so it is out of reach.
  "RUSTSEC-2026-0118",
  # hickory-proto 0.25.2 O(n^2) name compression during message encode.
  # Encoder side, hit only when we *send* a DNS message. The runner uses the OS resolver via hickory. It
  # never crafts outbound DNS frames with attacker-controlled name lists.
  "RUSTSEC-2026-0119",
  # rand 0.8.5 unsound ThreadRng reseed when a custom `log` logger calls rand::rng() (UB via aliased &mut).
  # Transitive via deno_crypto / deno_fs / deno_node (web-runner), used for non-cryptographic randomness
  # (jitter, salt scratchpads). The advisory's first precondition is the `log` feature, which our resolution
  # does not enable (alloc,default,getrandom,libc,rand_chacha,std,std_rng), so the path cannot be reached.
  # Fixed in the 0.8 line at 0.8.6, which deleted the log optional dep -- but deno_crypto pins rand "=0.8.5"
  # by equality through its newest release, so neither a lockfile bump nor a deno bump moves it. cargo-deny
  # does not match this id and warns advisory-not-detected; the entry stays because osv-scanner does flag it.
  "RUSTSEC-2026-0097",
  # rsa 0.9.10 Marvin Attack timing sidechannel on RSA decryption.
  # No patched version exists -- the advisory lists none, upstream is still migrating to a constant-time
  # implementation, and 0.9.10 is the newest stable (the 0.10 line is release candidates, equally affected),
  # so no upgrade can clear this. Pulled by deno_crypto + deno_node_crypto. The runner doesn't hold private
  # RSA keys or decrypt RSA payloads. Only TLS server cert verification, which uses *signature* checks, no
  # decryption. Not reachable unless guest JS explicitly imports crypto.subtle and performs RSA-OAEP decrypt
  # with a private key. Our modules don't.
  "RUSTSEC-2023-0071",
  # h2 0.3.27 unbounded empty DATA frames (low-severity HTTP/2 DoS: undrained streams grow memory).
  # Accepted for the 0.3 copy only. hyperium patched the 0.4 line (>= 0.4.16, which Cargo.lock now pins for the
  # hyper/reqwest path) and shipped no 0.3 backport, so 0.3.27 is the last release of a dead line. It arrives
  # via actix-http, and no feature selection can drop it: actix-web's `rustls-0_23` hard-enables `http2`, and
  # ws-server needs rustls to serve HTTPS/WSS. Only the TLS listener negotiates h2 via ALPN; the plaintext
  # port stays HTTP/1.1. No bump helps: actix-http 3.13.3, the newest release, still requires h2 ^0.3.27 -- drop
  # this when it ships one built on h2 0.4. cargo-deny 0.20 ignores by id only (no version scoping), so this
  # also mutes the 0.4 line -- Cargo.lock pins 0.4.16 there, and a bump below that would have to come back
  # through this entry, so re-check both copies when touching it.
  "RUSTSEC-2026-0258",
  # org.mozilla:rhino 1.7.15 -- high-CPU/DoS in toFixed. Maven ecosystem: the Java toolchain, not a Rust crate.
  # Build-time only: pulled by the teavm-maven-plugin (TeaVM's Java->JS compiler) via teavm-relocated-libs-rhino;
  # not shipped in any artifact, and its only input is our own trusted Java, so unreachable. pom.xml overrides the
  # plugin dep to the patched 1.7.15.1, but TeaVM shades rhino, so osv-scanner still resolves 1.7.15 from the
  # relocated lib. A TeaVM bump does not help either: teavm-relocated-libs-rhino still declares rhino 1.7.15 at
  # 0.15.0, the newest release. Flagged now that osv-scanner-check scans pom.xml; a Maven id so cargo-deny reports
  # it unknown (osv-scanner honours it). Drop when a TeaVM release declares 1.7.15.1 or later.
  "GHSA-3w8q-xq97-5j7x",
]

[licenses]
version = 2
# Compatible with our own `Apache-2.0 OR MIT` workspace license.
# Add a new entry only when a transitive dep introduces a new SPDX expression we've reviewed.
allow = [
  "Apache-2.0",
  # cranelift / wasmtime stack -- LLVM-derived code carries the Apache 2.0 text plus an extra patent grant for LLVM.
  # Still permissive.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # libbz2-rs-sys is the pure-Rust libbzip2 backend of the `bzip2` crate, transitive via deno_runtime -> qbsdiff.
  # qbsdiff (a binary-diff lib) is new in the deno 0.262 stack. `bzip2-1.0.6` is a real SPDX id ("bzip2 and
  # libbzip2 License v1.0.6") -- SPDX versions this license by the libbzip2 release its text matches; it is a
  # permissive BSD-style license (OSI-adjacent, FSF Free/Libre). The `bzip2` wrapper crate is MIT OR Apache-2.0.
  "bzip2-1.0.6",
  # clipboard-win + error-code (transitive via deno_runtime -> rustyline).
  # Boost Software License 1.0 -- permissive, OSI-approved, FSF Free/Libre.
  "BSL-1.0",
  # webpki-roots / webpki-root-certs (Mozilla's CA bundle).
  "CDLA-Permissive-2.0",
  # hexf-parse (transitive via cranelift). Public-domain dedication.
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# Explicit per-crate clarifications.
# cargo-deny otherwise emits a `no-license-field` warning when a crate's manifest uses `license-file` instead
# of an SPDX `license` expression. Each entry below has been verified against the on-disk LICENSE in
# ~/.cargo/registry. The mise `cargo-deny` task escalates `no-license-field` to a hard error so a new
# transitive dep without an SPDX expression must land here intentionally, not silently.
[[licenses.clarify]]
crate = "saffron"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0x0bcebb0f }]

[bans]
# Warn (not deny) on multiple-versions.
# Useful to surface duplicate transitive dep trees without blocking on every cargo update.
multiple-versions = "warn"
# Wildcard version specs in member crates are already forbidden by the taplo `no-wildcard-or-git-deps` schema.
# Double-cover here so it shows up in a security-style report too.
wildcards = "deny"
# Crate-by-crate bans live in `config/taplo/no-banned-deps.schema.json`.
# That is a declaration-time check on workspace [dependencies].
# The `deny` entries below catch *transitive* uses that the taplo rule can't see.
deny = [
  # `openssl` and `openssl-sys` link to libssl/libcrypto.
  # We use rustls + aws-lc-rs as the single TLS+crypto stack across the workspace. Any new transitive dep
  # that drags openssl back in should migrate, not be allowed. `openssl-probe` is fine -- it only probes for
  # installed cert store paths, doesn't link to OpenSSL itself.
  { crate = "openssl" },
  { crate = "openssl-sys" },
  # `ring` is forbidden except via the wrappers listed below.
  # The rest of the dep graph reaches the same primitives via `aws-lc-rs`. Any new transitive parent that
  # drags `ring` back in surfaces as an `unmatched-wrapper` error here. We can then decide whether to migrate
  # it to aws-lc-rs or extend the list. See https://github.com/EmbarkStudios/cargo-deny/issues/776 for the
  # `wrappers` pattern.
  #
  # Current allowed parents:
  #   * `rcgen` -- server-side TLS cert generation in et-ws-server.
  #     Intentional; rcgen's ring feature is what we want for the cert generator.
  #   * `rustls-webpki` -- pulled by deno_fetch + deno_tls (default features include `ring`).
  #     Drop once Deno's TLS stack migrates to aws-lc-rs defaults.
  #   * `quinn-proto` -- pulled by deno_net via quinn (default features include `ring`).
  #     Drop once Deno's quinn config switches to the `rustls-aws-lc-rs` feature.
  { crate = "ring", wrappers = ["quinn-proto", "rcgen", "rustls-webpki"] },
  # `ureq` is forbidden -- direct use is blocked by the taplo no-banned-deps schema.
  # This entry catches transitive paths the same way as `ring` above. No wrappers allowed. The only previous
  # parent (`ort-sys` via the `download-binaries` feature) is gone. The workspace `ort` dep now stages ONNX
  # Runtime through mise instead.
  { crate = "ureq" },
  # `regress` (a JS-flavoured regex engine) is forbidden except via the wrapper below.
  # It arrives only transitively through progenitor -> typify -> typify-impl, which uses it to validate the
  # JSON-Schema `pattern` regexes in our generated REST client. We standardise on the `regex` crate everywhere
  # else; any new parent that drags `regress` back in should migrate to `regex`. Direct workspace declaration is
  # separately blocked by config/taplo/no-banned-deps.schema.json.
  { crate = "regress", use-instead = "regex", wrappers = ["typify-impl"] },
]

[sources]
# Only crates.io.
# New git or alternate-registry deps must be added to the allow lists below intentionally.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
