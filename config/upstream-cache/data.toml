# Source-of-truth metadata for assets fetched from edge-toolkit/core's
# *-v<N> releases (and any other upstream URL pinned by an `*_asset` var
# in .mise/config*.toml). For each asset we record:
#
#   - sha256:   integrity check; the release page also ships .sha256
#               sidecars for human inspection, but this file is what
#               `fetch-*-rclone` tasks verify against, so the guarantee
#               is chained to git history rather than to (re-uploadable)
#               release storage.
#   - url:      the canonical download URL (where consumers fetch the
#               asset from -- usually our edge-toolkit/core release).
#               One source of truth; tasks compose the same URL via
#               `*_asset` + the release tag, but this is the explicit
#               value the rego policy validates against.
#   - upstream: the upstream project / dataset the asset was built from.
#               Lets a reader trace what they're downloading without
#               having to grep the rest of the repo.
#   - license:  SPDX expression for the upstream content. Bump alongside
#               `upstream` whenever upstream re-licenses.
#
# config/conftest/policy/checksums/checksums.rego enforces a
# bidirectional cross-reference: every `<name>_asset` var in
# .mise/config*.toml must have a matching `[asset.<filename>]` table
# here, and vice versa. Filename keys pin the upstream commit SHA
# (short) or version; bump in lockstep with the var and the release
# tag.

[asset."RetinaFace_int-7b69507.onnx"]
sha256 = "3b29de703b4641cb995754bc6294bd58b0fa5d859c838e9484c86d00251f8a08"
url = "https://github.com/edge-toolkit/core/releases/download/hf-cache-v1/RetinaFace_int-7b69507.onnx"
upstream = "https://huggingface.co/amd/retinaface"
license = "Apache-2.0"

