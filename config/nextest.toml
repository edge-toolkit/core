# The coverage mise task selects the `ci` profile to emit target/nextest/ci/junit.xml.
[profile.ci.junit]
path = "junit.xml"

# Serialize et-ws-web-runner's tests (under `default`, so every profile inherits it).
# Each web-runner test launches a heavy deno_runtime MainWorker, and several at once exhaust fd/port budgets.
[test-groups]
web-runner = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(et-ws-web-runner)'
test-group = 'web-runner'
