# nextest profile used by the coverage workflow via `cargo llvm-cov nextest` (NEXTEST_PROFILE=ci).
# It writes a JUnit report to target/nextest/ci/junit.xml, which the coverage job uploads to Codecov as test
# results (report_type: test_results). The coverage task loads it via `--config-file config/nextest.toml`.
[profile.ci.junit]
path = "junit.xml"

# Serialize et-ws-web-runner's tests.
# Each boots a heavy deno_runtime MainWorker, and several at once exhaust fd/port budgets. `max-threads = 1`
# runs them one at a time while the rest of the workspace stays parallel -- nextest's equivalent of that
# suite's single-threaded run (nextest ignores RUST_TEST_THREADS).
[test-groups]
web-runner = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'package(et-ws-web-runner)'
test-group = 'web-runner'
