experimental = ["setup-scripts"]

# Stack ceilings: each setup script hands its tests RUST_MIN_STACK, which sizes the thread libtest runs a test on.
# It goes through a setup script rather than the environment because nextest's own tokio workers honour it too,
# and abort at these sizes. Every test gets the value of the last script whose filter matches it, so the filters
# below are kept disjoint rather than relying on order.
#
# scenario_runners stays unlimited: it drives `mise` and `cargo`, which pass the variable down to rustc, whose
# compiler thread honours it and overflows building the workspace at these sizes.
[scripts.setup.stack-actix]
command = "goawk 'BEGIN { print \"RUST_MIN_STACK=\" ARGV[1] > ENVIRON[\"NEXTEST_ENV\"] }' 1048576"

[scripts.setup.stack-clap]
command = "goawk 'BEGIN { print \"RUST_MIN_STACK=\" ARGV[1] > ENVIRON[\"NEXTEST_ENV\"] }' 524288"

[scripts.setup.stack-gpu-probe]
command = "goawk 'BEGIN { print \"RUST_MIN_STACK=\" ARGV[1] > ENVIRON[\"NEXTEST_ENV\"] }' 524288"

# et-gpu-probe's native tests open real adapters, so the GPU driver's own calls run on the test's thread.
# At the 64 KiB above, every test that opens one aborts with `fatal runtime error: stack overflow, aborting` (on
# Windows, `0xc00000fd: Recursion too deep; the stack overflowed`), on every lane of commit
# https://github.com/edge-toolkit/core/commit/ccf4b07fd86795ce125f7839ff5a7ee4b8d5c143, e.g.
# https://github.com/edge-toolkit/core/actions/runs/44244160798/job/134598919973. Metal needs 256 KiB; the drivers
# CI uses differ, so they get the margin the actix servers do.
[scripts.setup.stack-gpu-driver]
command = "goawk 'BEGIN { print \"RUST_MIN_STACK=\" ARGV[1] > ENVIRON[\"NEXTEST_ENV\"] }' 1048576"

[[profile.default.scripts]]
filter = '''
package(et-gpu-probe-server) or package(et-ws-service) or package(et-websockify-service)
or package(et-modules-service) or package(et-storage-service) or package(et-ws-server)
or package(et-ws-test-server) or package(et-actix-web-config)'''
setup = "stack-actix"

[[profile.default.scripts]]
filter = '''
(package(et-cli) and not binary(scenario_runners)) or package(et-int-gen) or package(et-onnx)
or package(et-test-recovery)'''
setup = "stack-clap"

[[profile.default.scripts]]
filter = "package(et-gpu-probe) and not binary(native)"
setup = "stack-gpu-probe"

[[profile.default.scripts]]
filter = "package(et-gpu-probe) and binary(native)"
setup = "stack-gpu-driver"

# The coverage mise task runs its unit and integration passes under these, one JUnit report per profile dir.
# A test is an integration test when it is in either group below; every other test is a unit test. The task
# selects them with `-E`, because nextest does not allow group() in a profile's `default-filter`.
[profile.ci-unit.junit]
path = "junit-unit.xml"

[profile.ci-integration.junit]
path = "junit-integration.xml"

# The test workflow selects this through NEXTEST_PROFILE, so its lanes report every test run to flakiness.io.
[profile.ci.junit]
path = "junit.xml"

# Serialize et-ws-web-runner's tests (under `default`, so every profile inherits it).
# Each web-runner test launches a heavy deno_runtime MainWorker, and several at once exhaust fd/port budgets.
#
# et-cli's scenario_runners test joins the same group for the same reason: it starts two web runners of its own,
# so run alongside the web-runner tests it multiplies exactly the load this group exists to bound. It also holds
# the hub's fixed port for its duration, which nothing else may take while it runs.
#
# `integration` limits nothing; it exists to name the integration tests for the ci profiles above.
[test-groups]
integration = { max-threads = "num-cpus" }
web-runner = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(et-ws-web-runner) or binary(scenario_runners)'
test-group = 'web-runner'

# Keep the output of the probe tests that run on the machine's own hardware when they pass.
# Each prints the signature the machine gave, which is how a machine's signature comes to be recorded.
[[profile.default.overrides]]
filter = 'binary_id(et-gpu-probe::native) or binary_id(et-ws-wasi-runner::nn_probe)'
success-output = 'final'

# The integration test binaries outside the web-runner group, which already holds only integration tests.
# A binary belongs here when it spawns a child process, listens on a real socket, or drives a runner end to end.
# Serving an app through actix's in-process `test::init_service` does neither, so those stay unit tests. A whole
# package is named only where every one of its test binaries qualifies. Add a new binary here when it qualifies:
# the unit profile takes everything left out, so a missed entry is misfiled rather than dropped.
[[profile.default.overrides]]
filter = '''
package(et-test-otlp) or package(et-websockify-service) or package(et-ws-test-server)
or package(et-ws-wasi-runner)
or binary_id(edge-toolkit::pipx_site_packages)
or binary_id(et-test-helpers::child_guard) or binary_id(et-test-helpers::path_prefix)
or binary_id(et-ws-runner-common::fetch_main_field) or binary_id(et-ws-runner-common::module_file_missing)
or binary_id(et-ws-runner-common::register_frames)
or binary_id(et-storage-service::s3_backend) or binary_id(et-ws-pyo3-runner::modules)
or binary_id(et-test-recovery::command) or binary_id(et-recovery-supervisor::runtime)
or binary_id(et-recovery-supervisor::hub_frames) or binary_id(et-recovery-supervisor::kubernetes)
or binary_id(et-recovery-supervisor::shutdown)'''
test-group = 'integration'
