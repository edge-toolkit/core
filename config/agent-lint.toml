# Rules this repository holds at warning rather than error.
#
# Q002 (prompt-negative-only) wants every operative prohibition paired with a positive imperative within three
# source lines. A good part of CLAUDE.md is deliberately absolute -- "NEVER delete a lint rule without explicit
# user permission", "never turn a lint off to make code pass" -- and those earn their keep by admitting no
# exception. Restating each as a positive imperative would soften instructions whose whole value is that they
# do not bend, so the rule is held at warning here rather than obeyed.
#
# Downgraded, not suppressed: `warn` keeps every finding printed while letting the check exit 0, so a site where
# a positive form genuinely reads better is still visible and can be rewritten. `suppress` would hide these and
# every future one, which is the wholesale silencing this repository's own linting rules forbid.
[lint]
warn = ["Q002"]
