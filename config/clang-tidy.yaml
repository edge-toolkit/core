# clang-tidy checks for C sources.
# Applied via `mise run clang-tidy-check` (passed as --config-file=<this>).
# Bug-finding analysis only; opinionated readability/style checks are left off to avoid churn on the small C surface.
Checks: "clang-analyzer-*,bugprone-*,performance-*,portability-*"
WarningsAsErrors: "*"
