# ls-lint file/directory naming linter (https://ls-lint.org).
# Run via `mise run ls-lint-check`. ls-lint walks the working tree (not git), so the build/vendor/codegen trees are
# ignored below and only hand-written source is linted. Each rule lists the casings actually used in the repo today.
ls:
  # Directories are kebab-case (most) or snake_case (a few generated-style names).
  # The regex alternative permits leading-dot tool dirs (.github, .mise).
  .dir: kebab-case | snake_case | regex:\.[a-z_]+

  .rs: snake_case | kebab-case
  .py: snake_case | regex:__[a-z]+__
  .js: snake_case
  .zig: snake_case
  .c: snake_case
  .cpp: snake_case
  .dart: snake_case
  .wit: snake_case | kebab-case
  .rego: snake_case | kebab-case
  .yaml: snake_case | kebab-case
  .cs: PascalCase
  .java: PascalCase
  .kt: PascalCase
  # Gradle build scripts: the fixed names `build.gradle.kts` / `settings.gradle.kts`.
  .gradle.kts: regex:(build|settings)

  # Ban the `.conf` extension: config files standardize on `.ini`/`.rc`, as rclone.ini and ripgrep.rc do.
  # `regex:^$` matches no basename, so every `*.conf` file fails the check.
  .conf: regex:^$

ignore:
  - .git
  - target
  # `**/` because a pnpm workspace puts `node_modules` at the root AND under each member package dir.
  # E.g. both `node_modules` and `services/ws-server/static/node_modules`.
  - "**/node_modules"
  - generated
  # Bundled data/model assets -- names are not hand-chosen.
  - data
  # Build/vendor output that ls-lint would otherwise walk (it can't read .gitignore).
  # The `**/` form matches each at any depth.
  - "**/.venv"
  - "**/__pycache__"
  - "**/.pytest_cache"
  - "**/.ruff_cache"
  - "**/.zig-cache"
  - "**/zig-out"
  # These dotnet dirs are created mid-run by parallel tasks, so they must be ignored by literal path, not glob.
  # ls-lint snapshots glob-based ignores once at startup and drops any matching nothing then
  # (internal/glob/glob.go deletes zero-match keys), so a `**/bin/Debug` glob loses the race against the
  # `dotnet build` task creating the dirs. Literal paths are never glob-expanded, so they stay ignored whenever the
  # dir appears.
  - services/ws-modules/dotnet-data1/obj
  - services/ws-modules/dotnet-data1/bin/Debug
  - services/ws-modules/dotnet-data1/bin/Release
  # Built module artifacts (wheels, .wasm, generated JS) live under each pkg/.
  - "**/pkg"
  # Zig codegen templates dir whose name carries a literal `.in` suffix.
  - "**/zig.in"
  # Gradle/Kotlin trees ls-lint would otherwise walk.
  # The build/cache dirs are gitignored (ls-lint can't read .gitignore); wasmJsMain stays tracked but its
  # camelCase name is fixed by Kotlin Multiplatform's `src/<sourceSetName>/kotlin` layout contract.
  - "**/.gradle"
  - "**/.kotlin"
  - services/ws-modules/kotlin-data1/build
  - services/ws-modules/kotlin-data1/src/wasmJsMain
