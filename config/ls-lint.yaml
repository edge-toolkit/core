# ls-lint file/directory naming linter (https://ls-lint.org).
# Run via `mise run ls-lint-check`. ls-lint walks the working tree (not git), so the build/vendor/codegen trees are
# ignored below and only hand-written source is linted. Each rule lists the casings actually used in the repo today.
ls:
  # Directories are kebab-case (most) or snake_case (a few generated-style names).
  # The regex alternative permits leading-dot tool dirs (.github, .mise).
  .dir: kebab-case | snake_case | regex:\.[a-z_]+

  .rs: snake_case | kebab-case
  .py: snake_case | regex:__[a-z]+__
  .js: snake_case
  .zig: snake_case
  .c: snake_case
  .cpp: snake_case
  .dart: snake_case
  .wit: snake_case | kebab-case
  .rego: snake_case | kebab-case
  .yaml: snake_case | kebab-case
  .cs: PascalCase
  .java: PascalCase
  .kt: PascalCase
  # Gradle build scripts: the fixed names `build.gradle.kts` / `settings.gradle.kts`.
  .gradle.kts: regex:(build|settings)

  # Ban the `.conf` extension: config files standardize on `.ini`/`.rc`, as rclone.ini and ripgrep.rc do.
  # `regex:^$` matches no basename, so every `*.conf` file fails the check.
  .conf: regex:^$

ignore:
  # Every entry is a literal path -- no glob or wildcard syntax of any kind.
  # ls-lint snapshots glob ignores once at startup and drops any key matching nothing then (internal/glob/glob.go
  # deletes zero-match keys), so a glob covering a dir that a parallel task creates mid-run silently stops applying
  # and the tree gets walked. A literal path is never expanded, so it holds whenever the dir appears -- and costs
  # nothing on a tree where it never does.
  - .git
  - target
  - generated
  # Bundled data/model assets -- names are not hand-chosen.
  # This also covers the pnpm symlink farm under data/split-learning-demo, whose nested package dirs are vendored.
  - data
  # pnpm puts node_modules at the workspace root and under each member package (pnpm-workspace.yaml).
  - node_modules
  - services/ws-server/static/node_modules
  - services/ws-modules/js-data1/node_modules
  # Built module artifacts (wheels, .wasm, generated JS) live under each module's pkg/.
