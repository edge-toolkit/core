rules:
  - id: single-line-description-in-mise-config
    languages: [generic]
    paths:
      include:
        - "/.mise/config*.toml"
    pattern-regex: 'description = """'
    message: >-
      mise task `description` fields must be single-line `"..."` strings, not
      multi-line `"""..."""`. Keep the description short enough to fit on one
      line (under the 120-char limit).
    severity: ERROR

  - id: multiline-task-run-needs-bash-shell
    languages: [generic]
    paths:
      include:
        - "/.mise/config*.toml"
    pattern-regex: 'run = ("""|'''''')\n(?:(?!\1\n).*\n)*?\1\n(?!shell = "bash -x?euo pipefail -c")'
    message: >-
      A mise task with a multiline `run` must be immediately followed by
      `shell = "bash -euo pipefail -c"` (on the line right after the closing
      `"""`/`'''`), so a failing command fails the task instead of being masked.
      The `-x` variant (`bash -xeuo pipefail -c`) is also accepted (xtrace, used
      on the Windows OS-specific preinstall for failure-diagnosis transcripts).
      Put `shell` directly after `run`. bash is installed before any task on
      Windows (see preinstall), so even the setup tasks can use it.
    severity: ERROR

  - id: single-key-env-subtable-should-be-inline
    languages: [generic]
    paths:
      include:
        - "/.mise/config*.toml"
    # Matches `[tasks.X.env]` headers that wrap exactly one single-key assignment.
    # Followed by exactly one `KEY = VAL` assignment (modulo leading comment
    # lines) and terminated by a blank line + next `[` section header. The
    # "exactly one" comes from the negative lookahead `(?!.*=)` after the single
    # match -- a second assignment within the section blocks the match. The
    # lookahead doesn't check inline-form line length (would need code, not a
    # regex), so a hit still needs the human to confirm the would-be
    # `env = { ... }` fits inside 120 chars before flattening; if it doesn't,
    # leave it subtabled and add a `# semgrep-ignore: ...` directive on the header.
    pattern-regex: '(?m)^\[tasks\.[^\]]+\.env\]\n(?:#[^\n]*\n)*[A-Z_][A-Z0-9_]*\s*=\s*[^\n]+\n+\['
    message: >-
      `[tasks.X.env]` subtable has a single `KEY = "value"` assignment. Inline
      it on the parent task as `env = { KEY = "value" }` when the resulting
      line fits in 120 chars -- subtable form is reserved for multi-key envs.
    severity: WARNING
