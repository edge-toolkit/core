rules:
  - id: single-line-description-in-mise-config
    languages: [generic]
    paths:
      include:
        - "/.mise/config*.toml"
    pattern-regex: 'description = """'
    message: >-
      mise task `description` fields must be single-line `"..."` strings, not
      multi-line `"""..."""`. Keep the description short enough to fit on one
      line (under the 120-char limit).
    severity: ERROR

  - id: multiline-task-run-needs-bash-shell
    languages: [generic]
    paths:
      include:
        - "/.mise/config*.toml"
    pattern-regex: 'run = ("""|'''''')\n(?:(?!\1\n).*\n)*?\1\n(?!shell = "bash -euo pipefail -c")'
    message: >-
      A mise task with a multiline `run` must be immediately followed by
      `shell = "bash -euo pipefail -c"` (on the line right after the closing
      `"""`/`'''`), so a failing command fails the task instead of being masked.
      Put `shell` directly after `run`. bash is installed before any task on
      Windows (see preinstall), so even the setup tasks can use it.
    severity: ERROR
