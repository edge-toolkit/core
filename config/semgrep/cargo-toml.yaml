rules:
  - id: bare-workspace-inline-dep
    languages: [generic]
    paths:
      include:
        - "**/Cargo.toml"
    pattern: "$DEP = { workspace = true }"
    fix: "$DEP.workspace = true"
    message: >-
      Use the dotted form `dep.workspace = true` instead of the inline table `dep = { workspace = true }`. (Inline
      tables with extra keys, e.g. `dep = { workspace = true, features = [...] }`, are fine.)
    severity: ERROR
