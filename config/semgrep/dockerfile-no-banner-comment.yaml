rules:
  - id: dockerfile-no-banner-comment
    languages: [generic]
    paths:
      include:
        - "Dockerfile*"
    # Match a full-line comment framed by dash runs on BOTH sides.
    # The `# --- text ---` decorative "banner" divider style. The two-sided
    # `-{2,} ... -{2,}` requirement is what distinguishes a banner from an
    # ordinary wrapped comment line that merely opens with an em-dash separator
    # (`# -- foo`), which has no trailing dash run and is left alone.
    pattern-regex: '(?m)^[ \t]*#[ \t]*-{2,}.*-{2,}[ \t]*$'
    # Check-only: no autofix is provided.
    # semgrep's `fix-regex` is not applied for generic `pattern-regex` rules in
    # the pinned semgrep, so the dash-strip rewrite (`# --- text ---` -> `# text`)
    # can't be expressed as an autofix here.
    message: >-
      Decorative `# --- text ---` banner comments are not allowed in
      Dockerfiles. Use a plain, concise one-line comment (`# text`) instead:
      drop the surrounding dash runs, keeping the inner text.
    severity: ERROR
