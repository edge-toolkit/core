rules:
  - id: no-trailing-backslash
    languages: [generic]
    paths:
      exclude:
        - "/README.md"
        - "/utilities/cli/README.md"
        # Generated deployment artifacts (regen-verification output).
        - "/verification/**/mise.toml"
        - "/verification/**/compose.yaml"
        # Generated: wasmtime's format_err! messages wrap with a string-literal continuation.
        # Refer to int-gen bindings.rs for details.
        - "/services/ws-wasi-runner/src/bindings.rs"
    pattern-regex: '\\[ \t]*$'
    message: >-
      Trailing-backslash line continuations are not allowed in this repo.
      Keep it on one line, or use a language-appropriate alternative (concat!(...) in Rust, a mise [vars] entry,
      a YAML/array form). If a file genuinely needs them, add it to this rule's paths.exclude allowlist.
    severity: ERROR
