rules:
  - id: no-curl-pipe
    languages: [generic]
    paths:
      exclude:
        # Generated trees are deliberately NOT excluded.
        # A generated Dockerfile is built and run like any other, so a piped download in one is a real
        # vulnerability rather than a copy of a finding reported elsewhere. Catching it here also catches the
        # case the generator's own source cannot: a template assembled from fragments no single source line
        # shows as a pipe.
        #
        # This file is excluded, because it otherwise matches itself.
        # Not just the prose: the `pattern-regex` below is a literal `curl` followed by a literal `|`, so the
        # rule flags its own definition however the message is worded. Scoped to this one file rather than the
        # whole rules directory, so every other rule here stays covered.
        - "/config/semgrep/no-curl-pipe.yaml"
    # Match a `curl` whose output is piped anywhere at all.
    # `[^|\n]*` keeps the match inside one command rather than reaching a later, unrelated pipe.
    # There is deliberately no exemption for `| tar`. One was tried and removed, because `tar` can be told to
    # execute what it unpacks: `curl <url> | tar --to-command=sh -xf -` runs every archive member through a shell,
    # and `-I` / `--use-compress-program` hand an arbitrary command the stream as well. A pattern that allowed any
    # pipeline starting with `tar` therefore permitted exactly what this rule exists to stop, while reading as
    # though it only allowed unpacking. Nothing in the repo needs the exemption: every download fetches to a file,
    # verifies it, and extracts as a separate step.
    pattern-regex: '\bcurl\b[^|\n]*\|'
    message: >-
      Piping `curl` into another command is banned in this repo.
      `curl ... | sh` executes an unreviewed remote script outright: whoever controls the URL, or anyone able to
      substitute the response, chooses what runs, and a truncated download is indistinguishable from a good one.
      Download to a file first, verify it with a pinned `sha256sum -c` or a signature, and only then use it.
      `| tar` is banned too, and is not the safe exception it looks like: `tar --to-command=<cmd>` runs every
      archive member through that command, and `-I` / `--use-compress-program` likewise hand an arbitrary program
      the stream, so a piped archive can execute code just as a piped script can. Fetch, verify, then extract.
    severity: ERROR
