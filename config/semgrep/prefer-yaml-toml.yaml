rules:
  - id: prefer-yaml-toml-over-json
    languages: [generic]
    paths:
      include:
        - "*.json"
        - "*.jsonc"
        - "*.jsonl"
      exclude:
        # Formats whose tooling mandates JSON/JSONC -- everything else should be YAML or TOML.
        # Add a file here only if its tool can't read YAML/TOML; if the tool also supports JSONC, prefer that
        # extension over plain JSON so the config can carry inline comments.
        - "*.schema.json" # JSON Schema documents
        - "package.json" # npm manifests
        - "/.vscode/*.json" # editor config
        - "dprint.jsonc" # dprint config
        - ".dprint.jsonc"
        - "oxlintrc.jsonc" # oxlint: only JSON / JSONC supported
        - "oxfmtrc.jsonc" # oxfmt: only JSON / JSONC supported
    pattern-regex: \A
    message: >-
      Prefer YAML or TOML over JSON/JSONC/JSONL for config.
      If the tool requires a JSON-family format, prefer .jsonc over .json so the config can carry inline comments,
      and add the file to this rule's paths.exclude allowlist.
    severity: ERROR
