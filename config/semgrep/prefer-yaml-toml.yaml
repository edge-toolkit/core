rules:
  - id: prefer-yaml-toml-over-json
    languages: [generic]
    paths:
      include:
        - "*.json"
        - "*.jsonc"
        - "*.jsonl"
      exclude:
        # Formats whose tooling mandates JSON/JSONC -- everything else should be YAML or TOML.
        # Add a file here only if its tool can't read YAML/TOML; if the tool also supports JSONC, prefer that
        # extension over plain JSON so the config can carry inline comments.
        - "*.schema.json" # JSON Schema documents
        - "package.json" # npm manifests
        - "/.vscode/*.json" # editor config
        - "dprint.jsonc" # dprint config
        - ".dprint.jsonc"
        - "oxlintrc.jsonc" # oxlint: only JSON / JSONC supported
        - "oxfmtrc.jsonc" # oxfmt: only JSON / JSONC supported
        - "tsconfig.json" # TypeScript/tsgolint: mandates the JSON `tsconfig.json` name (oxlint --type-aware)
        - "math1-input.json" # math1 wire payload: served to modules verbatim, parsed by their JSON parsers
        # Both jscpd files have to be plain JSON, and .jsonc would misrepresent them.
        # jscpd parses its config with plain serde_json and reads no YAML/TOML, so a `//` comment aborts it with
        # `key must be a string at line 2 column 3` -- a .jsonc extension would advertise comments the parser
        # rejects. jscpd-baseline.json is machine-written by `jscpd --update-baseline`; its shape is not ours to
        # choose at all.
        - "jscpd.json" # jscpd config
        - "jscpd-baseline.json" # jscpd clone-fingerprint ratchet
    pattern-regex: \A
    message: >-
      Prefer YAML or TOML over JSON/JSONC/JSONL for config.
      If the tool requires a JSON-family format, prefer .jsonc over .json so the config can carry inline comments,
      and add the file to this rule's paths.exclude allowlist.
    severity: ERROR
