# One rule per check tool, each banning that tool's name everywhere except the files that wire it up.
#
# A checker should be invisible to everything it is not wired into. A comment saying some code is shaped a
# certain way to satisfy one documents the tool's reaction rather than the code, reads as noise to everyone who
# does not run it, and goes stale the moment its config moves. A cross-reference to another checker is worse
# still: it duplicates a rule that already documents itself where it lives, and the two then drift apart.
#
# Two narrow exceptions run through the allowlists below. A suppression pragma only works spelled out, so the
# file carrying one keeps the name. And a local rule mirroring an external analyzer's finding may name the code
# it mirrors so the pair stays recognisable -- the code, never the vendor.
#
# To wire a checker into a new file, add that file to the matching rule's `paths.exclude` with a comment saying
# which part of the wiring needs it. Do not add one so a comment can explain why some code looks the way it does;
# that is the thing these rules exist to prevent. One tool is deliberately absent: clippy, whose lint names are
# operational at nearly every site that writes one, so a ban on the word would be almost entirely allowlist.
rules:
  - id: no-action-validator-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.codacy.yaml" # Names the workflow linters Codacy defers to, as its exclusion rationale.
        - "/.github/actions/install-mise-tools/action.yaml" # Stages the tool for CI.
        - "/.github/workflows/test.yaml" # Notes the Windows lane's source-build fallback for it.
        - "/Dockerfile" # Disables the tool for an image whose build does not need it.
        - "/config/conftest/policy/mise/mise.rego" # Allowlists it as a `cargo:` tool with no prebuilt.
        - "/config/taplo/mise-cargo-backend-allowlist.schema.json" # Same allowlist, as a TOML schema enum.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)action-validator"
    message: >-
      Do not name the workflow schema validator outside the files that install and run it. Whether a workflow
      key is spelled a certain way to keep a validator happy is not what a reader of that workflow needs; say
      what the key does.
    severity: ERROR

  - id: no-actionlint-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/.codacy.yaml" # Names the workflow linters Codacy defers to, as its exclusion rationale.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)actionlint"
    message: >-
      Do not name the GitHub Actions linter outside the files that install and run it. A workflow comment
      crediting it for a shell quoting or expression change says nothing a reader of the workflow can use.
    severity: ERROR

  - id: no-ast-grep-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the scan/fix tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.codacy.yaml" # Names the workflow linters Codacy defers to, as its exclusion rationale.
        - "/config/ast-grep/**" # Its own ruleset, where the tool's own syntax is the subject.
        - "/config/generated-trees.toml" # Maps each generated tree onto the exclusion key this tool needs.
        - "/config/conftest/policy/generated_trees/generated_trees.rego" # Enforces that mapping.
        - "/config/conftest/policy/generated_trees/generated_trees_test.rego" # Unit tests for it.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)ast-grep"
    message: >-
      Do not name the structural search tool outside its own ruleset and the configs that scope it. Pointing at
      one of its rules from the code that rule governs duplicates the rule's own message, which is where the
      explanation belongs and where it stays correct.
    severity: ERROR

  - id: no-cargo-deny-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/.github/workflows/dependencies.yaml" # Runs the audit on CI.
        - "/config/deny.toml" # Its own config, including which scanner honours which advisory id.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)cargo-deny"
    message: >-
      Do not name the dependency auditor outside its config and the job that runs it. A dependency is chosen or
      avoided for a licensing or advisory reason, which stands on its own; the auditor that would have noticed
      is not part of it.
    severity: ERROR

  - id: no-cargo-unmaintained-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin and the task that runs it.
        - "/.github/workflows/dependencies.yaml" # Runs the scan on CI.
        - "/Cargo.toml" # Its per-crate ignore list, where each entry's reason is the false positive it hit.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)cargo-unmaintained"
    message: >-
      Do not name the unmaintained-crate scanner outside its ignore list and the job that runs it. Its ignore
      entries need the tool's own heuristics explained; nothing else in the tree does.
    severity: ERROR

  - id: no-clang-format-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the format/check tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/clang-format.yaml" # Its own config, including the settings held to agree with the C linters.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)clang-format"
    message: >-
      Do not name the C formatter outside its own config. Formatted code carries no evidence of who formatted
      it, and a comment claiming a brace or a blank line is the formatter's doing is unverifiable noise.
    severity: ERROR

  - id: no-clang-tidy-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the check/fix tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.github/workflows/codeql.yaml" # Names the check that keeps the coverage an excluded query gave up.
        - "/config/clang-tidy.yaml" # Its own config, including which external code each check mirrors.
        - "/config/conftest/policy/mise/mise.rego" # Allowlists it as a `cargo:` tool with no prebuilt.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)clang-tidy"
    message: >-
      Do not name the C static analyzer outside its config. Its suppression marker is a bare `// NOLINT` naming
      the check, which is all a reader needs -- spelling out the analyzer beside it adds nothing and dates the
      comment to whichever analyzer happened to run that week.
    severity: ERROR

  - id: no-codacy-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Names the tool in the task that mirrors its secret scan locally.
        - "/CLAUDE.md" # Documents how a finding from an external analyzer must reach a local checker.
        - "/.codacy.yaml" # Its own config, whose path excludes each carry their reason.
        - "/libs/wasi-guest/src/coverage.rs" # Path-excluded there; its header is that exclusion's only home.
        - "/services/ws-test-server/src/bin/cov-server.rs" # Likewise path-excluded, rationale in its header.
        - "/services/ws-web-runner/mingw-shim/msvc_crt_alloc.c" # Likewise, and the reason the file exists apart.
        - "/services/ws-web-runner/mingw-shim/msvc_crt_locale_cache.c" # Likewise.
        - "/utilities/cli/src/hub_ws_url.rs" # Likewise.
        - "/utilities/wasm-cov-wrapper/src/main.rs" # Likewise.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)codacy"
    message: >-
      Do not name this analyzer outside its own config and the few files it excludes by path, where the header
      is the exclusion's canonical home. It runs after a push, so a source comment about it describes something
      the reader cannot see, run, or check; state the property the code actually has.
    severity: ERROR

  - id: no-codecov-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # The coverage tasks that produce and upload its reports.
        - "/CLAUDE.md" # Records which coverage check on a PR is the one that has to pass.
        - "/.deepsource.toml" # Declares the coverage artifact both services read.
        - "/.github/workflows/coverage.yaml" # Uploads to it on CI.
        - "/.gitignore" # Ignores its downloaded uploader binary.
        - "/.dockerignore" # The same ignore, generated from it.
        - "/verification/**" # Generator-owned output, carrying whatever the generator wrote.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)codecov"
    message: >-
      Do not name the coverage service outside the jobs that upload to it. A test exists to pin behaviour, and
      saying it was added for a coverage percentage tells the next reader to delete it once the number moves.
    severity: ERROR

  - id: no-conftest-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entries, and the per-format policy tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.codacy.yaml" # Names the config linters Codacy defers to, as its exclusion rationale.
        - "/.editorconfig" # `conftest fmt` owns Rego indentation and is not configurable, hence the override.
        - "/Dockerfile" # Stages or disables the tool for the image build.
        - "/Dockerfile.nanoserver" # Same, for the Nano Server image.
        - "/config/conftest/**" # Its own policy tree, where the tool's input shape is the subject.
        - "/config/generated-trees.toml" # Declares the policy that enforces the linter/tree mapping.
        - "/config/regal.yaml" # Carves out the conftest-specific Rego patterns vanilla regal would flag.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)conftest"
    message: >-
      Do not name the policy runner outside its own policy tree and the tasks that feed it. A config entry is
      shaped by what the config has to express; a note that some policy would otherwise object belongs in that
      policy's own deny message, where it is shown to the person who trips it.
    severity: ERROR

  - id: no-cpplint-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.github/workflows/codeql.yaml" # Names the check that keeps the coverage an excluded query gave up.
        - "/Dockerfile.nanoserver" # Disables the tool for an image whose build does not need it.
        - "/config/clang-format.yaml" # The formatter setting chosen so the two agree on comment spacing.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)cpplint"
    message: >-
      Do not name the C++ style checker outside the configs that run it or defer to it. Its suppression marker
      carries the rule name already, and nothing else in a C file is the checker's business.
    severity: ERROR

  - id: no-deepsource-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # The coverage tasks that produce the reports it ingests.
        - "/CLAUDE.md" # Documents how a finding from an external analyzer must reach a local checker.
        - "/.deepsource.toml" # Its own config.
        - "/.codacy.yaml" # Names it as the analyzer still covering what Codacy skips.
        - "/.github/workflows/coverage.yaml" # Reports coverage to it on CI.
        - "/services/ws-modules/dotnet-data1/pkg/et_ws_dotnet_data1.js" # A `skipcq` pragma's own justification.
        - "/services/ws-modules/dotnet-math1/pkg/et_ws_dotnet_math1.js" # The same pragma in the twin shim.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)deepsource"
    message: >-
      Do not name this analyzer outside its own config and the pragmas it reads. A local rule mirroring one of
      its findings names the code -- `RS-W1079`, `TYP-025`, `CXX-W2009` -- and stops there: the code identifies
      the finding, survives a change of vendor, and is what a search will actually turn up.
    severity: ERROR

  - id: no-dprint-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the format/check tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.dprint.jsonc" # The root config, which is also this repo's root-marker file.
        - "/.codacy.yaml" # Names the formatters Codacy defers to, as its exclusion rationale.
        - "/.gitattributes" # Records that the formatters write LF, which the checkout must preserve.
        - "/Cargo.lock" # Carries its plugin crates as dependency names.
        - "/config/dprint.jsonc" # Its own config, including the settings held to agree with the JS formatter.
        - "/config/oxfmtrc.jsonc" # The other half of that agreement.
        - "/config/ryl.yaml" # Defers to it on inline-comment spacing so the two cannot fight.
        - "/config/semgrep/no-line-length-in-comment.yaml" # Names the configs that hold the line-length value.
        - "/config/semgrep/prefer-yaml-toml.yaml" # Allowlists its config, which can only be JSONC.
        - "/config/ast-grep/rules/no-current-dir.yaml" # Names the root-marker file, not the tool.
        - "/libs/path/src/lib.rs" # Holds that marker filename as a constant.
        - "/libs/path/tests/find.rs" # Writes the marker file to build a fixture root.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)dprint"
    message: >-
      Do not name the markdown/YAML/JSON formatter outside its config and the configs held to agree with it.
      Where a generator has to emit already-formatted output, say which shape the output must have; naming the
      formatter dates the comment to a config the generator never reads.
    severity: ERROR

  - id: no-editorconfig-check-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)editorconfig-check"
    message: >-
      Do not name the editorconfig checker outside the task that runs it. Write "the editorconfig line length"
      when a comment genuinely has to mention the limit -- that names the constraint and its source, which is
      what a reader can act on.
    severity: ERROR

  - id: no-flawfinder-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/Dockerfile.nanoserver" # Disables the tool for an image whose build does not need it.
        - "/services/ws-modules/zig-except1/src/exceptions.cpp" # A `flawfinder: ignore` pragma, spelled out.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)flawfinder"
    message: >-
      Do not name the C/C++ security scanner except in the `flawfinder: ignore` pragma, which only works spelled
      out on the line it covers. Its justification belongs on that same line and says why the call is safe.
    severity: ERROR

  - id: no-gitleaks-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/gitleaks.toml" # Its own config, including how far its inline marker reaches.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)gitleaks"
    message: >-
      Do not name the secret scanner outside its config and the `gitleaks:allow` marker it reads. A credential
      is kept out of a tracked file because it is a credential, not because a scanner would find it.
    severity: ERROR

  - id: no-hadolint-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.github/workflows/docker-linux.yaml" # Stages every Dockerfile where the tool can find it.
        - "/Dockerfile" # Carries `# hadolint ignore=` pragmas, which only work spelled out.
        - "/Dockerfile.nanoserver" # Same, plus the tool's own MISE_DISABLE_TOOLS entry.
        - "/Dockerfile.windows" # Same pragmas.
        - "/services/ws-server/Dockerfile" # Same, and why one code is suppressed inline rather than in config.
        - "/config/hadolint.yaml" # Its own config, and the shellcheck code it emits from its embedded copy.
        - "/utilities/cli/src/deployment_types/scenario_image.rs" # Emits those pragmas into generated images.
        - "/verification/**" # The generated images holding them.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)hadolint"
    message: >-
      Do not name the Dockerfile linter outside its config, its `hadolint ignore=` pragmas, and the code that
      emits them. Say what the instruction does and why it is written that way; a pragma already carries the
      code it suppresses.
    severity: ERROR

  - id: no-jscpd-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the tasks that run and report it.
        - "/CLAUDE.md" # Documents the baseline-is-a-debt-ledger rule, which is where that policy belongs.
        - "/config/jscpd.json" # Its own config.
        - "/config/jscpd-baseline.json" # The clone-fingerprint baseline it reads.
        - "/config/conftest/policy/jscpd/jscpd.rego" # Ratchets that baseline, and takes the tool as its package.
        - "/config/conftest/policy/policy_tests/policy_tests.rego" # Names that policy path in its exception list.
        - "/config/conftest/policy/policy_tests/policy_tests_test.rego" # Unit tests for it.
        - "/config/conftest/policy/generated_trees/generated_trees.rego" # Enforces the linter/tree mapping.
        - "/config/generated-trees.toml" # Maps each generated tree onto the exclusion key this tool needs.
        - "/config/semgrep/prefer-yaml-toml.yaml" # Allowlists its two files, which cannot be YAML or take comments.
        - "/config/typos.toml" # The same carve-out for those two files.
        - "/Dockerfile.nanoserver" # Disables the tool for an image whose verifier cannot install it.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)jscpd"
    message: >-
      Do not name the duplication checker outside its config, its baseline, and the policy that ratchets them. A
      reported clone is a request to remove duplication: factor the shared part out so it exists once. Where a
      clone is genuinely irreducible -- the same few lines every caller must write verbatim -- leave the code
      plain and raise it, rather than annotating the source with the tool's name.
    severity: ERROR

  - id: no-kubeconform-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/README.md" # Tells a contributor which checks validate the generated manifests.
        - "/.codacy.yaml" # Names the manifest checks Codacy defers to, as its exclusion rationale.
        - "/.github/workflows/k3s.yaml" # Runs the validation on CI.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)kubeconform"
    message: >-
      Do not name the manifest schema validator outside the job that runs it. A manifest field is set because
      Kubernetes requires or honours it, which is what the comment beside it should say.
    severity: ERROR

  - id: no-ls-lint-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs, and keeping its ignores in sync with .gitignore.
        - "/config/ls-lint.yaml" # Its own config.
        - "/config/semgrep/ls-lint-no-glob.yaml" # The rule holding that config to literal paths.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)ls-lint"
    message: >-
      Do not name the file-naming linter outside its config and the rule that governs it. A file or directory is
      named for what it holds; the checker that would object to another name is not part of that.
    severity: ERROR

  - id: no-lychee-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the link-check task.
        - "/CLAUDE.md" # Documents which checks an agent runs, and keeping its ignores in sync with .gitignore.
        - "/config/lychee.toml" # Its own config.
        - "/Dockerfile.nanoserver" # Disables the tool for an image whose build does not need it.
        - "/.gitignore" # Ignores its on-disk cache.
        - "/.dockerignore" # The same ignore, generated from it.
        - "/verification/**" # Generator-owned output, carrying whatever the generator wrote.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)lychee"
    message: >-
      Do not name the link checker outside its config and the task that runs it. A link is written to point
      somewhere useful, and a note that the checker accepts or skips it will outlive the reason it did.
    severity: ERROR

  - id: no-nextest-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and every task that runs the test suite.
        - "/.github/workflows/coverage.yaml" # Runs the suite under it on CI.
        - "/.github/workflows/test.yaml" # Same.
        - "/config/nextest.toml" # Its own config, including the test groups that serialise port users.
        # Every test here wants one fixed port, and only that config's test group keeps them apart.
        # That is a constraint nothing in the file itself can express, and a silent corruption when bypassed.
        - "/utilities/cli/tests/scenario_runners.rs"
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)nextest"
    message: >-
      Do not name the test runner outside its config and the jobs that invoke it. A test asserts what the code
      must do, and how it happens to be scheduled is the runner's business rather than the test's -- unless the
      schedule is load-bearing, which is a constraint worth stating and worth allowlisting for.
    severity: ERROR

  - id: no-osv-scanner-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the tasks that scan each ecosystem.
        - "/.github/workflows/dependencies.yaml" # Runs the scan on CI.
        - "/config/osv-scanner.toml" # Its own config.
        - "/config/deny.toml" # Records which of the two scanners honours each advisory id.
        - "/pnpm-workspace.yaml" # One root lockfile exists so the npm scan has a single committed target.
        - "/pubspec.yaml" # The same, for the Dart ecosystem.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)osv-scanner"
    message: >-
      Do not name the vulnerability scanner outside its config, the job that runs it, and the ignore lists that
      have to say which scanner honours which id. Everywhere else, describe the dependency, not the scan.
    severity: ERROR

  - id: no-oxfmt-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the format/check tasks.
        - "/CLAUDE.md" # Documents how to write JS that both formatters accept.
        - "/config/oxfmtrc.jsonc" # Its own config.
        - "/config/dprint.jsonc" # The other formatter, tuned to agree with it.
        - "/config/semgrep/prefer-yaml-toml.yaml" # Allowlists its config, which can only be JSONC.
        - "/config/conftest/policy/mise/mise.rego" # Allowlists it as a tool with no prebuilt at some triple.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)oxfmt"
    message: >-
      Do not name the JS formatter outside its config and the config held to agree with it. When a statement has
      to be split to keep both formatters happy, the fix is in the source -- a shorter line, an extracted local
      -- and the split stands on its own without a comment naming either tool.
    severity: ERROR

  - id: no-oxlint-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the lint/fix tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/oxlintrc.jsonc" # Its own config, including which external code each rule mirrors.
        - "/config/oxfmtrc.jsonc" # Names the shared JSONC configs the formatter must skip.
        - "/config/semgrep/prefer-yaml-toml.yaml" # Allowlists its config, which can only be JSONC.
        - "/config/conftest/policy/mise/mise.rego" # Allowlists it as a tool with no prebuilt at some triple.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)oxlint"
    message: >-
      Do not name the JS linter outside its config. A `skipcq` or eslint-style disable comment already carries
      the rule it silences plus the reason it is safe; adding the linter's name tells the reader nothing more.
    severity: ERROR

  - id: no-pyrefly-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the Python check task.
        - "/config/pyrefly.toml" # Its own config.
        - "/config/semgrep/no-type-comments.yaml" # The rule keeping annotations the only form it can check.
        - "/config/generated-trees.toml" # Maps each generated tree onto the exclusion key this tool needs.
        - "/config/conftest/policy/generated_trees/generated_trees.rego" # Enforces that mapping.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)pyrefly"
    message: >-
      Do not name the Python type checker outside its config and the rules that protect what it can see. An
      annotation states the type the code requires; that it also satisfies a checker follows, and need not be
      written down.
    severity: ERROR

  - id: no-regal-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the check/fix tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/regal.yaml" # Its own config.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: '(?i)\bregal\b'
    message: >-
      Do not name the Rego linter outside its own config. A policy is written the way Rego reads best; if one of
      its idioms is deliberate, say what the idiom does rather than which linter asked for it.
    severity: ERROR

  - id: no-roslynator-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the .NET check task.
        - "/Dockerfile.nanoserver" # Disables the tool for an image whose build does not need it.
        - "/Dockerfile.windows" # Same.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)roslynator"
    message: >-
      Do not name the C# analyzer outside the tasks and images that install it. A `#pragma warning disable`
      already names the diagnostic, which is the part a reader can look up.
    severity: ERROR

  - id: no-ruff-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the format/check/fix tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/ruff.toml" # Its own config, kept at the root so editors discover it.
        - "/.editorconfig" # Records that the formatter owns docstring and doc-comment reflow.
        - "/config/dprint.jsonc" # Skips the Python files this tool formats instead.
        - "/config/oxfmtrc.jsonc" # Names the root config it must not treat as JS.
        - "/config/semgrep/no-line-length-in-comment.yaml" # Names the configs that hold the line-length value.
        - "/config/openapi-python-client.yaml" # Turns off the generator's own hooks, which a task already runs.
        - "/generated/**" # Generator-owned output, carrying whatever the generator wrote.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: '(?i)\bruff\b'
    message: >-
      Do not name the Python linter/formatter outside its config and the configs that defer to it. A `# noqa`
      carries the code it silences and should carry the reason too; the tool that issued the code does not need
      naming beside it.
    severity: ERROR

  - id: no-ryl-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/ryl.yaml" # Its own config.
        - "/config/conftest/policy/mise/mise.rego" # Allowlists it as a tool with no prebuilt at some triple.
        - "/config/taplo/mise-cargo-backend-allowlist.schema.json" # The same allowlist, as a TOML schema enum.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: '(?i)\bryl\b'
    message: >-
      Do not name the YAML linter outside its own config. YAML is written to be read; where its shape is forced,
      say what forces it, which is almost always the schema the file answers to rather than a linter.
    severity: ERROR

  - id: no-semgrep-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the scan/fix tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.semgrepignore" # Its own ignore file, whose comments explain what the tool's default skips.
        - "/.codacy.yaml" # Excludes this ruleset, which its own copy of the tool misparses.
        - "/.github/workflows/test.yaml" # Notes the Windows lane's handling of the tool.
        - "/Dockerfile.nanoserver" # Disables the tool for an image whose build does not need it.
        - "/config/semgrep/**" # This ruleset, where the tool's own rule syntax is the subject.
        - "/config/generated-trees.toml" # Maps each generated tree onto the exclusion key this tool needs.
        - "/config/conftest/policy/generated_trees/generated_trees.rego" # Enforces that mapping.
        - "/config/conftest/policy/generated_trees/generated_trees_test.rego" # Unit tests for it.
    pattern-regex: "(?i)semgrep"
    message: >-
      Do not name this tool outside its own ruleset and the configs that scope it. A `nosemgrep` marker is the
      one place the name belongs in source, and it needs the rule id and a reason beside it; anywhere else,
      pointing at a rule duplicates the message that rule already shows whoever trips it.
    severity: ERROR

  - id: no-shellcheck-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, the task-body extractor, and the `# shellcheck disable=` pragmas in task bodies.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/.github/workflows/docker-linux.yaml" # Carries those pragmas in its run bodies.
        - "/.github/workflows/docker-windows.yaml" # Same.
        - "/.github/workflows/upstream-cache.yaml" # Same.
        - "/Dockerfile.nanoserver" # Same, plus the tool's own MISE_DISABLE_TOOLS entry.
        - "/Dockerfile.windows" # Same pragmas.
        - "/config/hadolint.yaml" # Ignores a code raised by the copy embedded in the Dockerfile linter.
        - "/utilities/cli/src/deployment_types/scenario_image.rs" # Emits those pragmas into generated images.
        - "/verification/**" # The generated images holding them.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)shellcheck"
    message: >-
      Do not name the shell linter except in the `# shellcheck disable=` pragma, which only works spelled out
      above the line it covers, and in the configs that run it. The pragma needs the code and the reason the
      construct is deliberate; nothing else in the script does.
    severity: ERROR

  - id: no-shfmt-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the extractor that formats mise task bodies with it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)shfmt"
    message: >-
      Do not name the shell formatter outside the tasks that run it. Formatted shell carries no evidence of who
      formatted it, so a comment claiming an indent is the formatter's doing cannot be checked.
    severity: ERROR

  - id: no-taplo-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the format/check tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/taplo.toml" # Its own config.
        - "/config/taplo/**" # The JSON schemas it lints TOML against.
        - "/config/conftest/policy/mise/mise.rego" # Allowlists it as a tool with no prebuilt at some triple.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)taplo"
    message: >-
      Do not name the TOML formatter and schema linter outside its config and schemas. Where a generator has to
      emit TOML the formatter will accept unchanged, say which shape the output must have -- sorted arrays,
      aligned comments -- rather than naming the tool that would otherwise rewrite it.
    severity: ERROR

  - id: no-trivy-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/README.md" # Tells a contributor which checks validate the generated manifests.
        - "/.codacy.yaml" # Names the manifest checks Codacy defers to, as its exclusion rationale.
        - "/config/trivyignore.yaml" # Its own ignore file, where each entry states why the finding is an artifact.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)trivy"
    message: >-
      Do not name the container and manifest scanner outside its ignore file and the task that runs it. Its
      ignore entries need its own resolution behaviour explained; nothing it scans does.
    severity: ERROR

  - id: no-typos-check-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin and the check/fix tasks.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)typos-(check|fix)"
    message: >-
      Do not name the spelling checker's tasks outside the config that defines them. An identifier spelled an
      unusual way is either correct or a typo; if it is correct, say what it means, and add it to the checker's
      own allowlist rather than explaining it where it appears.
    severity: ERROR

  - id: no-zizmor-mentions
    languages: [generic]
    paths:
      exclude:
        - "/.mise/**" # Tool pin, lockfile entry, and the task that runs it.
        - "/CLAUDE.md" # Documents which checks an agent runs for which file types.
        - "/config/zizmor.yaml" # Its own config.
        - "/.codacy.yaml" # Names the workflow linters Codacy defers to, as its exclusion rationale.
        - "/.github/actions/install-mise/action.yaml" # A `zizmor: ignore[...]` pragma, which only works spelled out.
        - "/.github/workflows/upstream-cache.yaml" # The same pragma.
        - "/config/semgrep/no-*-mentions.yaml" # The mention bans, which cannot help but name what they ban.
    pattern-regex: "(?i)zizmor"
    message: >-
      Do not name the Actions security auditor except in the `zizmor: ignore[...]` pragma, which only works
      spelled out, and in the configs that run it. A workflow step is written to be safe; say why it is, and let
      the pragma carry the audit it waives.
    severity: ERROR
