rules:
  - id: single-line-description-in-mise-config
    languages: [generic]
    paths:
      include:
        - "/.mise/config*.toml"
    pattern-regex: 'description = """'
    message: >-
      mise task `description` fields must be single-line `"..."` strings, not
      multi-line `"""..."""`. Keep the description short enough to fit on one
      line (under the 120-char limit).
    severity: ERROR
