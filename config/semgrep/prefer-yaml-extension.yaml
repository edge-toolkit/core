rules:
  - id: prefer-yaml-extension
    languages: [generic]
    paths:
      include:
        - "*.yml"
      exclude:
        # External upstream clones + generated trees are not our prose.
        - "/data"
        - "/generated"
    pattern-regex: \A
    message: >-
      Prefer the .yaml extension over .yml. GitHub Actions, ast-grep, semgrep and
      uv all read .yaml -- rename the file.
    severity: ERROR
