  # pip's vendored setuptools, listed in pip/_vendor/vendor.txt inside the python install.
  # pip vendors only setuptools' `pkg_resources`. The advisory is a path traversal in `setuptools.package_index`, which
  # pip does not ship, so the vulnerable code is not present at all; the version string is all that matches.
  - id: CVE-2025-47273
    purls:
      - "pkg:pypi/setuptools@70.3.0"
    statement: >-
      setuptools 70.3.0; fixed in 78.1.1.
    expired_at: 2027-01-01

  # Guava on the classpath of the Gradle and Maven distributions.
  # A memory-exhaustion denial of service, reachable only through the build files and dependency metadata the two tools
  # read: this repository's own pom.xml and Gradle scripts, and artifacts from Maven Central and the Gradle Plugin
  # Portal. Both pins are the newest releases the minimum release age admits, and Gradle 9.9.0 still bundles the same
  # Guava, so no bump clears it.
  - id: CVE-2026-102554
    paths:
      - "gradle/9.8.2/gradle-9.8.2/lib/guava-33.4.6-jre.jar"
      - "maven/3.10.0/apache-maven-3.10.0/lib/guava-33.7.1-jre.jar"
    statement: >-
      com.google.guava:guava 33.4.6-jre and com.google.guava:guava 33.7.1-jre; fixed in 33.7.2.
    expired_at: 2027-01-01

  # Dependencies of the AsyncAPI generator, which `gen:ws-md` drives through its library API.
  # Its only input is generated/specs/ws.yaml, which et-int-gen writes from this repository's own Rust types, and its
  # only template is the pinned markdown template installed beside it. jsonpath-plus therefore evaluates expressions
  # from that document alone, and simple-git, which the generator uses to fetch a template from a git URL, is never
  # called, since the template is a local path. 3.5.0 is the newest generator release, and it still depends on both.
  - id: CVE-2024-21534
