# Accepted vulnerabilities inside the mise-installed tools, the known findings the tools scan task tolerates.
#
# The scan this serves exists so that a newly published advisory against any installed tool fails the build. That
# only works while every finding already known has been reviewed and recorded here, so each entry is one advisory id,
# scoped to the install paths it was reviewed for, with the reason it is accepted and a date it lapses on.
#
# Paths are relative to the mise installs directory, which is the scan root, so each one starts with the tool's own
# install directory and its version. A bump of the tool therefore stops the entry matching, and the advisory is
# reported again if the new release still carries it. The wildcards stand only for what differs between platforms
# and machines, since `mise run check` scans on every OS: `{,.exe}` for the Windows suffix on a binary, `*` for the
# digest mise appends to an npm install's directory (`<version>~aube~<digest>`) and for the platform named in an
# unpacked archive's directory, and `**` for a layout that differs below the install directory. A finding that has no
# path, as the pip vendor list below does, is scoped by its package URL instead, which names the exact version.
#
# Every entry expires on the date the advisory ignores in config/deny.toml carry, and on that date stops suppressing
# anything, so the scan fails until the entry is dropped, fixed or re-dated alongside those.
---
vulnerabilities:
  # Go standard library and Go modules compiled into upstream release binaries.
  # Each tool here is at the newest release the seven-day minimum release age admits, and the fix needs its project to
  # rebuild with a newer Go toolchain or module; nothing in this repository can patch a prebuilt binary. Most of them
  # are linters and formatters that only read this repository's own files (gitleaks, actionlint, regal, kubeconform,
  # conftest, shfmt, goawk, jqfmt, editorconfig-checker, ls-lint, tsgolint), so an attacker would first need a commit
  # here. The rest reach only endpoints the operator chooses: kubectl, k3d and docker compose drive local clusters and
  # containers, crane publishes to GHCR, gh talks to GitHub, osv-scanner queries osv.dev, and otelcol receives the
  # local hosts' metrics. pyodide's distribution ships a Windows `python.exe` launcher built with Go 1.21, which
  # nothing runs: its install is kept off PATH, and the modules service only serves the files beside it.
  - id: CVE-2024-34156
    paths:
      - "http-pyodide/0.29.3/python.exe"
    statement: >-
      the Go standard library as compiled into each release binary; fixed in 1.22.7, 1.23.1, which none of these
      releases is built with yet.
    expired_at: 2027-01-01
