version = 1

# `pkg/` is deliberately NOT excluded from DeepSource analysis.
# It holds hand-written module loaders (e.g. the Pyodide shim et_ws_pydata1.js) alongside build output. Only the
# int-gen outputs under `generated/` and the scenario `verification/` fixtures are excluded, since those are fully
# generated; if genuinely-generated glue under `pkg/` turns up as a finding, add a narrow per-file exclude then.
exclude_patterns = ["generated/**", "verification/**"]

# Repo convention: tests live in a `tests/` directory or in source files prefixed `test_`.
test_patterns = ["**/test_*.py", "**/tests/**"]

# Dart is explicitly deactivated; its coverage comes from the mise pipeline's check:dart instead.
# DeepSource's Dart support is an AI-only analyzer (no classic static analysis), so with AI review off it
# auto-surfaces as a perpetually-skipped "DeepSource: Dart" check on every PR.
[[analyzers]]
enabled = false
name = "dart"

[[analyzers]]
enabled = true
name = "python"

[[analyzers]]
enabled = true
name = "javascript"

[analyzers.meta]
# The pkg/ loaders, browser modules, and ws-server `static/app.js` are ES modules with top-level import/export.
# DeepSource's JS analyzer is ESLint-based; without a module signal its parser reads these as scripts and emits
# spurious JS-0833 errors ("'import'/'export' may appear only with 'sourceType: module'"). This `module_system`
# meta alone does not stop it (the errors persisted with it set); the working signal is the root `package.json`
# "type": "module", which the analyzer honors to parse every `.js` as an ES module. The meta stays as the
# documented default and to carry the browser + nodejs globals.
environment = ["browser", "nodejs"]
module_system = "es-modules"

[[analyzers]]
enabled = true
name = "csharp"

[[analyzers]]
enabled = true
name = "docker"

[[analyzers]]
enabled = true
name = "cxx"
