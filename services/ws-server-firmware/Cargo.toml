[package]
name = "et-int-ws-server-firmware"
publish = false
description = "et-ws-server as firmware for the Raspberry Pi Pico 2 W and the ESP32-C6"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# `#[embassy_executor::main]` expands to `#[cortex_m_rt::entry]`, which cargo-shear's scan cannot see.
[package.metadata.cargo-shear]
ignored = ["cortex-m-rt"]

[[bin]]
bench = false
doctest = false
name = "et-ws-server-firmware"
path = "src/main.rs"
test = false

# The hub, its settings and the modules built in are the same wherever the binary is built for.
[dependencies]
chrono = { workspace = true, features = ["alloc"] }
edge-toolkit.workspace = true
et-ws-server = { workspace = true, features = ["picoserve-server"] }
et-ws-service = { workspace = true, features = ["picoserve-hub"] }
picoserve.workspace = true

# What every board shares once its radio is up: embassy's network stack, executor and clock, and the defmt log.
[target.'cfg(target_os = "none")'.dependencies]
defmt.workspace = true
embassy-executor = { workspace = true, features = ["defmt"] }
embassy-net = { workspace = true, features = ["defmt", "dhcpv4", "medium-ethernet", "proto-ipv4", "tcp"] }
embassy-time = { workspace = true, features = ["defmt"] }
picoserve = { workspace = true, features = ["embassy"] }
static_cell.workspace = true

# The Raspberry Pi Pico 2 W, bare-metal Arm: the RP2350 and its CYW43439 radio.
[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m-rt.workspace = true
cyw43 = { workspace = true, features = ["defmt"] }
cyw43-pio = { workspace = true, features = ["defmt"] }
defmt-rtt.workspace = true
embassy-executor = { workspace = true, features = ["executor-thread", "platform-cortex-m"] }
embassy-rp = { workspace = true, features = ["critical-section-impl", "defmt", "rp235xa", "time-driver"] }
embedded-alloc.workspace = true
panic-probe = { workspace = true, features = ["defmt"] }

# The ESP32-C6, bare-metal RISC-V: its own radio, and esp-rtos running embassy's executor and clock.
[target.'cfg(all(target_arch = "riscv32", target_os = "none"))'.dependencies]
esp-alloc = { workspace = true, features = ["defmt", "esp32c6"] }
esp-backtrace = { workspace = true, features = ["defmt", "esp32c6", "panic-handler"] }
esp-bootloader-esp-idf = { workspace = true, features = ["defmt", "esp32c6"] }
esp-hal = { workspace = true, features = ["defmt", "esp32c6", "unstable"] }
esp-println = { workspace = true, features = ["defmt-espflash", "esp32c6"] }
esp-radio = { workspace = true, features = ["defmt", "esp-alloc", "esp32c6", "wifi"] }
esp-rtos = { workspace = true, features = ["defmt", "embassy", "esp-alloc", "esp-radio", "esp32c6"] }

# Anywhere else, the host's: tokio, and a clock that knows the date.
[target.'cfg(not(target_os = "none"))'.dependencies]
chrono = { workspace = true, features = ["std"] }
picoserve = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
tungstenite.workspace = true

[build-dependencies]
et-firmware-modules.workspace = true
fs-err.workspace = true

[lints]
workspace = true
