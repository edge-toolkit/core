[package]
name = "et-ws-wasi-runner"
publish = true
description = "Native runner that fetches a ws-module WASI component from the server and executes it via wasmtime"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A dependency no source path names, which cargo-shear's scan therefore reads as unused.
# `ort` is never called, only depended on to hold the prerelease wasmtime-wasi-nn is built against.
[package.metadata.cargo-shear]
ignored = ["ort"]

[package.metadata.docs.rs]
features = ["docs"]

[lib]
doctest = false
path = "src/lib.rs"

[[bin]]
doctest = false
name = "et-ws-wasi-runner"
path = "src/main.rs"

[features]
#! Each standardised WASI interface hosted beyond `et:ws-wasi` and WASI Preview 2 is a feature, all on by default.
#! A guest that imports an interface the build left out fails to instantiate, naming the import.

default = ["nn", "webgpu"]
## Hosts `wasi:nn` (graph, tensor, inference) on ONNX Runtime through `wasmtime-wasi-nn`.
## Guests can then load an ONNX model and run inference on it.
nn = ["dep:ort", "dep:wasmtime-wasi-nn"]
## Hosts the full upstream `wasi:webgpu` interface through `wasi-webgpu-wasmtime`.
## A wgpu instance on every native backend gives guests real GPU compute and rendering.
webgpu = ["dep:wasi-webgpu-wasmtime", "dep:wgpu-core", "dep:wgpu-types"]
## Dispatches `wasi:nn` inference on `ExecutionTarget::Gpu` to ONNX Runtime's `CUDAExecutionProvider`.
## Without it such a request warns and falls back to the CPU. It enables wasmtime-wasi-nn's `onnx-cuda`, and
## through it `ort/cuda`, so `ort/download-binaries` pulls the CUDA-flavoured ONNX Runtime prebuilt -- which only
## exists for some host triples: Linux x86_64 reliably, while Linux aarch64 and macOS are not covered by Pyke's
## mirror at this version. wasmtime-wasi-nn knows no other GPU provider, so there is no CoreML equivalent on macOS.
cuda = ["nn", "wasmtime-wasi-nn/onnx-cuda"]
## Internal: compiles in the `/cov` preopen for the repo's coverage workflow.
## Mapped to `target/wasi-cov`, it is where instrumented WASI guests dump their minicov `.profraw`.
## `ET_TEST_COVERAGE` still gates the preopen at runtime.
coverage = ["et-ws-runner-common/coverage"]
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

[dependencies]
document-features = { workspace = true, optional = true }
edge-toolkit.workspace = true
et-otlp.workspace = true
et-rest-client = { workspace = true, features = ["tracing"] }
et-ws-runner-common.workspace = true
fs-err.workspace = true
futures-util.workspace = true
# libc::_exit for the macOS test-only fast exit (see main.rs).
# std::process::exit still runs atexit handlers, which is exactly the path that races libc++ during
# ORT teardown -- _exit skips them.
libc.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
tracing.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
# wasi-nn standardised ML inference.
# The workspace pin drops `openvino` + `winml` (which we don't use) and keeps `onnx`.
wasmtime-wasi-nn = { workspace = true, optional = true }
# Workspace pins `ort = "=2.0.0-rc.10"` because wasmtime-wasi-nn 48 is still built against it.
# That is a specific prerelease; rc.11+ moved
# `ort::session::{Input, Output}` and `ort::tensor`, and the cargo resolver
# would otherwise pick the latest rc.
ort = { workspace = true, optional = true }
# Upstream host impl of `wasi:webgpu@0.3.0-rc.2`, from the wasi-gfx project.
# It owns every resource and method in the interface; the runner supplies only the wgpu instance handle and
# the resource table it stores them in.
wasi-webgpu-wasmtime = { workspace = true, optional = true }
wgpu-core = { workspace = true, optional = true }
wgpu-types = { workspace = true, optional = true }

[dev-dependencies]
command-error.workspace = true
et-org.workspace = true
et-test-helpers.workspace = true
et-test-otlp.workspace = true
et-ws-test-server.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
retry.workspace = true
rstest.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
