[package]
name = "et-ws-wasi-runner"
publish = true
description = "Native runner that fetches a ws-module WASI component from the server and executes it via wasmtime"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A dependency no source path names, which cargo-shear's scan therefore reads as unused.
# `ort` is never called, only depended on to hold the prerelease wasmtime-wasi-nn is built against.
[package.metadata.cargo-shear]
ignored = ["ort"]

[package.metadata.docs.rs]
features = ["docs"]

[lib]
doctest = false
path = "src/lib.rs"

[[bin]]
doctest = false
name = "et-ws-wasi-runner"
path = "src/main.rs"
required-features = ["std"]

# The tests of the `std` runner, and of the board's, which compiles its guests as only a host can.
# `server_message_to_wit`, the test of the conversions a board shares, runs with `--no-default-features` as well.
# The board's test also needs `board` and `precompile`, which the crate's dev-dependency on itself turns on, so it
# runs whatever features the crate is otherwise built with.
[[test]]
name = "board"
required-features = ["board", "precompile", "std"]

[[test]]
name = "board_net"
required-features = ["board", "precompile", "std"]

[[test]]
name = "modules"
required-features = ["std"]

[[test]]
name = "o2_ingest_search"
required-features = ["std"]

[[test]]
name = "otel_propagation"
required-features = ["std"]

[[test]]
name = "vector_otlp_relay"
required-features = ["std"]

[[test]]
name = "ws_backend"
required-features = ["std"]

[features]
#! Each standardised WASI interface hosted beyond `et:ws-wasi` and WASI Preview 2 is a feature, all on by default.
#! A guest that imports an interface the build left out fails to instantiate, naming the import.

default = ["nn", "std", "webgpu"]
## The runner for a host with an operating system.
## It fetches a component from the hub, compiles it, and hosts WASI Preview 2 through `wasmtime-wasi`. Without it the
## crate is `no_std`: the message conversions, and with `board` the runner for a board.
std = [
  "chrono/std",
  "dep:et-otlp",
  "dep:et-rest-client",
  "dep:et-ws-runner-common",
  "dep:fs-err",
  "dep:futures-util",
  "dep:libc",
  "dep:reqwest",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:tracing",
  "dep:wasmtime-wasi",
  "edge-toolkit/std",
  "embedded-io-async?/std",
  "serde_json/std",
  "thiserror/std",
  "wasmtime/default",
]
## Compiles a component ahead of time for a board's engine, as a firmware's build script does.
## The board runs Pulley bytecode, so this compiles to it; a host runner, which runs native code, has no need of it.
precompile = ["wasmtime/cranelift", "wasmtime/pulley", "wasmtime/std"]
## The runner for a board with no operating system, `board::run`, which a firmware runs its guests on.
## It hosts a component compiled ahead of time on the clock, log and websocket the firmware provides, interpreting its
## Pulley bytecode, and keeps the board's storage buckets under a spin lock, since a board has no `std::sync::Mutex`.
## Its `board::net` reaches a hub on another machine over the board's own sockets.
board = ["dep:edge-ws", "dep:embassy-sync", "dep:embedded-io-async", "dep:spin", "wasmtime/pulley"]
## Hosts `wasi:nn` (graph, tensor, inference) on ONNX Runtime through `wasmtime-wasi-nn`.
## Guests can then load an ONNX model and run inference on it.
nn = ["dep:ort", "dep:wasmtime-wasi-nn", "std"]
## Hosts the full upstream `wasi:webgpu` interface through `wasi-webgpu-wasmtime`.
## A wgpu instance on every native backend gives guests real GPU compute and rendering.
webgpu = ["dep:wasi-webgpu-wasmtime", "dep:wgpu-core", "dep:wgpu-types", "std"]
## Dispatches `wasi:nn` inference on `ExecutionTarget::Gpu` to ONNX Runtime's `CUDAExecutionProvider`.
## Without it such a request warns and falls back to the CPU. It enables wasmtime-wasi-nn's `onnx-cuda`, and
## through it `ort/cuda`, so `ort/download-binaries` pulls the CUDA-flavoured ONNX Runtime prebuilt -- which only
## exists for some host triples: Linux x86_64 reliably, while Linux aarch64 and macOS are not covered by Pyke's
## mirror at this version. wasmtime-wasi-nn knows no other GPU provider, so there is no CoreML equivalent on macOS.
cuda = ["nn", "wasmtime-wasi-nn/onnx-cuda"]
## Internal: compiles in the `/cov` preopen for the repo's coverage workflow.
## Mapped to `target/wasi-cov`, it is where instrumented WASI guests dump their minicov `.profraw`.
## `ET_TEST_COVERAGE` still gates the preopen at runtime.
coverage = ["edge-toolkit/coverage", "et-ws-runner-common?/coverage", "std"]
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

# What a board's `no_std` runner needs as much as the host's: the engine, and the message types and their JSON.
[dependencies]
chrono = { workspace = true, features = ["alloc"] }
document-features = { workspace = true, optional = true }
edge-toolkit.workspace = true
# A board's websocket to a hub elsewhere: the frames, the bytes they cross a socket as, and the queues between them.
edge-ws = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["alloc"] }
serde_path_to_error.workspace = true
# The lock a board's guests share their buckets under, when there is no `std::sync::Mutex`.
spin = { workspace = true, optional = true }
thiserror.workspace = true
wasmtime.workspace = true
# The rest is the `std` runner's.
et-otlp = { workspace = true, optional = true }
et-rest-client = { workspace = true, features = ["tracing"], optional = true }
et-ws-runner-common = { workspace = true, optional = true }
fs-err = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"], optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-tungstenite = { workspace = true, features = ["connect"], optional = true }
tracing = { workspace = true, features = ["std"], optional = true }
wasmtime-wasi = { workspace = true, optional = true }
# wasi-nn standardised ML inference.
# The workspace pin drops `openvino` + `winml` (which we don't use) and keeps `onnx`.
wasmtime-wasi-nn = { workspace = true, optional = true }
# Workspace pins `ort = "=2.0.0-rc.10"` because wasmtime-wasi-nn 48 is still built against it.
# That is a specific prerelease; rc.11+ moved
# `ort::session::{Input, Output}` and `ort::tensor`, and the cargo resolver
# would otherwise pick the latest rc.
ort = { workspace = true, optional = true }
# Upstream host impl of `wasi:webgpu@0.3.0-rc.2`, from the wasi-gfx project.
# It owns every resource and method in the interface; the runner supplies only the wgpu instance handle and
# the resource table it stores them in.
wasi-webgpu-wasmtime = { workspace = true, optional = true }
wgpu-core = { workspace = true, optional = true }
wgpu-types = { workspace = true, optional = true }

# libc::_exit for the macOS test-only fast exit (see main.rs), the one platform that needs it.
# std::process::exit still runs atexit handlers, which is exactly the path that races libc++ during
# ORT teardown -- _exit skips them.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
command-error.workspace = true
critical-section = { workspace = true, features = ["std"] }
et-org.workspace = true
et-test-helpers.workspace = true
et-test-otlp.workspace = true
et-ws-test-server.workspace = true
et-ws-wasi-runner = { workspace = true, features = ["board", "precompile"] }
reqwest = { workspace = true, features = ["blocking"] }
retry.workspace = true
rstest.workspace = true
secrecy.workspace = true
serde_json = { workspace = true, features = ["std"] }
tempfile.workspace = true

[lints]
workspace = true
