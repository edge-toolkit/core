[package]
name = "et-ws-wasi-runner"
description = "Native runner that fetches a ws-module WASI component from the server and executes it via wasmtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false
name = "et_ws_wasi_runner"
path = "src/lib.rs"

[[bin]]
doctest = false
name = "et-ws-wasi-runner"
path = "src/main.rs"

[features]
default = []
# Enable wasmtime-wasi-nn's `onnx-cuda` feature, which flips the cfg in its
# ONNX backend so `ExecutionTarget::Gpu` dispatches to `CUDAExecutionProvider`
# instead of warning and falling back to CPU. `onnx-cuda` transitively turns
# on `ort/cuda` too, so the EP is compiled into ort. Opt-in because
# `ort/download-binaries` then pulls the CUDA-flavoured ONNX Runtime prebuilt,
# which only exists for some host triples (Linux x86_64 reliably; Linux
# aarch64 / macOS are not covered by Pyke's mirror at this version).
# Build on CUDA hosts with:
#     cargo build -p et-ws-wasi-runner --features cuda
cuda = ["wasmtime-wasi-nn/onnx-cuda"]

[dependencies]
async-trait.workspace = true
bytemuck.workspace = true
edge-toolkit.workspace = true
et-otlp.workspace = true
et-rest-client = { workspace = true, features = ["tracing"] }
et-ws-runner-common.workspace = true
futures-util.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
pollster.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde.workspace = true
serde-env.workspace = true
serde-inline-default.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
# wasi-nn standardised ML inference. The workspace pin drops `openvino` +
# `winml` (which we don't use) and keeps `onnx`.
wasmtime-wasi-nn.workspace = true
# Workspace pins `ort = "=2.0.0-rc.10"` because wasmtime-wasi-nn 44.0.1 was
# built against that specific prerelease; rc.11+ moved
# `ort::session::{Input, Output}` and `ort::tensor`, and the cargo resolver
# would otherwise pick the latest rc.
ort.workspace = true
wgpu.workspace = true

[dev-dependencies]
et-ws-test-server.workspace = true
otlp-mock.workspace = true
rstest.workspace = true

[lints]
workspace = true
