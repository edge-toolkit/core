[package]
name = "et-storage-service"
description = "E.T. anonymous S3-compatible service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
# See ws-server's openapi-spec feature for the rationale.
openapi-spec = ["dep:utoipa"]

[dependencies]
actix-files.workspace = true
actix-web.workspace = true
actix-web-thiserror.workspace = true
edge-toolkit.workspace = true
fs-err.workspace = true
futures-util.workspace = true
image.workspace = true
log.workspace = true
object_store.workspace = true
serde.workspace = true
serde-inline-default.workspace = true
serde_default.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
actix-rt.workspace = true
command-error.workspace = true
et-test-helpers.workspace = true
object_store.workspace = true
temp-env = { workspace = true, features = ["async_closure"] }
tempfile.workspace = true

[lints]
workspace = true
