[package]
name = "et-storage-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
# See ws-server's openapi-spec feature for the rationale.
openapi-spec = ["dep:utoipa"]

[dependencies]
actix-files = "0.6"
actix-web = "4"
actix-web-thiserror.workspace = true
edge-toolkit.workspace = true
futures-util = "0.3"
log.workspace = true
serde.workspace = true
serde-inline-default.workspace = true
serde_default.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tracing.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
actix-rt = "2"
tempfile.workspace = true

[lints]
workspace = true
