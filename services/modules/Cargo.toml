[package]
name = "et-modules-service"
publish = true
description = "Discovers ws-module packages on disk and serves their files statically"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
# See ws-server's openapi-spec feature for the rationale.
openapi-spec = ["dep:utoipa"]

[dependencies]
actix-files.workspace = true
actix-web.workspace = true
edge-toolkit.workspace = true
fs-err.workspace = true
serde.workspace = true
serde-inline-default.workspace = true
serde_default.workspace = true
serde_json.workspace = true
tracing.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
actix-rt.workspace = true
tempfile.workspace = true

[lints]
workspace = true
