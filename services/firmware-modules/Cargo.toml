[package]
name = "et-firmware-modules"
publish = true
description = "The source a firmware's build script writes to build ws-modules into its image"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
edge-toolkit = { workspace = true, features = ["std"] }
et-core-guest.workspace = true
et-ws-wasi-runner = { workspace = true, features = ["precompile"] }
fs-err.workspace = true
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
wasmparser.workspace = true

[dev-dependencies]
tempfile.workspace = true
wat.workspace = true

[lints]
workspace = true
