[package]
name = "et-ws-worker"
description = "Native agent that fetches a ws-module from the server and runs it via embedded V8"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "et_ws_worker"
path = "src/lib.rs"

[[bin]]
name = "et-ws-worker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
edge-toolkit.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyscript = { version = "0.12", features = ["web", "webgpu", "websocket", "webstorage"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
et-ws-test-server = { path = "../ws-test-server" }
rstest.workspace = true
