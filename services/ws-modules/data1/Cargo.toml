[package]
description = "data 1"
name = "et-ws-data1"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
edge-toolkit.workspace = true
et-web.workspace = true
et-ws-wasm-agent.workspace = true
# Browser WASM target — disable the `tracing` default feature so the
# opentelemetry deps the native pre-hook needs don't get pulled in.
et-rest-client.workspace = true
futures-util.workspace = true
js-sys.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-wasm.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlTextAreaElement", "Window", "console"] }

[dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
