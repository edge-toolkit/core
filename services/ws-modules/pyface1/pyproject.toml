[project]
dependencies = ["et-ws"]
description = "Python face detection"
license = "Apache-2.0 OR MIT"
name = "et-ws-pyface1"
requires-python = ">=3.10"
version = "0.1.0"

[dependency-groups]
# pytest-cov is a pytest plugin, so it must share pytest's environment.
# A separate mise `pipx:` tool would sit in an isolated venv pytest can't see; keeping it here puts both in one
# uv venv, so `uv run pytest --cov` works. The coverage workflow uses that to feed Python coverage to Codecov.
dev = ["pytest", "pytest-cov"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build==0.11.8"]

[tool.uv.build-backend]
module-name = "pyface1"
module-root = ""

# `et-ws` is the generated Pydantic client under `generated/python-ws/`.
# It is wired as a uv source so `uv run pytest` resolves it locally; the wheel itself is
# bundled separately into pkg/ by the `build-ws-pyface1-module` mise task
# (alongside the pyface1 wheel) so Pyodide can micropip-install it at runtime.
[tool.uv.sources]
et-ws = { path = "../../../generated/python-ws" }

[tool.ws-module.dependencies]
et-model-face1 = "*"
et-ws = "*"
onnxruntime-web = "*"
pyodide = "*"

[tool.pytest.ini_options]
pythonpath = ["."]
# Optional: helps with modern import resolution
addopts = ["--import-mode=importlib"]
