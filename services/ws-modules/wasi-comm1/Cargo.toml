[package]
name = "et-ws-wasi-comm1"
publish = true
description = "WASI Preview 2 port of comm1"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

# See wasi-data1/Cargo.toml for the rationale behind the wasi-only target scope.
# The lib body is gated identically.
[target.'cfg(target_os = "wasi")'.dependencies]
et-wasi-guest.workspace = true
serde_json.workspace = true

# Coverage instrumentation, off by default and enabled only by the coverage build.
# Forwards to the shared guest crate, which owns the minicov capture the instrumented guest dumps to the
# runner's /cov preopen at the end of run().
[features]
coverage = ["et-wasi-guest/coverage"]

[lints]
workspace = true
