[package]
name = "et-ws-wasi-comm1"
description = "WASI Preview 2 port of the comm1 module — list-agents + broadcast + direct message"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.57"

# Standalone workspace — see wasi-data1/Cargo.toml for the rationale.
[workspace]

[package.metadata.ws-module]
wasi-main = "et_ws_wasi_comm1.wasm"
