[package]
name = "et-ws-wasi-comm1"
publish = true
description = "WASI Preview 2 port of comm1"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "wasm32-wasip2"
features = ["docs"]

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

[features]
## Internal: builds the guest with `et-wasi-guest`'s coverage dump, for the repo's coverage workflow.
coverage = ["et-wasi-guest/coverage"]
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

# See wasi-data1/Cargo.toml for the rationale behind the wasi-only target scope.
# The lib body is gated identically.
[target.'cfg(target_os = "wasi")'.dependencies]
document-features = { workspace = true, optional = true }
et-wasi-guest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
