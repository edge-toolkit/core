[package]
name = "et-ws-wasi-comm1"
description = "WASI Preview 2 port of the comm1 module — list-agents + broadcast + direct message"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

# See wasi-data1/Cargo.toml for the rationale behind the wasi-only target
# scope; the lib body is gated identically.
[target.'cfg(target_os = "wasi")'.dependencies]
serde_json.workspace = true
wit-bindgen.workspace = true

# Build script (runs on the host) locates the repo root to emit ET_WIT_DIR.
[build-dependencies]
et-path.workspace = true

[lints]
workspace = true
