[package]
description = "math 1"
name = "et-ws-math1"
publish = true
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# `#[wasm_bindgen] pub async fn run` expands to `wasm_bindgen_futures` paths, which cargo-shear's scan cannot see.
[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
et-rest-client.workspace = true
et-web.workspace = true
et-ws-wasm-agent.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
tracing-wasm.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "console"] }

[lints]
workspace = true
