[package]
name = "et-ws-pyo3-split-learning-mit"
description = "Edge-toolkit agent that hosts the MIT split-learning-demo server-side model via PyO3 (PyTorch in-process)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "et_ws_pyo3_split_learning_mit"
path = "src/lib.rs"

[[bin]]
name = "et-ws-pyo3-split-learning-mit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
edge-toolkit.workspace = true
futures-util = "0.3"
# PyO3 with `auto-initialize` so we spin up the embedded CPython interpreter
# on first `Python::with_gil`. Need 0.24+ for Python 3.14 — the
# split-learning-demo's conda env can land us on 3.14 (where the legacy
# TorchScript ONNX exporter still works while the dynamo path doesn't).
pyo3 = { version = "0.28", features = ["auto-initialize"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rstest.workspace = true
