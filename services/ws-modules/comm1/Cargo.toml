[package]
description = "comm 1"
name = "et-ws-comm1"
publish = true
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# `#[wasm_bindgen] pub async fn run` expands to `wasm_bindgen_futures` paths, which cargo-shear's scan cannot see.
[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
edge-toolkit.workspace = true
et-web.workspace = true
et-ws-wasm-agent.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-wasm.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "console"] }

[lints]
workspace = true
