[package]
name = "et-ws-core-math1"
publish = true
description = "math1 twin as a Wasm 1.0 core module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "wasm32v1-none"

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

# Scoped to the Wasm 1.0 target the guest builds for, as its lib body is.
# A host `cargo check --workspace` then builds an empty cdylib.
[target.'cfg(all(target_arch = "wasm32", target_os = "none"))'.dependencies]
edge-toolkit.workspace = true
et-core-guest.workspace = true
et-math1.workspace = true
serde_json = { workspace = true, features = ["alloc"] }

[lints]
workspace = true
