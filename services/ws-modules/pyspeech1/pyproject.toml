[project]
dependencies = ["edge-toolkit", "et-org", "et-ws"]
description = "Python microphone speech detection"
license = "Apache-2.0 OR MIT"
name = "et-ws-pyspeech1"
requires-python = ">=3.10"
version = "0.1.0"

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build==0.11.8"]

[tool.uv.build-backend]
module-name = "pyspeech1"
module-root = ""

[tool.uv.sources]
edge-toolkit = { workspace = true }
et-org = { workspace = true }
et-ws = { workspace = true }

[tool.ws-module.dependencies]
edge-toolkit = "*"
et-model-speech1 = "*"
et-org = "*"
et-ws = "*"
et-ws-server-static = "*"
onnxruntime-web = "*"
pyodide = "*"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
