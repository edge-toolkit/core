[project]
# `et-rest-client` is the generated REST client wheel; the build task copies
# it into pkg/ alongside this module's own wheel, and the browser-side JS
# shim sys.path-injects both (et-rest-client is deliberately unpublished,
# so micropip can't resolve it). `pyodide-http` is on PyPI and the shim
# micropip-installs it so httpx dispatches through the browser's fetch().
dependencies = ["et-rest-client", "pyodide-http"]
description = "Python data 1"
license = "Apache-2.0 OR MIT"
name = "et-ws-pydata1"
requires-python = ">=3.10"
version = "0.1.0"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.10.2,<0.11.0"]

[tool.uv.build-backend]
module-name = "pydata1"
module-root = ""

# `et-rest-client` isn't published, so `uv sync` would fail to resolve it
# from PyPI. Point uv at the generated client directory — same pattern as
# pyface1 with `et-ws`. At browser runtime, the JS shim still installs the
# pre-built wheel from pkg/ (built by `build-et-rest-client-wheel`).
[tool.uv.sources]
et-rest-client = { path = "../../../generated/python-rest" }
