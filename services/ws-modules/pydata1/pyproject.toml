[project]
dependencies = ["et-rest-client", "pyodide-http"]
description = "Python data 1"
license = "Apache-2.0 OR MIT"
name = "et-ws-pydata1"
requires-python = ">=3.10"
version = "0.1.0"

[build-system]
build-backend = "uv_build"
requires = ["uv_build==0.11.8"]

[tool.uv.build-backend]
module-name = "pydata1"
module-root = ""

# `et-rest-client` isn't published, so `uv sync` would fail to resolve it
# from PyPI. Point uv at the generated client directory — same pattern as
# pyface1 with `et-ws`. At browser runtime the wheel is served from
# /modules/et-rest-client/ (declared in [tool.ws-module.dependencies]).
[tool.uv.sources]
et-rest-client = { path = "../../../generated/python-rest" }

# Browser-side module dependencies: each entry resolves to a sibling
# /modules/<name>/ mount (other ws-modules in services/ws-modules/ plus
# the generated et-rest-client at generated/python-rest/).
[tool.ws-module.dependencies]
et-rest-client = "*"
pyodide = "*"
