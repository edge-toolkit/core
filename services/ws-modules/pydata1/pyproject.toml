[project]
# `et-rest-client` is the generated REST client wheel; the build task copies
# it into pkg/ alongside this module's own wheel, and the browser-side JS
# shim sys.path-injects both (et-rest-client is deliberately unpublished,
# so micropip can't resolve it). `pyodide-http` is on PyPI and the shim
# micropip-installs it so httpx dispatches through the browser's fetch().
dependencies = ["et-rest-client", "pyodide-http"]
description = "Python data 1"
license = "Apache-2.0 OR MIT"
name = "et-ws-pydata1"
requires-python = ">=3.10"
version = "0.1.0"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.10.2,<0.11.0"]

[tool.uv.build-backend]
module-name = "pydata1"
module-root = ""
