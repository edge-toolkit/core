[package]
name = "et-ws-wasi-math1-sender"
publish = true
description = "WASI Preview 2 math1 trigger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

[target.'cfg(target_os = "wasi")'.dependencies]
et-wasi-guest.workspace = true

[features]
coverage = ["et-wasi-guest/coverage"]

# Build script (runs on the host) emits ET_MATH1_INPUT_PATH for the embedded canonical input.
[build-dependencies]
et-path.workspace = true

[lints]
workspace = true
