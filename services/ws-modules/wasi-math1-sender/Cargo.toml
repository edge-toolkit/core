[package]
name = "et-ws-wasi-math1-sender"
publish = true
description = "WASI Preview 2 math1 trigger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "wasm32-wasip2"
features = ["docs"]

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

[features]
## Internal: builds the guest with `et-wasi-guest`'s coverage dump, for the repo's coverage workflow.
coverage = ["et-wasi-guest/coverage"]
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

[target.'cfg(target_os = "wasi")'.dependencies]
document-features = { workspace = true, optional = true }
et-wasi-guest.workspace = true

# Build script (runs on the host) emits ET_MATH1_INPUT_PATH for the embedded canonical input.
[build-dependencies]
et-path.workspace = true

[lints]
workspace = true
