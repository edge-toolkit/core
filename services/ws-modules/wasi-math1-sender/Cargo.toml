[package]
name = "et-ws-wasi-math1-sender"
publish = true
description = "WASI Preview 2 math1 trigger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

# See wasi-data1/Cargo.toml for the rationale behind the wasi-only target scope.
# The lib body is gated identically.
#
# No `coverage` feature, unlike the other WASI guests. Those carry a kernel worth measuring; this one uploads a
# constant and loops on send, so an instrumented build would report the coverage of the twin it triggers, not of
# anything here.
[target.'cfg(target_os = "wasi")'.dependencies]
et-wasi-guest.workspace = true
serde_json.workspace = true

# Build script (runs on the host) emits ET_MATH1_INPUT_PATH for the embedded canonical input.
[build-dependencies]
et-path.workspace = true

[lints]
workspace = true
