[package]
description = "device sensor stream"
name = "et-ws-sensor1"
publish = true
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# `#[wasm_bindgen] pub async fn run` expands to `wasm_bindgen_futures` paths, which cargo-shear's scan cannot see.
[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"]

[package.metadata.release]
release = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
et-web.workspace = true
et-ws-wasm-agent.workspace = true
js-sys.workspace = true
tracing.workspace = true
tracing-wasm.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Event", "EventTarget", "Navigator", "Window", "console"] }

[lints]
workspace = true
