[package]
name = "et-ws-wasi-data1"
description = "WASI Preview 2 port of the data1 module — keyvalue store roundtrip"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.57"

# This module produces a WASI Preview 2 component and depends on
# wit-bindgen-generated extern symbols that don't exist on the host target.
# Keep it out of the parent workspace so `cargo check --workspace` at the
# repo root skips it entirely; the dedicated mise task drives `cargo build
# --target wasm32-wasip2` from inside this directory.
[workspace]

[package.metadata.ws-module]
wasi-main = "et_ws_wasi_data1.wasm"
