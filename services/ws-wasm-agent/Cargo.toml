[package]
name = "et-ws-wasm-agent"
publish = true
description = "WebSocket agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
chrono.workspace = true
edge-toolkit.workspace = true
et-web.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-wasm.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "BinaryType",
  "Document",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "MessageEvent",
  "Navigator",
  "Storage",
  "WebSocket",
  "Window",
  "console",
] }

[dev-dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen-test.workspace = true

# Coverage instrumentation, off by default and enabled only by the `wasm-agent-cov` mise task's test build.
# Forwards to et-web/coverage, which links minicov's profiler runtime (`__llvm_profile_runtime`) that the
# instrumented workspace crates reference -- the same mechanism the browser ws-modules use for coverage.
[features]
coverage = ["et-web/coverage"]

[lints]
workspace = true
