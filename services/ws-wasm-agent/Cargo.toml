[package]
name = "et-ws-wasm-agent"
publish = true
description = "WebSocket agent"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
features = ["docs"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
## Internal: links minicov's profiler runtime (`__llvm_profile_runtime`) through `et-web/coverage`.
## Only the coverage-instrumented test build of the repo's `wasm-agent-cov` task enables it.
coverage = ["et-web/coverage"]
## Internal: renders this feature list into the crate documentation, as docs.rs builds it.
docs = ["dep:document-features"]

[dependencies]
chrono.workspace = true
document-features = { workspace = true, optional = true }
edge-toolkit.workspace = true
et-web.workspace = true
js-sys.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-wasm.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "BinaryType",
  "Document",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "MessageEvent",
  "Navigator",
  "Storage",
  "WebSocket",
  "Window",
  "console",
] }

[dev-dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen-test.workspace = true

[lints]
workspace = true
