[package]
name = "et-websockify-service"
publish = true
description = "WebSocket-to-TCP relay, so a browser runtime can reach a loopback TCP port"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
actix-web.workspace = true
actix-ws.workspace = true
bytes = { workspace = true, features = ["std"] }
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
actix-web.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
