[package]
name = "et-ws-web-runner"
description = "Runner that fetches a ws-module from the server and executes its JS via embedded Deno"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = false
path = "src/lib.rs"

[[bin]]
doctest = false
name = "et-ws-web-runner"
path = "src/main.rs"

[dependencies]
deno_core.workspace = true
deno_error.workspace = true
deno_resolver.workspace = true
deno_runtime.workspace = true
edge-toolkit.workspace = true
et-rest-client = { workspace = true, features = ["tracing"] }
et-ws-runner-common.workspace = true
futures-util.workspace = true
# Direct dep so we can configure the REST client's reqwest retry policy: the
# default `ProtocolNacks` policy doesn't cover the HTTP/1 keep-alive race (see
# lib.rs `build_rest_client`). Features match et-rest-client's native build.
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"] }
serde.workspace = true
serde-env.workspace = true
sys_traits.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# deno_io (pulled via deno_runtime) declares `winapi` without its `std` feature,
# so winapi defines its own `c_void` and its `HANDLE` stops matching std's
# `RawHandle`, breaking the `from_raw_handle(GetStdHandle(..))` path on Windows
# (a missing-winapi-feature bug, cf. denoland/deno#24212). Depend on winapi with
# `std` here so cargo feature unification turns it on for the shared winapi.
[target.'cfg(windows)'.dependencies]
winapi.workspace = true

[dev-dependencies]
et-ws-test-server.workspace = true
rstest.workspace = true

[lints]
workspace = true
