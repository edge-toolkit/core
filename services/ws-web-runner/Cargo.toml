[package]
name = "et-ws-web-runner"
description = "Runner that fetches a ws-module from the server and executes its JS via embedded Deno"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = false
name = "et_ws_web_runner"
path = "src/lib.rs"

[[bin]]
doctest = false
name = "et-ws-web-runner"
path = "src/main.rs"

[dependencies]
deno_core.workspace = true
deno_error.workspace = true
deno_resolver.workspace = true
deno_runtime.workspace = true
edge-toolkit.workspace = true
et-rest-client = { workspace = true, features = ["tracing"] }
et-ws-runner-common.workspace = true
futures-util.workspace = true
serde.workspace = true
serde-env.workspace = true
sys_traits.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
et-ws-test-server.workspace = true
rstest.workspace = true

[lints]
workspace = true
