[package]
name = "et-ws-web-runner"
publish = true
description = "Runner that fetches a ws-module from the server and executes its JS via embedded Deno"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = false
path = "src/lib.rs"

[[bin]]
doctest = false
name = "et-ws-web-runner"
path = "src/main.rs"

[dependencies]
deno_core.workspace = true
deno_error.workspace = true
deno_resolver.workspace = true
deno_runtime.workspace = true
edge-toolkit.workspace = true
et-rest-client = { workspace = true, features = ["tracing"] }
et-ws-runner-common.workspace = true
futures-util.workspace = true
# Direct dep so we can configure the REST client's reqwest retry policy.
# The default `ProtocolNacks` policy doesn't cover the HTTP/1 keep-alive race (see
# lib.rs `build_rest_client`). Features match et-rest-client's native build.
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"] }
serde.workspace = true
serde-env.workspace = true
sys_traits.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Depend on winapi with `std` here so cargo feature unification turns it on for the shared winapi.
# deno_io (pulled via deno_runtime) declares `winapi` without its `std` feature,
# so winapi defines its own `c_void` and its `HANDLE` stops matching std's
# `RawHandle`, breaking the `from_raw_handle(GetStdHandle(..))` path on Windows
# (a missing-winapi-feature bug, cf. denoland/deno#24212).
[target.'cfg(windows)'.dependencies]
winapi.workspace = true

[build-dependencies]
# Compiles mingw-shim/ for the x86_64-pc-windows-gnu build (see build.rs).
# Used only in build.rs's `#[cfg(windows)]` branch, so these go unreferenced on non-Windows hosts -- harmless,
# since that branch (and the functions it calls) don't compile there, which also keeps them out of the Linux
# coverage report.
cc.workspace = true
command-error.workspace = true
fs-err.workspace = true

[dev-dependencies]
et-ws-test-server.workspace = true
fs-err.workspace = true
rstest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

# `coverage` (off by default): compiles the browser-module coverage-capture code into the runner.
# It adds the pycov + ws-agent-id shims, the __ET_TEST_COVERAGE prelude, and the wrapper's __et_capture_coverage
# PUT. Only the coverage workflow builds with it (and sets ET_TEST_COVERAGE, which still gates capture at runtime);
# every other build omits the code entirely. See the collect side in tests/modules.rs.
[features]
coverage = []

[lints]
workspace = true
