[package]
name = "et-ws-test-server"
publish = true
description = "In-process ws-server for integration tests"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[[bench]]
harness = false
name = "hub"

[dependencies]
actix-rt.workspace = true
# A hub can listen over HTTPS through the same rustls listener et-ws-server serves its secure port on.
actix-web = { workspace = true, features = ["rustls-0_23"] }
edge-toolkit = { workspace = true, features = ["std"] }
et-https-listener = { workspace = true, features = ["tls-self-signed"] }
et-modules-service = { workspace = true, features = ["std"] }
et-storage-service = { workspace = true, features = ["std"] }
# Encodes what the simulated COIN-D6 sends.
et-lidar.workspace = true
et-test-helpers.workspace = true
et-ws-service = { workspace = true, features = ["nats", "otel"] }
fs-err.workspace = true
futures-util.workspace = true
rustls.workspace = true
serde_json = { workspace = true, features = ["std"] }
tempfile.workspace = true
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
# Same TracingLogger setup as the real ws-server.
# So tests that init OTLP in-process see server-side spans parented on the propagated traceparent.
tracing-actix-web = { workspace = true, features = ["opentelemetry_0_32"] }

[dev-dependencies]
core_affinity.workspace = true
cpu-time.workspace = true
criterion.workspace = true
et-otlp.workspace = true
et-test-nats.workspace = true
et-test-otlp.workspace = true
et-ws-runner-common.workspace = true
reqwest.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
