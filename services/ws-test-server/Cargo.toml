[package]
name = "et-ws-test-server"
publish = true
description = "In-process ws-server for integration tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
actix.workspace = true
actix-rt.workspace = true
actix-web.workspace = true
edge-toolkit.workspace = true
et-modules-service.workspace = true
et-storage-service.workspace = true
et-test-helpers.workspace = true
et-ws-service.workspace = true
fs-err.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
# Same TracingLogger setup as the real ws-server.
# So tests that init OTLP in-process see server-side spans parented on the propagated traceparent.
tracing-actix-web.workspace = true

[dev-dependencies]
et-otlp.workspace = true
et-test-otlp.workspace = true
retry.workspace = true

[lints]
workspace = true
