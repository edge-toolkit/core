[package]
name = "et-ws-test-server"
description = "In-process ws-server for integration tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
actix.workspace = true
actix-rt.workspace = true
actix-web.workspace = true
et-modules-service.workspace = true
et-storage-service.workspace = true
et-ws-service.workspace = true
tempfile.workspace = true
# Same TracingLogger setup as the real ws-server, so tests that init OTLP
# in-process see server-side spans parented on the propagated traceparent.
tracing-actix-web.workspace = true

[dev-dependencies]
edge-toolkit.workspace = true
futures-util = "0.3"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[lints]
workspace = true
