# Hold back registry crate versions younger than a week.
# A malicious or broken release is usually yanked within that window, before the resolver can pick it. Versions
# already in Cargo.lock are kept. For an urgent bump, such as a security fix, run
# `CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate> --precise <version>`.
[registry]
global-min-publish-age = "7 days"
