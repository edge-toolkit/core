asyncapi: 3.0.0
channels:
  ws:
    address: /ws
components:
  messages:
    et-agent-message:
      contentType: application/json
      name: et-agent-message
      payload:
        properties:
          from_agent_id:
            type: string
          message:
            description: Arbitrary JSON value (opaque to the protocol)
          message_id:
            type: string
          scope:
            $ref: "#/components/schemas/MessageScope"
          server_received_at:
            type: string
          type:
            const: et-agent-message
            type: string
        required:
          - type
          - message_id
          - from_agent_id
          - scope
          - server_received_at
          - message
        title: WsAgentMessage
        type: object
      title: et-agent-message
    et-alive:
      contentType: application/json
      name: et-alive
      payload:
        $schema: https://json-schema.org/draft/2020-12/schema
        description: |-
          Messages a client is allowed to SEND to the server.

          Split from [`ServerMessage`] so the type system rejects client code
          constructing a `ConnectAck`, and so the server's inbound match arms
          can be exhaustive without an "unexpected server-originated message"
          trap.
        oneOf:
          - properties:
              agent_id:
                type:
                  - string
                  - "null"
              type:
                const: et-connect
                type: string
            required:
              - type
            title: WsConnect
            type: object
          - properties:
              timestamp:
                type: string
              type:
                const: et-alive
                type: string
            required:
              - type
              - timestamp
            title: WsAlive
            type: object
          - properties:
              type:
                const: et-list-agents
                type: string
            required:
              - type
            title: WsListAgents
            type: object
          - properties:
              message:
                description: Arbitrary JSON value (opaque to the protocol)
              to_agent_id:
                type: string
              type:
                const: et-send-agent-message
                type: string
            required:
              - type
              - to_agent_id
              - message
            title: WsSendAgentMessage
            type: object
          - properties:
              message:
                description: Arbitrary JSON value (opaque to the protocol)
              type:
                const: et-broadcast-message
                type: string
            required:
              - type
              - message
            title: WsBroadcastMessage
            type: object
          - properties:
              message_id:
                type: string
              type:
                const: et-message-ack
                type: string
            required:
              - type
              - message_id
            title: WsMessageAck
            type: object
          - properties:
              action:
                type: string
              capability:
                type: string
              details:
                description: Arbitrary JSON value (opaque to the protocol)
              type:
                const: et-client-event
                type: string
            required:
              - type
              - capability
              - action
              - details
            title: WsClientEvent
            type: object
          - properties:
              content:
                type: string
              type:
                const: et-relay-text
                type: string
            required:
              - type
              - content
            title: WsClientRelayText
            type: object
          - properties:
              content:
                description: Byte array (uint8)
                items:
                  format: uint8
                  maximum: 255
                  minimum: 0
                  type: integer
                type: array
              type:
                const: et-relay-binary
                type: string
            required:
              - type
              - content
            title: WsClientRelayBinary
            type: object
        title: ClientMessage
      title: et-alive
