# Early-init mise settings (read before the regular config, so they can affect
# which config files load). auto_env turns on platform environments: mise then
# loads .mise/config.<platform>.toml automatically for the current OS -- so
# config.windows.toml loads on Windows and config.macos.toml on macOS, with no
# manual MISE_ENV. It's harmless elsewhere (there's no config.linux.toml etc.),
# and setting it here also silences mise's 2026.12 "auto_env is becoming default"
# rollout warning. See https://mise.jdx.dev/configuration/environments.html
auto_env = true
