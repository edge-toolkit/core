# The `group_imports` option set below is only available in "nightly".
# https://rust-lang.github.io/rustfmt/?version=v1.5.1&search=#group_imports is
# only available in "nightly"

edition = "2021"
error_on_line_overflow = true
group_imports = "StdExternalCrate"
# Refer to int-gen bindings.rs for details.
ignore = ["services/ws-wasi-runner/src/bindings.rs"]
max_width = 120
