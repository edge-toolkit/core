cluster_name: "wasi-math1"
deployment_type: "mise"

# The `local` tree's scenario of the same name, rendered against released artifacts rather than built ones.
artifact_source: "published"

agents:
  - name: "math1-trigger"
    runner: "wasi"
    resources:
      - type: "wasi-math1-sender"

  - name: "wasi-math1-twin"
    runner: "wasi"
    resources:
      - type: "wasi-math1"
