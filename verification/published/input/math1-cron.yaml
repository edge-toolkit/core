cluster_name: "math1-cron"
deployment_type: "process-compose"

# The `local` tree's scenario of the same name, rendered against released artifacts rather than built ones.
artifact_source: "published"

agents:
  - name: "math1-twin"
    runner: "web"
    resources:
      - type: "math1"

  - name: "math1-trigger"
    runner: "web"
    schedule:
      cron: "* * * * *"
      time_zone: "UTC"
    resources:
      - type: "math1-sender"
