services:
  openobserve:
    image: openobserve/openobserve:v0.91.5
    healthcheck:
      test:
        - CMD
        - /openobserve
        - node
        - status
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - 127.0.0.1:5080:5080
    env_file:
      - secrets.env
    environment:
      RUST_LOG: warn
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data
  ws-server:
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    env_file:
      - secrets.env
    build:
      context: ../../../..
      dockerfile: verification/published/output/math1/Dockerfile
      additional_contexts:
        hub: docker-image://ghcr.io/edge-toolkit/core/et-ws-server:latest
    network_mode: host
    environment:
      MODULES_PATHS: "/app/services/ws-wasm-agent,
        /app/services/ws-modules/math1,
        /app/services/ws-modules/math1-sender"
      MODULES_ROOT: ""
      OTLP_AUTH_USERNAME: root@example.com
      OTLP_COLLECTOR_URL: http://127.0.0.1:5080/api/default/v1
      STORAGE_URL: file:///app/storage
    volumes:
      - ws-server-storage:/app/storage
    depends_on:
      openobserve:
        condition: service_healthy
  math1-twin:
    image: ghcr.io/edge-toolkit/core/et-ws-web-runner:latest
    network_mode: host
    environment:
      RUNNER_MODULE: "@edge-toolkit/et-ws-math1"
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
  math1-trigger:
    image: ghcr.io/edge-toolkit/core/et-ws-web-runner:latest
    network_mode: host
    environment:
      RUNNER_MODULE: "@edge-toolkit/et-ws-math1-sender"
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
volumes:
  openobserve-data: {}
  ws-server-storage: {}
