services:
  openobserve:
    image: openobserve/openobserve:v0.91.5
    healthcheck:
      test:
        - CMD
        - /openobserve
        - node
        - status
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - 127.0.0.1:5080:5080
    env_file:
      - ../../../../config/o2.env
      - secrets.env
    environment:
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data
  ws-server-hub:
    build:
      context: ../../../..
      dockerfile: services/ws-server/Dockerfile
    scale: 0
  ws-server:
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    env_file:
      - secrets.env
    build:
      context: ../../../..
      dockerfile: verification/local/output/vessel-fl-demo/Dockerfile
      additional_contexts:
        hub: service:ws-server-hub
    network_mode: host
    environment:
      MODULES_PATHS: "/app/services/ws-server/static,\
        /app/services/ws-wasm-agent,\
        /app/services/ws-modules/pyo3-mlflow,\
        /app/services/ws-modules/pyo3-vessel-fl-demo,\
        /app/services/ws-modules/vessel-fl-client,\
        /app/services/ws-modules/vessel-fl-coordinator,\
        /app/services/ws-modules/vessel-fl-mlflow"
      OTLP_COLLECTOR_URL: http://127.0.0.1:5080/api/default/v1
      STORAGE_URL: file:///app/storage
    volumes:
      - ws-server-storage:/app/storage
    depends_on:
      openobserve:
        condition: service_healthy
  vessel-1:
    build:
      context: ../../../..
      dockerfile: services/ws-pyo3-runner/Dockerfile
    network_mode: host
    environment:
      PYO3_AGENT_ID: vessel-1
      PYO3_PYTHONPATH: services/ws-modules/pyo3-vessel-fl-demo/.python-packages
      VESSEL_FL_CLIENT_ID: vessel_1
      VESSEL_FL_ROLE: client
      RUNNER_MODULE: et-ws-pyo3-vessel-fl-demo
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
  vessel-2:
    build:
      context: ../../../..
      dockerfile: services/ws-pyo3-runner/Dockerfile
    network_mode: host
    environment:
      PYO3_AGENT_ID: vessel-2
      PYO3_PYTHONPATH: services/ws-modules/pyo3-vessel-fl-demo/.python-packages
      VESSEL_FL_CLIENT_ID: vessel_2
      VESSEL_FL_ROLE: client
      RUNNER_MODULE: et-ws-pyo3-vessel-fl-demo
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
  vessel-3:
    build:
      context: ../../../..
      dockerfile: services/ws-pyo3-runner/Dockerfile
    network_mode: host
    environment:
      PYO3_AGENT_ID: vessel-3
      PYO3_PYTHONPATH: services/ws-modules/pyo3-vessel-fl-demo/.python-packages
      VESSEL_FL_CLIENT_ID: vessel_3
      VESSEL_FL_ROLE: client
      RUNNER_MODULE: et-ws-pyo3-vessel-fl-demo
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
  vessel-coordinator-native:
    build:
      context: ../../../..
      dockerfile: services/ws-pyo3-runner/Dockerfile
    network_mode: host
    environment:
      PYO3_AGENT_ID: vessel-coordinator
      PYO3_PYTHONPATH: services/ws-modules/pyo3-vessel-fl-demo/.python-packages
      VESSEL_FL_CLIENTS: vessel_1,vessel_2,vessel_3
      VESSEL_FL_ROLE: coordinator
      RUNNER_MODULE: et-ws-pyo3-vessel-fl-demo
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
  vessel-mlflow-bridge:
    build:
      context: ../../../..
      dockerfile: services/ws-pyo3-runner/Dockerfile
    network_mode: host
    environment:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      PYO3_AGENT_ID: vessel-mlflow
      PYO3_PYTHONPATH: services/ws-modules/pyo3-vessel-fl-demo/.python-packages
      RUNNER_MODULE: et-ws-pyo3-mlflow
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
volumes:
  openobserve-data: {}
  ws-server-storage: {}
