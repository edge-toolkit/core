[tasks.firmware-build]
description = "Build the Pimoroni Pico Plus 2 W firmware serving core-math1"
dir = "../../../.."
run = """
MODULES_PATHS="$PWD/modules/core/core-math1, $PWD/modules/wasi/wasi-math1-sender, $PWD/services/ws-server/static"
MODULES_PATHS="$MODULES_PATHS, $PWD/services/ws-wasm-agent"
export MODULES_PATHS
mise -E rust run build-firmware-pico-plus2w
"""

[tasks.firmware-build.env]
MODULES_ELSEWHERE = "onnxruntime-web, stats-gl"
MODULES_ELSEWHERE_URL = "https://cdn.jsdelivr.net/npm"
MODULES_ROOT = "@edge-toolkit/et-ws-server-static"
RUNNER_GUESTS = "math1-trigger=@edge-toolkit/et-ws-wasi-math1-sender, core-math1-twin=@edge-toolkit/et-ws-core-math1"

[tasks.firmware-flash]
depends = ["firmware-build"]
description = "Load the Pimoroni Pico Plus 2 W firmware onto the board, and start it"
dir = "../../../.."
run = "picotool load -x -t elf target/thumbv8m.main-none-eabihf/release/et-ws-server-firmware"

[tasks.firmware-host-test]
description = "Serve core-math1's modules from this host as the board would, and fetch each"
dir = "../../../.."
run = """
MODULES_PATHS="$PWD/modules/core/core-math1, $PWD/modules/wasi/wasi-math1-sender, $PWD/services/ws-server/static"
MODULES_PATHS="$MODULES_PATHS, $PWD/services/ws-wasm-agent"
export MODULES_PATHS
mise run cargo-test-pkg et-int-ws-server-firmware
"""

[tasks.firmware-host-test.env]
MODULES_ELSEWHERE = "onnxruntime-web, stats-gl"
MODULES_ELSEWHERE_URL = "https://cdn.jsdelivr.net/npm"
MODULES_ROOT = "@edge-toolkit/et-ws-server-static"
RUNNER_GUESTS = "math1-trigger=@edge-toolkit/et-ws-wasi-math1-sender, core-math1-twin=@edge-toolkit/et-ws-core-math1"
