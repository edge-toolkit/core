[env]
OTLP_AUTH_USERNAME = "root@example.com"

[env._]
file = "secrets.env"

[tasks.core-math1-twin]
description = "Run @edge-toolkit/et-ws-core-math1 in the wasi runner"
dir = "../../../.."
run = """
cargo run --quiet -p et-ws-wasi-runner
"""

[tasks.core-math1-twin.env]
RUNNER_MODULE = "@edge-toolkit/et-ws-core-math1"
WS_SERVER_URL = "ws://localhost:8080/ws"

[tasks.generated-scenario]
depends = ["core-math1-twin", "math1-trigger", "openobserve", "ws-server"]
description = "Run generated scenario for core-math1"

[tasks.math1-trigger]
description = "Run @edge-toolkit/et-ws-wasi-math1-sender in the wasi runner"
dir = "../../../.."
run = """
cargo run --quiet -p et-ws-wasi-runner
"""

[tasks.math1-trigger.env]
RUNNER_MODULE = "@edge-toolkit/et-ws-wasi-math1-sender"
WS_SERVER_URL = "ws://localhost:8080/ws"

[tasks.open-o2]
description = "Open the OpenObserve UI"
run = "open http://localhost:5080/"

[tasks.openobserve]
alias = "o2"
run = """
image=openobserve/openobserve:v1.1.2
container=openobserve-core-math1
settings="-e RUST_LOG=warn -e ZO_ROOT_USER_EMAIL=root@example.com"
# $settings is a word-split flag list by design; do not quote it.
docker run --rm --name "$container" -p 127.0.0.1:5080:5080 $settings -e ZO_ROOT_USER_PASSWORD "$image"
"""

[tasks.ws-server]
description = "Run the WebSocket server"
dir = "../../../../services/ws-server"
run = """
MODULES_PATHS="../ws-modules/core-math1, ../ws-modules/wasi-math1-sender"
export MODULES_PATHS
cargo run
"""

[tasks.ws-server.env]

[tools]
"aqua:F1bonacc1/process-compose" = "latest"
"cargo:open" = "latest"
