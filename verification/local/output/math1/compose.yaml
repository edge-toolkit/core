services:
  openobserve:
    image: openobserve/openobserve:v0.91.5
    healthcheck:
      test:
        - CMD
        - /openobserve
        - node
        - status
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - 127.0.0.1:5080:5080
    env_file:
      - ../../../../config/o2.env
      - secrets.env
    environment:
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data
  ws-server-hub:
    build:
      context: ../../../..
      dockerfile: services/ws-server/Dockerfile
    scale: 0
  ws-server:
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    env_file:
      - secrets.env
    build:
      context: ../../../..
      dockerfile: verification/local/output/math1/Dockerfile
      additional_contexts:
        hub: service:ws-server-hub
    network_mode: host
    environment:
      MODULES_PATHS: "/app/services/ws-server/static,\
        /app/services/ws-wasm-agent,\
        /app/services/ws-modules/math1,\
        /app/services/ws-modules/math1-sender"
      OTLP_COLLECTOR_URL: http://127.0.0.1:5080/api/default/v1
      STORAGE_URL: file:///app/storage
    volumes:
      - ws-server-storage:/app/storage
    depends_on:
      openobserve:
        condition: service_healthy
  math1-twin:
    build:
      context: ../../../..
      dockerfile: services/ws-web-runner/Dockerfile
    network_mode: host
    environment:
      RUNNER_MODULE: et-ws-math1
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
  math1-trigger:
    build:
      context: ../../../..
      dockerfile: services/ws-web-runner/Dockerfile
    network_mode: host
    environment:
      RUNNER_MODULE: et-ws-math1-sender
      WS_SERVER_URL: ws://localhost:8080/ws
    depends_on:
      ws-server:
        condition: service_healthy
volumes:
  openobserve-data: {}
  ws-server-storage: {}
