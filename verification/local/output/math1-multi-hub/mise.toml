[env]
OTLP_AUTH_USERNAME = "root@example.com"

[env._]
file = "secrets.env"

[tasks.generated-scenario]
depends = ["math1-trigger", "math1-twin", "nats", "openobserve", "rustfs", "ws-server"]
description = "Run generated scenario for math1-multi-hub"

[tasks.machine-edge]
depends = ["math1-twin", "ws-server-edge"]
description = "Run what machine edge runs"

[tasks.machine-server]
depends = ["math1-trigger", "nats", "openobserve", "rustfs", "ws-server"]
description = "Run what machine server runs"

[tasks.math1-trigger]
description = "Run @edge-toolkit/et-ws-math1-sender in the web runner"
dir = "../../../.."
run = """
cargo run --quiet -p et-ws-web-runner
"""

[tasks.math1-trigger.env]
RUNNER_MODULE = "@edge-toolkit/et-ws-math1-sender"
WS_SERVER_URL = "ws://localhost:8080/ws"

[tasks.math1-twin]
description = "Run @edge-toolkit/et-ws-math1 in the web runner"
dir = "../../../.."
run = """
cargo run --quiet -p et-ws-web-runner
"""

[tasks.math1-twin.env]
RUNNER_MODULE = "@edge-toolkit/et-ws-math1"
WS_SERVER_URL = "ws://localhost:8080/ws"

[tasks.nats]
description = "Run the NATS server the hubs share"
run = """
image=nats:2.15.1-alpine
container=nats-math1-multi-hub
ports="-p 4222:4222 -p 127.0.0.1:8222:8222"
# $ports is a word-split flag list by design; do not quote it.
docker run --rm --name "$container" $ports -v "$container:/data" "$image" --jetstream --store_dir /data --http_port 8222
"""

[tasks.open-o2]
description = "Open the OpenObserve UI"
run = "open http://localhost:5080/"

[tasks.openobserve]
alias = "o2"
run = """
image=openobserve/openobserve:v1.1.1
container=openobserve-math1-multi-hub
settings="-e RUST_LOG=warn -e ZO_ROOT_USER_EMAIL=root@example.com"
# $settings is a word-split flag list by design; do not quote it.
docker run --rm --name "$container" -p 127.0.0.1:5080:5080 $settings -e ZO_ROOT_USER_PASSWORD "$image"
"""

[tasks.rustfs]
description = "Run the object store the hubs share"
run = """
image=rustfs/rustfs:1.0.0-beta.12
container=rustfs-math1-multi-hub
settings="-e RUSTFS_ACCESS_KEY=et-storage -e RUSTFS_VOLUMES=/data -e RUSTFS_SECRET_KEY"
start='mkdir -p /data/et-storage && exec /entrypoint.sh rustfs'
# $settings is a word-split flag list by design; do not quote it.
docker run --rm --name "$container" -p 9000:9000 -v "$container:/data" $settings --entrypoint sh "$image" -c "$start"
"""

[tasks.ws-server]
description = "Run the WebSocket server"
dir = "../../../../services/ws-server"
run = """
MODULES_PATHS="../ws-modules/math1, ../ws-modules/math1-sender"
export MODULES_PATHS
cargo run
"""

[tasks.ws-server.env]
AWS_ACCESS_KEY_ID = "et-storage"
AWS_ALLOW_HTTP = "true"
AWS_DEFAULT_REGION = "us-east-1"
AWS_ENDPOINT = "http://localhost:9000"
STORAGE_URL = "s3://et-storage"
WS_BACKPLANE = "nats://localhost:4222"

[tasks.ws-server-edge]
description = "Run the WebSocket server on edge"
dir = "../../../../services/ws-server"
run = """
MODULES_PATHS="../ws-modules/math1, ../ws-modules/math1-sender"
export MODULES_PATHS
cargo run
"""

[tasks.ws-server-edge.env]
AWS_ACCESS_KEY_ID = "et-storage"
AWS_ALLOW_HTTP = "true"
AWS_DEFAULT_REGION = "us-east-1"
AWS_ENDPOINT = "http://127.0.0.1:9000"
STORAGE_URL = "s3://et-storage"
WS_BACKPLANE = "nats://127.0.0.1:4222"

[tools]
"aqua:F1bonacc1/process-compose" = "latest"
"cargo:open" = "latest"
