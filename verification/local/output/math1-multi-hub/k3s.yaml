apiVersion: v1
kind: Namespace
metadata:
  name: et-math1-multi-hub
---
apiVersion: v1
kind: ConfigMap
data:
  RUST_LOG: warn
  ZO_DATA_DIR: /data
  ZO_ROOT_USER_EMAIL: root@example.com
metadata:
  name: openobserve-config
  namespace: et-math1-multi-hub
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openobserve-data
  namespace: et-math1-multi-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: openobserve
  name: openobserve
  namespace: et-math1-multi-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: openobserve-config
            - secretRef:
                name: et-math1-multi-hub-secrets
          image: openobserve/openobserve:v1.1.1
          imagePullPolicy: IfNotPresent
          name: openobserve
          ports:
            - containerPort: 5080
          readinessProbe:
            exec:
              command:
                - /openobserve
                - node
                - status
            failureThreshold: 20
            periodSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /data
              name: openobserve-data
            - mountPath: /tmp
              name: openobserve-tmp
      nodeSelector:
        edge-toolkit/machine: server
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: openobserve-data
          persistentVolumeClaim:
            claimName: openobserve-data
        - emptyDir: {}
          name: openobserve-tmp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: openobserve
  name: openobserve
  namespace: et-math1-multi-hub
spec:
  ports:
    - name: http
      port: 5080
      targetPort: 5080
  selector:
    app: openobserve
---
apiVersion: v1
kind: ConfigMap
data:
  nats-server.conf: |
    port: 4222
    monitor_port: 8222
    jetstream {
      store_dir: /data
    }
metadata:
  name: nats-config
  namespace: et-math1-multi-hub
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: et-math1-multi-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nats
  name: nats
  namespace: et-math1-multi-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - image: nats:2.15.1-alpine
          imagePullPolicy: IfNotPresent
          name: nats
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /healthz?js-enabled-only=true
              port: 8222
            periodSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /data
              name: nats-data
            - mountPath: /etc/nats
              name: nats-config
      nodeSelector:
        edge-toolkit/machine: server
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nats-data
          persistentVolumeClaim:
            claimName: nats-data
        - configMap:
            name: nats-config
          name: nats-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nats
  name: nats
  namespace: et-math1-multi-hub
spec:
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
  selector:
    app: nats
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: et-math1-multi-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rustfs
  name: rustfs
  namespace: et-math1-multi-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - command:
            - sh
            - -c
            - mkdir -p /data/et-storage && exec /entrypoint.sh rustfs
          env:
            - name: RUSTFS_ACCESS_KEY
              value: et-storage
            - name: RUSTFS_VOLUMES
              value: /data
          envFrom:
            - secretRef:
                name: et-math1-multi-hub-secrets
          image: rustfs/rustfs:1.0.0-beta.12
          imagePullPolicy: IfNotPresent
          name: rustfs
          ports:
            - containerPort: 9000
          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /data
              name: rustfs-data
            - mountPath: /logs
              name: rustfs-logs
            - mountPath: /tmp
              name: rustfs-tmp
      nodeSelector:
        edge-toolkit/machine: server
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: rustfs-data
          persistentVolumeClaim:
            claimName: rustfs-data
        - emptyDir: {}
          name: rustfs-logs
        - emptyDir: {}
          name: rustfs-tmp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rustfs
  name: rustfs
  namespace: et-math1-multi-hub
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
  selector:
    app: rustfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ws-server
  name: ws-server
  namespace: et-math1-multi-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-server
  template:
    metadata:
      labels:
        app: ws-server
    spec:
      containers:
        - env:
            - name: AWS_ACCESS_KEY_ID
              value: et-storage
            - name: AWS_ALLOW_HTTP
              value: "true"
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ENDPOINT
              value: http://rustfs:9000
            - name: MODULES_PATHS
              value: /app/services/ws-modules/math1,/app/services/ws-modules/math1-sender
            - name: MODULES_ROOT
              value: ""
            - name: OTLP_AUTH_USERNAME
              value: root@example.com
            - name: OTLP_COLLECTOR_URL
              value: http://openobserve:5080/api/default/v1
            - name: STORAGE_URL
              value: s3://et-storage
            - name: TLS_CERT_FILE
              value: /app/runtime/cert.pem
            - name: TLS_KEY_FILE
              value: /app/runtime/key.pem
            - name: WS_AGENT_REGISTRY
              value: /app/runtime/registry.yaml
            - name: WS_BACKPLANE
              value: nats://nats:4222
          envFrom:
            - secretRef:
                name: et-math1-multi-hub-secrets
          image: et-ws-server-math1-multi-hub:latest
          imagePullPolicy: IfNotPresent
          name: ws-server
          ports:
            - containerPort: 8080
            - containerPort: 8443
          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /app/runtime
              name: ws-server-runtime
      nodeSelector:
        edge-toolkit/machine: server
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: ws-server-runtime
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ws-server
  name: ws-server
  namespace: et-math1-multi-hub
spec:
  ports:
    - name: ws
      port: 8080
      targetPort: 8080
    - name: wss
      port: 8443
      targetPort: 8443
  selector:
    app: ws-server
---
