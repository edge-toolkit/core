[tasks.generated-scenario]
depends = ["openobserve", "ws-server"]
description = "Run generated scenario for facility-security-scenario"

[tasks.open-o2]
description = "Open the OpenObserve UI"
run = "open http://localhost:5080/"

[tasks.openobserve]
alias = "o2"
dir = "../../../.."
run = """
image=openobserve/openobserve:v0.91.5
credential=ZO_ROOT_USER_PASSWORD=Et+quis8784 # skipcq: SCT-A000 -- generated dev-only scenario credential
docker run --rm --name openobserve -p 5080:5080 --env-file config/o2.env -e "$credential" "$image"
"""

[tasks.ws-server]
description = "Run the WebSocket server"
dir = "../../../../services/ws-server"
run = '''
export MODULES_PATHS="\
  static, ../ws-wasm-agent, ../ws-modules/face-detection, ../ws-modules/har1, ../ws-modules/pyface1,\
  ../../data/model-modules/model-face1, $(cargo run --quiet -p et-cli -- npm-module-path --package onnxruntime-web),\
  ../../data/model-modules/model-har-motion1, ../../generated/python-ws, $(mise where http:pyodide)"
cargo run
'''

[tasks.ws-server.env]
# skipcq: SCT-A000 -- generated dev-only scenario credential
OTLP_AUTH_PASSWORD = "Et+quis8784"
OTLP_AUTH_USERNAME = "root@example.com"

[tools]
"cargo:open" = "latest"
